"Wed Jul 8", "date_ko": "7/8 (수)", "title": "Addressing Instrument-Outcome Confounding in Mendelian Randomization through Representation Learning", "url": "https://icml.cc/virtual/2026/poster/60473", "board": "Hall A #4415", "categories": ["Confounding & Deconfounding", "Identification & Partial ID", "Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Shimeng Huang", "Matthew Robinson", "Francesco Locatello"], "famous": ["Francesco Locatello"], "key_idea_en": "A representation-learning framework uses multi-environment genetic data to identify valid instruments for Mendelian Randomization, correcting for instrument-outcome confounding when genetic variants correlate with environmental factors.", "summary_en": "Mendelian Randomization (MR) uses genetic variants as instruments to estimate causal effects while addressing unobserved confounding, but this validity breaks down when the chosen variants themselves correlate with environmental factors that confound the instrument-outcome relationship. The authors propose a representation-learning framework that leverages data collected across multiple environments to identify, or construct, valid genetic instruments despite this confounding. The paper provides theoretical insights into when such instruments can be recovered, along with empirical validation using All of Us Biobank data. This matters because MR is a widely used epidemiological tool whose causal conclusions depend critically on instrument validity, and the work directly targets a known failure mode - gene-environment correlation - rather than assuming it away. The fetched abstract text was only partially verbatim, so some methodological and theoretical details are not fully specified here.", "key_idea_ko": "여러 environment에 걸친 genetic data를 활용해 Mendelian Randomization에 valid한 instrument를 식별하는 representation-learning framework를 제안하여, genetic variant가 environmental factor와 상관될 때 발생하는 instrument-outcome confounding을 교정한다.", "summary_ko": "Mendelian Randomization(MR)은 genetic variant를 instrument로 사용해 unobserved confounding을 다루면서 causal effect를 추정하지만, 선택된 variant 자체가 instrument-outcome 관계를 confound하는 environmental factor와 상관될 경우 이러한 validity는 깨진다. 핵심 아이디어는 여러 environment에서 수집된 데이터를 활용해 이러한 confounding에도 불구하고 valid한 genetic instrument를 식별하거나 구성하는 representation learning framework이다. 이 논문은 그러한 instrument가 언제 복원 가능한지에 대한 이론적 통찰을 제공하고, All of Us Biobank 데이터를 이용한 실증적 검증을 수행한다. 이는 MR이 널리 쓰이는 epidemiological 도구이며 그 causal 결론이 instrument validity에 결정적으로 의존한다는 점에서 중요하며, 이 연구는 잘 알려진 실패 모드(gene-environment correlation)를 가정으로 회피하지 않고 직접 다룬다. 다만 이 논문에서 확보된 abstract는 일부만 원문 그대로이거나 paraphrase된 것이어서, 방법론 및 이론적 세부사항이 여기서 완전히 명시되지는 않는다.", "abstract": "Mendelian Randomization (MR) is a prominent observational epidemiological research method, designed to address unobserved confounding when estimating causal effects. The work addresses violations of instrumental variable assumptions, particularly when genetic variants correlate with environmental factors. The researchers propose a representation learning framework that leverages multi-environment data to identify valid genetic instruments, providing theoretical insights and empirical validation using All of Us Biobank data."}, {"id": "64474", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Causal Fine-Tuning under Latent Confounded Shift", "url": "https://icml.cc/virtual/2026/poster/64474", "board": "Hall A #3015", "categories": ["Confounding & Deconfounding", "Causal Representation Learning", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Jialin Yu", "Yuxiang Zhou", "Haoxuan Li", "Junchi Yu", "Mengyue Yang", "Yulan He", "Nevin Zhang", "Phil Torr", "Ricardo Silva"], "famous": ["Ricardo Silva"], "key_idea_en": "Causal Fine-Tuning (CFT) uses a structural-causal-model-based fine-tuning objective to decompose a pretrained model's representation into causal and spurious components, making it robust to latent confounded distribution shift such as spurious metadata cues.", "summary_en": "Models deployed in the real world often suffer from latent confounded shift, where hidden variables create spurious training-time correlations, such as treating data-source metadata as a proxy for sentiment, that break down when the confounding pattern changes at deployment. CFT addresses this by using a structural causal model as an inductive bias to derive sufficient conditions for identifying the causal effect of inputs despite latent confounding, and turns this into a fine-tuning objective that separates high-level causal features from low-level spurious ones. Instantiated on BERT, learning and appropriately adjusting these causal and spurious representations yields a more robust predictor under spurious-correlation injection attacks in text, outperforming black-box domain generalization baselines. This offers a concrete, causally motivated fine-tuning recipe rather than a purely black-box robustness method for pretrained language models. The approach depends on the identifiability conditions from the assumed SCM holding, and is demonstrated specifically on BERT-based text classification with injected spurious correlations.", "key_idea_ko": "Causal Fine-Tuning(CFT)은 structural causal model 기반의 fine-tuning objective를 사용해 pretrained model의 representation을 causal 요소와 spurious 요소로 분해함으로써, spurious metadata cue와 같은 latent confounded distribution shift에 대한 robustness를 확보한다.", "summary_ko": "실제 환경에 배포된 model은 latent confounded shift를 겪는 경우가 많은데, 이는 숨겨진 변수가 training 시점의 spurious correlation(예: data-source metadata를 sentiment의 proxy로 취급하는 경우)을 만들어내고, 배포 시점에 confounding pattern이 바뀌면 이 correlation이 무너지기 때문이다. 저자들은 structural causal model을 inductive bias로 사용하여 latent confounding에도 불구하고 input의 causal effect를 identify하기 위한 충분조건을 도출하고, 이를 high-level causal feature와 low-level spurious feature를 분리하는 fine-tuning objective로 구현한 Causal Fine-Tuning(CFT)을 제안한다. BERT에 적용했을 때, 이러한 causal/spurious representation을 학습하고 적절히 조정하면 text에서의 spurious-correlation injection attack 하에서도 black-box domain generalization baseline보다 더 robust한 predictor를 얻는다. pretrained language model에 대해 순수한 black-box robustness 방법이 아니라 구체적이고 causally motivated된 fine-tuning recipe를 제공한다는 점에서 의미가 있다. 이 접근법은 가정한 SCM으로부터 도출된 identifiability 조건이 성립하는 것에 의존하며, 구체적으로 injected spurious correlation을 포함한 BERT 기반 text classification에서만 시연되었다.", "abstract": "Adapting to latent confounded shift remains a core challenge in modern AI. This setting is driven by hidden variables that induce spurious correlations between inputs and outputs during training, leading models to rely on non-causal shortcuts. For example, a model may learn to treat metadata (e.g., data source like \"Amazon\") as a proxy for positive sentiment, causing failure when the source becomes predominantly negative during deployment. To address this latent confounded shift, we introduce Causal Fine-Tuning (CFT). Using a structural causal model as an inductive bias, we derive sufficient conditions under which the causal effect of inputs is identifiable (despite latent confounding), and translate these insights into a fine-tuning objective that decomposes representations into high-level causal and low-level spurious components. Instantiating this framework in BERT, we show that learning such causal/spurious representations and adjusting them accordingly yield a more robust predictor. Experiments on spurious correlation injection attacks in text demonstrate that our method outperforms black-box domain generalization baselines, highlighting the benefits of explicitly modeling causal structure."}, {"id": "62154", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "NBCG: Nash-Bargained Causal Game for Long-Tailed Multi-Label NLP", "url": "https://icml.cc/virtual/2026/poster/62154", "board": "Hall A #308", "categories": ["Causal Discovery", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": ["functional causal model"], "authors": ["Jing Yang", "Jusheng Zhang", "Keze Wang"], "famous": [], "key_idea_en": "NBCG reframes long-tailed multi-label learning as a Nash bargaining game among causally-structured label coalitions, preventing frequent labels from dominating shared representations through spurious co-occurrence shortcuts.", "summary_en": "Long-tailed multi-label text classification is usually treated as a data-scarcity problem addressed by re-sampling or fixed re-weighting, but the authors identify a different failure mode, 'dominant coalition capture,' in which frequent labels amplified by spurious co-occurrences dominate shared representations and gradient allocation, forcing rare labels to be learned via brittle shortcuts. NBCG (Nash-Bargained Causal Game) reformulates multi-label learning as cooperative bargaining among label coalitions, first using neural structural equation models to learn a directed dependency structure that induces causally coherent coalitions and coalition-specific communication masks. Its central mechanism is a Nash bargaining objective over coalition utilities relative to an adaptive disagreement point, which serves as a principled credit-allocation rule that prioritizes under-served coalitions while preserving a Pareto-efficient trade-off among all labels. This replaces ad hoc re-sampling or re-weighting with a causally grounded, game-theoretic mechanism for robust long-tailed multi-label learning. The abstract does not report concrete benchmark numbers, and the method's benefit depends on how well the learned causal dependency structure among labels reflects reality.", "key_idea_ko": "NBCG는 long-tailed multi-label learning을 causally 구조화된 label coalition 간의 Nash bargaining game으로 재구성하여, 빈번한 label이 spurious co-occurrence shortcut을 통해 공유 representation을 지배하는 것을 방지한다.", "summary_ko": "long-tailed multi-label text classification은 보통 re-sampling이나 고정된 re-weighting으로 다루는 data-scarcity 문제로 취급되지만, 저자들은 spurious co-occurrence로 증폭된 빈번한 label이 공유 representation과 gradient allocation을 지배하여 rare label이 취약한 shortcut으로만 학습되는 'dominant coalition capture'라는 다른 failure mode를 짚어낸다. 핵심 아이디어인 NBCG(Nash-Bargained Causal Game)는 multi-label learning을 label coalition 간의 협력적 bargaining으로 재정식화하며, 먼저 Neural Structural Equation Model을 이용해 directed dependency structure를 학습함으로써 causally coherent한 coalition과 coalition별 communication mask를 유도한다. 주요 기술적 메커니즘은 adaptive disagreement point에 대한 coalition utility에 관한 Nash bargaining objective로, 이는 under-served coalition을 우선시하면서도 모든 label 간의 Pareto-efficient한 trade-off를 유지하는 원칙적인 credit-allocation 규칙으로 작동한다. 이는 ad hoc한 re-sampling/re-weighting을 causally grounded된 game-theoretic 메커니즘으로 대체하여 강건한 long-tailed multi-label learning을 가능하게 한다는 점에서 의의가 있다. abstract에는 구체적인 benchmark 수치가 제시되지 않았으며, 이 방법의 이득은 label 간에 학습된 causal dependency structure가 실제를 얼마나 잘 반영하는지에 달려 있다.", "abstract": "Long-tailed multi-label text classification is often treated as a data scarcity problem, addressed by re-sampling or fixed re-weighting. We argue that a central failure mode is dominant coalition capture: frequent labels, amplified by spurious co-occurrences, form dominant coalitions that dominate shared representations and gradient allocation during optimization. As a result, rare labels are learned via superficial shortcuts, yielding brittle generalization under distribution shifts. We propose NBCG, a Nash-Bargained Causal Game that reformulates multi-label learning as a cooperative bargaining process among label coalitions. NBCG first leverages Neural Structural Equation Models to learn a directed dependency structure, inducing causally coherent coalitions, rather than random partitions, and coalition-specific communication masks. We then optimize a Nash bargaining objective over coalition utilities relative to an adaptive disagreement point, which serves as a principled credit-allocation mechanism: it adaptively prioritizes under-served coalitions while maintaining a Pareto-efficient trade-off among all players."}, {"id": "62126", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "A Recursive Decomposition Framework for Causal Structure Learning in the Presence of Latent Variables", "url": "https://icml.cc/virtual/2026/poster/62126", "board": "Hall A #3511", "categories": ["Causal Discovery", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Zheng Li", "Feng Xie", "Shenglan Nie", "Xichen Guo", "Ruxin Wang", "Hao Zhang"], "famous": ["Feng Xie"], "key_idea_en": "DiCoLa is a recursive divide-and-conquer causal structure learning framework that handles latent confounders while reducing the cost of constraint-based conditional-independence testing on high-dimensional problems.", "summary_en": "Constraint-based causal discovery relies heavily on conditional independence testing, making it computationally expensive in high-dimensional settings, and existing divide-and-conquer approaches typically cannot handle latent variables. DiCoLa recursively decomposes the causal discovery task into smaller subproblems, solves each while accounting for latent confounders, and reconstructs the global causal structure from the subproblem solutions. The paper establishes theoretical correctness and efficiency guarantees for this decomposition and shows improved computational efficiency when layered atop multiple existing causal discovery algorithms, validated on synthetic and real-world data. Enabling divide-and-conquer causal discovery under latent confounding extends scalable structure learning to a far more realistic class of problems than the causally sufficient setting most decomposition methods assume. As with most decomposition methods, the efficiency gains likely depend on the underlying graph having exploitable decomposable structure (this summary is based on the title alone).", "key_idea_ko": "DiCoLa는 latent confounder를 다루는 recursive divide-and-conquer causal structure learning framework으로, high-dimensional problem에서 constraint-based CI testing의 비용을 줄인다.", "summary_ko": "constraint-based causal discovery는 conditional independence(CI) testing에 크게 의존하여 high-dimensional 설정에서 계산 비용이 크며, 기존 divide-and-conquer 접근법은 대체로 latent variable을 다루지 못한다. DiCoLa는 causal discovery task를 더 작은 subproblem으로 recursively 분해하고, latent confounder를 고려하며 각 subproblem을 풀어 subproblem의 해로부터 global causal structure를 재구성한다. 이 논문은 이 decomposition에 대한 theoretical correctness와 efficiency guarantee를 확립하고, 여러 기존 causal discovery 알고리즘 위에 적용했을 때 개선된 computational efficiency를 synthetic 및 real-world data에서 검증한다. latent confounding 하에서의 divide-and-conquer causal discovery를 가능하게 함으로써, 대부분의 decomposition method가 가정하는 causally-sufficient 설정보다 훨씬 realistic한 problem class로 scalable structure learning을 확장한다는 점에서 의의가 있다. 다른 decomposition method와 마찬가지로 efficiency gain은 아마도 underlying graph가 exploitable한 decomposable structure를 갖는지에 의존하며, 이 요약은 title만을 근거로 작성되었다.", "abstract": "Constraint-based causal discovery is widely used for learning causal structures, but heavy reliance on conditional independence (CI) testing makes it computationally expensive in high-dimensional settings. This paper introduces DiCoLa, a framework that decomposes causal discovery tasks into smaller subproblems while handling latent variables, a scenario most existing divide-and-conquer approaches cannot address. The method recursively solves subproblems and reconstructs global causal structures. The paper establishes theoretical guarantees and demonstrates improved computational efficiency across multiple algorithms, with validation on both synthetic and real-world datasets."}, {"id": "60623", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Multi-View Causal Discovery without Non-Gaussianity: Identifiability and Algorithms", "url": "https://icml.cc/virtual/2026/poster/60623", "board": "Hall A #4201", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["functional causal model"], "authors": ["Ambroise Heurtebise", "Lemir Omar Chehab", "Pierre Ablin", "Alexandre Gramfort", "Aapo Hyvarinen"], "famous": ["Aapo Hyvarinen"], "key_idea_en": "A multi-view linear SEM achieves identifiable causal discovery by exploiting cross-view correlation instead of relying on non-Gaussianity, alongside multi-view extensions of DirectLiNGAM, PairwiseLiNGAM, and ICA-LiNGAM.", "summary_en": "Standard causal discovery methods rely on strong assumptions such as non-Gaussian disturbances, yet modern applications that provide multiple related 'views' of the same system have rarely been exploited to relax such assumptions. The authors introduce a multi-view linear structural equation model that replaces the non-Gaussianity requirement with correlation structure across views, and design several multi-view causal discovery algorithms inspired by DirectLiNGAM, PairwiseLiNGAM, and ICA-LiNGAM. They prove identifiability of the model for acyclic SEMs under this weaker, correlation-based assumption. As a result, causal discovery extends to a broader class of data-generating processes, including Gaussian disturbances, whenever multiple views or modalities of a system are available. The methods are validated via simulations and on neuroimaging data to estimate causal graphs between brain regions, though the theory remains restricted to acyclic linear SEMs.", "key_idea_ko": "이 논문은 non-Gaussianity 대신 cross-view correlation을 활용하여 identifiable한 causal discovery를 달성하는 multi-view linear SEM을 제안하고, DirectLiNGAM, PairwiseLiNGAM, ICA-LiNGAM의 multi-view 확장을 함께 제시한다.", "summary_ko": "표준 causal discovery 방법은 non-Gaussian disturbance 같은 강한 assumption에 의존하지만, 동일한 system의 여러 관련 'view'를 제공하는 현대적 application들은 이러한 assumption을 완화하는 데 거의 활용되지 않았다. 저자들은 non-Gaussianity 요구조건을 view 간 correlation structure로 대체하는 multi-view linear structural equation model을 도입하고, DirectLiNGAM, PairwiseLiNGAM, ICA-LiNGAM에서 영감을 얻은 여러 multi-view causal discovery algorithm을 설계한다. 이들은 이 weaker한 correlation 기반 assumption 하에서 acyclic SEM에 대한 model identifiability를 증명한다. 이는 system의 여러 view나 modality가 존재하는 경우라면(예: Gaussian disturbance) causal discovery를 더 넓은 범주의 data-generating process로 확장한다는 점에서 중요하다. 방법은 simulation과 brain region 간 causal graph를 추정하는 neuroimaging data로 검증되었으며, theory는 acyclic linear SEM으로 제한된다.", "abstract": "Causal discovery is a difficult problem that typically relies on strong assumptions on the data-generating model, such as non-Gaussianity. In practice, many modern applications provide multiple related views of the same system, which has rarely been considered for causal discovery. Here, we leverage this multi-view structure to achieve causal discovery with weak assumptions. We propose a multi-view linear Structural Equation Model (SEM) that extends the well-known framework of non-Gaussian disturbances by alternatively leveraging correlation over views. We prove the identifiability of the model for acyclic SEMs. Subsequently, we propose several multi-view causal discovery algorithms, inspired by single-view algorithms (DirectLiNGAM, PairwiseLiNGAM, and ICA-LiNGAM). The new methods are validated through simulations and applications on neuroimaging data, where they enable the estimation of causal graphs between brain regions."}, {"id": "67225", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Position: Causality is Key for Interpretability Claims to Generalise", "url": "https://icml.cc/virtual/2026/poster/67225", "board": "Hall A #4205", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Representation Learning", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Shruti Joshi", "Aaron Mueller", "David Klindt", "Wieland Brendel", "Dhanya Sridhar", "Patrik Reizinger"], "famous": [], "key_idea_en": "This position paper argues that Pearl's causal hierarchy clarifies exactly what LLM interpretability claims are licensed to say, and that causal representation learning is needed to make such findings generalize.", "summary_en": "LLM interpretability research repeatedly produces findings that fail to generalize, often making causal claims the underlying evidence cannot support. Pearl's causal hierarchy - association, intervention, and counterfactual - offers a formal lens for specifying what data and assumptions a given interpretability claim actually requires. Mapped against current practice, behavioral observations turn out to license only associational claims, interventions support cause-effect claims but not behavior prediction, and counterfactual or unseen-behavior predictions remain largely unverifiable, a gap the authors argue causal representation learning (CRL) could close by provably extracting the underlying semantic variables and relations. For practitioners, this gives a principled basis for choosing methods and avoiding claims that outrun their evidence, with potential benefits for the field's reproducibility. As a position paper it offers this diagnostic framework and a set of practical requirements - robustness to distribution shift, sensitivity to assumptions, compositionality of interventions - rather than new empirical interpretability results.", "key_idea_ko": "포지션 페이퍼로서, Pearl의 causal hierarchy가 LLM interpretability 주장이 실제로 무엇을 정당화하는지를 formal하게 규명하며, interpretability 결과의 generalization을 위해서는 causal representation learning이 필요하다고 주장한다.", "summary_ko": "문제는 LLM interpretability 연구가 반복적으로 generalize되지 않는 발견을 내놓고, 근거가 뒷받침하지 못하는 causal claim을 만든다는 점이다. 핵심 아이디어는 Pearl의 causal hierarchy(association, intervention, counterfactual)가 특정 interpretability claim에 어떤 데이터와 가정이 필요하며 실제로 어떤 추론을 지지하는지를 formal하게 specify한다는 것이다. 주요 결과는 diagnostic mapping을 통해 behavioral observation은 associational claim만 지지하고 intervention은 cause-effect claim은 지지하지만 behavior prediction을 보장하지 않으며 counterfactual/unseen-behavior 예측은 현재 연구들에서 대체로 검증 불가능함을 보이고, 이 gap을 메우기 위해 causal representation learning(CRL)이 semantic variable과 relation의 provable extraction을 제공할 수 있다고 논하는 것이다. 이는 practitioner에게 method를 선택하고 근거를 넘어서는 claim을 피하도록 하는 framework를 제공하여 interpretability 연구의 reproducibility를 개선할 잠재력이 있다는 점에서 중요하다. 다만 position paper이므로 새로운 empirical interpretability 결과보다는 diagnostic/conceptual framework와 실무적 요구사항(distribution shift에 대한 robustness, assumption sensitivity, intervention의 compositionality)을 제시하는 데 그친다.", "abstract": "Interpretability research on large language models (LLMs) has produced methods that align model components to high-level concepts, yet their use has been accompanied by recurring failures: findings that do not generalise, and causal language that outruns the evidence. Our position is that Pearl's causal hierarchy formally defines what constitutes a good alignment, what data or assumptions it requires, and what inferences it supports. Specifically, observations of model behaviour support only associational claims; interventions enable cause-effect claims, but not necessarily predictions of model behaviour; counterfactuals, or predictions of behaviour on unseen examples, are often unverifiable in current studies. We show how interpretability research can benefit from causal representation learning (CRL), which provides tools for provably extracting semantic variables and their relationships from activations, and outline practical requirements for generalisable insights: robustness to distribution shifts, sensitivity to assumptions, and compositionality of interventions. Our diagnostic framework helps practitioners select appropriate methods and mitigate failures to ensure that claims match evidence and findings generalise."}, {"id": "60689", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "SCOUT: Cyclic Causal Discovery Under Soft Interventions with Unknown Targets", "url": "https://icml.cc/virtual/2026/poster/60689", "board": "Hall A #4210", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["score-based", "intervention-based", "functional causal model"], "authors": ["Alpar Turkoglu", "Muralikrishnna Guruswamy Sethuraman", "Faramarz Fekri"], "famous": [], "key_idea_en": "SCOUT learns nonlinear, cyclic causal graphs with unknown soft-intervention targets by maximizing likelihood via normalizing flows, relaxing the acyclicity, Gaussian-noise, and known-target assumptions of prior causal discovery methods.", "summary_en": "Most causal discovery methods assume acyclicity, Gaussian exogenous noise, and known intervention targets, assumptions that are frequently violated in real systems. SCOUT instead learns nonlinear, cyclic causal relationships from soft-interventional data with unknown intervention targets, maximizing data log-likelihood through contractive residual flows and neural spline flows. On both synthetic and real-world data, it outperforms state-of-the-art baselines at recovering the causal graph and identifying the unknown intervention targets across varied interventional and noise settings. This extends causal discovery to more realistic cyclic, nonlinear, non-Gaussian systems with unlabeled interventions, a setting common in biology and other feedback-driven domains. The method still assumes soft rather than arbitrary hard interventions and relies on the flow model's fit, so its performance is tied to flow expressiveness and the validity of the soft-intervention assumption.", "key_idea_ko": "SCOUT은 기존 causal discovery 방법들의 acyclicity, Gaussian noise, known intervention target 가정을 완화하여, normalizing flow 기반 likelihood 최대화를 통해 unknown soft intervention target을 가진 nonlinear, cyclic causal graph를 학습한다.", "summary_ko": "대부분의 causal discovery 방법은 acyclicity, Gaussian exogenous noise, known intervention target을 가정하지만 실제 시스템에서는 이러한 가정이 자주 위반된다. SCOUT은 contractive residual flow와 neural spline flow를 이용해 data log-likelihood를 최대화함으로써, unknown intervention target을 가진 soft-interventional data로부터 nonlinear하고 cyclic한 causal relationship을 학습하는 causal discovery framework이다. synthetic 및 real-world data에서 SCOUT은 다양한 interventional/noise 설정에서 causal graph와 unknown intervention target을 복원하는 데 있어 state-of-the-art baseline들을 능가한다. 이는 causal discovery의 적용 범위를 biology 등 feedback 중심 도메인에서 흔한, unlabeled intervention을 포함한 보다 현실적인 cyclic, nonlinear, non-Gaussian 시스템으로 확장한다는 점에서 의의가 있다. 다만 이 방법은 여전히 soft intervention(임의의 hard intervention이 아님)을 가정하고 normalizing flow의 model fit에 의존하므로, 성능은 flow의 표현력과 soft-intervention 가정의 타당성에 좌우된다.", "abstract": "Learning causal relationships between variables from data is a fundamental research area with many applications across disciplines. Most of the existing causal discovery algorithms rely on the assumptions that (i) the underlying system is acyclic, (ii) the exogenous noise variables are Gaussian, and (iii) that the intervention targets for the data generating experiments are known. While these assumptions simplify the analysis, they are violated in real-life systems. Most existing methods that address these issues either assume the underlying model is linear or are constrained to operate in limited interventional settings. To that end, we propose SCOUT, a novel causal discovery framework to learn nonlinear causal cyclic relationships from soft interventional data with unknown targets. Our main approach maximizes the data log-likelihood to recover the graph structure, using two normalizing-flow architectures, contractive residual flows and neural spline flows. By conducting experiments on synthetic and real-world data, we show that SCOUT outperforms state-of-the-art methods in both causal graph and unknown target recovery across various interventional and noise settings."}, {"id": "62976", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Smooth Multi-Policy Causal Effect Estimation in Longitudinal Settings", "url": "https://icml.cc/virtual/2026/poster/62976", "board": "Hall A #4211", "categories": ["Treatment Effects & CATE", "Time-Series Causality"], "estimands": ["policy value"], "treatment_type": "time-varying", "discovery_types": [], "authors": ["Wenxin Chen", "Weishen Pan", "Kyra Gan", "Fei Wang"], "famous": [], "key_idea_en": "A policy-aware reparameterization of ICE Q-functions with a shared kernel-embedding policy encoder (PEQ-Net) jointly estimates multiple dynamic treatment policies, controlling a second-order bias that otherwise inflates variance.", "summary_en": "Standard longitudinal causal inference methods such as LTMLE estimate each dynamic treatment policy separately, inducing an uncontrolled second-order bias that inflates finite-sample variance even after standard debiasing. The authors instead propose a policy-aware reparameterization of Iterative Conditional Expectation (ICE) Q-functions that enables joint estimation via a shared representation, implemented as the Policy-Encoded Q Network (PEQ-Net), whose policy encoder is trained with kernel mean embeddings to reflect population-level policy dissimilarities. After an LTMLE correction step, they prove that the shared-representation design structurally constrains the second-order remainder, and experiments on semi-synthetic data show a 13-62% RMSE reduction over existing ICE-based methods. This enables statistically sharper comparative evaluation of multiple treatment policies at once, which is central to healthcare and policy decision-making. Validation is limited to semi-synthetic longitudinal datasets and relies on correct specification of the shared kernel-embedding representation plus standard LTMLE assumptions such as sequential ignorability and positivity.", "key_idea_ko": "여러 dynamic treatment policy를 공동으로 추정할 수 있도록 shared kernel-embedding policy encoder(PEQ-Net)를 갖춘 policy-aware reparameterization of ICE Q-function을 도입하여, policy를 개별 추정할 때 variance를 부풀리는 second-order bias를 통제한다.", "summary_ko": "LTMLE 같은 표준 longitudinal causal inference 방법은 각 dynamic treatment policy를 개별적으로 추정하는데, 이는 표준 debiasing을 거친 후에도 finite-sample variance를 부풀리는 통제되지 않은 second-order bias를 유발한다. 저자들은 shared representation을 통한 joint estimation을 가능하게 하는 Iterative Conditional Expectation(ICE) Q-function의 policy-aware reparameterization을 제안하며, 이는 population-level policy dissimilarity를 반영하도록 kernel mean embedding으로 학습된 policy encoder를 가진 Policy-Encoded Q Network(PEQ-Net)로 구현된다. LTMLE correction step 이후, shared-representation 설계가 second-order remainder를 구조적으로 제약함을 증명하며, semi-synthetic data 실험에서 기존 ICE 기반 방법 대비 13-62%의 RMSE 감소를 보인다. 이는 여러 treatment policy를 동시에 통계적으로 더 예리하게 비교 평가할 수 있게 하며, 이는 헬스케어와 정책 의사결정에서 핵심적이다. 검증은 semi-synthetic longitudinal dataset에 한정되며, shared kernel-embedding representation의 올바른 specification과 sequential ignorability, positivity 같은 표준 LTMLE 가정에 의존한다.", "abstract": "Comparative evaluation of multiple dynamic treatment policies is essential for healthcare and policy decisions, yet conventional longitudinal causal inference methods estimate each in isolation, preventing information sharing across counterfactuals. This separate estimation paradigm induces a structurally uncontrolled second-order bias, inflating finite-sample variance even after standard debiasing with longitudinal targeted maximum likelihood estimation (LTMLE). To address this, the authors propose a policy-aware reparameterization of Iterative Conditional Expectation (ICE) Q-functions that enables joint estimation through shared representations, implemented in the Policy-Encoded Q Network (PEQ-Net), an architecture centered on a shared policy encoder trained using kernel mean embeddings so the learned representation space reflects population-level policy dissimilarities. After applying an LTMLE correction step, this design imposes a structural constraint on the second-order remainder, stabilizing finite-sample variance. Experiments on semi-synthetic datasets demonstrate that PEQ-Net consistently outperforms existing ICE-based methods, reducing root-mean-square error by 13-62%."}, {"id": "64597", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Spiked-CFR: Causal Representation Learning from LLMs via Wasserstein Projection Pursuit", "url": "https://icml.cc/virtual/2026/poster/64597", "board": "Hall A #4213", "categories": ["Treatment Effects & CATE", "Confounding & Deconfounding", "Causal Reasoning in LLMs/Agents"], "estimands": ["CATE", "ITE"], "treatment_type": "binary", "discovery_types": [], "authors": ["Fan Wang", "Hengyu Yue", "Yu Bowen", "Weiming Liu", "Zongxin Yang", "Xuyun Zhang", "Xiaolin Zheng", "Chaochao Chen", "Shuiguang Deng"], "famous": [], "key_idea_en": "Spiked-CFR introduces Wasserstein Projection Pursuit to locate a low-dimensional confounding subspace within high-dimensional LLM text embeddings, so treatment-effect estimation needs only to balance that subspace rather than the full embedding, tightening generalization bounds.", "summary_en": "Estimating treatment effects from observational text via LLM embeddings is appealing, but standard Wasserstein-matching-based causal representation learning becomes vacuous in the high ambient dimension of such embeddings. Spiked-CFR addresses this by assuming a Spiked Confounding Structure, in which treatment-selection bias concentrates in a low-dimensional subspace, and introduces Wasserstein Projection Pursuit, a minimax procedure that adversarially learns an orthogonal projection on the Stiefel manifold to isolate and balance just that subspace while preserving prognostic information. This yields a tighter PEHE generalization bound and estimation rate that scale with the intrinsic confounding dimension k rather than the full embedding dimension D. The result makes causal effect estimation from LLM text representations statistically meaningful instead of relying on vacuous high-dimensional bounds. Experiments on four semi-synthetic and four real clinical benchmarks show improved accuracy and robustness, though the approach's benefits hinge on the assumed spiked, low-rank confounding structure actually holding.", "key_idea_ko": "Wasserstein Projection Pursuit를 제안하여 고차원 LLM text embedding 안에서 confounding이 집중된 저차원 subspace를 찾아, treatment-effect estimation이 전체 embedding이 아닌 그 subspace만 balancing하면 되도록 함으로써 generalization bound를 tight하게 만든다.", "summary_ko": "LLM embedding을 이용해 observational text 데이터로부터 treatment effect를 추정하는 것은 매력적이지만, 표준 Wasserstein-matching 기반 causal representation learning은 LLM embedding의 고차원 ambient dimension에서 vacuous해진다. 본 논문은 treatment-selection bias가 저차원 subspace에 집중되어 있다고 가정하는 Spiked Confounding Structure를 제안하는 SPIKED-CFR을 제시하고, Stiefel manifold 위에서 adversarial하게 orthogonal projection을 학습하여 해당 subspace만 분리해 balancing하면서 prognostic information은 보존하는 minimax 절차인 Wasserstein Projection Pursuit을 개발한다. 주요 기술적 결과는 전체 embedding dimension D가 아니라 intrinsic confounding dimension k에 의존하는 더 tight한 PEHE generalization bound와 estimation rate이다. 이는 LLM text representation으로부터의 causal effect estimation을 vacuous한 고차원 bound에 의존하지 않고 통계적으로 유의미하게 만든다는 점에서 중요하다. 4개의 semi-synthetic benchmark와 4개의 real clinical benchmark에서 향상된 accuracy와 robustness를 보이지만, 이 접근법은 spiked(저차원) confounding structure가 실제로 성립한다는 가정에 의존한다.", "abstract": "Estimating treatment effects from observational text is increasingly practical with Large Language Models (LLMs). However, applying causal representation learning directly to high-dimensional LLM embeddings faces a fundamental barrier: empirical Wasserstein matching suffers from the curse of dimensionality, rendering standard generalization guarantees effectively vacuous. We propose SPIKED-CFR, a framework bridging this gap by assuming a Spiked Confounding Structure, where treatment selection bias concentrates in a low-dimensional subspace of the semantic representation. We develop Wasserstein Projection Pursuit, a minimax objective that adversarially learns an orthogonal projection on the Stiefel manifold to identify and balance only this confounding subspace while preserving prognostic information. Under a spiked confounding structure, we show the projected discrepancy can be estimated at a rate governed by the intrinsic dimension k much less than D, and we derive a tighter PEHE generalization bound that depends on k rather than the ambient embedding dimension. Experiments on four semi-synthetic benchmarks and four real-world clinical benchmarks demonstrate improved accuracy and robustness over strong baselines."}, {"id": "64110", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Formalizing and Falsifying Causal Pathways of Rare Events", "url": "https://icml.cc/virtual/2026/poster/64110", "board": "Hall A #4304", "categories": ["Identification & Partial ID", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Anahita Haghighat", "Dominik Janzing"], "famous": ["Dominik Janzing"], "key_idea_en": "The paper gives a formal definition of a causal pathway underlying rare-event root causes in structural equation models and characterizes its testable implications.", "summary_en": "Prior work formalized root-cause analysis for rare events ('outliers') in structural equation models but lacked a rigorous notion of the causal pathway by which such an event arises, along with implications that could actually be tested against data. The authors supply a formal definition of a causal pathway for rare-event root causes and derive its testable implications within the structural equation model framework. They identify conditions under which these testable implications depend only on a causal abstraction specific to the rare-event pathway, rather than requiring the complete causal graph. This bridges informal, verbal causal explanations of rare failures - such as 'X caused this outage via Y' - with formal, falsifiable causal modeling, enabling principled validation of such narratives. The available abstract is brief and builds directly on prior root-cause formalizations, so the precise scope of assumptions is best checked in the full paper.", "key_idea_ko": "structural equation model에서 rare-event root cause의 근간이 되는 causal pathway를 형식적으로 정의하고 그 testable implication을 특성화한다.", "summary_ko": "기존 연구는 structural equation model에서 rare event(outlier)에 대한 root-cause analysis를 형식화했으나, 그러한 rare event가 발생하는 causal pathway에 대한 엄밀한 개념과 데이터로 실제 검증 가능한 implication은 결여되어 있었다. 저자들은 rare-event root cause에 대한 causal pathway의 형식적 정의를 제시하고, structural equation model framework 내에서 그 testable implication을 도출한다. 이들은 이러한 testable implication이 완전한 causal graph 전체가 아니라 해당 rare-event pathway에 특정된 causal abstraction에만 의존하게 되는 조건을 규명한다. 이는 rare failure에 대한 비형식적, 구두적인 causal 설명(예: X가 Y를 통해 이 outage를 유발했다)을 형식적이고 falsifiable한 causal modeling과 연결하여, 그러한 서사에 대한 원칙적인 검증을 가능케 한다는 점에서 의의가 있다. 다만 확보된 abstract는 짧고 이전의 root-cause 형식화에 직접 기반하고 있어, 가정의 정확한 범위는 원문 전체에서 확인하는 것이 바람직하다.", "abstract": "Building on recent formalizations of root cause analysis for rare events (\"outliers\") in structural equation models, we propose a formal definition of a causal pathway and discuss its testable implications. The researchers also identify conditions where testable implications depend on causal abstraction specific to rare event pathways rather than the complete causal graph, establishing a bridge between simple verbal causal explanations and detailed causal modeling."}, {"id": "60651", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Federated Causal Inference on Multi-Site Observational Data via Propensity Score Aggregation", "url": "https://icml.cc/virtual/2026/poster/60651", "board": "Hall A #4305", "categories": ["Treatment Effects & CATE", "Confounding & Deconfounding"], "estimands": ["ATE"], "treatment_type": "binary", "discovery_types": [], "authors": ["Remi Khellaf", "Aurelien Bellet", "Julie Josse"], "famous": [], "key_idea_en": "Fed-IPW and Fed-AIPW estimate the ATE from decentralized, multi-site observational data by federating propensity-score estimation via membership weights that exploit cross-site heterogeneity to improve overlap.", "summary_en": "Standard causal inference assumes centralized individual-level data, but real data are often split across sites that cannot be pooled due to privacy, logistical, or legal constraints. The authors estimate propensity scores as a federated weighted average of local scores using membership weights, the site-membership probability conditional on covariates, computed via standard federated learning algorithms, and plug these into Federated Inverse Propensity Weighting (Fed-IPW) and Augmented IPW (Fed-AIPW) estimators for the ATE. Theoretical analysis and experiments show that Fed-IPW and Fed-AIPW perform well under heterogeneity in site sample sizes, treatment mechanisms, and covariate distributions, exploiting cross-site heterogeneity to improve positivity and overlap. Unlike meta-analysis, which fails when any single site violates positivity, this approach remains valid and can even benefit from between-site heterogeneity, enabling privacy-preserving multi-site ATE estimation. The membership-weight propensity models can be parametric or nonparametric, and the method is compared against meta-analysis and related approaches on simulated and real-world data.", "key_idea_ko": "이 논문은 membership weight를 통해 propensity-score 추정을 federate하여 decentralized multi-site observational data로부터 ATE를 추정하는 Fed-IPW와 Fed-AIPW estimator를 제안하고, 이는 site 간 heterogeneity를 활용해 overlap을 개선한다.", "summary_ko": "표준적인 causal inference는 centralized된 individual-level data를 가정하지만, 실제 데이터는 privacy, 물리적, 법적 제약으로 인해 통합될 수 없는 여러 site에 분산되어 있는 경우가 많다. 저자들은 covariate 조건부 site-membership probability인 Membership Weight를 이용해 propensity score를 local score들의 federated weighted average로 추정하고, 이를 표준적인 federated learning algorithm으로 계산한 뒤 Federated Inverse Propensity Weighting(Fed-IPW)과 Augmented IPW(Fed-AIPW) ATE estimator에 대입한다. 이론적 분석과 실험은 Fed-IPW/Fed-AIPW가 site별 sample size, treatment mechanism, covariate distribution의 heterogeneity 하에서도 잘 작동하며, site 간 heterogeneity를 활용해 positivity/overlap을 개선함을 보인다. 어느 한 site라도 positivity를 위반하면 실패하는 meta-analysis와 달리, 이 접근법은 여전히 유효하며 오히려 site 간 heterogeneity로부터 이득을 볼 수 있어 privacy-preserving한 multi-site ATE 추정을 가능하게 한다. membership-weight propensity model은 parametric일 수도 nonparametric일 수도 있으며, 비교 대상은 simulated 및 real-world data에 대한 meta-analysis 및 관련 접근법이다.", "abstract": "Causal inference typically assumes centralized access to individual-level data. Yet, in practice, data are often decentralized across multiple sites, making centralization infeasible due to privacy, logistical, or legal constraints. We address this problem by estimating the Average Treatment Effect (ATE) from decentralized observational data via a Federated Learning (FL) approach, allowing inference through the exchange of aggregate statistics rather than individual-level data. We propose a novel method to estimate propensity scores via a federated weighted average of local scores using Membership Weights (MW), defined as probabilities of site membership conditional on covariates. MW can be flexibly estimated with parametric or non-parametric classification models using standard FL algorithms. The resulting propensity scores are used to construct Federated Inverse Propensity Weighting (Fed-IPW) and Augmented IPW (Fed-AIPW) estimators. In contrast to meta-analysis methods, which fail when any site violates positivity, our approach exploits heterogeneity in treatment assignment across sites to improve overlap. We show that Fed-IPW and Fed-AIPW perform well under site-level heterogeneity in sample sizes, treatment mechanisms, and covariate distributions. Theoretical analysis and experiments on simulated and real-world data demonstrate clear advantages over meta-analysis and related approaches."}, {"id": "64421", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Budgeted Active Experimentation for Treatment Effect Estimation from Observational and Randomized Data", "url": "https://icml.cc/virtual/2026/poster/64421", "board": "Hall A #4313", "categories": ["Treatment Effects & CATE", "Confounding & Deconfounding"], "estimands": ["CATE"], "treatment_type": "", "discovery_types": [], "authors": ["Jiacan Gao", "Xinyan Su", "Mingyuan Ma", "Yiyan HUANG", "Xiao Xu", "Xinrui Wan", "Tianqi Gu", "Enyun Yu", "Jiecheng Guo", "Zhiheng Zhang"], "famous": [], "key_idea_en": "A budgeted active experimentation framework uses observational priors to guide the acquisition of the most informative units for randomized experiments, improving heterogeneous treatment effect estimation under limited RCT budgets.", "summary_en": "Estimating heterogeneous treatment effects in industry involves a tension between limited randomized controlled trial budgets and abundant but policy-biased observational data that suffers from imbalance and overlap violations. The paper proposes a budgeted active experimentation framework that iteratively selects units for randomized experiments using an acquisition function targeting uplift estimation uncertainty, overlap deficits, and domain discrepancy, informed by observational priors. The authors establish finite-sample deviation bounds, asymptotic normality via martingale central limit theorems, and minimax lower bounds demonstrating information-theoretic optimality, backed by experiments on industrial datasets that outperform standard randomized baselines. This offers a principled, cost-efficient way to combine cheap biased observational data with expensive unbiased experiments in real deployment settings. The approach is validated in cost-constrained industrial settings, and its guarantees depend on the stated overlap and modeling assumptions.", "key_idea_ko": "budgeted active experimentation framework가 observational prior를 활용하여 randomized experiment에 가장 informative한 unit을 획득하도록 안내함으로써, 제한된 RCT budget 하에서 heterogeneous treatment effect 추정을 개선한다.", "summary_ko": "산업 현장에서 heterogeneous treatment effect를 추정하는 데는 제한된 randomized controlled trial budget과, imbalance 및 overlap violation을 겪는 policy-biased observational data 사이의 tension이 존재한다. 이 논문은 uplift 추정의 uncertainty, overlap deficit, domain discrepancy를 목표로 하는 acquisition function을 observational prior로 안내하여, randomized experiment에 투입할 unit을 반복적으로 선택하는 budgeted active experimentation framework를 제안한다. 주요 결과는 finite-sample deviation bound, martingale central limit theorem을 통한 asymptotic normality, information-theoretic optimality를 확립하는 minimax lower bound이며, 산업 데이터셋 실험에서 표준 randomized baseline을 능가함을 보인다. 이는 저렴하지만 biased한 observational data와 비용이 큰 unbiased experiment를 실제 배포 환경에서 원칙적이고 비용 효율적으로 결합하는 방법을 제공한다는 점에서 의의가 있다. 이 접근법은 비용이 제약된 산업 환경에서 검증되었으며, 그 보장은 명시된 overlap 및 모델링 가정에 의존한다.", "abstract": "Estimating heterogeneous treatment effects is central to data-driven decision-making, yet industrial applications often face a fundamental tension between limited randomized controlled trial (RCT) budgets and abundant but biased observational data collected under historical targeting policies. Although observational logs offer the advantage of scale, they inherently suffer from severe policy-induced imbalance and overlap violations, rendering standalone estimation unreliable. We propose a budgeted active experimentation framework that iteratively enhances model training for causal effect estimation via active sampling. By leveraging observational priors, we develop an acquisition function targeting uplift estimation uncertainty, overlap deficits, and domain discrepancy to select the most informative units for randomized experiments. We establish finite-sample deviation bounds, asymptotic normality via martingale Central Limit Theorems (CLTs), and minimax lower bounds to prove information-theoretic optimality. Extensive experiments on industrial datasets demonstrate that our approach significantly outperforms standard randomized baselines in cost-constrained settings."}, {"id": "66099", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "On the Identifiability of Poisson Branching Structural Causal Model Under Latent Confounding", "url": "https://icml.cc/virtual/2026/poster/66099", "board": "Hall A #3805", "categories": ["Causal Discovery", "Confounding & Deconfounding", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["functional causal model"], "authors": ["Jie Qiao", "Zihuai Zeng", "Ruichu Cai", "Zhengming Chen", "Zhifeng Hao"], "famous": [], "key_idea_en": "The paper establishes identifiability conditions for a Latent Confounding Poisson Branching Structural Causal Model using probability generating functions and a trie representation theorem, and gives an algorithm for learning branching causal structure from count data under latent confounding.", "summary_en": "Causal discovery from observational count data is difficult when the data exhibit inherent branching structure, such as an upstream event like an ad impression probabilistically triggering a downstream event like a purchase, and existing approaches do not adequately address latent confounding in this setting. The authors introduce the Latent Confounding Poisson Branching Structural Causal Model (LC-PB-SCM) and use probability generating functions to analyze the dependencies latent confounding induces, developing a trie representation theorem that connects branching causal mechanisms to algebraic properties. Building on this, they establish identifiability conditions for local 3-variable systems under latent confounding, a nontrivial theoretical result for branching count-data models, and propose a practical structure-learning algorithm, demonstrating its effectiveness on synthetic and real-world datasets. The result gives a principled foundation for recovering branching causal structure from count data even when latent confounders are present. The identifiability results are established specifically for local 3-variable systems, so identifiability for larger or more general graph structures is not directly addressed.", "key_idea_ko": "probability generating function과 trie representation theorem을 이용해 Latent Confounding Poisson Branching Structural Causal Model(LC-PB-SCM)의 identifiability 조건을 확립하고, latent confounding 하에서 count data로부터 branching causal structure를 학습하는 알고리즘을 제시한다.", "summary_ko": "upstream event(예: ad impression)가 downstream event(예: purchase)를 확률적으로 유발하는 것과 같은 inherent branching structure를 가진 observational count data로부터의 causal discovery는 어렵고, 기존 접근법은 이 설정에서 latent confounding을 충분히 다루지 못한다. 저자들은 Latent Confounding Poisson Branching Structural Causal Model(LC-PB-SCM)을 도입하고 Probability Generating Function을 이용해 latent confounding이 유발하는 dependency를 분석하여, branching causal mechanism을 algebraic property와 연결하는 trie representation theorem을 개발한다. 이를 바탕으로 latent confounding 하의 local 3-variable system에 대한 identifiability 조건을 확립하는데, 이는 branching count-data model에 대한 nontrivial한 theoretical 결과이다. 이어서 실용적인 structure-learning 알고리즘을 제안하고 synthetic 및 real-world dataset에서 그 효과를 입증한다. identifiability 결과는 local 3-variable system에 국한되어 확립되었으므로, 더 크거나 general한 graph structure에 대한 identifiability는 직접 다루어지지 않는다.", "abstract": "Causal discovery from observational count data poses unique challenges, particularly when the data exhibit inherent branching structures, e.g., an upstream event (e.g., an ad impression) triggers a downstream event (e.g., a purchase) with a certain probability. This work addresses limitations in existing approaches by introducing the Latent Confounding Poisson Branching Structural Causal Model (LC-PB-SCM). The authors employ Probability Generating Functions to analyze dependencies created by latent confounding and develop a Trie representation theorem connecting branching causal mechanisms to algebraic properties. They establish identifiability conditions for local 3-variable systems and propose a practical algorithm to learn causal structures under latent confounding, demonstrating its effectiveness through experiments on both synthetic and real-world datasets."}, {"id": "65634", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "CFPO : Counterfactual Policy Optimization For Multimodal Reasoning", "url": "https://icml.cc/virtual/2026/poster/65634", "board": "Hall A #121", "categories": ["Counterfactual Inference", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zhangyuan Yu", "Wanran Sun", "Guangjing Yang", "Xiaohu Wu", "Qicheng Lao"], "famous": [], "key_idea_en": "Counterfactual Policy Optimization (CFPO) regularizes multimodal reasoning policies by maximizing the discrepancy between their predictions and predictions under a counterfactual state where key visual cues are suppressed, enforcing causal consistency between vision and reasoning.", "summary_en": "Large vision-language models fine-tuned with standard RL for reasoning lack explicit counterfactual or causal mechanisms, which leads to grounding failures such as ignoring visual evidence in favor of language priors or hallucination drift over long chains of thought. CFPO addresses this with a cross-modal counterfactual enhancement mechanism that regularizes the policy by maximizing the discrepancy between the model's actual prediction and its prediction under a counterfactual state where critical visual cues are suppressed. The method integrates seamlessly with standard RL algorithms such as GRPO and DAPO, without external reward models or extra supervision, delivering consistent gains of 3.17-6.25% over standard RL baselines and 1.32-2.13% over the state-of-the-art perception-aware method PAPO. By forcing predictions to causally depend on visual evidence, the approach directly targets the grounding and hallucination problems in multimodal reasoning. The 'counterfactual' here is a heuristic visual-cue-suppression intervention rather than a formally identified causal estimand, and results are reported on the paper's own reasoning benchmarks against GRPO, DAPO, and PAPO baselines.", "key_idea_ko": "Counterfactual Policy Optimization(CFPO)은 multimodal reasoning을 위한 RL framework로, 핵심 visual cue를 억제한 counterfactual state에서의 예측과 실제 예측 간 discrepancy를 최대화하도록 policy를 regularize하여 vision과 reasoning 간 causal consistency를 강제한다.", "summary_ko": "표준 RL로 fine-tuning된 large vision-language model은 explicit한 counterfactual 혹은 causal mechanism이 결여되어 있어, visual evidence 대신 language prior를 따르거나 long chain-of-thought에서 hallucination drift가 발생하는 grounding failure를 겪는다. 핵심 아이디어는 CFPO의 cross-modal counterfactual enhancement mechanism으로, 핵심 visual cue를 억제한 counterfactual state에서의 예측과 모델의 실제 예측 간 discrepancy를 최대화하도록 policy를 regularize한다. 주요 결과는 CFPO가 외부 reward model이나 추가 supervision 없이 GRPO, DAPO 같은 표준 RL algorithm과 매끄럽게 통합되며, 표준 RL baseline 대비 3.17-6.25%, state-of-the-art perception-aware method(PAPO) 대비 1.32-2.13%의 일관된 성능 향상을 보인다는 것이다. 이는 예측이 visual evidence에 causally dependent하도록 강제함으로써 multimodal reasoning의 grounding/hallucination 문제를 직접적으로 겨냥한다는 점에서 중요하다. 여기서의 'counterfactual'은 formally identified된 causal estimand라기보다는 heuristic한 visual-cue-suppression intervention이며, 결과는 논문 자체의 reasoning benchmark에서 GRPO/DAPO/PAPO baseline 대비로만 보고된다.", "abstract": "Large Vision-Language Models (LVLMs) have demonstrated remarkable capabilities in multimodal reasoning. However, prevailing reinforcement learning (RL) paradigms lack explicit counterfactual enhancement and causal learning mechanisms. This fundamental deficiency results in severe grounding failures, manifesting as a tendency to ignore visual evidence in favor of language priors or exhibiting hallucination drift during long chain-of-thought reasoning. To address this root cause, we propose CounterFactual Policy Optimization (CFPO), a novel framework that enforces causal consistency between visual perception and textual reasoning. CFPO introduces a cross-modal counterfactual enhancement mechanism, which regularizes the policy by maximizing the discrepancy between the model's predictions and those from a counterfactual state where critical visual cues are suppressed. This approach seamlessly integrates with standard algorithms like GRPO and DAPO without requiring external reward models or additional supervision. Extensive experiments demonstrate that CFPO significantly improves reasoning fidelity, achieving consistent gains of 3.17%-6.25% over standard RL baselines and 1.32%-2.13% over the state-of-the-art perception-aware method (PAPO)."}, {"id": "67152", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Position: Trustworthy AI Suffers from Invariance Conflicts and Causality is The Solution", "url": "https://icml.cc/virtual/2026/poster/67152", "board": "Hall A #4206", "categories": ["Causal Fairness & Robustness", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Ruta Binkyte", "Ivaxi Sheth", "Zhijing Jin", "Mohammad Havaei", "Bernhard Schoelkopf", "Mario Fritz"], "famous": [], "key_idea_en": "This position paper argues that trustworthy-AI objectives, fairness, robustness, privacy, explainability, conflict because they are actually incompatible invariance requirements under different changes to the data-generating process, and that causality offers the unifying framework for understanding and resolving these trade-offs.", "summary_en": "As AI, including foundation models, is deployed in high-stakes settings, achieving fairness, robustness, privacy, and explainability simultaneously while preserving utility has proven difficult, and the paper takes this tension as its central concern. Its central move is to reinterpret trustworthy-AI trade-offs as incompatible invariance requirements under different changes to the data-generating process, with causality proposed as the unifying lens for this reinterpretation. As a position paper, its substance lies in this reframing together with the illustration that trade-offs can be softened or resolved through selective invariance, applicable to both classical ML models and large foundation models. This offers a common theoretical vocabulary for objectives usually studied and optimized in isolation, potentially guiding more principled trade-off management. The paper is argumentative and conceptual rather than presenting new algorithms or empirical results, and it closes by outlining open challenges rather than solved problems.", "key_idea_ko": "이 position paper는 fairness, robustness, privacy, explainability 같은 trustworthy-AI objective들이 서로 다른 data-generating-process change에 대한 상충되는 invariance requirement이기 때문에 충돌한다고 주장하며, causality가 이러한 trade-off를 이해하고 해소하는 통합적 framework라고 제안한다.", "summary_ko": "foundation model을 포함한 AI가 high-stakes setting에 배포되면서 fairness, robustness, privacy, explainability를 utility를 유지하며 동시에 달성하는 것이 어려웠고, 이 논문은 이를 핵심 문제로 설정한다. 이 논문의 핵심 move는 trustworthy-AI trade-off를 data-generating process에 대한 서로 다른 변화 하에서의 incompatible invariance requirement로 재해석하고, causality가 이러한 재해석을 위한 통합적 lens를 제공한다고 주장하는 것이다. position/perspective paper로서 주요 내용은 이러한 reframing과, classical ML model과 large foundation model 모두에 적용 가능한 selective invariance를 통해 trade-off가 완화되거나 해소될 수 있음을 보이는 illustration이다. 이는 보통 개별적으로 연구되고 최적화되는 objective들에 대한 공통 이론적 vocabulary를 제공하여 보다 원칙에 입각한 trade-off 관리를 이끌 수 있다는 점에서 중요하다. 다만 이 논문은 새로운 algorithm이나 empirical result를 제시하기보다 argumentative하고 conceptual한 성격을 가지며, 해결된 문제가 아니라 open challenge를 정리하며 마무리된다.", "abstract": "As artificial intelligence (AI), including machine learning (ML) models and foundation models (FMs), is increasingly deployed in high-stakes domains, ensuring their trustworthiness has become a central challenge. However, the core trustworthy AI objectives, such as fairness, robustness, privacy, and explainability, are hard to achieve simultaneously, especially while preserving utility. This position paper argues that causality is necessary to understand and balance trade-offs in performance and multiple objectives of trustworthy AI. We ground our arguments in re-interpreting trustworthy AI trade-offs as incompatible invariance requirements under different changes to the data-generating process. We then illustrate that causality provides a unifying framework for understanding how trade-offs in trustworthy AI arise, and how they can be softened or resolved through selective invariance. This perspective applies to both classical ML models and large-scale FMs. Our paper discusses how causal assumptions may be applied explicitly or implicitly in modern large-scale systems. Finally, we outline open challenges and opportunities for using causality to build more trustworthy AI."}, {"id": "66361", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Domain Adaptive Object Detection via Dynamic Causal Refinement", "url": "https://icml.cc/virtual/2026/poster/66361", "board": "Hall A #4612", "categories": ["Causal Representation Learning", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zeyu Ma", "Jiaqi Huang", "Yitong Qin", "Ziqiang Zheng", "Jiwei Wei", "Jie Zou", "Yang Yang", "Heng Tao Shen"], "famous": [], "key_idea_en": "Dynamic Causal Refinement (DCR) uses closed-loop feedback between data augmentation and model optimization to progressively suppress domain-common spurious features and steer object detectors toward genuinely causal features under domain shift.", "summary_en": "Domain Adaptive Object Detection transfers detectors from labeled source domains to unlabeled target domains, but existing feature-alignment methods that boost statistical domain-invariance inadvertently amplify domain-common spurious factors, such as shared environmental context, that act as shortcuts rather than true causal object features. DCR addresses this through a closed-loop feedback mechanism between data augmentation and model optimization, pairing Semantic Prediction Consistency to filter domain-specific spurious factors and establish robust statistical invariance with Discrepancy-Guided Causal Refinement to actively suppress domain-common spurious dependence via spectral perturbation. This iterative refinement pushes detectors to rely on semantically meaningful causal representations rather than shortcuts, yielding significant improvements over state-of-the-art on standard DAOD benchmarks. The contribution matters because it targets a subtle failure mode in domain adaptation, where methods conflate spurious invariance with genuine causal invariance. Its causal claims are operationalized heuristically through consistency losses and spectral perturbation rather than formal causal identification, and evaluation is limited to standard object-detection domain-adaptation benchmarks.", "key_idea_ko": "Dynamic Causal Refinement(DCR)는 data augmentation과 model optimization 간의 closed-loop feedback을 이용하여 domain-common spurious feature를 점진적으로 억제하고 object detector가 domain shift 하에서도 true causal feature를 향하도록 유도한다.", "summary_ko": "Domain Adaptive Object Detection(DAOD)은 labeled source domain에서 학습된 detector를 unlabeled target domain으로 전이하는 과제인데, statistical domain-invariance를 높이는 기존 feature-alignment 방법들은 의도치 않게 true causal object feature 대신 shortcut으로 작용하는 domain-common spurious factor(예: 공유된 environmental context)도 함께 증폭시킨다. 핵심은 Dynamic Causal Refinement(DCR)로, data augmentation과 model optimization 사이에 closed-loop feedback 메커니즘을 구축하고, Semantic Prediction Consistency(SPC)로 domain-specific spurious factor를 걸러내어 robust한 statistical invariance를 확립하며, Discrepancy-Guided Causal Refinement(DGCR)로 spectral perturbation을 통해 domain-common spurious dependence를 능동적으로 억제한다. 이러한 반복적 refinement는 detector가 shortcut 대신 semantically meaningful한 causal representation에 의존하도록 유도하며, 표준 DAOD 벤치마크에서 state-of-the-art 대비 유의미한 성능 향상을 달성한다. domain adaptation 방법이 spurious invariance와 genuine causal invariance를 혼동하는 미묘한 실패 모드를 겨냥한다는 점에서 중요하다. causal claim은 consistency loss와 spectral perturbation을 통해 heuristic하게 operationalize된 것이지 formal causal identification을 통한 것이 아니며, 평가는 표준 object-detection domain-adaptation 벤치마크로 제한된다.", "abstract": "Domain Adaptive Object Detection (DAOD) addresses the challenge of transferring object detectors from labeled source domains to unlabeled target domains. Existing domain adaptation methods primarily rely on feature distribution alignment, which enhances domain-invariant features (statistical invariance) but also inadvertently increases inherent domain-common spurious factors (e.g., common environmental contexts), which act as shortcut features rather than the true causal factors for object classification. We propose Dynamic Causal Refinement (DCR), a novel framework that establishes a closed-loop feedback mechanism between data augmentation and model optimization to progressively refine causal features. Specifically, we design Semantic Prediction Consistency (SPC) to filter domain-specific spurious factors and establish a robust statistical invariance, and Discrepancy-Guided Causal Refinement (DGCR) to actively suppress the dependence on domain-common spurious factors via spectral perturbation for causal refinement. This process encourages the detector to suppress its reliance on shortcut features and instead prioritize semantically meaningful causal representations. Extensive experiments on standard benchmarks demonstrate that our method outperforms state-of-the-art counterparts significantly."}, {"id": "63557", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "U$^3$CF: Unbiased, Unconfounding, and Unified Causal Framework for Multi-Target Domain Adaptation", "url": "https://icml.cc/virtual/2026/poster/63557", "board": "Hall A #4616", "categories": ["Confounding & Deconfounding", "Causal Fairness & Robustness", "Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Wenxu Wang", "Yeqiang Liu", "Rui Zhou", "Jing Wang", "Zhenbo Li", "Wenbo Gong"], "famous": [], "key_idea_en": "U3CF is a structural-causal-model-based framework for multi-target domain adaptation that disentangles domain-invariant causal factors from domain-specific confounders and applies conditional intervention to remove spurious cross-domain correlations.", "summary_en": "Multi-target domain adaptation methods typically enforce domain invariance empirically without a principled causal formulation, which can bias adaptation across multiple unlabeled target domains. U3CF instead builds a structural causal model in which domain-invariant causal factors and domain-specific factors jointly shape representations and labels, the latter inducing spurious cross-target correlations, then disentangles representations into invariant components and confounders via a mutual-information-based separation criterion, applies conditional intervention to block confounding, and aligns domains through a prototype-driven contrastive strategy. Extensive experiments on four benchmarks show U3CF consistently outperforms leading multi-target domain adaptation methods. Grounding domain adaptation in an explicit causal model offers a principled way to remove confounding-induced bias rather than relying on heuristic invariance regularizers, improving robustness across multiple target domains at once. The causal graph over invariant and domain-specific factors is assumed by design rather than discovered from data, and evaluation is limited to four benchmark datasets.", "key_idea_ko": "U3CF는 multi-target domain adaptation을 위한 structural causal model 기반 framework로, domain-invariant causal factor와 domain-specific confounder를 disentangle하고 conditional intervention을 적용해 spurious cross-domain correlation을 제거한다.", "summary_ko": "Multi-target domain adaptation 방법들은 대체로 원칙적인 causal formulation 없이 경험적으로 domain-invariance를 강제하며, 이는 여러 unlabeled target domain에 대한 adaptation에 편향을 유발할 수 있다. U3CF는 domain-invariant causal factor와 domain-specific factor가 함께 representation과 label을 형성하며 후자가 spurious cross-target correlation을 유발함을 보이는 structural causal model을 구성한 뒤, mutual-information 기반 분리 기준으로 representation을 invariant component와 confounder로 disentangle하고, conditional intervention을 적용해 confounding을 차단하며, prototype 기반 contrastive alignment 전략으로 domain을 정렬한다. 네 개 benchmark에 대한 광범위한 실험에서 U3CF는 주요 multi-target domain adaptation 방법들을 일관되게 능가한다. Domain adaptation을 명시적 causal model에 근거시킴으로써 heuristic한 invariance regularizer에 의존하는 대신 confounding으로 인한 bias를 제거하는 원칙적인 방법을 제공하며, 여러 target domain에 걸쳐 동시에 robustness를 향상시킨다. Invariant factor와 domain-specific factor에 대한 causal graph는 데이터로부터 discover되는 것이 아니라 설계상 가정된 것이며, 평가는 네 개의 benchmark 데이터셋에 국한된다.", "abstract": "Multi-target domain adaptation (MTDA) trains a model using a labeled source domain and several unlabeled target domains, aiming to enhance performance across all targets. However, existing methods lack a principled causal formulation and often rely on empirical domain-invariance enforcement, which can bias adaptation across targets. To fill this gap, we propose the Unbiased, Unconfounding, and Unified Causal Framework (U3CF) for MTDA. To unify align multiple domains, we propose a prototype-driven alignment strategy that progressively updates prototypes by high-confidence target predictions, while the contrastive optimization objective jointly aligns target samples to semantic prototypes and preserves class discrimination. By formulating a structural causal model, we reveal that domain-invariant causal factors and domain-specific factors shape representations and labels, while the latter induces spurious label correlations across targets. Accordingly, U3CF achieves unbiased prediction by disentangling representations into invariant causal components and domain-specific confounders and applying conditional intervention to block confounding effects while preserving invariant semantics. To ensure precise disentanglement, we leverage mutual information theory to derive a principled criterion for feature separation. Extensive experiments on four benchmarks demonstrate that U3CF consistently outperforms leading methods."}, {"id": "64369", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "The Fisher Dimension: Instance-Dependent Complexity for Causal Discovery", "url": "https://icml.cc/virtual/2026/poster/64369", "board": "Hall A #4114", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Luong Doan", "Khanh Quoc", "Duc Nguyen", "Mai Hung", "Phong Ho", "Nhung Duong", "Tuan Do"], "famous": [], "key_idea_en": "The Fisher dimension is an instance-dependent complexity measure, the inverse squared minimum partial correlation, that tightly characterizes the sample complexity of recovering the Markov equivalence class in linear Gaussian causal discovery.", "summary_en": "Classical sample-complexity bounds for causal structure learning are minimax, worst-case quantities, so they fail to distinguish genuinely easy problem instances from hard ones. This paper defines the Fisher dimension, based on the inverse squared minimum partial correlation needed for recovery, as an instance-specific complexity measure for Markov equivalence class recovery in linear Gaussian models. The authors prove that the Fisher dimension gives matching, up to log factors, lower and upper bounds on sample complexity, and show it stays uniformly bounded across graph structures under well-conditioned spectral, noise, and edge-coefficient assumptions, implying that parametric rather than structural properties drive difficulty. This offers a finer, instance-adaptive lens for understanding when causal discovery is statistically easy or hard, beyond worst-case minimax rates. Theory and empirical validation are limited to linear Gaussian models with well-conditioned spectral properties, with correlation between the metric and observed sample complexity confirmed across structured graph families.", "key_idea_ko": "논문은 linear Gaussian causal discovery에서 Markov equivalence class 복원의 sample complexity를 정밀하게 특징짓는 instance-dependent complexity measure인 'Fisher dimension'(최소 partial correlation의 역제곱)을 도입한다.", "summary_ko": "causal structure learning에 대한 고전적인 sample-complexity bound는 minimax/worst-case 기준이어서, 정말 쉬운 문제 instance와 어려운 instance를 구분하지 못한다. 저자들은 linear Gaussian model에서 Markov equivalence class 복원에 필요한 최소 partial correlation의 역제곱에 기반한 instance-specific complexity measure로 Fisher dimension을 정의한다. Fisher dimension이 sample complexity에 대해 (log factor 이내로) 서로 일치하는 lower bound와 upper bound를 제공함을 증명하며, well-conditioned spectral, noise, edge-coefficient 가정 하에서는 그래프 구조 전반에 걸쳐 균일하게 bounded됨을 보여, 문제의 난이도가 structural property가 아니라 parametric property에 의해 좌우됨을 시사한다. worst-case minimax rate를 넘어 causal discovery가 통계적으로 쉬운지 어려운지를 이해하는 더 정교하고 instance-adaptive한 관점을 제공한다. 이론과 실증적 검증 모두 well-conditioned spectral property를 갖는 linear Gaussian model에 국한되며, 이 metric과 관측된 sample complexity 간의 상관관계는 structured graph family에 걸쳐 확인되었다.", "abstract": "Classical sample complexity bounds for causal structure learning are minimax in nature, characterizing worst-case difficulty without distinguishing between easy and hard instances. The work introduces the Fisher dimension as a measure of instance-specific complexity for Markov equivalence class recovery in linear Gaussian models, defined as the inverse squared minimum partial correlation needed for recovery. Theoretical analysis shows this dimension provides both lower and upper bounds (tight to logarithmic factors) for sample complexity. The authors demonstrate that under well-conditioned spectral properties with bounded noise and edge coefficients, the Fisher dimension remains uniformly bounded regardless of graph structure, suggesting parametric rather than structural features drive complexity variation. Empirical results validate correlation between this metric and observed sample complexity across structured graph families."}, {"id": "62714", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Shapley Regularized Neural Granger Causality", "url": "https://icml.cc/virtual/2026/poster/62714", "board": "Hall A #407", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["continuous-optimization"], "authors": ["Maolin Yang", "Zhoufan Zhu", "Yuanhe Tian", "Kun Gao", "MUYI LI"], "famous": [], "key_idea_en": "Reformulating neural Granger causality as a feature attribution problem, this work uses an Information-Theoretic Shapley value (Info-Shap) to build global-dependency regularizers that suppress spurious causal links.", "summary_en": "Neural Granger causality methods typically rely on simple local measures for causal discovery, which capture only partial model information and can miss global dependencies among time series. This work reformulates Granger causality as a feature attribution problem, defining an Information-Theoretic Shapley value (Info-Shap) as a global measure of feature importance and proving that zero Info-Shap is equivalent to Granger non-causality. Building on this measure, the authors introduce two model-agnostic regularizers that suppress spurious relationships and mitigate overfitting, and that can be plugged into the training of any differentiable neural network. By grounding neural Granger causal discovery in a principled, global attribution measure rather than local heuristics, the approach improves the robustness of the recovered causal structure. The method is validated on synthetic and realistic time series datasets, though its guarantees remain specific to the Granger-causality framework and its underlying identifiability assumptions.", "key_idea_ko": "neural Granger causality를 feature attribution 문제로 재정식화하여, Information-Theoretic Shapley value(Info-Shap)를 global-dependency regularizer로 사용해 spurious causal link를 억제한다.", "summary_ko": "기존 neural Granger causality 방법은 causal discovery에 local한 measure에 의존하여 모델 정보의 일부만 활용하고 시계열 간 global dependency를 놓칠 수 있다는 문제가 있다. 이 논문은 Granger causality를 feature attribution 문제로 재정식화하고, global feature importance measure로서 Information-Theoretic Shapley value(Info-Shap)를 정의하며, Info-Shap이 0이면 Granger non-causality와 동치임을 이론적으로 증명한다. 주요 기술적 결과로 Info-Shap 기반의 두 가지 model-agnostic regularizer를 제안하여 spurious relationship을 억제하고 overfitting을 완화하며, 이는 differentiable neural network 학습 어디에나 plug-in 가능하다. 이는 neural Granger causal discovery를 local/heuristic이 아닌 원칙적이고 global한 attribution measure에 기반하게 함으로써 복원된 causal structure의 robustness를 향상시킨다는 점에서 의의가 있다. synthetic 및 realistic 시계열 데이터셋에서 검증되었으나, 결과는 Granger-causality framework와 그 identifiability assumption에 특정적이다.", "abstract": "Identifying temporal causal structure is fundamental to understanding complex systems. Neural Granger causality has emerged as a powerful paradigm for this task, leveraging the expressiveness of neural networks to model intricate nonlinear dynamics. Although complex architectures excel at predictive modeling, existing methods typically rely on simple local measures for causal discovery, which extract only partial information from the learned model and may miss global dependencies. To address this issue, we reformulate Granger causality as a feature attribution problem and propose the Information-Theoretic Shapley value (Info-Shap) to measure global feature importance. We first establish the theoretical equivalence between zero Info-Shap and Granger non-causality. On top of this, we construct two novel regularizers to suppress spurious relationships and mitigate overfitting. These regularizers are model-agnostic and can be seamlessly integrated into the training of any differentiable neural network. Through extensive experiments on synthetic and realistic datasets, we demonstrate that our method robustly recovers the underlying causal relationships, providing a flexible tool for causal discovery in high-dimensional nonlinear time series."}, {"id": "61815", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Toward Identifiable Sparse Autoencoders", "url": "https://icml.cc/virtual/2026/poster/61815", "board": "Hall A #2510", "categories": ["Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Walter Nelson", "Theofanis Karaletsos", "Francesco Locatello"], "famous": ["Francesco Locatello"], "key_idea_en": "Sparse autoencoders are theoretically unstable across training runs, motivating iSAE, a modified TopK SAE whose learned dictionaries are near-identifiable via a restricted-isometry argument connecting SAEs to dictionary learning.", "summary_en": "Sparse autoencoders (SAEs) are widely used to interpret neural network representations, yet different training runs are empirically known to yield different concept dictionaries and codes, undermining their reliability as an interpretability tool. This paper theoretically characterizes the model properties responsible for that instability and proposes minimal architectural and training changes that address them, yielding iSAE, a modified TopK SAE variant. iSAE achieves lower reconstruction error and improved stability, and by connecting SAEs to classical dictionary learning, the authors show theoretically that dictionaries learned by iSAE in practice satisfy an approximate restricted isometry property, making their sparse codes near-identifiable. Identifiability of this kind is a prerequisite for trusting SAE-derived concepts as consistent, meaningful features rather than training-run artifacts. The identifiability result is approximate rather than exact, and stability is demonstrated empirically alongside the theory rather than proven for all training regimes.", "key_idea_ko": "이 논문은 sparse autoencoder가 서로 다른 training run
