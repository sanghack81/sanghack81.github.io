 간 이론적으로 unstable함을 보이고, restricted-isometry 논증으로 SAE와 dictionary learning을 연결하여 학습된 dictionary가 near-identifiable한 iSAE라는 수정된 TopK SAE를 제안한다.", "summary_ko": "sparse autoencoder(SAE)는 neural network representation을 해석하는 데 널리 쓰이지만, 서로 다른 training run이 서로 다른 concept dictionary와 code를 산출한다는 것이 경험적으로 알려져 있어 interpretability 도구로서의 신뢰성을 저해한다. 이 논문은 이러한 instability를 유발하는 model 속성을 이론적으로 규명하고, 이를 해소하는 최소한의 architecture 및 training 변경을 제안하여 수정된 TopK SAE 변형인 iSAE를 도출한다. iSAE는 더 낮은 reconstruction error와 향상된 stability를 달성하며, SAE를 classical dictionary learning과 연결함으로써 iSAE가 학습한 dictionary가 실제로 approximate restricted isometry property를 만족하여 sparse code가 near-identifiable함을 이론적으로 보인다. identifiability는 SAE가 도출한 concept을 training-run artifact가 아니라 일관되고 의미 있는 feature로 신뢰하기 위한 전제조건이라는 점에서 중요하다. identifiability 결과는 정확한 것이 아니라 restricted isometry에 기반한 근사적 결과이며, stability는 모든 training regime에 대해 증명된 것이 아니라 이론과 함께 경험적으로 입증된다.", "abstract": "Recently, sparse autoencoders (SAEs) have emerged as an attractive tool for interpreting and interacting with representations in practical neural networks. While it is common empirical folklore, we also show theoretically that SAEs are highly unstable: different training runs are likely to produce different concept dictionaries and sparse codes. We characterize the model characteristics that get in the way of the stability of real-world SAEs, and address each of these problems through minimal changes to the architecture and training procedure. Together, these changes yield iSAE, a variant of the standard TopK SAE with lower reconstruction error and improved stability. We explain this improvement theoretically by connecting SAEs with traditional dictionary learning approaches, and show that the dictionaries learned in practice satisfy an approximate restricted isometry condition, rendering the corresponding sparse codes in those models near-identifiable."}, {"id": "60621", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Meta-iLaD: Identifiable Latent Dynamics via Meta-Learning of Dynamics Environments", "url": "https://icml.cc/virtual/2026/poster/60621", "board": "Hall A #4106", "categories": ["Causal Representation Learning", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yubo Ye", "Sweekar Piya", "Xiajun Jiang", "Linwei Wang"], "famous": [], "key_idea_en": "Meta-iLaD meta-learns across multiple dynamics environments to identify latent dynamical representations for high-dimensional, locally-stationary time series.", "summary_en": "Assessing current states and forecasting high-dimensional time series requires learning latent dynamics, but such dynamics are often only locally stationary, which makes identifiability difficult to establish from a single environment. Meta-iLaD models locally-stationary latent dynamics and meta-learns across multiple distinct dynamics environments to recover the shared latent dynamical structure. The ICML abstract page was truncated behind a 'Show more' control, so the full technical result and experimental claims could not be retrieved. Identifiable latent dynamics would in principle let practitioners forecast and interpret high-dimensional time series with theoretical guarantees rather than relying on purely predictive black-box models. The scope and assumptions underlying the identifiability result could not be fully confirmed from the available page content, as this summary is drawn partly from the title alone.", "key_idea_ko": "high-dimensional, locally-stationary time series의 latent dynamical representation을 identify하기 위해 여러 dynamics environment에 걸쳐 meta-learning을 수행한다.", "summary_ko": "high-dimensional time series의 현재 상태를 파악하고 미래를 예측하려면 latent dynamics를 학습해야 하지만, 이러한 dynamics는 흔히 locally stationary할 뿐이어서 단일 environment만으로는 identifiability를 확보하기 어렵다. Meta-iLaD는 locally-stationary latent dynamics를 모델링하고, 여러 개의 서로 다른 dynamics environment에 걸쳐 meta-learning을 수행하여 공유된 latent dynamical structure를 identify한다. ICML 페이지의 abstract가 'Show more' 버튼 뒤에 가려져 있어 구체적인 기술적 결과와 실험 결과는 확인하지 못했다. latent dynamics가 identifiable하다면, 순수 예측 중심의 black-box 모델이 아니라 이론적 보장을 갖춘 high-dimensional time series의 forecasting과 해석이 원칙적으로 가능해진다는 점에서 의의가 있다. identifiability 결과의 범위와 가정은 확보 가능한 페이지 내용만으로는 완전히 확인되지 않았으며, 이는 제목에 주로 의존한 부분적 요약임을 밝혀둔다(abstract truncated at source).", "abstract": "Learning latent dynamics is central to assessing current states and forecasting future trajectories for high-dimensional time series. For locally-stationary latent dynamics of the form F(z_t, ...), [remainder of abstract truncated by a 'Show more' control on the ICML virtual page and not retrievable via automated fetch]."}, {"id": "60944", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "CauSciBench: Evaluating LLM Causal Inference for Scientific Research", "url": "https://icml.cc/virtual/2026/poster/60944", "board": "Hall A #4403", "categories": ["Causal Reasoning in LLMs/Agents", "Treatment Effects & CATE"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Sawal Acharya", "Terry Zhang", "Andrew Kim", "Anahita Haghighat", "Xianlin Sun", "Pepijn Cobben", "Rahul Shrestha", "Maximilian Mordig", "Jacob Emmerson", "Furkan Danisman", "Yuen Chen", "Clijo Jose", "Andrei Muresanu", "Justin Cui", "Jiarui Liu", "Yahang Qi", "Punya Pandey", "Yinya Huang", "Bernhard Scholkopf", "Zhijing Jin"], "famous": ["Bernhard Scholkopf"], "key_idea_en": "CauSciBench is a 300+ task benchmark that evaluates whether LLMs can autonomously carry out the full causal-inference pipeline, variable selection, method selection, effect estimation, and interpretation, on real scientific data.", "summary_en": "Assessing whether LLMs can serve as autonomous scientific analysts requires testing the entire causal-inference workflow rather than isolated sub-tasks, a gap no prior benchmark had comprehensively covered. CauSciBench addresses this with over 300 tasks drawn from real-world studies, synthetic scenarios, and textbook datasets spanning multiple disciplines, evaluating variable selection, method selection, causal effect estimation, and statistical interpretation, with seven frontier models tested under test-time scaling strategies such as Chain-of-Thought, Program-of-Thought, and ReAct. The central finding is a clear performance gap between real-world and synthetic settings, exposing limitations in current agentic capabilities for data-driven causal analysis. This quantifies how far current LLM agents remain from reliably automating scientific causal analysis, an increasingly proposed use case. The benchmark's scope is bounded by its task design and by the specific models and prompting strategies tested, and because the abstract text available was truncated, some benchmark details here are inferred from surrounding page content.", "key_idea_ko": "CauSciBench는 LLM이 실제 과학 데이터에 대해 variable selection, method selection, effect estimation, interpretation을 포함한 전체 causal-inference pipeline을 자율적으로 수행할 수 있는지를 평가하는 300개 이상의 task로 구성된 benchmark이다.", "summary_ko": "LLM이 autonomous scientific analyst 역할을 할 수 있는지를 평가하려면 개별 sub-task가 아니라 전체 causal-inference workflow를 테스트해야 하지만, 이를 포괄적으로 다루는 benchmark는 이전에 없었다. 이 논문은 real-world study, synthetic scenario, textbook dataset에서 가져온 300개 이상의 task로 구성된 CauSciBench를 도입하여 variable selection, method selection, causal effect estimation, statistical interpretation을 평가한다. Chain-of-Thought, Program-of-Thought, ReAct 등 test-time scaling 전략 하에서 7개의 frontier model을 테스트한 결과, real-world 설정과 synthetic 설정 사이에 뚜렷한 성능 격차가 나타나 현재 agentic capability의 한계를 드러낸다. 이는 data-driven causal analysis를 신뢰성 있게 자동화하는 것으로부터 현재 LLM agent가 얼마나 멀리 있는지를 정량화한다는 점에서 중요하다. benchmark의 범위는 task 설계와 테스트된 특정 model/prompting 전략에 의해 제한되며, 원문 abstract가 잘려 있어 일부 benchmark 세부사항은 주변 페이지 내용으로부터 추론되었다.", "abstract": "Identifying and estimating causal relationships from data is an important component of the scientific research process because it enables researchers to understand how variables affect one another. CauSciBench is a benchmark containing over 300 evaluation tasks designed to assess LLMs' capacity to independently conduct causal inference across the complete analysis pipeline, encompassing variable selection, method selection, causal effect estimation, and statistical interpretation. The benchmark draws from real-world studies, synthetic scenarios, and textbook datasets spanning multiple disciplines. The researchers evaluated seven frontier models using test-time scaling strategies including Chain-of-Thought, Program-of-Thought, and ReAct approaches. Results show a clear performance gap between real-world and synthetic settings, highlighting limitations in current agentic capabilities for data-driven causal analysis."}, {"id": "65022", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "How Few-Shot Examples Add Up: A Causal Decomposition of Function Vectors in In-Context Learning", "url": "https://icml.cc/virtual/2026/poster/65022", "board": "Hall A #2110", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Entang Wang", "Yiwei Wang", "Aleksandra Bakalova", "Michael Hahn"], "famous": [], "key_idea_en": "The in-context-learning 'function vector' decomposes additively into per-example sub-vectors, which further split into Query-Key routing versus Value-update contributions, giving a mechanistic account of how few-shot prompts drive task behavior.", "summary_en": "In-context learning allows LLMs to pick up new tasks from a handful of examples via a 'function vector' (FV), a causal activation direction driving task behavior, yet how individual demonstrations combine to form this vector had not been mechanistically understood. The authors show that an n-shot function vector is well approximated by a linear combination of example-level sub-vectors, an additive superposition, and further causally decompose each contribution into Query-Key routing (attention allocation) versus Value updates. Models turn out to adaptively reweight which demonstrations dominate the FV based on prior context, with Query-Key alignment contributing most consistently while Value-mediated effects are more heterogeneous across examples. This gives a causal, mechanistic account of how few-shot prompts are implemented internally, informing both interpretability work and prompt design for in-context learning. The analysis is an activation-level causal decomposition on specific models and tasks, and the paper does not detail how broadly the additive-superposition finding generalizes across architectures.", "key_idea_ko": "in-context learning의 'function vector'를 additive한 per-example sub-vector로 causal decomposition하고, 이를 다시 Query-Key routing과 Value-update contribution으로 나누어 few-shot prompt가 task behavior를 이끄는 mechanistic account를 제공한다.", "summary_ko": "In-context learning은 LLM이 소수의 example만으로 새로운 task를 습득하게 하는 'function vector'(FV) -- task behavior를 이끄는 causal activation direction -- 를 통해 이루어지지만, 개별 demonstration들이 어떻게 결합되어 이 vector를 형성하는지는 mechanistically 이해되지 않았다. 저자들은 n-shot function vector가 example-level sub-vector들의 linear combination(additive superposition)으로 잘 근사됨을 보이고, 각 기여를 다시 Query-Key routing(attention allocation)과 Value update로 causally decompose한다. 이들은 모델이 prior context에 따라 어떤 demonstration이 FV를 지배할지 adaptively reweight함을 발견하며, Query-Key alignment의 기여는 example 전반에서 가장 일관적인 반면 Value-mediated effect는 더 이질적임을 보인다. 이는 few-shot prompt가 내부적으로 어떻게 구현되는지에 대한 causal하고 mechanistic한 설명을 제공한다는 점에서 중요하며, interpretability 연구와 ICL을 위한 prompt design 모두에 시사점을 준다. 이 분석은 특정 model/task에 대한 activation-level causal decomposition이며, abstract는 additive-superposition finding이 architecture 전반에 얼마나 일반화되는지는 상세히 다루지 않는다.", "abstract": "In-context learning (ICL) excels at new tasks from minimal examples, yet we still lack a mechanistic explanation of how few-shot prompts shape a model's function vector (FV) -- a causal activation direction that drives task behavior on the ICL query. We demonstrate that an n-shot function vector is well-approximated by a linear combination of example-level sub-vectors, indicating additive contributions from individual demonstrations. We show models contextualize examples based on prior ones, adaptively reweighting which demonstrations dominate the function vector. Our causal decomposition separates Query-Key routing from Value updates, revealing that contextualization's most consistent contributions arise from Query-Key alignment, while Value-mediated effects are more heterogeneous. The findings integrate additive superposition with context-dependent attention reweighting into a mechanistic account of how few-shot prompts implement tasks."}, {"id": "63395", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Geometric Collapse: When Vision Models Fail to Verify Physical Causality", "url": "https://icml.cc/virtual/2026/poster/63395", "board": "Hall A #1310", "categories": ["Other", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Wentao Zhang", "Jinhu Qi", "Weiqiang Jin", "Yifei Zhang", "Chan-Tong Lam", "Irwin King"], "famous": [], "key_idea_en": "A controlled counterfactual image perturbation, 'Scrambled Edges,' injects edge cues while violating physical continuity, revealing that dense depth predictors lack any mechanism to detect and quarantine physically implausible evidence.", "summary_en": "Whether scaling self-supervised dense geometric depth prediction models has endowed them with any inference-time check on the physical plausibility of their inputs remains unclear. The authors construct 'Scrambled Edges,' a controlled counterfactual perturbation that adds salient edge cues while breaking surface continuity, illumination coherence, and occlusion ordering, using energy- and structure-matched controls to isolate the causal effect of unsupported edges. Across CNN, ViT, and SSL depth predictors evaluated on NYU Depth v2 and KITTI, these edge perturbations cause up to 3.2x larger prediction deviation than energy-matched noise, and this 'Geometric Collapse' propagates globally such that even oracle-masked repair recovers only 47% of the error. The findings offer controlled behavioral evidence that current dense predictors cannot reliably quarantine physically unsupported cues, motivating explicit plausibility scoring and selective cue integration in future architectures. The results are demonstrated on specific depth-estimation benchmarks and predictor families, leaving generality to other dense-prediction tasks unestablished.", "key_idea_ko": "physical continuity를 위반하면서 edge cue를 주입하는 controlled counterfactual image perturbation인 'Scrambled Edges'를 이용해, dense depth predictor가 physically implausible한 evidence를 탐지하고 격리할 메커니즘을 갖추지 못했음을 보인다.", "summary_ko": "self-supervised dense geometric(depth) prediction model을 scaling하는 것이 inference 시점에 입력의 physical plausibility를 검증하는 메커니즘을 만들어냈는지는 불분명하다. 저자들은 surface continuity, illumination coherence, occlusion ordering을 깨뜨리면서 salient edge cue를 추가하는 controlled counterfactual perturbation인 'Scrambled Edges'를 구성하고, energy- 및 structure-matched control을 통해 unsupported edge의 causal effect를 isolate한다. NYU Depth v2와 KITTI에서 CNN, ViT, SSL depth predictor 전반에 걸쳐 이러한 edge perturbation은 energy-matched noise 대비 최대 3.2배 큰 prediction deviation을 유발했고, 이 'Geometric Collapse'는 전역적으로 전파되어 oracle-masked repair조차 error의 47%만을 복구했다. 이는 현재 dense predictor가 physically unsupported cue를 신뢰성 있게 격리할 수 없다는 controlled behavioral evidence를 제시하며, 향후 architecture에서 explicit plausibility scoring과 selective cue integration의 필요성을 시사한다. 이 결과는 특정 depth-estimation benchmark와 predictor family에서 입증된 것이며, 다른 dense-prediction task로의 generality는 abstract에서 확립되지 않았다.", "abstract": "Recent progress in large-scale self-supervised learning has improved dense geometric prediction, but it remains unclear whether such scaling yields inference-time physical plausibility checks. We propose Scrambled Edges, a controlled counterfactual that injects salient edge-like cues while violating surface continuity, illumination coherence, and occlusion ordering. With energy-matched and structure-matched controls, we isolate the effect of unsupported edge evidence from high-frequency energy and edge sparsity. Across CNN/ViT/SSL depth predictors on NYU Depth v2 and KITTI, Scrambled Edges induce up to 3.2x larger deviation from clean predictions than energy-matched noise. The resulting Geometric Collapse propagates globally: even with oracle knowledge of the corrupted region, output-level repair recovers only 47%, with substantial error outside the mask. These findings provide controlled behavioral evidence that current dense predictors lack reliable mechanisms to quarantine physically unsupported edge cues, motivating explicit plausibility scoring and selective cue integration."}, {"id": "61961", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "CURVE: Learning Causality-Inspired Invariant Representations for Robust Scene Understanding via Uncertainty-Guided Regularization", "url": "https://icml.cc/virtual/2026/poster/61961", "board": "Hall A #1604", "categories": ["Causal Representation Learning", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yue Liang", "Jiatong Du", "Ziyi Yang", "Yanjun Huang", "Hong Chen"], "famous": [], "key_idea_en": "CURVE applies causality-inspired, uncertainty-guided regularization to disentangle invariant scene relations from spurious environment-specific ones, improving out-of-distribution generalization of scene graphs.", "summary_en": "Scene graphs used for scene understanding tend to overfit to spurious correlations, which severely hinders their generalization to out-of-distribution settings. CURVE tackles this by combining variational uncertainty modeling with uncertainty-guided structural regularization and prototype-conditioned debiasing to suppress high-variance, environment-specific relations and disentangle invariant interaction dynamics. This yields improved zero-shot transfer and low-data sim-to-real adaptation, along with domain-stable sparse topologies and reliable uncertainty estimates for risk prediction under distribution shift. Robust scene understanding under distribution shift is critical for real-world perception systems such as robotics and autonomous driving, which is what makes these gains consequential. Evaluation focuses on zero-shot and low-data transfer scenarios, and the causal framing is inspirational rather than grounded in a formal structural causal model with identification guarantees.", "key_idea_ko": "CURVE는 causality-inspired uncertainty-guided regularization을 사용하여 invariant scene relation을 spurious한 environment-specific relation으로부터 disentangle함으로써 scene graph의 out-of-distribution generalization을 개선한다.", "summary_ko": "scene understanding에 사용되는 scene graph는 spurious correlation에 overfit되는 경향이 있으며, 이는 out-of-distribution 설정으로의 generalization을 심각하게 저해한다. 논문은 variational uncertainty modeling과 uncertainty-guided structural regularization, prototype-conditioned debiasing을 결합한 프레임워크인 CURVE를 제안하여 high-variance한 environment-specific relation을 억제하고 invariant interaction dynamics를 disentangle한다. zero-shot transfer 및 low-data sim-to-real adaptation 성능이 개선되었으며, domain-stable한 sparse topology와 distribution shift 하에서의 risk prediction을 위한 신뢰할 수 있는 uncertainty estimate를 얻었다. distribution shift 하에서의 robust scene understanding은 robotics나 autonomous driving과 같은 실세계 perception system에 필수적이라는 점에서 중요하다. 평가는 zero-shot 및 low-data transfer 시나리오에 집중되어 있으며, causal framing은 identification guarantee를 갖춘 formal structural causal model에 기반한 것이 아니라 영감을 얻은 수준이다.", "abstract": "Scene graphs provide structured abstractions for scene understanding, yet they often overfit to spurious correlations, severely hindering out-of-distribution generalization. To address this limitation, we propose CURVE, a causality-inspired framework that integrates variational uncertainty modeling with uncertainty-guided structural regularization to suppress high-variance, environment-specific relations. Specifically, we apply prototype-conditioned debiasing to disentangle invariant interaction dynamics from environment-dependent variations, promoting a sparse and domain-stable topology. Empirically, we evaluate CURVE in zero-shot transfer and low-data sim-to-real adaptation, verifying its ability to learn domain-stable sparse topologies and provide reliable uncertainty estimates to support risk prediction under distribution shifts."}, {"id": "61642", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Density-Guided Continuous Flow for Robust Counterfactual Explanations", "url": "https://icml.cc/virtual/2026/poster/61642", "board": "Hall A #3200", "categories": ["Counterfactual Inference", "Causal Fairness & Robustness"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Jun Tan", "Qing Guo", "Zicheng Xu", "Jinglin Li", "QI Fang", "Ning Gui"], "famous": [], "key_idea_en": "DensityFlow is a Neural-ODE-based generative framework that produces robust counterfactual explanations by steering generation toward high-density data-manifold regions via a learned differentiable density score, avoiding expensive ensemble-based stability checks.", "summary_en": "Counterfactual explanations support actionable recourse, but their reliability degrades in low-density regions of the data manifold where classifiers exhibit high variance, and existing robustness fixes rely on costly ensemble intersections. DensityFlow instead models counterfactual generation as continuous-time dynamics parameterized by a Neural ODE, guided by a differentiable density score learned via noise contrastive estimation with a (K+1)-way discriminator that steers generation toward high-confidence, high-density regions; for black-box models it adds a local proxy-distillation mechanism that aligns a lightweight surrogate with the target model along the generation trajectory, enabling efficient gradient-based optimization with few queries. Experiments show DensityFlow achieves superior validity under model multiplicity while substantially reducing query costs relative to ensemble-based baselines. This offers a more efficient path to robust counterfactual explanations without sacrificing validity as the target model varies. Its reliability depends on the quality of the learned density score and local surrogate, which remain empirical approximations rather than exact model access.", "key_idea_ko": "DensityFlow는 학습된 differentiable density score를 이용해 생성 과정을 data manifold의 high-density 영역으로 유도하는 Neural-ODE 기반 생성 framework로, 값비싼 ensemble 기반 안정성 검사 없이 robust counterfactual explanation을 만든다.", "summary_ko": "Counterfactual explanation은 actionable recourse에 중요하지만 classifier의 variance가 큰 data manifold의 low-density 영역에서는 신뢰성이 떨어지며, 기존 robustness 해법은 비용이 큰 ensemble intersection에 의존한다. DensityFlow는 대신 counterfactual generation을 Neural ODE로 parameterize된 continuous-time dynamics로 모델링하고, Noise Contrastive Estimation으로 학습한 differentiable density score((K+1)-way discriminator로 density ratio를 추정)를 이용해 generation을 high-confidence, high-density 영역으로 유도한다. Black-box model에 대해서는 counterfactual generation trajectory를 따라 가벼운 surrogate를 target model에 맞추는 local proxy distillation mechanism을 추가하여, 적은 query만으로 효율적인 gradient 기반 최적화를 가능하게 한다. 실험 결과 DensityFlow는 model multiplicity 하에서 더 뛰어난 validity를 달성하면서 ensemble 기반 baseline 대비 query cost를 크게 줄인다. 이 접근법은 학습된 density score와 local surrogate의 품질에 의존하는데, 이들은 정확한 model access가 아닌 경험적 근사치이다.", "abstract": "Counterfactual explanations (CEs) are essential for actionable recourse, yet their reliability is often compromised in low-density regions, where classifiers exhibit high variance. Unlike existing methods that rely on expensive ensemble intersections to define stability, we propose DensityFlow, a generative framework that constructs robust CEs by adhering to the high-confidence data manifold. Specifically, we model the counterfactual generation as continuous-time dynamics parameterized by Neural ODE, guided by a differentiable density score to actively avoid uncertain, low-density areas. This density score is learned via Noise Contrastive Estimation, effectively leveraging a (K+1)-way discriminator to estimate density ratios. For black-box settings, we introduce a local proxy distillation mechanism that aligns a lightweight surrogate with the target model strictly within the trajectory of CE generation, enabling efficient gradient-based optimization with minimal queries. Experiments demonstrate that DensityFlow achieves superior validity under model multiplicity while significantly reducing query costs compared to ensemble-based baselines. Our implementation is available in the anonymous repository."}, {"id": "61219", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Causally Evaluating the Learnability of Formal Language Tasks", "url": "https://icml.cc/virtual/2026/poster/61219", "board": "Hall A #2303", "categories": ["Causal Reasoning in LLMs/Agents", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Vesteinn Snaebjarnarson", "Anej Svete", "Josef Valvoda", "Reda Boumasmoud", "Brian DuSell", "Ryan Cotterell"], "famous": [], "key_idea_en": "A causal graphical model and an efficient sampler for probabilistic finite-state automata control a target task's occurrence while holding other formal-language properties fixed, enabling the true causal (not merely correlational) relationship between task frequency and learnability to be measured.", "summary_en": "Language model performance on a given task is affected by confounders in the training data, such as related languages helping low-resource languages or code helping natural-language reasoning, yet formal languages used to study learnability commonly fail to adequately treat this multi-task confounding. Treating formal languages as multi-task learners, this work constructs a causal graphical model, paired with an efficient sampling mechanism for probabilistic finite-state automata, that gives full control over how often a target task occurs while holding other language properties fixed. Its main technical contribution is a set of task-specific decomposed KL-divergences that serve as targeted evaluation tools for isolating the causal effect of task occurrence on learnability. Experiments show that naive correlation between task frequency and learnability does not recover the true causal relationship, demonstrating that causal analysis is necessary rather than optional for correctly attributing what drives LLM learnability. The study is conducted in a controlled formal-language/finite-state-automata setting rather than on natural language directly, trading realism for causal control.", "key_idea_ko": "목표 task의 발생 빈도를 제어하면서 다른 formal-language property는 고정하는 causal graphical model과 probabilistic finite-state automata용 효율적 sampler를 구축하여, task frequency와 learnability 간의 진정한 causal(단순 상관이 아닌) 관계를 측정할 수 있게 한다.", "summary_ko": "language model의 특정 task 성능은 training data 내 confounder(예: 관련 언어가 저자원 언어 학습을 돕거나 code가 자연어 reasoning을 돕는 경우)의 영향을 받는데, formal language를 이용한 learnability 연구는 이러한 multi-task confounding을 충분히 다루지 못해왔다. formal language를 multi-task learner로 취급하여 causal graphical model을 구성하고, probabilistic finite-state automata에 대한 효율적 sampling mechanism을 결합함으로써 다른 language property를 고정한 채 목표 task의 발생 빈도를 완전히 통제할 수 있게 한다. task별로 분해된 KL-divergence 집합을 주요 기술적 결과로 제시하며, 이는 task occurrence가 learnability에 미치는 causal effect를 분리해 평가하는 targeted evaluation tool로 기능한다. 실험 결과 task frequency와 learnability 간 naive correlation은 진정한 causal relationship을 복원하지 못함을 보여, LLM learnability의 원인을 올바르게 규명하는 데 causal analysis가 선택이 아니라 필수임을 입증한다. 이 연구는 자연어 자체가 아니라 controlled된 formal-language/finite-state-automata setting에서 수행되어, realism을 causal control과 맞바꾼다.", "abstract": "Large language models (LLMs) trained on natural language data are capable of translating between languages, predict chess moves, and write poetry. Performance on a given task depends on directly relevant training data, yet confounders abound: data in related languages has been shown to help low-resource languages, and training on code has been shown to improve reasoning capabilities in natural language generation. Formal languages have become a common tool for understanding the learnability of language model architectures and their limitations---we argue that they should also be treated as multi-task learners when studying the learnability of a given task. This means that to understand the learnability of a given property of a formal language, confounders from other tasks need to be considered. We propose a causal graphical model and an efficient sampling mechanism for probabilistic finite-state automata that gives full control over the occurrences of a given task while maintaining other language properties. To enable targeted evaluation, we derive task-specific decomposed KL-divergences. These tools allow us to know the causal relationship between how often a task appears and its true learnability. Our experiments confirm that the correlation between task occurrences and learnability does not recover the accurate relationship---for this, the causal analysis and machinery is necessary."}, {"id": "63154", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "The Fairness Hierarchy: A viewpoint from causal inference", "url": "https://icml.cc/virtual/2026/poster/63154", "board": "Hall A #3302", "categories": ["Causal Fairness & Robustness", "Counterfactual Inference", "Identification & Partial ID"], "estimands": ["NDE", "NIE", "counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Chengbo Zhang", "Zhen Yao", "Hao Pang", "Changcheng Li"], "famous": [], "key_idea_en": "A fairness framework built on path-specific counterfactual interventions lets sensitive-attribute information selectively propagate or be blocked along chosen causal paths, yielding a hierarchy of interpretable fairness notions rather than a single fairness constraint.", "summary_en": "Existing fair-prediction methods typically impose fairness as constraints on predictive objectives or model parameters, but this paper instead defines fairness directly at the level of counterfactual prediction semantics. Given a learned causal graph and structural causal model, the method builds a predictive distribution for the outcome by generating counterfactual predictions that selectively allow or block sensitive-attribute information along designated causal paths, including cases with multiple sensitive sources. This selective path-blocking induces a hierarchy of interpretable fairness notions that generalizes standard path-specific causal fairness semantics rather than delivering just one fixed notion. The result is fine-grained, interpretable control over which causal channels of sensitive influence count as fair versus unfair, in place of an all-or-nothing constraint. The framework's applicability depends on having, or correctly specifying, a causal graph and structural model for the sensitive attributes and outcome, and its behavior is demonstrated empirically rather than backed by identification guarantees stated in the abstract.", "key_idea_ko": "이 논문은 path-specific counterfactual intervention에 기반한 fairness framework를 구축하여 sensitive-attribute information이 선택된 causal path를 따라 선택적으로 전파되거나 차단되도록 하고, 단일 fairness constraint 대신 해석 가능한 fairness 개념들의 hierarchy를 생성한다.", "summary_ko": "문제는 기존의 fair-prediction method들이 대체로 fairness를 predictive objective나 model parameter에 대한 constraint로 부과하지만, 이 논문은 대신 counterfactual prediction semantics 수준에서 fairness를 직접 정의한다는 점에서 출발한다. 핵심 아이디어는 learned causal graph와 structural causal model이 주어졌을 때, sensitive-attribute information이 지정된 causal path를 따라 선택적으로 허용되거나 차단되도록 counterfactual prediction을 생성하여 outcome에 대한 predictive distribution을 구성하는 것이며, sensitive source가 여러 개인 경우도 포함한다. 주요 결과는 이러한 selective path-blocking이 단일 고정된 개념을 제공하는 대신, 표준 path-specific causal fairness semantics를 일반화하는 해석 가능한 fairness 개념들의 hierarchy를 유도한다는 것이다. 이는 all-or-nothing constraint 대신 sensitive influence의 어떤 causal channel을 fair 혹은 unfair로 볼지에 대해 practitioner에게 세밀하고 해석 가능한 통제권을 제공한다는 점에서 중요하다. 이 framework의 적용 가능성은 sensitive attribute와 outcome에 대한 causal graph와 structural model을 보유하거나 올바르게 specify하는 데 의존하며, 그 동작은 abstract에 명시된 identification guarantee 없이 empirical하게 입증되었다.", "abstract": "Fairness in machine learning prediction has attracted growing attention in recent years. In this article, we propose a causal-inference-based framework for fair prediction, defined through path-specific counterfactual interventions. Instead of imposing fairness via constraints on predictive objectives or model parameters, our approach specifies fairness directly at the level of counterfactual prediction semantics. Given a learned causal graph, we construct a predictive distribution for the outcome Y using a structural causal model and generate counterfactual predictions by selectively intervening on causal paths emanating from sensitive attributes. By allowing or blocking the propagation of sensitive information along designated paths, possibly involving multiple sensitive sources, our framework induces a hierarchy of interpretable fairness notions, generalizing standard path-specific causal semantics. Our empirical experiments demonstrate how different fairness levels can be instantiated and compared in practice."}, {"id": "64724", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Unveiling the Structure of Do-Calculus Reasoning via Derivation Graphs", "url": "https://icml.cc/virtual/2026/poster/64724", "board": "HALL A #4311", "categories": ["Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Clement Yvernes", "Emilie Devijver", "Marianne Clausel", "Eric Gaussier"], "famous": [], "key_idea_en": "The paper introduces derivation graphs that represent and organize how do-calculus rules combine, characterizing the full space of interventional and observational expressions equivalent under do-calculus and bounding derivations to at most four rule applications.", "summary_en": "The do-calculus offers a general inference system for interventional queries by successively transforming expressions through its three rules, but combining and ordering these rule applications to explore the space of equivalent expressions has lacked systematic structure. Derivation graphs fill this gap by representing how do-calculus rules are applied and combined, which in turn characterizes the full space of observational and interventional probability expressions equivalent under the do-calculus. The structure of these graphs yields a simple procedure that reaches any equivalent expression in at most four do-calculus rule applications, and applying identification algorithms across these equivalent queries produces multiple valid estimands for the same causal quantity. Because different valid estimands for an identified effect can have very different statistical efficiency, mapping this equivalence space opens a path toward systematically finding more efficient estimators. The work characterizes the combinatorial structure of derivations but does not itself select the most efficient estimator among the equivalents it exposes.", "key_idea_ko": "do-calculus 규칙들이 결합되는 방식을 표현하고 정리하는 derivation graph를 도입하여, do-calculus 하에서 동치인 interventional/observational expression의 전체 공간을 특징짓고 derivation을 최대 네 번의 규칙 적용으로 bound한다.", "summary_ko": "do-calculus는 세 가지 규칙을 순차적으로 적용해 expression을 변환함으로써 interventional query에 대한 일반적인 추론 체계를 제공하지만, 이러한 규칙 적용을 결합하고 순서를 정해 동치 expression의 공간을 탐색하는 데는 체계적인 구조가 부족했다. 핵심 아이디어는 do-calculus 규칙이 적용되고 결합되는 방식을 표현하는 derivation graph를 도입하여, do-calculus 하에서 동치인 observational 및 interventional probability expression의 전체 공간을 특징짓는 것이다. 주요 기술적 결과는 이 graph의 구조가 임의의 동치 expression에 도달하는 데 최대 네 번의 do-calculus 규칙 적용만 필요한 단순한 절차를 제공한다는 것이며, 이러한 동치 query들에 identification algorithm을 적용하면 동일한 causal quantity에 대해 여러 valid한 estimand가 산출된다. 이는 동일한 identified effect에 대한 서로 다른 valid estimand들이 매우 다른 statistical efficiency를 가질 수 있으므로, 동치 공간을 매핑하는 것이 더 효율적인 estimator를 체계적으로 찾는 길을 열어준다는 점에서 의의가 있다. 이 연구는 derivation의 조합적 구조를 특징짓지만, 그것이 드러내는 동치 estimand들 중 가장 효율적인 것을 직접 선택하지는 않는다.", "abstract": "The do-calculus defines a general system of inference for interventional queries, allowing causal quantities to be transformed through successive applications of its rules. This process induces a rich space of equivalent interventional expressions, but combining and ordering these rules remains challenging. In this work, we introduce derivation graphs, which represent how do-calculus rules are applied and combined, and characterize the full space of observational and interventional probabilities which are equivalent under the do-calculus. The structure of these graphs yields a simple procedure that uses at most four applications of do-calculus rules. Finally, we show how applying identification algorithms to equivalent causal queries produces multiple valid estimands for the same causal quantity, eventually yielding more efficient estimators."}, {"id": "63457", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Regret-Based Federated Causal Discovery with Unknown Interventions", "url": "https://icml.cc/virtual/2026/poster/63457", "board": "Hall A #4314", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based", "intervention-based"], "authors": ["Federico Baldo", "Charles Assaad"], "famous": [], "key_idea_en": "I-PERI is a federated causal discovery algorithm that recovers a common CPDAG across clients and then orients extra edges using structural differences from unknown, client-specific interventions, yielding a tighter phi-Markov equivalence class.", "summary_en": "Federated causal discovery methods typically assume all clients share the same causal model, an unrealistic assumption since client-specific policies, for example across hospitals, induce heterogeneous, unknown interventions. I-PERI first recovers the CPDAG common to all clients from federated observational data, then exploits structural differences induced by the clients' unknown interventions to orient additional edges, defining a new, tighter phi-Markov equivalence class represented by an augmented phi-CPDAG. The authors prove convergence and privacy-preserving guarantees for I-PERI and empirically demonstrate its effectiveness against baselines. This relaxes an unrealistic homogeneity assumption in federated causal discovery, making the framework applicable to realistic decentralized settings like multi-hospital data with site-specific practices, while preserving privacy. Interventions must be attributable to client-level heterogeneity in a way the algorithm can exploit, so orientation power is bounded by how much the clients' interventions actually differ.", "key_idea_ko": "I-PERI는 client 전체에 공통된 CPDAG를 복원한 뒤 unknown하고 client별로 다른 intervention에서 비롯된 structural difference를 이용해 추가 edge를 orient하는 federated causal discovery algorithm으로, 더 tight한 phi-Markov equivalence class를 산출한다.", "summary_ko": "federated causal discovery 방법은 대체로 모든 client가 동일한 causal model을 공유한다고 가정하는데, 이는 병원 간처럼 client별 정책이 heterogeneous하고 unknown한 intervention을 유발하는 현실에서는 비현실적이다. I-PERI는 먼저 federated observational data로부터 모든 client에 공통된 CPDAG를 복원한 뒤, client들의 unknown intervention이 유발한 structural difference를 이용해 추가 edge를 orient하여 augmented phi-CPDAG로 표현되는 새롭고 더 tight한 phi-Markov Equivalence Class를 정의한다. 저자들은 I-PERI에 대한 convergence와 privacy-preserving guarantee를 증명하고 baseline 대비 효과성을 경험적으로 보인다. 이는 federated causal discovery의 비현실적인 homogeneity 가정을 완화하여, 사이트별 practice가 다른 multi-hospital data 같은 현실적인 decentralized setting에 이 framework가 적용 가능하도록 하면서 동시에 privacy를 보존한다. Intervention은 algorithm이 활용할 수 있는 방식으로 client-level heterogeneity에 귀속되어야 하며, orientation power는 client들의 intervention이 실제로 얼마나 다른지에 의해 제한된다.", "abstract": "Most causal discovery methods recover a completed partially directed acyclic graph (CPDAG) representing a Markov equivalence class from observational data. Recent work has extended these methods to federated settings to address data decentralization and privacy constraints, but often under idealized assumptions that all clients share the same causal model. Such assumptions are unrealistic in practice, as client-specific policies, for instance, across hospitals, naturally induce heterogeneous and unknown interventions. In this work, we address federated causal discovery under unknown client-level interventions. We propose I-PERI, a novel federated algorithm that first recovers the CPDAG common to all clients and then orients additional edges by exploiting structural differences induced by interventions across clients. This yields a tighter equivalence class, which we call the phi-Markov Equivalence Class, represented by an augmented version of the CPDAG, namely, a phi-CPDAG. We provide theoretical guarantees on the convergence of I-PERI, as well as on its privacy-preserving properties, and present empirical evaluations demonstrating the effectiveness of the proposed algorithm."}, {"id": "62901", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Counterfactual Bootstrap for Robust Meta-Reinforcement Learning", "url": "https://icml.cc/virtual/2026/poster/62901", "board": "Hall A #4404", "categories": ["Counterfactual Inference", "Identification & Partial ID", "Confounding & Deconfounding"], "estimands": ["counterfactual query", "policy value"], "treatment_type": "time-varying", "discovery_types": [], "authors": ["Ai Bo", "Junzhe Zhang", "M. Cenk Gursoy"], "famous": ["Junzhe Zhang"], "key_idea_en": "The method augments Meta-RL algorithms such as MAML with partial-identification-based counterfactual trajectory generation from confounded, heterogeneous observational environments to produce robust policy initializations.", "summary_en": "Meta-RL methods typically assume unobserved confounders can be ruled out a priori, yet real observational data collected across heterogeneous environments is often confounded, undermining generalization guarantees. The authors introduce an augmentation procedure for standard Meta-RL algorithms that applies partial identification methods to generate posterior counterfactual trajectories from candidate environments consistent with the confounded observations. These counterfactual trajectories are used to find a policy initialization, and theoretical analysis shows the resulting causal Meta-RL approach is guaranteed to minimize generalization loss on future inference tasks. This makes Meta-RL robust to confounding in its training data, an assumption most existing methods silently rely on and violate in practice. The guarantees rely on partial-identification bounds over the set of candidate environments consistent with observed data, so their tightness depends on how well that candidate set captures the true confounding structure.", "key_idea_ko": "confounded되고 heterogeneous한 observational environment로부터 partial identification 기반의 counterfactual trajectory generation을 이용해 Meta-RL 알고리즘(예: MAML)을 보강함으로써 강건한 policy initialization을 만든다.", "summary_ko": "Meta-RL 방법들은 대개 unobserved confounder를 사전에 배제할 수 있다고 가정하지만, 여러 이질적 environment에서 수집된 실제 observational data는 흔히 confounded되어 있어 generalization 보장을 훼손한다. 저자들은 표준 Meta-RL 알고리즘에 적용 가능한 augmentation 절차를 도입하는데, 이는 partial identification 방법을 적용하여 confounded된 관측값과 일관된 candidate environment로부터 posterior counterfactual trajectory를 생성한다. 이 counterfactual trajectory들은 policy initialization을 찾는 데 사용되며, 이론적 분석은 그 결과로 얻어지는 causal Meta-RL 접근법이 future inference task에서 generalization loss를 최소화함을 보장함을 보인다. 이는 대부분의 기존 Meta-RL 방법이 암묵적으로 의존하면서도 실제로는 위배하는 가정인 confounding에 대해 Meta-RL을 강건하게 만든다는 점에서 중요하다. 이 보장은 관측된 데이터와 일관된 'candidate environment' 집합에 대한 partial-identification bound에 의존하므로, 그 tightness는 그 candidate set이 실제 confounding structure를 얼마나 잘 포착하는지에 달려 있다.", "abstract": "Meta-Reinforcement Learning (Meta-RL) focuses on training policies using data collected from a variety of diverse environments. This approach enables the policy to adapt to new settings with only a few training steps. While many Meta-RL methods have demonstrated success, they often rely on the assumption that unobserved confounders can be excluded a priori. This paper investigates robust Meta-RL in sequential decision-making, given confounded observational data collected across multiple heterogeneous environments. We introduce a novel augmentation procedure for standard Meta-RL algorithms (e.g., MAML), which employs partial identification methods to generate posterior counterfactual trajectories from candidate environments that align with the confounded observations. These counterfactual trajectories are then used to find a policy initialization that produces strong generalization performance in the target domain. Theoretical analysis reveals that our causal Meta-RL approach is guaranteed to yield a solution that minimizes generalization loss in future inference tasks."}, {"id": "64916", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "DeepBlip: Estimating Conditional Average Treatment Effects Over Time", "url": "https://icml.cc/virtual/2026/poster/64916", "board": "Hall A #4405", "categories": ["Treatment Effects & CATE", "Time-Series Causality", "Confounding & Deconfounding"], "estimands": ["CATE"], "treatment_type": "time-varying", "discovery_types": [], "authors": ["Haorui Ma", "Dennis Frauen", "Stefan Feuerriegel"], "famous": ["Stefan Feuerriegel"], "key_idea_en": "DeepBlip is the first neural framework for structural nested mean models, using a double optimization trick to train all time-specific 'blip effect' functions jointly end to end.", "summary_en": "Structural nested mean models decompose treatment-sequence effects over time into interpretable time-specific 'blip effects,' but their sequential g-estimation scheme has resisted neural implementation because it blocks end-to-end gradient training. DeepBlip overcomes this with a novel double optimization trick that learns all blip functions simultaneously, incorporating sequential architectures such as LSTMs or transformers to capture temporal dependencies. A Neyman-orthogonal loss correctly adjusts for time-varying confounding, yielding unbiased effect estimates that remain robust to nuisance model misspecification and achieving state-of-the-art performance on clinical datasets. In doing so, the framework brings modern deep sequence models to bear on treatment-effect-over-time estimation while preserving the interpretability and unbiasedness guarantees of the classical SNMM formulation. The approach still relies on standard time-varying-confounding adjustment assumptions and has been validated primarily on clinical benchmark data.", "key_idea_ko": "DeepBlip는 structural nested mean model(SNMM)을 위한 최초의 neural framework로, double optimization trick을 이용해 모든 time-specific 'blip effect' 함수들을 end-to-end gradient training으로 동시에 학습한다.", "summary_ko": "SNMM은 treatment-sequence effect를 시간에 따라 해석 가능한 time-specific 'blip effect'로 분해하지만, 순차적 g-estimation 절차가 end-to-end gradient-based training을 가로막아 neural implementation이 부재했다. 핵심 아이디어는 novel double optimization trick을 사용해 모든 blip function을 동시에 학습하는 DeepBlip으로, LSTM이나 transformer 같은 sequential architecture를 통합해 temporal dependency를 포착한다. Neyman-orthogonal loss를 통해 time-varying confounding을 올바르게 조정함으로써 nuisance model misspecification에 robust하면서 unbiased한 effect estimate를 제공하며, clinical dataset에서 state-of-the-art 성능을 달성한다. 이는 interpretability와 unbiasedness 보장을 유지하면서 modern deep sequence model을 SNMM 기반 treatment-effect-over-time estimation에 접목시킨다는 점에서 중요하다. 이 접근은 표준적인 time-varying-confounding adjustment assumption에 의존하며, 주로 clinical benchmark dataset에서 검증되었다.", "abstract": "Structural nested mean models (SNMMs) are a principled approach to estimate the treatment effects over time. A particular strength of SNMMs is to break the joint effect of treatment sequences over time into localized, time-specific 'blip effects'. This decomposition promotes interpretability through the incremental effects and enables the efficient offline evaluation of optimal treatment policies without re-computation. However, neural frameworks for SNMMs are lacking, as their inherently sequential g-estimation scheme prevents end-to-end, gradient-based training. Here, we propose DeepBlip, the first neural framework for SNMMs, which overcomes this limitation with a novel double optimization trick to enable simultaneous learning of all blip functions. Our DeepBlip seamlessly integrates sequential neural networks like LSTMs or transformers to capture complex temporal dependencies. By design, our method correctly adjusts for time-varying confounding to produce unbiased estimates, and its Neyman-orthogonal loss function ensures robustness to nuisance model misspecification. Finally, we evaluate our DeepBlip across various clinical datasets, where it achieves state-of-the-art performance."}, {"id": "63864", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Gateways to Tractability for Satisfiability in Pearl’s Causal Hierarchy", "url": "https://icml.cc/virtual/2026/poster/63864", "board": "Hall A #4407", "categories": ["Identification & Partial ID", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Robert Ganian", "Marlene Gruendel", "Simon Wietheger"], "famous": [], "key_idea_en": "The paper establishes the first fixed-parameter- and XP-tractable fragments of satisfiability for Pearl's Causal Hierarchy, parameterized by primal treewidth and variable count, via structural characterizations of well-formed causal models rather than standard treewidth dynamic programming.", "summary_en": "Deciding satisfiability of formulas in Pearl's Causal Hierarchy, spanning probabilistic, interventional, and counterfactual statements, is intractable in essentially every classical, non-parameterized setting, which limits automated causal reasoning. The paper turns to parameterized complexity, using measures such as primal treewidth and the number of variables to isolate probabilistic and counterfactual fragments that admit fixed-parameter-tractable or XP algorithms. It also proves matching hardness results delineating the boundary of tractability, departing technically from standard treewidth dynamic programming by exploiting structural characterizations specific to well-formed causal models. These are the first positive tractability results for PCH satisfiability, supplying a theoretical foundation and new algorithmic tools for automated causal reasoning and verification systems. Tractability holds only within the identified parameterized fragments, such as bounded treewidth or few variables, while general PCH satisfiability remains intractable outside these regimes.", "key_idea_ko": "Pearl's Causal Hierarchy satisfiability 문제에서 primal treewidth와 변수 개수로 parameterize된, 표준 treewidth dynamic programming이 아니라 well-formed causal model의 structural characterization을 이용한 최초의 fixed-parameter tractable 및 XP tractable fragment를 식별한다.", "summary_ko": "Pearl's Causal Hierarchy(probabilistic, interventional, counterfactual statement)에 속하는 formula의 satisfiability를 결정하는 문제는 사실상 모든 classical, non-parameterized setting에서 계산적으로 intractable하여 automated causal reasoning을 제약한다. 이 논문은 이 문제에 parameterized complexity 분석을 적용하여 primal treewidth와 변수 개수 등의 parameter를 사용해 probabilistic 및 counterfactual fragment 중 fixed-parameter tractable 또는 XP algorithm을 허용하는 경우를 식별한다. 주요 기술적 결과는 tractability의 경계를 나타내는 matching hardness result이며, 기술적으로는 표준 treewidth dynamic programming이 아니라 well-formed causal model에 특화된 structural characterization을 활용한다는 점에서 차별화된다. 이는 PCH satisfiability에 대한 최초의 positive tractability result로서, automated causal reasoning 및 verification 시스템 구축을 위한 이론적 토대와 새로운 알고리즘 도구를 제공한다. 다만 tractability는 식별된 parameterized fragment(예: bounded treewidth 또는 few variables)에 대해서만 성립하며, 이 regime을 벗어난 일반적인 PCH satisfiability는 여전히 intractable하다.", "abstract": "Pearl's Causal Hierarchy (PCH) is a central framework for reasoning about probabilistic, interventional, and counterfactual statements, yet the satisfiability problem for PCH formulas is computationally intractable in almost all classical settings. We revisit this challenge through the lens of parameterized complexity and identify the first gateways to tractability. Our results include fixed-parameter and XP-algorithms for satisfiability in key probabilistic and counterfactual fragments, using parameters such as primal treewidth and the number of variables, together with matching hardness results that map the limits of tractability. Technically, we depart from the dynamic programming paradigm typically employed for treewidth-based algorithms and instead exploit structural characterizations of well-formed causal models, providing a new algorithmic toolkit for causal reasoning."}, {"id": "61120", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Gradient-Based Causal Tree Ensembles: A Backbone Architecture for Heterogeneous Treatment Effects", "url": "https://icml.cc/virtual/2026/poster/61120", "board": "Hall A #4408", "categories": ["Treatment Effects & CATE"], "estimands": ["CATE"], "treatment_type": "", "discovery_types": [], "authors": ["Yusuke Kano", "Jeremy P Voisey", "Mihaela van der Schaar"], "famous": ["Mihaela van der Schaar"], "key_idea_en": "GRACE is a differentiable tree-ensemble architecture with multi-way, oblique, and soft splits that trains end-to-end by backpropagation and slots in as a drop-in replacement for fully-connected layers to improve heterogeneous treatment effect estimation on tabular data.", "summary_en": "On tabular data, representation-learning approaches to heterogeneous treatment effect estimation can be outperformed by tree-based methods, especially when uninformative features are present, yet trees have not integrated easily into end-to-end deep HTE models. GRACE (GRAdient-based Causal tree Ensembles) resolves this with a tree-based architecture featuring multi-way, oblique, and soft splits that trains via backpropagation and serves as a drop-in replacement for fully-connected layers within existing HTE architectures. Across benchmarks spanning binary and non-binary treatments, GRACE consistently and substantially outperforms both neural-network and tree-based HTE baselines, with ablations isolating which architectural components drive the gains. The result is a flexible, backpropagation-compatible tree backbone that combines the tabular strength of trees with the end-to-end trainability of neural CATE estimators. Evaluation covers benchmark datasets with binary and non-binary treatments, while behavior in high-dimensional or continuous-treatment settings beyond those benchmarks is not addressed.", "key_idea_ko": "GRACE는 multi-way, oblique, soft split을 갖춘 differentiable tree-ensemble 아키텍처로, backpropagation을 통해 end-to-end로 학습되며 tabular data에서 heterogeneous treatment effect (HTE) 추정을 개선하기 위해 fully-connected layer를 대체하는 drop-in 구조이다.", "summary_ko": "tabular data에서 heterogeneous treatment effect 추정을 위한 representation-learning 접근법은 특히 uninformative feature가 있을 때 tree-based 방법에 성능이 뒤처질 수 있지만, tree는 deep HTE model에 end-to-end로 통합하기 어렵다. GRACE(GRAdient-based Causal tree Ensembles)는 multi-way, oblique, soft split을 갖춘 tree-based 아키텍처로 backpropagation을 통해 학습되며, 기존 HTE 아키텍처의 fully-connected layer를 대체하는 drop-in 구조로 설계되었다. binary 및 non-binary treatment 벤치마크 전반에서 GRACE는 neural-network 및 tree-based HTE baseline을 일관되고 상당한 차이로 능가하며, ablation을 통해 성능 향상을 이끄는 아키텍처 구성요소를 규명한다. tree의 tabular 강점과 neural CATE estimator의 end-to-end trainability를 결합한 유연하고 backpropagation 호환 가능한 tree backbone을 제공한다는 점에서 의의가 있다. binary 및 non-binary treatment를 가진 HTE 벤치마크 데이터셋에서 평가되었으며, 테스트된 벤치마크를 넘어서는 고차원 또는 continuous-treatment 설정에서의 동작은 abstract에서 다루지 않는다.", "abstract": "Estimating Heterogeneous Treatment Effects (HTE) from observational data is essential in fields such as healthcare and policy-making, where randomized experiments are often impractical. While representation learning-based methods have shown promise, recent studies suggest that tree-based approaches may offer superior performance on tabular data, particularly in the presence of uninformative features. We introduce GRAdient-based Causal tree Ensembles (GRACE), a novel tree-based architecture for HTE estimation that incorporates multi-way, oblique, and soft splits, enabling end-to-end training via backpropagation. GRACE can be seamlessly integrated into existing models as a replacement for fully-connected neural network layers. Across diverse benchmarks involving binary and non-binary treatment settings, GRACE consistently surpasses neural network and tree-based baselines, often by a substantial margin. We further analyze GRACE as an extension of fully-connected neural network layers and conduct ablation studies to isolate and quantify the contribution of each architectural component to the improvement in performance. These results position GRACE as a powerful new foundation for flexible, robust, and accurate HTE estimation."}, {"id": "64905", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Identifiable Markov Switching Models with Instantaneous Effects and Exponential Families", "url": "https://icml.cc/virtual/2026/poster/64905", "board": "Hall A #4409", "categories": ["Time-Series Causality", "Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["functional causal model"], "authors": ["Roel Hulsman", "Carles Balsells-Rodas", "Sara Magliacane"], "famous": ["Sara Magliacane"], "key_idea_en": "The paper establishes identifiability of latent regimes and regime-dependent causal structure in nonlinear, non-Gaussian Markov switching models with instantaneous effects and exponential-family noise, and introduces FlowMSM to recover them in practice.", "summary_en": "Non-stationary temporal systems, such as seasonal climate dynamics or diabetic glucose regulation, are often modeled with discrete latent regimes, but identifying both the regimes and their causal structure is difficult under frequent switching, nonlinear or non-Gaussian dynamics, and instantaneous effects between variables. The paper proves identifiability of latent regimes and regime-dependent causal structures under nonlinear lagged and instantaneous effects with independent exponential-family noise, a theory that also subsumes non-temporal mixtures of causal models as a special case, and builds on it to introduce FlowMSM, a regime-detection framework compatible with any stationary causal-discovery method for recovering regime-specific graphs. Experiments on synthetic benchmarks and a financial-economics dataset show effective regime detection and causal discovery under non-stationarity. This extends causal-discovery guarantees to a broad and practically common class of non-stationary time series. The identifiability results rely on the exponential-family noise assumption and independence of the noise terms.", "key_idea_ko": "Instantaneous effect와 exponential-family noise를 갖는 nonlinear, non-Gaussian Markov Switching Model에서 latent regime과 regime별 causal structure의 identifiability를 증명하고, 이를 실제로 복원하는 FlowMSM을 제안한다.", "summary_ko": "계절성 기후나 당뇨 glucose dynamics 같은 non-stationary temporal system은 discrete latent regime을 갖는 Markov Switching Model로 흔히 모델링되지만, 빈번한 switching과 nonlinear/non-Gaussian dynamics, 변수 간 instantaneous(동시점) effect 하에서는 regime과 그 causal structure를 identify하기 어렵다. 이 논문은 independent exponential-family noise를 갖는 nonlinear lagged 및 instantaneous effect 하에서 latent regime과 regime-dependent causal structure 모두의 identifiability를 증명하며, 이 이론은 non-temporal mixture-of-causal-model을 특수한 경우로 포함한다. 이를 바탕으로, 임의의 stationary causal discovery 방법과 결합하여 regime별 causal graph를 복원할 수 있는 regime-detection framework인 FlowMSM을 제안한다. Synthetic benchmark와 금융 경제 데이터셋 실험은 non-stationarity 하에서 효과적인 regime detection과 causal discovery를 보여준다. 이는 causal discovery guarantee를 실무에서 흔한 non-stationary time series라는 폭넓은 class로 확장한다는 점에서 의미가 있으며, identifiability 결과는 exponential-family noise 가정과 noise term들의 independence에 의존한다.", "abstract": "Temporal systems often exhibit non-stationary behaviour, such as seasonal climate variation or glucose fluctuations in patients with type-1 diabetes. One way to model non-stationarity is through discrete latent regimes, i.e., stationary segments of time. Such systems induce a Markov Switching Model (MSM), a class of Hidden Markov Models with autoregressive dependencies among latent regimes and observed variables. Identifying latent regimes is challenging in the presence of frequent regime switches and nonlinear and non-Gaussian dynamics, particularly when there are instantaneous effects between the variables, e.g., due to slow rates of measurements. In this work, we establish the identifiability of both latent regimes and regime-dependent causal structures under temporal regime dependencies, nonlinear lagged and instantaneous effects, and independent noise from the exponential family. Our identifiability theory subsumes non-temporal mixtures of causal models. Furthermore, we introduce FlowMSM, a regime detection framework that can be paired with any stationary causal discovery method to recover regime-dependent causal structures. Experiments on synthetic benchmarks and a financial economics dataset demonstrate the effectiveness of our approach to detect latent regimes and discover causal structures from non-stationary time series."}, {"id": "63223", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Learning Treatment Representations for Downstream Instrumental Variable Regression", "url": "https://icml.cc/virtual/2026/poster/63223", "board": "Hall A #4410", "categories": ["Treatment Effects & CATE", "Identification & Partial ID"], "estimands": [], "treatment_type": "multi-valued", "discovery_types": [], "authors": ["Shiangyi Lin", "Hui Lan", "Vasilis Syrgkanis"], "famous": [], "key_idea_en": "Treatment representations for high-dimensional treatments (e.g., clinical pathways) are learned by explicitly conditioning the dimension-reduction step on the instrumental variable, avoiding the omitted-treatment bias of instrument-agnostic reduction before IV estimation.", "summary_en": "Standard instrumental variable (IV) estimators cannot handle more treatments than instruments, a serious obstacle for high-dimensional, unstructured treatments such as clinical treatment pathways, and the common workaround of unsupervised dimension reduction before IV estimation ignores the instrument and introduces substantial omitted treatment bias. The authors instead construct treatment representations by explicitly incorporating the instrumental variable during representation learning, rather than reducing dimensionality in an instrument-agnostic way. They prove that this instrument-guided approach identifies the optimal outcome-prediction directions even with a limited number of instruments. Validation on large-scale semi-synthetic clinical data derived from a major hospital, together with additional simulations, shows the method significantly outperforms conventional two-stage IV approaches. This extends valid IV-based causal effect estimation to high-dimensional treatment settings where classical IV breaks down, though the approach still relies on standard IV validity assumptions and is validated mainly on semi-synthetic rather than fully real outcome data.", "key_idea_ko": "고차원 treatment(예: clinical pathway)에 대한 treatment representation을 학습할 때 dimension-reduction 단계를 instrumental variable에 명시적으로 conditioning함으로써, instrument를 무시한 reduction이 IV estimation 전에 야기하는 omitted-treatment bias를 회피한다.", "summary_ko": "표준 instrumental variable (IV) estimator는 instrument 수보다 treatment 수가 많은 경우를 다룰 수 없어 clinical treatment pathway와 같은 고차원 unstructured treatment에 큰 장애가 되며, IV estimation 이전에 흔히 쓰이는 unsupervised dimension reduction은 instrument를 무시해 상당한 omitted treatment bias를 초래한다. 저자들은 instrument-agnostic한 방식으로 차원을 축소하는 대신, representation learning 과정에서 instrumental variable을 명시적으로 포함시켜 treatment representation을 구성할 것을 제안한다. 이러한 instrument-guided 접근이 제한된 수의 instrument만으로도 optimal한 outcome-prediction 방향을 identify함을 증명하며, 대형 병원 유래 large-scale semi-synthetic clinical data와 추가 simulation을 통해 기존 two-stage IV 접근보다 유의하게 뛰어난 성능을 보인다. classical IV가 무너지는 고차원 treatment setting으로 valid한 IV 기반 causal effect estimation을 확장한다는 점에서 의미가 있다. 이 접근 역시 표준 IV validity 가정에 의존하며, 완전한 real outcome data가 아닌 주로 semi-synthetic data로 검증되었다.", "abstract": "Traditional instrumental variable (IV) estimators cannot accommodate more treatments than instruments, a limitation that is critical for high-dimensional, unstructured data like clinical treatment pathways. Current practice -- applying unsupervised dimension reduction before IV estimation -- suffers from substantial omitted treatment bias because the representation learning step ignores the instrument. We propose a novel framework that constructs treatment representations by explicitly incorporating instrumental variables. We prove that this instrument-guided approach ensures the identification of optimal outcome-prediction directions even with limited instruments. Validation on large-scale, semi-synthetic clinical data derived from a major hospital, along with other simulations, shows that our approach significantly outperforms conventional two-stage methods."}, {"id": "62505", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "One Intervention per Component is Enough: Towards Identifiability in Linear Stochastic Dynamics from Steady State", "url": "https://icml.cc/virtual/2026/poster/62505", "board": "Hall A #4413", "categories": ["Identification & Partial ID", "Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["intervention-based"], "authors": ["Saber Salehkaleybar"], "famous": [], "key_idea_en": "One intervention per strongly-connected component of a multivariate Ornstein-Uhlenbeck process's drift graph suffices to identify all process parameters (up to global scale) from steady-state data alone, via a recursive estimator.", "summary_en": "Recovering the parameters of a multivariate Ornstein-Uhlenbeck process - needed, for example, in large-scale gene perturbation experiments - is hard when only steady-state snapshot data are available, since standard SDE estimation normally requires time-series trajectories. The authors show that a single intervention per strongly connected component (SCC) of the drift graph is enough for generic identifiability up to a global scaling factor, provided the SCC condensation graph is connected with a single root and mild spectral nondegeneracy holds, and they supply a recursive algorithm that topologically orders the SCCs and solves linear systems derived from steady-state moment equations. Building on this result, a regularized least-squares estimator jointly minimizes steady-state mean and covariance residuals across observational and interventional data, and experiments on synthetic and real data confirm accurate parameter recovery and prediction of unseen interventions. The approach offers a practical, theoretically grounded route to dynamical parameter identification from cheap steady-state snapshots rather than costly time-series measurements, which is particularly relevant to large-scale gene perturbation screens. Its identifiability guarantee depends on specific graph-connectivity conditions and spectral nondegeneracy, and recovery is only possible up to a global scale factor.", "key_idea_ko": "이 논문은 multivariate Ornstein-Uhlenbeck process의 drift graph에서 strongly-connected component당 하나의 intervention만으로도 steady-state 데이터만으로 모든 process parameter를 global scale까지 identify하기에 충분함을 증명하고 recursive estimator를 제시한다.", "summary_ko": "문제는 예컨대 대규모 gene perturbation 실험에서 필요한 것처럼 multivariate Ornstein-Uhlenbeck process의 parameter를 steady-state 스냅샷 데이터만으로 복원하는 것이 표준 SDE 추정이 time-series trajectory를 요구하기 때문에 어렵다는 점이다. 핵심 아이디어와 결과는 저자들이 SCC condensation graph가 single root를 갖는 connected graph이고 mild spectral nondegeneracy가 성립한다는 조건 하에서 drift graph의 strongly connected component(SCC)당 하나의 intervention이 global scaling factor까지의 generic identifiability에 충분함을 보이고, SCC를 topologically ordering하여 steady-state moment equation에서 유도된 linear system을 푸는 recursive algorithm을 제시하는 것이다. 주요 기술적 결과는 이를 바탕으로 observational data와 interventional data에 걸쳐 steady-state mean/covariance residual을 jointly minimize하는 regularized least-squares estimator를 구성하고, synthetic 및 real data 실험에서 정확한 parameter recovery와 unseen intervention에 대한 prediction을 확인한 것이다. 이는 비용이 큰 time-series 측정 대신 저렴한 steady-state snapshot으로부터 dynamical parameter를 identify하는 실용적이고 theoretically grounded된 경로를 제공하며, 대규모 gene perturbation screen에 관련이 있다는 점에서 의의가 있다. identifiability는 특정한 graph-connectivity 조건(single-root SCC condensation)과 spectral nondegeneracy 가정을 요구하며, recovery는 global scale factor까지만 가능하다.", "abstract": "We study the problem of recovering the parameters of a multivariate Ornstein-Uhlenbeck (OU) process from steady-state observational and interventional data. In many applications, such as large-scale gene perturbation experiments, only stationary \"snapshot\" measurements are available, making standard stochastic differential equation estimation methods that rely on time-series trajectories inapplicable. We first establish an identifiability result: one intervention per strongly connected component (SCC) of the drift graph suffices to recover all OU process parameters generically up to a global scaling factor. This holds provided that the SCC condensation graph is connected with a single root and certain spectral nondegeneracy assumptions hold. We propose a recursive learning algorithm that orders SCCs topologically and, for each component, isolates its marginal dynamics and solves a linear system derived from the steady-state moment equations, leveraging parameters recovered for upstream components. Building on this theoretical foundation, we propose a regularized least-squares estimator that jointly minimizes residuals of the steady-state mean and covariance equations across observational and interventional data. Experiments on synthetic and real datasets demonstrate the effectiveness of our method in recovering parameters and predicting unseen interventions."}, {"id": "62849", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Credibility-Aware Weighting Federated Causal Discovery for Time Series", "url": "https://icml.cc/virtual/2026/poster/62849", "board": "Hall A #505", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Jiegang Xu", "Fuyuan Cao", "Jiye Liang"], "famous": [], "key_idea_en": "Fed-CAW performs federated causal discovery for time series across clients with drifting mechanisms and heterogeneous sampling frequencies by weighting aggregated edges with credibility scores under differential privacy.", "summary_en": "Federated causal discovery for time series is complicated by intervention policies that drift over time within each client and by differing sampling frequencies across clients, which together make local causal graphs heterogeneous and hard to aggregate. Fed-CAW addresses this by defining edge-level credibility scores from within-client temporal stability and cross-client temporal consistency after mapping heterogeneous sampling frequencies onto a unified time scale, then aggregating privatized edge statistics weighted by these scores under differential privacy. The method recovers a global causal graph with theoretical justification for the time-scale mapping and rigorous differential privacy guarantees, validated on synthetic and real-world datasets. This enables privacy-preserving causal discovery across institutions with non-identical, drifting, and differently sampled time series data. It preserves personalized local structures without sharing raw data, but its guarantees rest on the assumed credibility scoring and privacy mechanisms.", "key_idea_ko": "Fed-CAW는 mechanism이 drift하고 sampling frequency가 이질적인 client들에 걸쳐 federated causal discovery를 수행하며, differential privacy 하에서 credibility score로 가중된 edge를 aggregate한다.", "summary_ko": "time series에 대한 federated causal discovery는 각 client 내에서 시간에 따라 drift하는 intervention policy와 client 간 서로 다른 sampling frequency로 인해 local causal graph가 이질적이 되어 aggregation이 어렵다는 문제가 있다. 이 논문은 이질적인 sampling frequency를 통합된 time scale로 매핑한 뒤 within-client temporal stability와 cross-client temporal consistency로부터 edge 단위 credibility score를 정의하고, 이 score로 가중된 privatized edge statistics를 differential privacy 하에서 aggregate하는 Fed-CAW를 제안한다. 주요 결과는 time-scale mapping에 대한 이론적 근거와 엄밀한 differential privacy guarantee를 갖춘 global causal graph 복원 방법이며, synthetic 및 real-world dataset에서 검증되었다. 이는 서로 다른 특성을 가지고 drift하며 다르게 sampling된 time series data를 가진 기관들 간에 privacy를 보존하는 causal discovery를 가능하게 한다는 점에서 의의가 있다. 이 방법은 raw data 공유 없이 개인화된 local structure를 보존하지만, 그 guarantee는 가정된 credibility scoring과 privacy mechanism에 의존한다.", "abstract": "Federated causal discovery for time series is becoming increasingly important in many application domains. In practice, intervention policies on each client often change over time, causing the local underlying causal mechanisms to drift rather than remain fixed. Moreover, different sampling frequencies across clients yield incompatible time scales in the observed data, making the resulting local causal graphs naturally heterogeneous and difficult to aggregate consistently. Accordingly, we propose Fed-CAW, a Credibility-Aware Weighting Federated causal discovery framework for time series. Specifically, we define edge-level credibility scores that quantify per-edge reliability by summarizing (i) within-client temporal stability across windows and (ii) cross-client temporal consistency after mapping heterogeneous sampling frequencies onto a unified time scale. We then aggregate privatized edge statistics under differential privacy, treating credibility scores as weights to recover a global causal graph while preserving personalized local structures without sharing raw data. Theoretically, we demonstrate the rationale for the unified time scale mapping and establish rigorous differential privacy guarantees. Experimental results on synthetic and real-world datasets demonstrate the effectiveness of our proposed method."}, {"id": "61373", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "CausalX: A Unified and Causally-Interpretable Plug-and-Play Model for Multi-modal Spatio-Temporal Forecasting", "url": "https://icml.cc/virtual/2026/poster/61373", "board": "Hall A #4002", "categories": ["Time-Series Causality", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["hybrid"], "authors": ["Shiqi Zhang", "Pan Mu", "Hanting Yan", "Yuchao Zhu", "Jinglin Zhang", "Cong Bai"], "famous": [], "key_idea_en": "CausalX is a plug-and-play multi-modal spatio-temporal forecasting model that learns a dynamic causal graph across modalities and time, refined via a structural-prior-guided diffusion process, to yield interpretable, causally-attributed forecasts.", "summary_en": "Multi-modal spatio-temporal forecasting is important for many applications but is hampered by complex, evolving cross-modal and temporal interactions, and existing models are often uninterpretable, limiting reliability in safety-critical scenarios. CausalX addresses this by learning a dynamic causal graph across modalities and time whose edge weights quantify causal attribution strength, further refined by a diffusion-based generative process guided by structural priors. To compensate for the absence of ground-truth causal structure, it aggregates multi-source constraints from causal analysis techniques and a variational autoencoder spanning predictive, temporal, interventional, and generative aspects, jointly learning a more comprehensive causal graph. Experiments on real-world forecasting tasks, including pedestrian trajectory prediction and tropical cyclone forecasting, show CausalX achieves superior accuracy while producing interpretable causal graphs, and the framework is presented as modular and architecture-agnostic. Because no ground-truth causal graph is available for validation, the learned causal structure is assessed indirectly through downstream forecasting performance and multi-source constraint agreement rather than direct structural ground truth.", "key_idea_ko": "modality와 time에 걸친 dynamic causal graph를 학습하고 이를 structural-prior-guided diffusion process로 정교화하여 해석 가능하고 causally-attributed된 forecast를 제공하는 plug-and-play multi-modal spatio-temporal forecasting model CausalX를 제시한다.", "summary_ko": "multi-modal spatio-temporal forecasting은 여러 응용에서 중요하지만 복잡하게 진화하는 cross-modal 및 temporal interaction 때문에 어려우며, 기존 모델은 흔히 해석 불가능해 safety-critical 시나리오에서 신뢰성을 제한한다. CausalX는 modality와 time에 걸쳐 edge weight가 causal attribution strength를 정량화하는 dynamic causal graph를 학습하고, 이를 structural prior에 의해 guide되는 diffusion 기반 생성 과정으로 추가 정교화하여 이 문제를 해결한다. ground-truth causal structure의 부재를 보완하기 위해 CausalX는 predictive, temporal, interventional, generative 측면을 아우르는 causal analysis 기법과 variational autoencoder로부터 multi-source constraint를 종합하여 더 포괄적인 causal graph를 공동으로 학습한다. pedestrian trajectory prediction과 tropical cyclone forecasting을 포함한 real-world forecasting task 실험에서 CausalX는 해석 가능한 causal graph를 산출하면서도 우수한 정확도를 달성하며, modular하고 architecture-agnostic한 방식으로 제시된다. 검증에 사용할 ground-truth causal graph가 없으므로, 학습된 causal structure는 직접적인 structural ground truth가 아니라 downstream forecasting 성능과 multi-source constraint 간의 일치도를 통해 간접적으로 평가된다.", "abstract": "Multi-modal spatio-temporal forecasting underpins many real-world applications but remains challenging due to the complex and evolving interactions across modalities and time steps. Moreover, the lack of interpretability in existing models limits their reliability in safety-critical scenarios. In this paper, we present CausalX, a unified and causally interpretable plug-and-play model for multi-modal spatio-temporal forecasting. CausalX achieves interpretability by learning a dynamic causal graph across modalities and time, whose edge weights quantify causal attribution strength, and are further refined by a diffusion-based generative process guided by structural priors. To overcome the absence of ground-truth causal structures, CausalX aggregates multi-source constraints from causal analysis techniques and a variational autoencoder, spanning predictive, temporal, interventional, and generative aspects to jointly learn a more comprehensive causal graph. Extensive experiments on real-world forecasting tasks, including pedestrian trajectory prediction and tropical cyclone forecasting, demonstrate that CausalX achieves superior accuracy while producing interpretable causal graphs. CausalX is modular, architecture-agnostic, and generalizable, offering a new perspective on bridging causal inference and spatio-temporal forecasting."}, {"id": "60673", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "
