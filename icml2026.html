 and architectural symmetries. We further show that neuron identifiability enables representation merging without prior alignment, and characterize when such merging admits a linear low-loss connecting path. These findings highlight the role of effective function classes in affecting the loss landscape."}, {"id": "63227", "session": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "ECCO: Evidence-Driven Causal Reasoning for Compiler Optimization", "url": "https://icml.cc/virtual/2026/poster/63227", "board": "Hall A #3703", "categories": ["Causal Reasoning in LLMs/Agents", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Haolin Pan", "Lianghong Huang", "Dong Jinyuan", "Mingjie Xing", "Yanjun Wu"], "famous": [], "key_idea_en": "ECCO combines an LLM trained on a causal chain-of-thought dataset that maps code features to performance evidence with a genetic algorithm, letting the LLM's causal reasoning guide mutation operations for compiler auto-tuning.", "summary_en": "Compiler auto-tuning is caught between traditional black-box search, which lacks semantic guidance, and LLM-based approaches, which tend toward superficial pattern matching without genuine causal understanding of optimization decisions. The authors introduce ECCO, which first builds a chain-of-thought dataset that explicitly links static code features to verifiable performance evidence, teaching the LLM the causal logic behind optimization choices rather than sequence imitation, and then uses the LLM as a strategist whose stated optimization intents guide the mutation operators of a genetic algorithm. On seven datasets, ECCO beats the LLVM opt -O3 baseline with an average 24.44% reduction in cycles. This shows that interpretable, evidence-grounded causal reasoning from an LLM can meaningfully steer combinatorial search in a systems-optimization task, rather than merely generating plausible-looking code. The approach is validated empirically on specific compiler benchmarks and datasets, so its generality to other optimization domains or compilers remains unestablished.", "key_idea_ko": "ECCO는 code feature를 performance evidence에 매핑하는 causal chain-of-thought dataset으로 학습된 LLM과 genetic algorithm을 결합하여, LLM의 causal reasoning이 compiler auto-tuning의 mutation 연산을 이끌도록 한다.", "summary_ko": "compiler auto-tuning은 semantic guidance가 없는 전통적인 black-box search와, optimization 결정에 대한 실질적인 causal understanding 없이 표면적인 pattern matching에 그치는 LLM 기반 접근 사이에 갇혀 있다. 저자들은 static code feature를 검증 가능한 performance evidence에 명시적으로 연결하는 chain-of-thought dataset을 먼저 구축하여 LLM에게 sequence imitation이 아닌 optimization 선택의 causal logic을 학습시키고, 이후 LLM을 strategist로 사용해 그 optimization 의도가 genetic algorithm의 mutation 연산자를 이끌도록 한다. 일곱 개 데이터셋에서 ECCO는 LLVM opt -O3 baseline 대비 평균 24.44%의 cycle 감소를 달성하며 이를 능가한다. 이는 interpretable하고 evidence에 기반한 LLM의 causal reasoning이, 그럴듯한 코드를 생성하는 데 그치지 않고 systems-optimization task의 combinatorial search를 실질적으로 이끌 수 있음을 보여준다는 점에서 의의가 있다. 이 접근법은 특정 compiler benchmark와 dataset에 대해서만 실증적으로 검증되었으므로, 다른 optimization domain이나 compiler에 대한 일반화 가능성은 확립되지 않았다.", "abstract": "Compiler auto-tuning faces a dichotomy between traditional black-box search methods, which lack semantic guidance, and recent Large Language Model (LLM) approaches, which often suffer from superficial pattern matching and causal opacity. In this paper, we introduce ECCO, a framework that bridges interpretable reasoning with combinatorial search. We first propose a reverse engineering methodology to construct a Chain-of-Thought dataset, explicitly mapping static code features to verifiable performance evidence. This enables the model to learn the causal logic governing optimization decisions rather than merely imitating sequences. Leveraging this interpretable prior, we design a collaborative inference mechanism where the LLM functions as a strategist, defining optimization intents that dynamically guide the mutation operations of a genetic algorithm. Experimental results on seven datasets demonstrate that ECCO outperforms the LLVM opt -O3 baseline, achieving an average 24.44% reduction in cycles."}, {"id": "62504", "session": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Dismantling Pathological Shortcuts: A Causal Framework for Faithful LVLM Decoding", "url": "https://icml.cc/virtual/2026/poster/62504", "board": "HALL A #3103", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Liu Yu", "Can Chen", "PING KUANG", "Zhikun Feng", "Fan Zhou", "Gillian Dobbie"], "famous": [], "key_idea_en": "Fox is a training-free, inference-time causal-intervention method that locates and severs the attention-head 'shortcut' responsible for object hallucination in large vision-language models.", "summary_en": "Large vision-language models hallucinate objects not merely due to attention intensity but because of a deeper structural misalignment: at decision-critical steps, specific attention heads act as 'risky mediators' that decouple from visual evidence and lock onto language priors, forming a pathological shortcut around visual grounding. Fox (Faithfulness and Observational-flow via eXpression-rectification) is a training-free framework that unsupervisedly localizes these risky mediators via a visual attention entropy probe, then performs a targeted causal intervention, numerical logit saturation, to sever the shortcut, followed by conflict-gated cooperative decoding to reconcile faithfulness and fluency. Fox achieves state-of-the-art hallucination reduction, outperforming the prior method SID by 29.1%, while preserving linguistic richness and general reasoning. This offers a mechanistic, causal fix for LVLM hallucination that requires no retraining. Its scope is limited by dependence on the attention-entropy probe correctly identifying risky mediators, and evaluation is confined to standard hallucination benchmarks.", "key_idea_ko": "Fox는 large vision-language model에서 object hallucination을 유발하는 attention-head shortcut을 찾아 절단하는, training-free한 inference-time causal-intervention 방법이다.", "summary_ko": "large vision-language model(LVLM)은 object를 hallucinate하는데, 이 논문은 이것이 단순히 attention intensity 문제가 아니라 decision-critical step에서 특정 attention head가 visual evidence로부터 분리되어 language prior에 고착되는 risky mediator로 작동하며 visual grounding을 우회하는 pathological shortcut을 만드는 더 깊은 structural misalignment라고 문제를 제기한다. 핵심 아이디어인 Fox(Faithfulness and Observational-flow via eXpression-rectification)는 visual attention entropy probe를 통해 risky mediator를 unsupervised하게 localize한 뒤, targeted causal intervention(numerical logit saturation)으로 shortcut을 절단하고, 이어서 conflict-gated cooperative decoding으로 faithfulness와 fluency를 조화시키는 training-free framework이다. 주요 기술적 결과로 Fox는 linguistic richness와 general reasoning을 유지하면서 이전 방법인 SID를 29.1% 상회하는 state-of-the-art hallucination 감소를 달성한다. 이는 retraining 없이 LVLM hallucination에 대한 mechanistic하고 causal한 해법을 제공한다는 점에서 의의가 있다. 범위는 attention-entropy probe가 risky mediator를 정확히 식별하는지에 의존하며, 평가는 standard hallucination benchmark에서 이루어졌다.", "abstract": "Large Vision-Language Models (LVLMs) exhibit sophisticated reasoning but remain susceptible to object hallucination. Deviating from the prevailing attention intensity assumption, we reveal a deeper dynamic structural misalignment: hallucination is triggered at decision-critical steps where specific attention heads, acting as risky mediators, decouple from visual evidence to lock onto language priors. This establishes a pathological shortcut that bypasses visual grounding. To dismantle this, we propose Fox (Faithfulness and Observational-flow via eXpression-rectification), a training-free inference-time framework. Fox diagnoses structural misalignment using a visual attention entropy probe to localize risky mediators unsupervisedly. We then execute a targeted causal intervention via numerical logit saturation to physically sever the shortcut path. Finally, a conflict-gated cooperative decoding strategy reconciles interventional faithfulness with observational fluency. Extensive experiments demonstrate that Fox achieves SOTA performance, outperforming SID by 29.1% while preserving linguistic richness and general reasoning capabilities."}, {"id": "64437", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "CauseCollab: Causal Unified and Modality-Agnostic Network for Heterogeneous Collaborative Perception", "url": "https://icml.cc/virtual/2026/poster/64437", "board": "Hall A #1507", "categories": ["Confounding & Deconfounding", "Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Weize Li", "Yang Li", "Quan Yuan", "Xiaoyuan Fu", "Guiyang Luo", "Jinglin Li"], "famous": [], "key_idea_en": "CauseCollab is a causal, modality-agnostic collaborative-perception network that disentangles semantic content from modality-specific confounders to fix inconsistent pseudo-protocol distributions across heterogeneous sensors.", "summary_en": "Protocol-based multi-agent collaborative perception maps heterogeneous sensor features into a shared space, but independently trained modality-specific converters create inconsistent pseudo-protocol distributions, causing semantic inconsistency and error accumulation, especially when modality gaps are large. CauseCollab formulates protocol-space representation learning causally, using causal metric learning to disentangle semantic factors from modality-specific statistical confounders, and adds a context-guided Unified Converter that aligns heterogeneous modalities into consistent semantics, with new modalities incorporated via lightweight adapters. On the OPV2V and DAIR-V2X benchmarks, CauseCollab achieves state-of-the-art collaborative perception performance, with the largest gains arising in scenarios with large modality discrepancies. The causal disentanglement approach offers a principled way to keep multi-agent perception robust and extensible as new sensor modalities are added, rather than relying on ad hoc protocol converters. Evaluation is restricted to two autonomous-driving collaborative-perception datasets, and the causal confounder structure is assumed by design rather than discovered from data.", "key_idea_ko": "CauseCollab은 causal하고 modality-agnostic한 collaborative-perception network로, semantic content를 modality-specific confounder로부터 disentangle하여 heterogeneous sensor 간 inconsistent한 pseudo-protocol distribution 문제를 해결한다.", "summary_ko": "Protocol 기반 multi-agent collaborative perception은 heterogeneous sensor feature를 shared space로 mapping하지만, 독립적으로 훈련된 modality-specific converter들이 inconsistent한 pseudo-protocol distribution을 만들어 semantic inconsistency와 error accumulation을 유발하며, modality gap이 클수록 문제가 심해진다. CauseCollab은 protocol-space representation learning을 causal하게 정식화하여 causal metric learning으로 semantic factor를 modality-specific statistical confounder로부터 disentangle하고, 이질적 modality를 일관된 semantics로 정렬하는 context-guided Unified Converter를 추가하며, 새로운 modality는 lightweight adapter로 추가된다. OPV2V와 DAIR-V2X benchmark에서 CauseCollab은 state-of-the-art collaborative perception 성능을 달성하며, modality discrepancy가 큰 시나리오에서 가장 큰 성능 향상을 보인다. 이 causal disentanglement 접근은 ad hoc한 protocol converter에 의존하는 대신, 새로운 sensor modality가 추가되어도 multi-agent perception을 robust하고 extensible하게 유지하는 원칙적인 방법을 제공한다는 점에서 중요하다. 평가는 두 개의 autonomous-driving collaborative-perception dataset에 국한되며, causal confounder structure는 data로부터 discover되는 것이 아니라 design상 assume된다.", "abstract": "Collaborative perception enhances environment understanding through multi-agent information sharing, but its performance in real-world scenarios is constrained by heterogeneous sensor modalities and model architectures. Recent protocol-based two-stage methods alleviate this problem by mapping heterogeneous features into a shared protocol space; however, independently trained modality-specific converters often generate modality-specific pseudo-protocol distributions, leading to semantic inconsistency and error accumulation, which is particularly pronounced in scenarios with large modality discrepancies. To address this issue, we propose CauseCollab, a causal unified and modality-agnostic network. CauseCollab formulates representation learning in the protocol space from a causal perspective, explicitly disentangling semantic factors from modality-specific statistical confounders via causal metric learning. Meanwhile, CauseCollab adopts context-guided Unified Converter for heterogeneous modalities to ensure cross-modal semantic consistency. In addition, integrating new modalities only requires training adapters with minimal parameters. Extensive experiments on the OPV2V and DAIR-V2X datasets demonstrate that CauseCollab achieves state-of-the-art performance, with more significant gains in scenarios involving large modality gaps."}, {"id": "61854", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "MACD: Model-Aware Contrastive Decoding via Counterfactual Data for Video-LLMs", "url": "https://icml.cc/virtual/2026/poster/61854", "board": "Hall A #701", "categories": ["Counterfactual Inference", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Qixin Xiao", "Kun Zhou"], "famous": [], "key_idea_en": "MACD mitigates Video-LLM hallucination by using the model's own feedback to construct object-level counterfactual inputs and fusing them into contrastive decoding for evidence-grounded token selection.", "summary_en": "Video-LLMs hallucinate by generating plausible but ungrounded content when visual evidence is weak, ambiguous, or biased, and existing contrastive decoding methods rely on random perturbations that poorly target the actual drivers of hallucination. MACD instead uses the Video-LLM's own feedback to identify the object regions most responsible for hallucination and constructs targeted, model-aware counterfactual inputs at the object level rather than arbitrary frame or temporal edits. Integrating these counterfactual data into contrastive decoding enforces evidence-grounded token selection, consistently reducing hallucination while maintaining or improving accuracy on EventHallusion, MVBench, Perception-test, and Video-MME across the Qwen and InternVL model families. This demonstrates that causally targeting the actual failure mode outperforms generic perturbation-based contrastive decoding for hallucination mitigation. The approach is especially effective for small, occluded, or co-occurring objects and operates as an inference-time decoding strategy rather than a retraining fix.", "key_idea_ko": "MACD는 model 자신의 feedback을 이용해 object-level counterfactual input을 구성하고 이를 contrastive decoding에 결합하여 evidence-grounded token selection을 수행함으로써 Video-LLM hallucination을 완화한다.", "summary_ko": "Video-LLM은 visual evidence가 약하거나 ambiguous하거나 biased될 때 plausible하지만 ungrounded한 content를 생성하며 hallucinate하는데, 기존 contrastive decoding 방법은 random perturbation에 의존하여 hallucination의 실제 원인을 잘 겨냥하지 못한다. MACD는 Video-LLM 자신의 feedback을 이용해 hallucination에 가장 책임이 큰 object region을 식별하고, 임의의 frame이나 temporal edit이 아니라 object level에서 targeted하고 model-aware한 counterfactual input을 구성한다. 이러한 counterfactual data를 contrastive decoding에 통합하여 evidence-grounded token selection을 강제하며, EventHallusion, MVBench, Perception-test, Video-MME에서 Qwen 및 InternVL model family 전반에 걸쳐 정확도를 유지하거나 향상시키면서 일관되게 hallucination을 감소시켰다. 이는 hallucination mitigation에서 실제 실패 모드를 causally 겨냥하는 것이 generic한 perturbation 기반 contrastive decoding보다 우수함을 보여준다. 이 접근은 특히 작거나 가려지거나 co-occurring한 object에 효과적이며, retraining이 아니라 inference-time decoding strategy이다.", "abstract": "Video language models (Video-LLMs) are prone to hallucinations, often generating plausible but ungrounded content when visual evidence is weak, ambiguous, or biased. Existing decoding methods, such as contrastive decoding (CD), rely on random perturbations to construct contrastive data for mitigating hallucination patterns. However, such a way is hard to control the visual cues that drive hallucination or well align with model weaknesses. We propose Model-aware Counterfactual Data based Contrastive Decoding (MACD), a new inference strategy that combines model-guided counterfactual construction with decoding. Our approach uses the Video-LLM's own feedback to identify object regions most responsible for hallucination, generating targeted counterfactual inputs at the object level rather than arbitrary frame or temporal modifications. These model-aware counterfactual data is then integrated into CD to enforce evidence-grounded token selection during decoding. Experiments on EventHallusion, MVBench, Perception-test and Video-MME show that MACD consistently reduces hallucination while maintaining or improving task accuracy across diverse Video-LLMs, including Qwen and InternVL families. The method is especially effective in challenging scenarios involving small, occluded, or co-occurring objects. Our code and data will be publicly released."}, {"id": "64456", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "From Prompts to Tokens: Internalizing Causal Supervision in Vision-Language Model for Multi-Image Causal Reasoning", "url": "https://icml.cc/virtual/2026/poster/64456", "board": "Hall A #2210", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Discovery", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Haoping Yu", "Yuanxi Li", "Jing Ma"], "famous": [], "key_idea_en": "BridgeVLM internalizes causal reasoning in vision-language models by converting a causal graph induced from multi-image inputs into structured Causal Tokens processed inside the LLM decoder, rather than relying on textual prompting.", "summary_en": "Large vision-language models remain brittle at visual causal reasoning, especially for interventional and counterfactual queries over multi-image inputs, because prior work injects causal knowledge only through textual prompts external to model execution. BridgeVLM instead induces a causal graph from multi-image inputs and converts it into structured Causal Tokens executed by RAMP layers injected into the LLM decoder, paired with a unified training interface, M3S, that supplies fine-grained causal supervision at both local and global granularities. The approach delivers substantial accuracy gains, including 54.4% versus 33.2% on CausalVLBench intervention tasks, an improvement from 43.6% to 49.0% on Causal3D, and an F1 jump from 33.4% to 75.1% on causal structure learning. By embedding causal reasoning structurally rather than through prompting, the method makes VLM behavior on intervention and counterfactual queries markedly more reliable. It is evaluated only on CausalVLBench and Causal3D, and its performance depends on the quality of the induced causal graph and the resulting token supervision.", "key_idea_ko": "BridgeVLM은 multi-image 입력으로부터 유도한 causal graph를 텍스트 프롬프팅 대신 LLM decoder 내부에서 처리되는 구조화된 Causal Token으로 변환하여 vision-language model에 causal reasoning을 internalize한다.", "summary_ko": "대형 vision-language model은 특히 multi-image 입력에 대한 interventional/counterfactual query에서 visual causal reasoning이 취약한데, 기존 연구는 causal knowledge를 model 실행 외부의 텍스트 프롬프트로만 주입하기 때문이다. 핵심 아이디어는 BridgeVLM으로, multi-image 입력에서 causal graph를 유도하고 이를 LLM decoder에 삽입된 RAMP layer가 처리하는 구조화된 Causal Token으로 변환하며, local/global 세밀도에서 causal supervision을 제공하는 통합 학습 인터페이스(M3S)를 함께 제안한다. 주요 기술적 결과로 CausalVLBench intervention task에서 54.4% vs 33.2%, Causal3D에서 43.6%에서 49.0%로, causal structure learning에서 F1이 33.4%에서 75.1%로 크게 향상되었다. 이는 causal reasoning을 외부 프롬프팅 트릭에서 구조적으로 내재화된 mechanism으로 전환하여 intervention/counterfactual query에 대한 신뢰성을 높인다는 점에서 의의가 있다. 다만 특정 benchmark(CausalVLBench, Causal3D)에서만 평가되었고, 유도된 causal graph와 token supervision의 품질에 성능이 의존한다.", "abstract": "Visual causal reasoning is essential for understanding and intervening in the physical world, requiring identification of causal variables from visual inputs and reasoning over intervention effects. Despite recent progress, large vision-language models (VLMs) remain brittle at such tasks, especially for interventional and counterfactual queries over multi-image inputs. Most existing explorations inject causal knowledge via textual prompts, leaving causal mechanisms external to model execution and limiting reliable control during inference. To address this problem, we propose BridgeVLM, which internalizes visual causal reasoning by inducing a causal graph from multi-image inputs and converting it into structured Causal Tokens executed by RAMP layers injected into the LLM decoder for causal message passing. We further introduce a unified training interface M3S for fine-grained causal supervision from different granularities (local/global level). BridgeVLM achieves 54.4% accuracy on intervention tasks on CausalVLBench (vs. 33.2% with prompt-level supervision), improves results on Causal3D from 43.6% to 49.0%, and substantially improves causal structure learning on CausalVLBench (F1: 33.4% to 75.1%)."}, {"id": "62056", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Towards Fair Sequential Decision-Making: A Causal Decomposition Approach", "url": "https://icml.cc/virtual/2026/poster/62056", "board": "Hall A #4207", "categories": ["Causal Fairness & Robustness", "Counterfactual Inference"], "estimands": ["NDE", "NIE"], "treatment_type": "", "discovery_types": [], "authors": ["Jiajun Chen", "Jin Tian", "Chris Quinn"], "famous": ["Jin Tian"], "key_idea_en": "Online causally-fair decision-making is formulated with counterfactual direct, indirect, and spurious effects as fairness constraints, and bandit algorithms are given that achieve sublinear regret and constraint-violation bounds.", "summary_en": "Ensuring fairness in sequential decision-making requires more than statistical parity, so this work targets finer-grained counterfactual fairness notions, namely direct, indirect, and spurious effects, in an online bandit setting. It formulates online causally-fair learning with multiple long-term, a priori unknown counterfactual-fairness constraints and studies the problem in both non-parametric contextual bandits and parametric logistic bandits. The authors prove sublinear regret and constraint-violation bounds in both settings without requiring Slater's condition, and for logistic bandits achieve a regret bound nearly matching the unconstrained optimum. By connecting counterfactual fairness measures to practical online learning guarantees, the results show that fairness constraints need not come at a large cost in regret. The findings are specific to the stated bandit models and to the three defined counterfactual effect measures, leaving extension to other decision-making settings or fairness notions for future work.", "key_idea_ko": "온라인 순차적 의사결정에서 counterfactual direct, indirect, spurious effect를 fairness 제약으로 정식화하고, 이를 만족시키면서 sublinear regret과 constraint-violation bound를 갖는 bandit algorithm을 제시한다.", "summary_ko": "sequential decision-making에서 fairness를 보장하려면 statistical parity 이상이 필요하며, 이 논문은 online bandit 환경에서 세밀한 counterfactual fairness 개념인 direct, indirect, spurious effect(Layer-3 Pearl Causal Hierarchy 수준의 quantity)를 다룬다. 여러 개의 장기적이고 사전에 알려지지 않은 counterfactual-fairness 제약을 갖는 online causally-fair learning problem을 정식화하고, 이를 non-parametric contextual bandit과 parametric logistic bandit 두 세팅에서 연구한다. 저자들은 Slater's condition을 요구하지 않고도 두 세팅 모두에서 sublinear regret과 constraint-violation bound를 증명하며, logistic bandit의 경우 unconstrained optimum에 거의 근접하는 regret bound를 달성한다. 이는 causal counterfactual fairness measure를 실용적인 online learning 보장과 연결한다는 점에서 의의가 있으며, fairness 제약이 반드시 큰 regret 비용을 수반하지 않음을 보여준다. 결과는 명시된 bandit model과 세 가지로 정의된 counterfactual effect measure에 국한되며, 다른 decision-making 세팅이나 fairness 개념으로의 확장은 다루지 않는다.", "abstract": "Counterfactual reasoning is one of the fundamental facets of human cognition, involved in various tasks such as explanation, credit assignment, blame, and responsibility. It describes the queries what would have happened had some intervention been performed given that something else, corresponding to Layer 3 of the Pearl Causal Hierarchy. In this project, we examine a specific type of counterfactual quantities, called counterfactual direct (Str-DE), indirect (Str-IE), and spurious (Str-SE) effects for quantifying fairness in a sequential decision-making framework. Building on these measures, we formulate an online causally-fair learning problem with multiple long-term constraints and study it in both non-parametric contextual bandits and parametric logistic bandits settings. We achieve sublinear regret and violations bounds for both bandits settings with round-wise counterfactual fairness constraints (that are a priori unknown) without Slater's condition. In particular, for logistic bandits, we obtain nearly optimal regret bound with leading term similar to that for unconstrained case (Zhang et al., 2025)."}, {"id": "60927", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "CORE-MTL: Rethinking Gradient Balancing via Causal Orthogonal Representations", "url": "https://icml.cc/virtual/2026/poster/60927", "board": "Hall A #4113", "categories": ["Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Chengfeng Wu", "Jingge Wang", "Yanru Wu", "Tao Zou"], "famous": [], "key_idea_en": "CORE-MTL disentangles the shared multi-task representation into a task-relevant semantic stream and a nuisance residual stream using causal and physical priors, avoiding negative transfer without gradient-balancing tricks.", "summary_en": "Existing multi-task learning methods balance gradients or modify shared architecture while ignoring representation content, leaving them unable to separate task-relevant structure from spurious context and prone to negative transfer. CORE-MTL instead takes a representation-centric approach, structurally splitting the shared representation into semantic and residual streams and using physical priors together with statistical constraints to concentrate task-relevant structure in the semantic stream. The method achieves a provably tighter out-of-distribution generalization bound than optimization-centric approaches and reduces gradient interference without any explicit gradient projection or reweighting. This reframes multi-task optimization as a causal disentanglement problem, offering a theoretically grounded, architecture-level alternative to gradient-surgery heuristics. The framework is instantiated and evaluated only in the visual domain, relying on domain-specific physical priors, so its generality to other modalities remains untested.", "key_idea_ko": "shared multi-task representation을 causal/physical prior를 이용해 task-relevant semantic stream과 nuisance residual stream으로 분리함으로써, gradient-balancing trick 없이도 negative transfer를 방지한다.", "summary_ko": "기존 multi-task learning 방법들은 gradient를 balancing하거나 shared architecture를 수정하지만 representation의 내용 자체는 다루지 않아, task-relevant structure와 spurious context를 분리하지 못해 negative transfer가 발생한다. CORE-MTL은 representation 중심의 framework로, physical prior와 statistical constraint를 이용해 shared representation을 semantic stream과 residual stream으로 구조적으로 분리하여 task-relevant structure를 semantic stream에 집중시킨다. 이 방법은 optimization 중심 접근법보다 더 tight한 out-of-distribution generalization bound를 증명 가능한 형태로 제시하며, 명시적인 gradient projection이나 reweighting 없이도 gradient interference를 줄인다. 이는 multi-task optimization을 causal disentanglement 문제로 재구성한 것으로, gradient-surgery 휴리스틱에 대한 이론적 근거를 갖춘 architecture-level 대안을 제공한다는 점에서 의의가 있다. 다만 visual domain에서 domain-specific physical prior에 의존해 구현 및 검증되었기 때문에 다른 modality로의 일반화는 검증되지 않았다.", "abstract": "Multi-task learning (MTL) aims to construct a joint model for multiple tasks by sharing a common representation across domains. To achieve this goal, existing optimization-centric methods either balance task gradients or modify the shared architecture. However, as these approaches remain agnostic to the content of the shared representation, they fail to disentangle task-relevant structure from spurious context, leading to negative transfer and poor generalization. To overcome this limitation, we propose Causal Orthogonal Representations for Multi-Task Learning (CORE-MTL), a representation-centric framework that structurally disentangles the shared representation into semantic and residual streams, concentrating task-relevant structure in the semantic stream while relegating nuisance variation to the residual stream. We instantiate this framework in the visual domain by leveraging physical priors for structured scenes and statistical constraints for attributes. Theoretically, our method enjoys a tighter out-of-distribution generalization bound than optimization-centric methods and reduces task gradient interference without explicit gradient projection or reweighting. Empirically, CORE-MTL consistently outperforms existing methods on visual multi-task benchmarks in both in-distribution and out-of-distribution settings."}, {"id": "62072", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Bayesian Meta-Learning with Expert Feedback for Task-Shift Adaptation through Causal Embeddings", "url": "https://icml.cc/virtual/2026/poster/62072", "board": "Hall A #4114", "categories": ["Causal Representation Learning", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Lotta Makinen", "Jorge Loria", "Samuel Kaski"], "famous": [], "key_idea_en": "Conditioning Bayesian meta-learning priors on precomputed latent causal task embeddings, informed by noisy expert judgments of causal similarity, lets transfer to out-of-distribution tasks track shared causal mechanisms rather than spurious correlation.", "summary_en": "Meta-learning methods can suffer negative transfer when adapting to out-of-distribution target tasks, because they rely on spurious cross-task correlations rather than genuine mechanistic similarity. The paper proposes a causally-aware Bayesian meta-learning approach that conditions task-specific priors on precomputed latent causal task embeddings, drawing on noisy expert-provided pairwise judgments of causal similarity between source and target tasks under limited target-task data. Theoretical analysis shows that conditioning on these causal embeddings controls prior mismatch and mitigates negative transfer under task shift, while empirical results demonstrate reduced negative transfer and improved out-of-distribution adaptation both in controlled simulations and in a large-scale clinical cross-disease transfer setting where the causal embeddings align with known clinical mechanisms. This is valuable for meta-learning deployments where target data is scarce and naive transfer can actively degrade performance. The approach depends on the availability, even if noisy, of expert causal-similarity judgments between tasks.", "key_idea_ko": "causal similarity에 대한 noisy expert judgment로부터 얻은 precomputed latent causal task embedding을 사용해 Bayesian meta-learning의 prior를 조건화함으로써, out-of-distribution task로의 transfer가 spurious correlation이 아닌 shared causal mechanism에 근거하도록 한다.", "summary_ko": "Meta-learning 방법은 out-of-distribution target task에 적응할 때 mechanistic similarity가 아닌 spurious cross-task correlation에 의존하여 negative transfer를 겪을 수 있다는 문제가 있다. 이 논문은 task-specific prior를 precomputed latent causal task embedding에 조건화하는 causally-aware Bayesian meta-learning 방법을 제안하며, 이 embedding은 제한된 target-task 데이터 하에서 source와 target task 간 causal similarity에 대한 noisy한 expert pairwise judgment를 활용해 구성된다. 이론적 분석은 causal embedding에 조건화하는 것이 prior mismatch를 통제하고 task shift 하에서 negative transfer를 완화함을 보인다. 실증적으로 이 방법은 controlled simulation과 대규모 clinical cross-disease transfer 세팅(여기서 causal embedding이 알려진 clinical mechanism과 정합함)에서 negative transfer를 줄이고 OOD adaptation을 개선한다. 이는 target data가 부족하고 naive transfer가 오히려 성능을 해칠 수 있는 meta-learning 배포 상황에서 중요하지만, 이 접근법은 task 간 expert causal-similarity judgment의 가용성(비록 noisy하더라도)에 의존한다는 한계가 있다.", "abstract": "Meta-learning methods perform well on new within-distribution tasks but often fail when adapting to out-of-distribution target tasks, where transfer from source tasks can induce negative transfer. We propose a causally-aware Bayesian meta-learning method, by conditioning task-specific priors on precomputed latent causal task embeddings, enabling transfer based on mechanistic similarity rather than spurious correlations. Our approach explicitly considers realistic deployment settings where access to target-task data is limited, and adaptation relies on noisy (expert-provided) pairwise judgments of causal similarity between source and target tasks. We provide a theoretical analysis showing that conditioning on causal embeddings controls prior mismatch and mitigates negative transfer under task shift. Empirically, we demonstrate reductions in negative transfer and improved out-of-distribution adaptation in both controlled simulations and a large-scale real-world clinical prediction setting for cross-disease transfer, where causal embeddings align with underlying clinical mechanisms."}, {"id": "66163", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Reward-Preserving Counterfactual State Editing for Offline Reinforcement Learning", "url": "https://icml.cc/virtual/2026/poster/66163", "board": "Hall A #503", "categories": ["Counterfactual Inference", "Confounding & Deconfounding"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Siyu Wang", "Xiaocong Chen", "Mingming Gong", "Yong Li", "Quan Sheng", "Lina Yao"], "famous": ["Mingming Gong"], "key_idea_en": "CSET augments offline RL training data with minimally edited counterfactual states, matched to the factual reward via a causal reward model, to reduce causal confusion in transformer policies without learning transition dynamics.", "summary_en": "Transformer policies for offline RL, such as Decision Transformer, can suffer from causal confusion, latching onto spurious correlations in logged trajectories rather than the environment's true causal mechanisms. CSET (Counterfactual State Editing Transformer) fits a causal reward model as a conditional VAE to infer a posterior over reward disturbances, then uses a counterfactual state generator, constrained by a move-band and acceptance gate, to produce a minimally edited state whose predicted reward matches the factual reward, augmenting trajectories by swapping only the observation token while keeping the next observation factual. Combined with a causally structured hybrid transformer that uses separate per-stream encoders with attention softly supervised toward true causal parents, CSET shows consistent gains over transformer baselines and much greater robustness to injected spurious distractors on D4RL locomotion and AntMaze and on offline recommendation benchmarks. This debiases offline RL from spurious reward correlations without the cost or error accumulation of learning full transition dynamics. The approach is limited to the strictly offline setting, and its benefit depends on the quality of the learned causal reward model and its disturbance posterior.", "key_idea_ko": "CSET은 causal reward model을 통해 factual reward와 일치하는 minimally edited counterfactual state로 offline RL training data를 augmentation하여, transition dynamics를 학습하지 않고도 transformer policy의 causal confusion을 줄인다.", "summary_ko": "Decision Transformer와 같은 offline RL용 transformer policy는 logged trajectory 내의 spurious correlation에 매달려 환경의 진짜 causal mechanism을 놓치는 causal confusion을 겪을 수 있다. CSET(Counterfactual State Editing Transformer)은 conditional VAE로 causal reward model을 fitting하여 reward disturbance에 대한 posterior를 추론한 뒤, move-band와 acceptance gate로 제약된 counterfactual state generator를 사용해 predicted reward가 factual reward와 일치하는 minimally edited state를 생성하고, next observation은 factual로 유지한 채 observation token만 교체하여 trajectory를 augmentation한다. stream별로 분리된 encoder와 true causal parent 쪽으로 softly supervised된 attention을 갖는 causally structured hybrid transformer와 결합했을 때, CSET은 D4RL locomotion/AntMaze 및 offline recommendation benchmark에서 transformer baseline 대비 일관된 성능 향상과 주입된 spurious distractor에 대한 훨씬 큰 robustness를 보인다. 전체 transition dynamics를 학습할 때 발생하는 비용이나 error accumulation 없이 offline RL을 spurious reward correlation으로부터 debias한다는 점에서 의의가 있다. 엄격히 offline setting에 국한되며, 성능은 학습된 causal reward model과 그 disturbance posterior의 품질에 의존한다.", "abstract": "Transformer sequence models such as Decision Transformer can learn strong offline policies from logged trajectories, but they can suffer from causal confusion: reliance on spurious correlations that predict reward in the data but do not reflect the true causal mechanisms of the environment. We propose CSET (Counterfactual State Editing Transformer), which improves robustness in strictly offline reinforcement learning without learning environment transition dynamics. CSET first fits a causal reward model as a conditional variational autoencoder to infer a posterior over reward disturbances for each transition. Conditioning on the factual action and a sampled disturbance, a counterfactual state generator proposes a minimally edited state whose predicted reward matches the factual reward; a normalized move-band constraint and an acceptance gate enforce state plausibility and reward consistency. We then augment trajectories by replacing only the observation token with the edited state while keeping the next observation factual, so the policy is not trained on synthetic successor transitions. On the model side, CSET uses a causally structured hybrid transformer: separate convolutional encoders process return-to-go, state, and action streams for local temporal structure, and a final attention block is softly supervised so action prediction focuses on its direct causal parents (state and return-to-go). Experiments on D4RL locomotion and AntMaze tasks and on offline recommendation benchmarks show consistent gains over transformer baselines and substantially improved robustness to injected spurious distractors."}, {"id": "64920", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Causal Flow Q-Learning for Robust Offline Reinforcement Learning", "url": "https://icml.cc/virtual/2026/poster/64920", "board": "Hall A #614", "categories": ["Confounding & Deconfounding", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Mingxuan Li", "Junzhe Zhang", "Elias Bareinboim"], "famous": ["Junzhe Zhang", "Elias Bareinboim"], "key_idea_en": "The paper treats offline RL from pixel-based demonstrations as a confounded causal inference problem and trains flow-matching policies that optimize worst-case performance under unmeasured confounding, using a discriminator to detect mismatch with the behavioral policy.", "summary_en": "Offline RL policy-gradient methods typically assume no unmeasured confounding, yet sensory mismatches between demonstrator and learner in pixel-based data introduce implicit confounding bias into the offline dataset. The authors frame confounded offline RL as a causal robustness problem, deriving an objective that optimizes worst-case policy performance under such confounding and implementing it via expressive flow-matching policies trained with a discriminator that measures the discrepancy between the target policy and the nominal behavioral policy. Across 25 pixel-based tasks, their confounding-robust augmentation procedure achieves a success rate 120% that of confounding-unaware, state-of-the-art offline RL methods. This provides a principled, causally grounded way to make offline RL robust to hidden confounding arising from sensory mismatch, a common feature of real demonstration data. The approach targets pixel-based offline RL settings, and the abstract does not detail how well it generalizes to confounding sources beyond sensory or demonstrator mismatch.", "key_idea_ko": "pixel-based demonstration을 이용한 offline RL을 confounded causal inference 문제로 정식화하고, 관측되지 않은 confounding 하에서 worst-case 성능을 최적화하는 flow-matching policy를 discriminator로 학습한다.", "summary_ko": "offline RL의 policy-gradient 방법들은 unmeasured confounding이 없다고 가정하지만, pixel-based data에서는 demonstrator와 learner 사이의 sensory mismatch가 offline data에 암묵적인 confounding bias를 유발한다. 저자들은 confounded offline RL을 causal robustness 문제로 정식화하여, 이러한 confounding 하에서 worst-case policy 성능을 최적화하는 objective를 도출하고, target policy와 nominal behavioral policy 간의 불일치를 평가하는 discriminator로 학습되는 expressive flow-matching policy를 통해 이를 구현한다. 25개의 pixel-based task에서, confounding-robust augmentation 절차는 confounding을 고려하지 않는 state-of-the-art offline RL 방법 대비 120%의 success rate를 달성한다. 이는 실제 demonstration data에서 흔히 발생하는 sensory mismatch로 인한 hidden confounding에 대해 offline RL을 강건하게 만드는 원칙적이고 causally grounded한 방법을 제공한다는 의의가 있다. 이 접근법은 pixel-based offline RL setting을 대상으로 하며, sensory/demonstrator mismatch 이외의 confounding source에 대한 일반화 가능성은 abstract에서 자세히 다루지 않는다.", "abstract": "Expressive policies based on flow-matching have been successfully applied in reinforcement learning (RL) more recently due to their ability to model complex action distributions from offline data. These algorithms build on standard policy gradients, which assume that there is no unmeasured confounding in the data. However, this condition does not necessarily hold for pixel-based demonstrations when a mismatch exists between the demonstrator's and the learner's sensory capabilities, leading to implicit confounding biases in offline data. We address the challenge by investigating the problem of confounded observations in offline RL from a causal perspective. We develop a novel causal offline RL objective that optimizes policies' worst-case performance that may arise due to confounding biases. Based on this new objective, we introduce a practical implementation that learns expressive flow-matching policies from confounded demonstrations, employing a deep discriminator to assess the discrepancy between the target policy and the nominal behavioral policy. Experiments across 25 pixel-based tasks demonstrate that our proposed confounding-robust augmentation procedure achieves a success rate 120% that of confounding-unaware, state-of-the-art offline RL methods."}, {"id": "64408", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Cycle-of-Science: Reliable Reasoning through Counterfactual Verification for Agent Decision Making", "url": "https://icml.cc/virtual/2026/poster/64408", "board": "Hall A #209", "categories": ["Causal Reasoning in LLMs/Agents", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Ruojie Zhang", "Wencheng Zhu", "dayong zhu"], "famous": [], "key_idea_en": "Cycle-of-Science lets LLM agents iteratively generate hypotheses, run counterfactual experiments, and validate causal dependencies, improving robust decision-making beyond passive correlation-based learning.", "summary_en": "LLM-based autonomous agents struggle with robust decision-making because passive learning from similar past experiences tends to confound correlation with causality. Cycle-of-Science addresses this with an iterative Hypothesis-Experiment-Validation loop, in which causal knowledge guides initial hypothesis generation, counterfactual samples test hypotheses through experiments, causal analysis quantifies intervention effects, and an adaptive threshold calibration adjusts causal validation based on policy uncertainty. The framework achieves superior performance over state-of-the-art approaches on agent decision-making benchmarks. This offers a principled way to inject causal reasoning into agent pipelines, potentially improving the reliability of autonomous decisions. The evaluation is limited to the benchmarks tested, and the framework's generality across broader real-world agent deployments remains unestablished.", "key_idea_ko": "Cycle-of-Science는 LLM agent가 hypothesis 생성, counterfactual experiment 수행, causal dependency 검증을 반복함으로써 수동적인 correlation 기반 학습을 넘어선 강건한 decision-making을 가능하게 하는 framework이다.", "summary_ko": "LLM 기반 autonomous agent는 유사한 과거 경험으로부터의 수동적 학습이 correlation과 causality를 혼동시키는 경향이 있어 강건한 decision-making에 어려움을 겪는다. 이 논문은 causal knowledge가 초기 hypothesis 생성을 안내하고, counterfactual sample이 experiment를 통해 hypothesis를 검증하며, causal analysis가 intervention effect를 정량화하는 Hypothesis-Experiment-Validation의 iterative loop인 Cycle-of-Science를 제안하고, 여기에 policy uncertainty에 따라 causal validation을 조정하는 adaptive threshold calibration을 추가한다. 주요 결과는 agent decision-making benchmark에서 state-of-the-art 접근법 대비 우수한 성능이다. 이는 agent pipeline에 causal reasoning을 principled하게 주입하는 방법을 제공하여 autonomous decision의 reliability를 개선할 수 있다는 점에서 중요하다. 평가는 테스트된 benchmark로 한정되며, 더 넓은 real-world agent 배포 전반에 대한 framework의 generality는 아직 확립되지 않았다.", "abstract": "Large Language Models have significantly advanced autonomous agents through their sophisticated perception and execution capabilities. Despite effective, agents still struggle with robust decision-making due to passive learning from similar experiences that often confound correlation with causality. Inspired by the Scientific Method, we propose a Cycle-of-Science framework that autonomously explores potential causal pathways through an iterative loop of Hypothesis, Experiment, and Validation, enabling agents to identify truly effective causal dependencies. To be specific, we first leverage causal knowledge to guide the initial hypotheses generation. These hypotheses are then analyzed through experiments using counterfactual samples. Afterward, we perform causal analysis to quantify effects of interventions, deriving well-validated hypotheses for next agent steps. Finally, we introduce adaptive threshold calibration that modulates causal validation based on policy uncertainty. Experiments on benchmarks demonstrate that our method achieves superior performance over state-of-the-art approaches."}, {"id": "65472", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Optimal Transport Group Counterfactual Explanations", "url": "https://icml.cc/virtual/2026/poster/65472", "board": "Hall A #3307", "categories": ["Counterfactual Inference", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Enrique Valero-Leal", "Bernd Bischl", "Pedro Larranaga", "Concha Bielza", "Giuseppe Casalicchio"], "famous": [], "key_idea_en": "An explicit optimal-transport map sends any member of a group to its counterfactual without per-instance re-optimization, minimizing total transport cost while preserving group geometry and generalizing to new group members.", "summary_en": "Existing group counterfactual explanation methods are optimized only for a fixed group and fail to generalize to new members, often require strong model assumptions such as linearity for tractability, or poorly control distortion of the group's geometry. The authors instead learn an explicit optimal transport map that sends any group instance to its counterfactual without re-optimization, minimizing the group's total transport cost with fewer parameters and yielding more interpretable, common actionable recourse. For linear classifiers, the counterfactual-representing functions are shown to arise from specific convex optimization problems (QP, QCQP, and related forms), giving a precise characterization of the solution structure. Experiments show the method generalizes accurately to new instances, preserves group geometry, and incurs only negligible additional transport cost relative to baselines, while substantially outperforming them when model linearity cannot be exploited. The strongest theoretical guarantees, the explicit convex-optimization characterization, are established only for linear classifiers, with nonlinear settings handled more empirically.", "key_idea_ko": "group의 임의의 member를 재최적화 없이 counterfactual로 보내는 explicit optimal transport map을 학습하여, group geometry를 보존하면서 total transport cost를 최소화하고 새로운 member에도 generalize한다.", "summary_ko": "기존 group counterfactual explanation 방법은 고정된 group에만 최적화되어 새로운 member로 일반화되지 않거나, tractability를 위해 linearity 같은 강한 model assumption을 요구하거나, group geometry의 distortion을 잘 제어하지 못한다는 한계가 있다. 저자들은 대신 group instance를 재최적화 없이 counterfactual로 보내는 explicit optimal transport map을 학습하여 group의 total transport cost를 최소화하며, 이는 더 적은 parameter로 더 interpretable하고 공통된 actionable recourse를 제공한다. linear classifier에 대해서는 counterfactual을 나타내는 함수가 특정 convex optimization problem(QP, QCQP 등)에서 도출됨을 증명하여 solution structure를 정밀하게 characterize한다. 실험 결과 이 방법은 새로운 instance에 정확히 generalize하고 group geometry를 보존하며 baseline 대비 무시할 만한 추가 transport cost만 발생시키고, model linearity를 활용할 수 없는 경우에는 baseline을 상당히 능가한다. 가장 강한 theoretical guarantee(explicit convex-optimization characterization)는 linear classifier에 대해서만 확립되며, nonlinear setting은 보다 empirical하게 다뤄진다.", "abstract": "Group counterfactual explanations find a set of counterfactual instances to explain a group of input instances contrastively. However, existing methods either (i) optimize counterfactuals only for a fixed group and do not generalize to new group members, (ii) strictly rely on strong model assumptions (e.g., linearity) for tractability or/and (iii) poorly control the counterfactual group geometry distortion. We instead learn an explicit optimal transport map that sends any group instance to its counterfactual without re-optimization, minimizing the group's total transport cost. This enables generalization with fewer parameters, making it easier to interpret the common actionable recourse. For linear classifiers, we prove that functions representing group counterfactuals are derived via mathematical optimization, identifying the underlying convex optimization type (QP, QCQP, ...). Experiments show that they accurately generalize, preserve group geometry and incur only negligible additional transport cost compared to baseline methods. If model linearity cannot be exploited, our approach also significantly outperforms the baselines."}, {"id": "62590", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "CausalArmor: Efficient Indirect Prompt Injection Guardrails via Causal Attribution", "url": "https://icml.cc/virtual/2026/poster/62590", "board": "Hall A #2809", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Minbeom Kim", "Mihir Parmar", "Phillip Wallis", "Lesly Miculicich", "Kyomin Jung", "Krishnamurthy Dvijotham", "Long T. Le", "Tomas Pfister"], "famous": [], "key_idea_en": "CausalArmor detects indirect prompt injection through a causal 'dominance shift' signature, untrusted content gaining disproportionate attributable influence over the user request at a privileged decision point, measured via leave-one-out ablation, and applies sanitization only selectively, avoiding the costs of always-on defenses.", "summary_en": "Tool-calling AI agents are vulnerable to indirect prompt injection (IPI), where malicious instructions hidden in untrusted content hijack the agent's actions, and existing always-on defenses suffer an over-defense dilemma that degrades utility and latency even absent an attack. The authors reframe IPI detection causally: a successful injection produces a 'dominance shift' in which the user request no longer decisively supports the agent's privileged action while a specific untrusted segment gains disproportionate attributable influence, detected via lightweight leave-one-out ablation attribution at decision points. They prove a theoretical bound showing that sanitization triggered by attribution margins yields an exponentially small probability of selecting a malicious action, and complement it with retroactive chain-of-thought masking that prevents the agent from acting on already-poisoned reasoning traces. As a result, CausalArmor matches the security of aggressive always-on defenses while improving explainability and preserving utility and latency in benign scenarios. It is evaluated on the AgentDojo and DoomArena benchmarks and assumes the ability to instrument and observe the agent's decision computation in order to compute ablation attributions.", "key_idea_ko": "CausalArmor는 leave-one-out ablation으로 측정되는 causal 'dominance shift' signature(untrusted content가 privileged decision point에서 user request 대비 불균형하게 큰 attributable influence를 얻는 현상)를 통해 indirect prompt injection을 탐지하고, sanitization을 selective하게만 적용하여 always-on defense의 비용을 회피한다.", "summary_ko": "tool-calling AI agent는 untrusted content에 숨겨진 malicious instruction이 agent의 행동을 hijack하는 indirect prompt injection(IPI)에 취약하며, 기존의 always-on defense는 공격이 없을 때조차 utility와 latency를 저해하는 over-defense dilemma를 겪는다. 핵심 아이디어는 IPI 탐지를 causal하게 재구성하는 것으로, 성공적인 injection은 user request가 더 이상 agent의 privileged action을 결정적으로 지지하지 못하면서 특정 untrusted segment가 불균형한 attributable influence를 얻는 'dominance shift'를 만들어내며, 이를 decision point에서의 가벼운 leave-one-out ablation attribution으로 탐지한다. 주요 기술적 결과는 attribution margin에 의해 촉발되는 sanitization이 malicious action을 선택할 확률을 exponentially 작게 만든다는 theoretical bound이며, 여기에 이미 poisoning된 reasoning trace에 따라 행동하는 것을 막는 retroactive chain-of-thought masking이 더해진다. 이는 CausalArmor가 benign scenario에서 utility와 latency를 보존하면서도 explainability를 개선하고 aggressive always-on defense와 동등한 보안 수준을 달성한다는 점에서 중요하다. 이 방법은 AgentDojo와 DoomArena benchmark에서 평가되었으며, agent의 decision computation을 instrument/observe하여 ablation attribution을 계산할 수 있음을 가정한다.", "abstract": "AI agents equipped with tool-calling capabilities are susceptible to Indirect Prompt Injection (IPI) attacks. In this attack scenario, malicious commands hidden within untrusted content trick the agent into performing unauthorized actions. Existing defenses can reduce attack success but often suffer from the over-defense dilemma: they deploy expensive, always-on sanitization regardless of actual threat, thereby degrading utility and latency even in benign scenarios. We revisit IPI through a causal ablation perspective: a successful injection manifests as a dominance shift where the user request no longer provides decisive support for the agent's privileged action, while a particular untrusted segment, such as a retrieved document or tool output, provides disproportionate attributable influence. Based on this signature, we propose CausalArmor, a selective defense framework that (i) computes lightweight, leave-one-out ablation-based attributions at privileged decision points, and (ii) triggers targeted sanitization only when an untrusted segment dominates the user intent. Additionally, CausalArmor employs retroactive Chain-of-Thought masking to prevent the agent from acting on 'poisoned' reasoning traces. We present a theoretical analysis showing that sanitization based on attribution margins conditionally yields an exponentially small upper bound on the probability of selecting malicious actions. Experiments on AgentDojo and DoomArena demonstrate that CausalArmor matches the security of aggressive defenses while improving explainability and preserving utility and latency of AI agents."}, {"id": "64985", "session": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Domain Transfer Becomes Identifiable via a Single Alignment", "url": "https://icml.cc/virtual/2026/poster/64985", "board": "Hall A #4610", "categories": ["Causal Representation Learning", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Sagar Shrestha", "Subash Timilsina", "Hoang-Son Nguyen", "Xiao Fu"], "famous": [], "key_idea_en": "Domain-transfer mappings, ordinarily non-identifiable due to measure-preserving automorphisms, become identifiable under a Jacobian sparsity condition together with just a single paired anchor sample, enforced via a scalable regularizer.", "summary_en": "Domain transfer, such as mapping a source distribution to a target one in image-to-image translation or cross-platform data alignment, is fundamentally ill-posed because measure-preserving automorphisms can alter cross-domain correspondences while leaving the marginals unchanged, causing content misalignment. Prior work restores identifiability by jointly transferring several paired conditional distributions, but such labeled conditionals are often unavailable in practice. This paper shows that, under a structural sparsity condition on the Jacobian support pattern of the transfer map, distribution matching combined with just a single paired anchor sample suffices to identify the true transfer, requiring far less supervision. To keep this tractable in high dimensions, the authors introduce an efficient Jacobian sparsity regularizer based on randomized masked finite differences that avoids explicit Jacobian computation. The approach substantially lowers the supervision burden for identifiable domain transfer and is validated with synthetic and real-world experiments, though it still depends on the structural sparsity assumption holding and on having at least one anchor pair available.", "key_idea_ko": "논문은 measure-preserving automorphism으로 인해 보통 non-identifiable한 domain-transfer mapping이, Jacobian sparsity 조건과 단 하나의 paired anchor sample만 주어지면 identifiable해짐을 보이고, 이 sparsity를 강제하는 scalable regularizer를 제시한다.", "summary_ko": "domain transfer(예: image-to-image translation이나 cross-platform data alignment에서처럼 source distribution을 target distribution으로 mapping하는 것)는 measure-preserving automorphism이 marginal을 그대로 두면서도 cross-domain correspondence를 바꿀 수 있어 근본적으로 ill-posed하며 content misalignment를 일으킨다. 기존 연구는 여러 paired conditional distribution을 함께 transfer함으로써 identifiability를 회복했지만 이런 labeled conditional은 실제로는 흔히 얻을 수 없는데, 이 논문은 transfer map의 Jacobian support pattern에 대한 structural sparsity 조건 하에서는 distribution matching과 단 하나의 paired anchor sample만으로도 true transfer를 identify하기에 충분함을 보여 필요한 supervision을 크게 줄인다. 고차원에서 이를 tractable하게 만들기 위해, 명시적인 Jacobian 계산을 피하는 randomized masked finite difference 기반의 효율적인 Jacobian sparsity regularizer를 도입한다. identifiable domain transfer에 필요한 supervision 부담을 상당히 낮춘다는 점에서 중요하며, 이 이론은 synthetic 및 real-world 실험으로 검증되었다. 여전히 structural sparsity 가정이 성립해야 하고 적어도 하나의 anchor pair를 필요로 한다는 한계가 있다.", "abstract": "Domain transfer (DT) maps source to target distributions and supports tasks such as unsupervised image-to-image translation, single-cell analysis, and cross-platform medical imaging. However, DT is fundamentally ill-posed: push-forward mappings are generally non-identifiable, as measure-preserving automorphisms (MPAs) preserve marginals while altering cross-domain correspondences, leading to content-misaligned translation. Recent work shows that MPAs can be eliminated by jointly transferring multiple corresponding source/target conditional distributions, but supervision signals labeling such conditionals are not always available in practice. We develop an alternative route to DT identifiability. Under a structural sparsity condition on the Jacobian support pattern, we show that distribution matching together with a single paired anchor sample suffices to identify the ground-truth transfer, requiring substantially less supervision than prior approaches. To enable practical high-dimensional learning, we further propose an efficient Jacobian sparsity regularizer based on randomized masked finite differences, yielding a scalable surrogate without explicit Jacobian evaluation. Empirical results on synthetic and real-world DT tasks validate the theory."}, {"id": "65016", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Counterfactual Occlusion-Aware Learning via Visibility Intervention for LiDAR Anomaly Detection", "url": "https://icml.cc/virtual/2026/poster/65016", "board": "Hall A #1413", "categories": ["Counterfactual Inference", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Longyu Yang", "Jun Liu", "Yap-Peng Tan", "Fumin Shen", "Heng Tao Shen", "Xiaofeng Zhu", "Ping Hu"], "famous": [], "key_idea_en": "COVAL trains LiDAR anomaly detectors on synthetically generated factual/counterfactual occlusion pairs, intervening on volumetric visibility so the model learns to exploit anomaly-induced occlusion patterns rather than visible measurements alone.", "summary_en": "LiDAR point-cloud anomaly detection is important for autonomous-system safety, but most methods rely only on visible measurements and overlook occlusion, the structured spatial voids that anomalies create, as a signal. COVAL (Counterfactual Occlusion-Visibility Anomaly Learning) addresses this by intervening on volumetric visibility during training through physics-conformed synthetic anomaly construction, generating paired factual and counterfactual observations that share identical scene geometry but differ in occlusion pattern, trained with two objectives, Visibility-Variant Counterfactual Reconstruction and Visibility-Invariant Counterfactual Consistency. These objectives isolate anomaly-induced structural missingness and refine normal-scene representations, yielding state-of-the-art performance on standard LiDAR anomaly-segmentation benchmarks. This shows that a counterfactual, intervention-based data-augmentation strategy can improve safety-critical perception by exploiting occlusion structure rather than raw appearance alone. Its benefits are tied to how well the physics-conformed synthetic occlusion process matches real sensor physics.", "key_idea_ko": "COVAL은 volumetric visibility에 개입(intervene)하여 factual/counterfactual occlusion pair를 합성 생성함으로써, LiDAR anomaly detector가 단순히 보이는 measurement뿐 아니라 anomaly가 유발하는 occlusion pattern까지 학습하도록 훈련한다.", "summary_ko": "LiDAR point cloud anomaly detection은 autonomous system 안전에 중요하지만, 대부분의 방법은 보이는 measurement에만 의존하고 anomaly가 만들어내는 구조화된 spatial void인 occlusion을 신호로 활용하지 않는다. 핵심 아이디어는 COVAL(Counterfactual Occlusion-Visibility Anomaly Learning)로, physics-conformed synthetic anomaly construction을 통해 training 중 volumetric visibility에 개입하여 동일한 scene geometry를 갖지만 occlusion pattern이 다른 factual/counterfactual observation pair를 생성하고, Visibility-Variant Counterfactual Reconstruction과 Visibility-Invariant Counterfactual Consistency 두 objective로 훈련한다. 주요 기술적 결과는 이 objective들이 anomaly에 의한 structural missingness를 분리해내고 normal-scene representation을 정교화하여 표준 LiDAR anomaly segmentation benchmark에서 state-of-the-art 성능을 달성한다는 것이다. 이는 counterfactual하고 intervention 기반인 data-augmentation 전략이 raw appearance만이 아니라 occlusion structure를 활용하여 safety-critical perception을 향상시킬 수 있음을 보여준다는 점에서 의미가 있다. 그 적용 범위는 physics-conformed synthetic anomaly construction에 대한 의존으로 제한되므로, 이득은 synthetic occlusion 과정이 실제 sensor physics를 얼마나 잘 반영하는지에 좌우된다.", "abstract": "LiDAR point cloud anomaly detection is critical for autonomous system safety, yet most existing methods rely only on visible measurements, overlooking occlusion as a structured consequence of the LiDAR sensing process. We argue that anomalies are characterized not only by what is observed, but also by the spatial voids they create, which alter occlusion patterns and volumetric visibility. We propose Counterfactual Occlusion-Visibility Anomaly Learning (COVAL), a framework that intervenes on volumetric visibility during training. Using physics-conformed synthetic anomaly construction, COVAL generates paired factual and counterfactual observations with identical scene geometry but different occlusion patterns. Then, we introduce two complementary objectives: Visibility-Variant Counterfactual Reconstruction, which models occlusion-induced missing regions, and Visibility-Invariant Counterfactual Consistency, which enforces stable representations across visibility changes. Together, these objectives isolate anomaly-induced structural missingness and in turn refine representation of normal scenes, thus improving anomaly sensitivity at test time. Experiments on standard LiDAR anomaly segmentation benchmarks show that COVAL achieves state-of-the-art performance."}, {"id": "63799", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "DeFacto: Counterfactual Thinking with Images for Enforcing Evidence-Grounded and Faithful Reasoning", "url": "https://icml.cc/virtual/2026/poster/63799", "board": "Hall A #1415", "categories": ["Counterfactual Inference", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Tianrun Xu", "Haoda Jing", "Ye Li", "Yuquan Wei", "Jun Feng", "Guanyu Chen", "Haichuan Gao", "Tianren Zhang", "Jing Liu", "Feng Chen"], "famous": [], "key_idea_en": "DeFacto is a counterfactual-reasoning training framework that aligns MLLMs' visual evidence with their answers via GRPO reinforcement learning and a dedicated counterfactual dataset/benchmark.", "summary_en": "Multimodal language models that 'think with images' often give correct answers unsupported by correct visual evidence, breaking evidence-answer consistency. DeFacto jointly optimizes task correctness and evidence-answer consistency using three training paradigms (positive, counterfactual, random-masking), built on an automatic language-guided pipeline that localizes question-relevant regions and generates counterfactual image variants, forming the roughly 100k-image DeFacto-100K dataset, and is trained with GRPO reinforcement learning under three complementary rewards. The authors also introduce DeFacto-1.5K, a human-annotated benchmark, and show that DeFacto substantially improves both answer accuracy and evidence-answer consistency over strong baselines across diverse benchmarks. By grounding MLLM reasoning in verifiably correct visual evidence through counterfactual training, the work addresses a key faithfulness gap in image-based reasoning systems beyond mere answer accuracy. The approach relies on an automatic region-localization and counterfactual-generation pipeline whose own reliability is not independently validated, and code/data release is only promised upon acceptance.", "key_idea_ko": "DeFacto는 GRPO reinforcement learning과 전용 counterfactual dataset/benchmark를 통해 MLLM의 visual evidence와 answer를 정렬시키는 counterfactual-reasoning training framework이다.", "summary_ko": "image를 통해 'thinking'하는 multimodal language model은 종종 올바른 visual evidence로 뒷받침되지 않는 정답을 내놓아 evidence-answer consistency가 깨지는 문제가 있다. DeFacto는 question-relevant region을 localize하고 counterfactual image variant를 생성하는 automatic language-guided pipeline(약 10만 장 규모의 DeFacto-100K를 구성)을 기반으로, positive, counterfactual, random-masking 세 가지 training paradigm을 이용해 GRPO reinforcement learning과 세 가지 보완적 reward로 task correctness와 evidence-answer consistency를 함께 최적화한다. 저자들은 human-annotated benchmark인 DeFacto-1.5K도 함께 도입하며, DeFacto가 다양한 benchmark에서 strong baseline 대비 answer accuracy와 evidence-answer consistency를 모두 크게 향상시킴을 보인다. counterfactual training을 통해 MLLM reasoning을 검증 가능하게 올바른 visual evidence에 grounding함으로써, 단순 answer accuracy를 넘어 image 기반 reasoning system의 핵심적인 faithfulness gap을 다룬다. 이 접근은 자체 신뢰성이 독립적으로 검증되지 않은 automatic region-localization 및 counterfactual-generation pipeline에 의존하며, code/data 공개는 승인 시에만 약속되어 있다.", "abstract": "Recent advances in multimodal language models (MLLMs) have made thinking with images a dominant paradigm for multimodal reasoning. However, existing methods still fail to ensure evidence-answer consistency, where correct answers must be supported by correct visual evidence. To address this issue, we propose DeFacto, a counterfactual reasoning framework that explicitly aligns visual evidence with final answers by jointly optimizing for task correctness and evidence-answer consistency. Our approach integrates three complementary training paradigms: (i) positive, (ii) counterfactual, and (iii) random-masking. We further develop a language-guided evidence construction pipeline that automatically localizes question-relevant regions and generates counterfactual variants, resulting in DeFacto-100K, a dataset of about 100k images. Building on this dataset, we train MLLMs with GRPO-based reinforcement learning and design three complementary rewards to promote correct answering, structured reasoning, and consistent evidence selection. Moreover, we introduce DeFacto-1.5K, a human-annotated benchmark for systematically evaluating evidence-grounded consistency beyond answer accuracy. Experiments on diverse benchmarks demonstrate that DeFacto substantially improves both answer accuracy and evidence-answer consistency over strong baselines. The code and datasets will be released upon acceptance."}, {"id": "60956", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Towards Trustworthy and Identifiable Virtual Face Generation", "url": "https://icml.cc/virtual/2026/poster/60956", "board": "Hall A #1108", "categories": ["Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Chunyang Li", "Haoyue Wang", "Zhenxing Qian", "Sheng Li", "Xinpeng Zhang", "Jian Liu", "Yixuan Pei", "Weiqiang Wang"], "famous": [], "key_idea_en": "TIVDiff is a diffusion framework that generates identity-verifiable 'virtual faces' for privacy protection while embedding a reversible watermark that ties each output to its virtual identity for trustworthiness verification.", "summary_en": "Identifiable virtual face (IVF) generation replaces a user's face with one that looks and statistically differs from the original but remains recognizable, protecting privacy, yet existing schemes cannot verify the trustworthiness of the generated face and often suffer limited quality or controllability. TIVDiff is a diffusion-based framework that learns a virtual identity (VID) space through Virtual Identity Projection and synthesizes high-quality virtual faces conditioned on VID and 3D facial geometry so that pose and expression are preserved. An Identity-Guarded Generative Watermarking module reversibly binds the diffusion model's initial noise to the VID, embedding an imperceptible, verifiable cue in the generated face that supports legitimacy checks. Experiments show TIVDiff outperforms prior IVF generation schemes on image quality, identifiability, and trustworthiness, closing a trust gap in privacy-preserving face synthesis. Note that this is a generative-privacy and watermarking paper rather than a causal-inference paper; 'identifiable' here refers to identity verifiability, not causal identifiability.", "key_idea_ko": "TIVDiff는 privacy protection을 위해 identity 검증이 가능한 virtual face를 생성하는 diffusion framework로, 생성된 output을 virtual identity와 연결하는 reversible watermark를 내장하여 trustworthiness를 검증할 수 있게 한다.", "summary_ko": "문제는 Identifiable virtual face(IVF) generation 방법이 사용자의 얼굴을 시각적, 통계적으로 다르지만 여전히 인식 가능한 virtual face로 대체해 privacy를 보호하지만, 기존 scheme들은 생성된 face의 trustworthiness를 검증할 수 없고 quality나 controllability도 제한적인 경우가 많다는 점이다. 핵심 아이디어는 TIVDiff가 Virtual Identity Projection을 통해 virtual identity(VID) space를 학습하는 diffusion 기반 framework로, VID와 3D facial geometry에 conditioning하여 pose와 expression을 보존하면서 고품질 virtual face를 합성하는 것이다. 주요 기술적 결과는 Identity-Guarded Generative Watermarking module이 diffusion model의 initial noise를 VID에 reversible하게 binding하여 생성된 face에 legitimacy 확인을 위한 imperceptible하고 검증 가능한 단서를 내장하며, 실험 결과 TIVDiff가 image quality, identifiability, trustworthiness 측면에서 기존 IVF generation scheme들을 능가함을 보인 것이다. 이는 privacy-preserving face synthesis에서 존재하던 trust gap을 해소한다는 점에서 의미가 있다. 다만 이 논문은 causal-inference 논문이 아니라 generative-privacy 및 watermarking 논문이며, 여기서의 identifiable은 causal identifiability가 아니라 identity verifiability를 가리킨다.", "abstract": "Identifiable virtual face (IVF) generation aims to transform a user's original face into a virtual face for high utility privacy protection. The IVF is visually and statistically different from the original face, which can still be used for recognizing the user's identity. Despite the advantage, these schemes are unable to verify the trustworthiness of the IVF, the quality and controllability of which is often limited. To address these issues, we propose TIVDiff, a diffusion-based framework for trustworthy and identifiable virtual face generation. TIVDiff learns a virtual identity (VID) space via Virtual Identity Projection (VIP) and synthesizes high-quality virtual faces conditioned on VID and 3D facial geometry for pose and expression preservation. To enable the trustworthiness of IVF, we introduce Identity-Guarded Generative Watermarking (IGGW) to bind the diffusion initial noise with VID through a reversible mapping. This enables the embedding of an imperceptible cue into IVF for legitimacy verification. Experiments demonstrate the advantage of our TIVDiff over the state-of-the-art IVF generation schemes in terms of image quality, identifiability and trustworthiness."}, {"id": "65198", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "EvoCF: Multi-Agent Collaboration via Agentic Memory-Driven Evolutionary Counterfactual Planning", "url": "https://icml.cc/virtual/2026/poster/65198", "board": "Hall A #3814", "categories": ["Causal Reasoning in LLMs/Agents", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Haotian Chi", "Zeyu Feng", "Xingrui Yu", "Linbo Luo", "Yew Soon Ong", "Ivor Tsang", "Hechang Chen", "Yi Chang", "Haiyan Yin"], "famous": [], "key_idea_en": "EvoCF is an agentic memory-driven evolutionary counterfactual planning framework that improves multi-agent embodied collaboration by inducing symbolic constraints from failures and evolving plans through rule-conditioned counterfactual mutations.", "summary_en": "LLM-based planners for multi-agent embodied systems often fail to respect the physical and coordination constraints of real-world environments, producing short-sighted, one-shot plans. EvoCF addresses this by combining a symbolic constraint inductor that learns reusable rules from failures, an evolutionary counterfactual plan generator that mutates plans under those rules, and an agentic memory-grounded evaluator that ranks candidates using retrieval-augmented evidence. Across multi-agent embodied simulation benchmarks, EvoCF consistently discovers more robust and executable plans than baseline approaches. These results suggest that grounding multi-agent planning in counterfactual reasoning and accumulated memory, rather than single-shot LLM generation, meaningfully improves plan robustness and interpretability. The evaluation, however, is limited to simulation benchmarks and depends on the quality of the induced symbolic constraints and the memory-based evaluator.", "key_idea_ko": "EvoCF는 실패 사례로부터 symbolic constraint를 유도하고 rule-conditioned counterfactual mutation을 통해 계획을 진화시켜, agentic memory 기반의 evolutionary counterfactual planning으로 multi-agent embodied collaboration을 개선하는 framework이다.", "summary_ko": "LLM 기반 planner는 multi-agent embodied system에서 실제 환경의 물리적·협응 제약을 제대로 반영하지 못해 근시안적인 one-shot plan을 생성하는 경우가 많다. EvoCF는 실패로부터 재사용 가능한 규칙을 학습하는 symbolic constraint inductor, 그 규칙 하에서 계획을 변이시키는 evolutionary counterfactual plan generator, retrieval-augmented evidence로 후보를 평가하는 agentic memory 기반 evaluator를 결합한다. multi-agent embodied simulation benchmark 전반에서 EvoCF는 baseline 대비 더 robust하고 실행 가능한 plan을 일관되게 발견한다. 이는 single-shot LLM generation이 아니라 counterfactual reasoning과 축적된 memory에 기반해 planning을 수행하는 것이 plan의 robustness와 interpretability를 유의미하게 개선함을 보여준다. 평가는 simulation benchmark에 국한되며, 성능은 induced symbolic constraint의 품질과 memory 기반 evaluator에 의존한다.", "abstract": "Planning collaboration strategies for multi-agent embodied systems remains a core challenge for LLM-based planners, which often fail to capture the physical and coordination constraints of real-world environments. To address this, we present EvoCF, an agentic memory-driven evolutionary counterfactual planning framework for discovering improved multi-agent collaboration strategies through counterfactual plan generation and evaluation. First, we propose a symbolic constraint inductor that induces reusable symbolic constraints from failures, forming an evolving rule library. Then, we propose an evolutionary counterfactual plan generator that systematically explores semantically consistent plan variants through rule-conditioned mutations, enabling robust collaboration strategies beyond short-sighted one-shot LLM plans. Finally, we design an agentic memory-grounded evaluator that ranks candidate plans using retrieval-augmented evidence, producing interpretable, constraint-aware selections. Across multi-agent embodied simulation benchmarks, EvoCF consistently discovers more robust and executable plans compared to baseline approaches. Our results demonstrate that grounding multi-agent planning in agentic memory and counterfactual reasoning significantly enhances both effectiveness and robustness."}, {"id": "65690", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "What if Tomorrow is the World Cup Final? Counterfactual Time Series Forecasting with Textual Conditions", "url": "https://icml.cc/virtual/2026/poster/65690", "board": "Hall A #404", "categories": ["Time-Series Causality", "Counterfactual Inference"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Shuqi Gu", "Yongxiang Zhao", "Baoyu Jing", "Kan Ren"], "famous": [], "key_idea_en": "The paper introduces counterfactual time series forecasting conditioned on free-form text, along with an evaluation framework and a text-attribution mechanism that separates mutable from immutable factors to improve forecasts under hypothetical conditions.", "summary_en": "Time series forecasting methods typically rely on historical data or factual future conditions, largely ignoring counterfactual what-if scenarios, especially when those conditions are expressed in unstructured text. The authors introduce the task of counterfactual time series forecasting with textual conditions and propose a text-attribution mechanism that distinguishes mutable from immutable factors in the text to guide the forecast. They also build an evaluation framework spanning both factual and counterfactual settings that functions even without ground-truth counterfactual time series, and demonstrate improved forecast accuracy under complex, stochastic textual conditions. This extends forecasting beyond simple structured interventions to realistic, free-text what-if scenarios, such as asking what happens if the World Cup final falls tomorrow, broadening its applicability to real-world planning. Because counterfactual ground truth is generally unavailable, evaluation must rely on the proposed framework rather than direct comparison to true counterfactual outcomes, an inherent limitation of the setting.", "key_idea_ko": "자유 텍스트로 표현된 조건에 대해 counterfactual time series forecasting을 도입하고, mutable/immutable factor를 구분하는 text-attribution 메커니즘과 평가 프레임워크를 함께 제시한다.", "summary_ko": "time series forecasting은 미래 사건을 반영해야 하지만, 기존 방법들은 historical data나 factual future condition에 의존하여 비정형 텍스트로 표현된 counterfactual what-if 시나리오를 거의 다루지 못한다. 이 논문은 textual condition에 조건화된 counterfactual time series forecasting task를 새로 제안하고, 텍스트 내 mutable factor와 immutable factor를 구분하여 forecast를 유도하는 text-attribution 메커니즘을 제시한다. ground-truth counterfactual time series 없이도 factual/counterfactual 설정을 모두 다루는 평가 프레임워크를 구축하며, 복잡하고 stochastic한 textual condition 하에서 forecast 정확도가 향상됨을 보
