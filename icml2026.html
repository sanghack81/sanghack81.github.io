  }

  function paperDate(paper){
    return state.lang === "ko"
      ? (paper._dateKo || paper._dateEn || sessionDate(paper._session))
      : (paper._dateEn || paper._dateKo || sessionDate(paper._session));
  }

  function searchHaystack(paper){
    return [
      paper.title,
      paper.key_idea_en,
      paper.key_idea_ko,
      paper.summary_en,
      paper.summary_ko,
      paper.abstract,
      ...paper._authors
    ].join(" ").toLowerCase();
  }

  function matchesSearch(paper){
    if (!state.query) return true;
    return searchHaystack(paper).includes(state.query.toLowerCase());
  }

  function matchesCategory(paper){
    if (!state.categories.size) return true;
    return paper._categories.some(category => state.categories.has(category));
  }

  function matchesSession(paper){
    if (!state.sessions.size) return true;
    return state.sessions.has(paper._session);
  }

  function matchesNotable(paper){
    return !state.notableOnly || paper._famous.length > 0;
  }

  function matchesAll(paper){
    return matchesSearch(paper) && matchesCategory(paper) && matchesSession(paper) && matchesNotable(paper);
  }

  function highlighted(value){
    const source = String(value || "");
    const query = state.query;
    if (!query) return escapeHtml(source);
    const regex = new RegExp(escapeRegex(query), "ig");
    let output = "";
    let lastIndex = 0;
    source.replace(regex, (match, offset) => {
      output += escapeHtml(source.slice(lastIndex, offset));
      output += `<mark>${escapeHtml(match)}</mark>`;
      lastIndex = offset + match.length;
      return match;
    });
    output += escapeHtml(source.slice(lastIndex));
    return output;
  }

  function isFamousAuthor(paper, author){
    return paper._famousNames.has(normalizeName(author));
  }

  function authorHtml(paper){
    const t = text();
    const expanded = state.expandedAuthors.has(paper._id);
    const visibleIndexes = new Set();
    paper._authors.forEach((author, index) => {
      const matchesAuthorSearch = state.query && author.toLowerCase().includes(state.query.toLowerCase());
      if (expanded || index < AUTHORS_LIMIT || isFamousAuthor(paper, author) || matchesAuthorSearch) {
        visibleIndexes.add(index);
      }
    });
    const visible = paper._authors
      .map((author, index) => ({author, index}))
      .filter(item => visibleIndexes.has(item.index));
    const hiddenCount = paper._authors.length - visible.length;
    const pieces = visible.map(({author}) => {
      const famous = isFamousAuthor(paper, author);
      const content = famous
        ? `<strong class="famous-author">${highlighted(author)} <span class="star" aria-label="notable">⭐</span></strong>`
        : highlighted(author);
      return `<span class="author">${content}</span>`;
    });
    if (!expanded && hiddenCount > 0) {
      pieces.push(`<button class="author-more" type="button" data-action="authors" data-id="${escapeAttr(paper._id)}">${escapeHtml(t.moreAuthors(hiddenCount))}</button>`);
    } else if (expanded && paper._authors.length > AUTHORS_LIMIT) {
      pieces.push(`<button class="author-more" type="button" data-action="authors" data-id="${escapeAttr(paper._id)}">${escapeHtml(t.lessAuthors)}</button>`);
    }
    return pieces.join(", ");
  }

  function categoryTags(paper){
    return paper._categories
      .map(category => `<span class="tag tag-category"${styleVars({"--category-color":categoryColor(category)})}>${escapeHtml(category)}</span>`)
      .join("");
  }

  function methodFacetTags(paper){
    const t = text();
    const pieces = [];
    if (paper._estimands.length) {
      pieces.push(`<span class="facet-label">${escapeHtml(t.estimandLabel)}</span>`);
      paper._estimands.forEach(estimand => {
        pieces.push(`<span class="tag tag-facet">${escapeHtml(estimand)}</span>`);
      });
    }
    if (paper._treatmentType) {
      pieces.push(`<span class="tag tag-facet">${escapeHtml(t.treatmentTag(paper._treatmentType))}</span>`);
    }
    paper._discoveryTypes.forEach(method => {
      pieces.push(`<span class="tag tag-facet">${escapeHtml(method)}</span>`);
    });
    return pieces.length
      ? `<div class="tag-row tag-row-facets">${pieces.join("")}</div>`
      : "";
  }

  function cardHtml(paper){
    const t = text();
    const isOpen = state.expandedCards.has(paper._id);
    const panelId = `panel-${paper._id.replace(/[^A-Za-z0-9_-]/g, "-")}`;
    const time = paper._time || t.timeMissing;
    const date = paperDate(paper);
    const sessionTag = [`PS${paper._session}`, date, time].filter(Boolean).join(" · ");
    const dayColor = dayColorForSession(paper._session);
    const abstract = paper.abstract || "";
    return `<article class="paper-card${isOpen ? " is-open" : ""}"${styleVars({"--day-color":dayColor})} data-id="${escapeAttr(paper._id)}">
      <div class="card-hitbox" role="button" tabindex="0" data-action="toggle-card" data-id="${escapeAttr(paper._id)}" aria-expanded="${isOpen ? "true" : "false"}" aria-controls="${escapeAttr(panelId)}">
        <div class="board-badge" title="${escapeAttr(paper.board || "Hall A")}">
          <span class="board-number">${escapeHtml(boardNumber(paper.board))}</span>
          <span class="board-hall">Hall A</span>
        </div>
        <div class="card-main">
          <h3 class="card-title">${highlighted(paper.title)}</h3>
          <div class="tag-row">
            ${categoryTags(paper)}
            <span class="tag">${escapeHtml(sessionTag)}</span>
          </div>
          ${methodFacetTags(paper)}
          <p class="authors">${authorHtml(paper)}</p>
          <p class="idea">${highlighted(keyIdea(paper))}</p>
        </div>
        <span class="expand-indicator" aria-hidden="true">⌄</span>
      </div>
      <div class="details-panel" id="${escapeAttr(panelId)}" aria-hidden="${isOpen ? "false" : "true"}">
        <div class="details-inner">
          <div class="details-content">
            <h3>${escapeHtml(t.summaryHeading)}</h3>
            <p>${highlighted(summary(paper))}</p>
            <h3>${escapeHtml(t.abstractHeading)}</h3>
            <p class="abstract">${highlighted(abstract)}</p>
            <a class="open-link" href="${escapeAttr(paper.url || "#")}" target="_blank" rel="noopener" ${isOpen ? "" : "tabindex=\"-1\""}>${escapeHtml(t.open)}</a>
          </div>
        </div>
      </div>
    </article>`;
  }

  function countForCategory(category){
    return PAPERS.filter(paper =>
      paper._categories.includes(category) &&
      matchesSearch(paper) &&
      matchesSession(paper) &&
      matchesNotable(paper)
    ).length;
  }

  function countForSession(session){
    return PAPERS.filter(paper =>
      paper._session === session &&
      matchesSearch(paper) &&
      matchesCategory(paper) &&
      matchesNotable(paper)
    ).length;
  }

  function renderChrome(){
    const t = text();
    els.root.lang = state.lang;
    els.eyebrow.textContent = t.eyebrow;
    els.pageTitle.textContent = t.title;
    els.searchLabel.textContent = t.searchLabel;
    els.searchInput.placeholder = t.searchPlaceholder;
    els.categoryLabel.textContent = t.topics;
    els.sessionLabel.textContent = t.sessions;
    els.notableOnly.textContent = t.notableOnly;
    els.notableOnly.classList.toggle("is-active", state.notableOnly);
    els.notableOnly.setAttribute("aria-pressed", String(state.notableOnly));
    els.clearFilters.textContent = t.clear;
    els.clearFilters.hidden = !activeFilters();
    els.emptyState.textContent = t.empty;
    els.footerNote.textContent = t.footer;
    els.overviewStrip.setAttribute("aria-label", t.overviewLabel);
    els.groupMode.querySelector('[data-group="session"]').textContent = t.groupSession;
    els.groupMode.querySelector('[data-group="category"]').textContent = t.groupCategory;
    els.groupMode.querySelectorAll("button").forEach(button => {
      button.classList.toggle("is-active", button.dataset.group === state.group);
    });
    els.langMode.querySelectorAll("button").forEach(button => {
      button.classList.toggle("is-active", button.dataset.lang === state.lang);
    });
    updateThemeButton();
  }

  function renderOverview(){
    const t = text();
    els.overviewStrip.innerHTML = SESSION_IDS.map(session => {
      const meta = sessionMeta.get(session) || {time:"", total:0};
      const time = meta.time || t.timeMissing;
      const date = sessionDate(session);
      const count = meta.total || 0;
      const dayColor = dayColorForSession(session);
      return `<a class="overview-tile day-accent"${styleVars({"--day-color":dayColor})} href="#ps${session}" data-jump-session="${session}" aria-label="${escapeAttr(t.overviewAria(session, date, time, count))}">
        <span class="overview-top"><span class="overview-ps">PS${session}</span><span class="overview-count">${count}</span></span>
        ${date ? `<span class="overview-date">${escapeHtml(date)}</span>` : ""}
        <span class="overview-time">${escapeHtml(time)}</span>
      </a>`;
    }).join("");
  }

  function renderFilters(){
    els.categoryChips.innerHTML = CATEGORIES.map(category => {
      const selected = state.categories.has(category);
      const count = countForCategory(category);
      return `<button class="chip chip-category${selected ? " is-active" : ""}"${styleVars({"--category-color":categoryColor(category)})} type="button" data-category="${escapeAttr(category)}" aria-pressed="${selected ? "true" : "false"}">
        <span class="chip-label">${escapeHtml(category)}</span>
        <span class="chip-count">${count}</span>
      </button>`;
    }).join("");
    els.sessionChips.innerHTML = SESSION_IDS.map(session => {
      const selected = state.sessions.has(session);
      const count = countForSession(session);
      return `<button class="chip${selected ? " is-active" : ""}" type="button" data-session="${session}" aria-pressed="${selected ? "true" : "false"}">
        <span class="chip-label">PS${session}</span>
        <span class="chip-count">${count}</span>
      </button>`;
    }).join("");
  }

  function renderResults(){
    const t = text();
    const shown = PAPERS.filter(matchesAll);
    els.resultCount.textContent = t.result(shown.length, PAPERS.length);
    els.notableStat.textContent = t.notableStat(totalNotablePapers, Number(DATA.notable_count) || 0);
    els.emptyState.hidden = shown.length !== 0;

    if (state.group === "session") {
      els.paperList.innerHTML = SESSION_IDS.map(session => {
        const meta = sessionMeta.get(session) || {time:""};
        const time = meta.time || t.timeMissing;
        const date = sessionDate(session);
        const group = shown.filter(paper => paper._session === session);
        const dayColor = dayColorForSession(session);
        const cards = group.length
          ? group.map(cardHtml).join("")
          : `<p class="section-empty">${escapeHtml(t.sectionEmpty)}</p>`;
        return `<section class="group session-group" id="ps${session}">
          <div class="group-head day-accent"${styleVars({"--day-color":dayColor})}>
            <h2 class="group-title">${escapeHtml(t.sessionTitle(session))}</h2>
            <span class="group-meta">${escapeHtml(t.sessionMeta(date, time, group.length))}</span>
          </div>
          ${cards}
        </section>`;
      }).join("");
      return;
    }

    els.paperList.innerHTML = CATEGORIES.map(category => {
      const group = shown.filter(paper => paper._categories.includes(category));
      if (!group.length) return "";
      return `<section class="group">
        <div class="group-head">
          <h2 class="group-title">${escapeHtml(category)}</h2>
          <span class="group-meta">${escapeHtml(t.topicMeta(group.length))}</span>
        </div>
        ${group.map(cardHtml).join("")}
      </section>`;
    }).join("");
  }

  function render(){
    renderChrome();
    renderOverview();
    renderFilters();
    renderResults();
    window.requestAnimationFrame(updateStickyOffset);
  }

  function toggleSetValue(set, value){
    if (set.has(value)) set.delete(value);
    else set.add(value);
  }

  function toggleCard(article){
    const id = article.dataset.id;
    const open = !article.classList.contains("is-open");
    article.classList.toggle("is-open", open);
    if (open) state.expandedCards.add(id);
    else state.expandedCards.delete(id);
    const hitbox = article.querySelector('[data-action="toggle-card"]');
    const panel = article.querySelector(".details-panel");
    const link = article.querySelector(".open-link");
    if (hitbox) hitbox.setAttribute("aria-expanded", open ? "true" : "false");
    if (panel) panel.setAttribute("aria-hidden", open ? "false" : "true");
    if (link) {
      if (open) link.removeAttribute("tabindex");
      else link.setAttribute("tabindex", "-1");
    }
  }

  function jumpToSession(session){
    if (state.group !== "session") {
      state.group = "session";
      render();
    }
    window.requestAnimationFrame(() => {
      updateStickyOffset();
      const target = document.getElementById(`ps${session}`);
      if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
      try {
        history.replaceState(null, "", `#ps${session}`);
      } catch (error) {
        window.location.hash = `ps${session}`;
      }
    });
  }

  els.themeToggle.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    els.root.setAttribute("data-theme", next);
    updateThemeButton();
  });

  if (themeQuery && themeQuery.addEventListener) {
    themeQuery.addEventListener("change", () => {
      if (!els.root.getAttribute("data-theme")) updateThemeButton();
    });
  }

  els.langMode.addEventListener("click", event => {
    const button = event.target.closest("[data-lang]");
    if (!button) return;
    state.lang = button.dataset.lang === "en" ? "en" : "ko";
    render();
  });

  els.groupMode.addEventListener("click", event => {
    const button = event.target.closest("[data-group]");
    if (!button) return;
    state.group = button.dataset.group === "category" ? "category" : "session";
    render();
  });

  els.searchInput.addEventListener("input", event => {
    state.query = event.target.value.trim();
    render();
  });

  els.notableOnly.addEventListener("click", () => {
    state.notableOnly = !state.notableOnly;
    render();
  });

  els.clearFilters.addEventListener("click", () => {
    state.query = "";
    state.categories.clear();
    state.sessions.clear();
    state.notableOnly = false;
    els.searchInput.value = "";
    render();
  });

  els.categoryChips.addEventListener("click", event => {
    const button = event.target.closest("[data-category]");
    if (!button) return;
    toggleSetValue(state.categories, button.dataset.category);
    render();
  });

  els.sessionChips.addEventListener("click", event => {
    const button = event.target.closest("[data-session]");
    if (!button) return;
    toggleSetValue(state.sessions, Number(button.dataset.session));
    render();
  });

  els.overviewStrip.addEventListener("click", event => {
    const link = event.target.closest("[data-jump-session]");
    if (!link) return;
    event.preventDefault();
    jumpToSession(Number(link.dataset.jumpSession));
  });

  els.paperList.addEventListener("click", event => {
    const authorButton = event.target.closest('[data-action="authors"]');
    if (authorButton) {
      event.preventDefault();
      event.stopPropagation();
      toggleSetValue(state.expandedAuthors, authorButton.dataset.id);
      render();
      return;
    }
    const hitbox = event.target.closest('[data-action="toggle-card"]');
    if (!hitbox) return;
    const article = hitbox.closest(".paper-card");
    if (article) toggleCard(article);
  });

  els.paperList.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    const hitbox = event.target.closest('[data-action="toggle-card"]');
    if (!hitbox || event.target !== hitbox) return;
    event.preventDefault();
    const article = hitbox.closest(".paper-card");
    if (article) toggleCard(article);
  });

  window.addEventListener("resize", updateStickyOffset);

  render();

  const hashMatch = window.location.hash.match(/^#ps([1-8])$/);
  if (hashMatch) jumpToSession(Number(hashMatch[1]));
})();
</script>
</body>
</html>
