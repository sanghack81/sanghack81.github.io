Power-Boosted Granger-Causal Discovery for Large Heterogeneous Panel Data", "url": "https://icml.cc/virtual/2026/poster/60673", "board": "Hall A #4007", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Yiheng Gu", "Xiufan Yu"], "famous": [], "key_idea_en": "PE-PGCT is a power-enhancement wrapper that can be layered on top of any existing panel Granger non-causality test to substantially boost statistical power in heterogeneous, high-dimensional panel data, especially under sparse causal signals.", "summary_en": "Testing for Granger non-causality in heterogeneous, potentially high-dimensional panel data suffers from low statistical power, particularly when the number of cross-sectional units exceeds the number of time points and causal signals are sparsely distributed. The proposed power-enhanced panel Granger causality test, PE-PGCT, is built as an add-on component that augments any existing panel Granger non-causality test rather than replacing it. A rigorous asymptotic analysis shows that the power-enhancement component induces negligible size distortion under the null while delivering significant power gains under the alternative, with the largest gains in high-dimensional, sparse-signal regimes. This makes Granger causality testing practical and reliable for modern large panel datasets, where existing tests often fail to detect real causal signals. The guarantees are asymptotic and validated via simulation plus a single real-world application, and the method's benefit depends on being paired with a suitable base panel Granger non-causality test.", "key_idea_ko": "기존의 어떠한 panel Granger non-causality test 위에도 얹을 수 있는 power-enhancement wrapper(PE-PGCT)를 제안하여, 이질적이고 고차원인 panel data, 특히 causal signal이 sparse한 경우 statistical power를 크게 향상시킨다.", "summary_ko": "이질적이고 잠재적으로 고차원인 panel data에서 Granger non-causality를 검정하는 것은 낮은 statistical power 문제를 겪으며, 특히 cross-sectional unit 수가 시점 수를 초과하고 causal signal이 sparse하게 분포된 경우 더욱 그러하다. 핵심 아이디어는 기존의 어떤 panel Granger non-causality test도 대체하지 않고 보강할 수 있는 add-on component로 구성된 power-enhanced panel Granger causality test(PE-PGCT)이다. 주요 기술적 결과는 이 power-enhancement component가 null 하에서는 무시할 만한 size distortion만 유발하면서 alternative 하에서는 유의미한 power 향상을 제공하며, 그 향상 폭이 고차원이고 signal이 sparse한 영역에서 가장 크다는 것을 보이는 엄밀한 asymptotic 분석이다. 이는 기존 검정들이 실제 causal signal을 탐지하지 못하는 경우가 많은 현대의 대규모 panel dataset에서 Granger causality testing을 실용적이고 신뢰할 수 있게 만든다는 점에서 중요하다. 보장은 asymptotic한 것으로 simulation과 단일 real-world application을 통해 검증되었으며, 방법의 이점은 적절한 base panel Granger non-causality test와 결합되었을 때에 한해 나타난다.", "abstract": "This paper proposes a power-enhanced panel Granger causality test (PE-PGCT) for assessing the Granger non-causality in heterogeneous and potentially high-dimensional panel data. Building on any existing panel Granger non-causality test, we show, both theoretically and empirically, that the proposed PE-PGCT boosts its power substantially. The power gains are particularly significant in situations of high-dimensional panels when the cross-sectional dimension exceeds the time dimension, as well as under sparse alternatives when the signals are sparsely distributed across panel units. We establish rigorous theoretical guarantees on the asymptotic behavior of the proposed power enhancement component, demonstrating attractive power enhancement properties that it induces negligible size distortion under the null hypothesis while delivering significant power gain under the alternatives. The empirical performances are illustrated via extensive simulation studies, as well as a real-world application."}, {"id": "64953", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "TopoDistill: Distilling Global System Topology for Causal Discovery in Multivariate Time Series", "url": "https://icml.cc/virtual/2026/poster/64953", "board": "Hall A #414", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zehao Liu", "Pengfei Jiao", "Yuhan Wu", "Jianqi Yang", "Yuyu Yin"], "famous": [], "key_idea_en": "TopoDistill improves noisy convergent-cross-mapping causal discovery in multivariate time series by distilling the neighborhood topology of a multivariate global embedding into the univariate delay-embedded shadow manifold used for cross-mapping.", "summary_en": "Convergent cross mapping (CCM) discovers causality in multivariate time series by reconstructing shadow manifolds via time-delay embedding and measuring cross-map skill, but under noise the single-view time-delay embedding often yields geometrically degraded manifolds with unreliable neighborhoods, weakening causal identification even though Takens' theorem holds in ideal conditions. TopoDistill addresses this through topology-informed knowledge distillation, in which a global embedder trained on the full multivariate observations learns a global attractor representation, and a delay embedder operating on a single noisy view is distilled to match its neighborhood-distribution topology to that global representation. This cross-view alignment produces smoother, more reliable neighborhoods for cross mapping, improving robustness to noise while retaining specificity against spurious correlations. This matters because it directly targets the noise-sensitivity weakness of a widely used time-series causal discovery method rather than replacing it outright. The approach is validated with theoretical analysis and experiments, but relies on having a suitable multivariate view available at training time to serve as the distillation target.", "key_idea_ko": "TopoDistill은 multivariate global embedding의 neighborhood topology를 cross-mapping에 사용되는 univariate delay-embedded shadow manifold로 distill함으로써, multivariate 시계열에서 noisy한 convergent-cross-mapping 기반 causal discovery를 개선한다.", "summary_ko": "Convergent cross mapping(CCM)은 time-delay embedding으로 shadow manifold를 재구성하고 cross-map skill을 측정하여 multivariate 시계열에서 causality를 discover하지만, Takens' theorem이 이상적 조건에서 성립함에도 noise 하에서는 single-view time-delay embedding이 기하학적으로 열화된 manifold와 신뢰할 수 없는 neighborhood를 만들어 causal identification을 약화시킨다. TopoDistill은 topology-informed knowledge distillation으로 이를 해결하는데, 전체 multivariate 관측치로 학습된 global embedder가 global attractor representation을 학습하고, 단일 noisy view에서 작동하는 delay embedder는 이 global representation의 neighborhood-distribution topology에 맞도록 distill된다. 이러한 cross-view alignment는 cross mapping을 위한 더 매끄럽고 신뢰할 수 있는 neighborhood를 만들어, spurious correlation에 대한 specificity를 유지하면서 noise에 대한 robustness를 향상시킨다. 이는 널리 쓰이는 시계열 causal discovery 방법의 noise-sensitivity 약점을 완전히 대체하는 대신 직접 겨냥한다는 점에서 의의가 있다. 이 접근법은 이론적 분석과 실험으로 검증되었으나, 학습 시점에 distillation target으로 사용할 적절한 multivariate view가 있어야 한다는 전제에 의존한다.", "abstract": "Although causal discovery from multivariate time series is widely used, it remains challenging under noise. Convergent cross mapping (CCM) infers causality by reconstructing shadow manifolds via time-delay embedding (TDE) and evaluating cross-map skill between manifolds. Despite Takens' theorem guarantees in ideal settings, TDE effectively attempts to recover system state from a single noisy view, often yielding geometrically degraded manifolds and unreliable distance-based neighborhoods, which in turn weakens causal identification. We propose TopoDistill, a topology-informed knowledge distillation framework that improves univariate shadow-manifold reconstruction by aligning local neighborhood structure to a multivariate system representation. A global embedder trained on multivariate observations captures a global attractor representation, while a delay embedder is distilled to produce embeddings whose neighborhood distributions match the global topology. This cross-view alignment yields smoother and more reliable neighborhoods, improving cross mapping under noise while maintaining specificity against spurious correlations. Theoretical analysis and experimental results demonstrate that our method enables effective causal discovery."}, {"id": "68776", "session": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Physics-Aware Spatiotemporal Causal Graph Network for Forecasting with Limited Data", "url": "https://icml.cc/virtual/2026/poster/68776", "board": "Hall A #4608", "categories": ["Time-Series Causality", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zijun Cui", "Sam Griesemer", "Sungyong Seo", "Joshua Hikida", "Yan Liu"], "famous": [], "key_idea_en": "P-STCGN learns a causal graph from spatiotemporal data using physics-derived relationships as labels, then forecasts using a module conditioned on that learned causal structure.", "summary_en": "Spatiotemporal forecasting models benefit from physics-based inductive biases, such as laws or symmetries, for interpretability, robustness, and performance under limited data, yet principled ways to encode physical dynamics as explicit causal structure, rather than generic constraints, remain scarce. P-STCGN fills this gap by deriving causal relationships from spatiotemporal data as physics-aware labels to train a dedicated neural module for causal structure learning, then forecasting using a module that operates under this learned causal structure. The model proves robust to noisy and limited data, outperforming existing models on a variety of synthetic tasks and benchmark datasets, and shows superior forecasting on real-world graph signals. This offers a way to fuse physics domain knowledge with causal graph learning to improve forecasting robustness when data is scarce. Its applicability, however, depends on having relevant physics equations or domain knowledge available to derive the causal labels, limiting use in domains that lack such priors.", "key_idea_ko": "P-STCGN은 physics로부터 유도된 관계를 label로 사용해 spatiotemporal data로부터 causal graph를 학습한 뒤, 그 학습된 causal structure에 조건화된 module로 forecasting을 수행한다.", "summary_ko": "spatiotemporal forecasting model은 interpretability, robustness, limited data 하에서의 성능을 위해 physics 기반 inductive bias(법칙이나 대칭성)로부터 이득을 얻지만, 물리적 dynamics를 generic한 constraint가 아니라 explicit한 causal structure로 encoding하는 원칙적인 방법에는 gap이 있다. 이 논문의 핵심은 spatiotemporal data로부터 physics-aware label로서 causal relationship을 도출하여 causal structure learning을 위한 전용 neural module을 학습시킨 뒤, 이 학습된 causal structure 하에서 동작하는 module로 forecasting을 수행하는 physics-aware spatiotemporal causal graph network(P-STCGN)이다. P-STCGN은 noisy하고 limited한 data에 robust하며, 다양한 synthetic task와 benchmark dataset에서 기존 model을 능가하고 real-world graph signal에서도 우수한 forecasting 성능을 보인다. data가 부족할 때 forecasting robustness를 개선하기 위해 physics domain knowledge와 causal graph learning을 결합하는 방법을 제공한다는 점에서 의의가 있다. causal label을 도출할 관련 physics equation이나 domain knowledge가 있어야 적용 가능하므로, 그러한 prior가 없는 domain에서는 사용이 제한된다.", "abstract": "Spatiotemporal models have drawn significant interest recently due to their widespread applicability across many domains. These models are often made more practically useful by incorporating beneficial inductive biases, such as laws or symmetries from domain-relevant physics equations. This physics-awareness provides an interpretable means of grounding otherwise purely data-driven models, improving robustness and boosting performance in settings with limited data. In this work, we view physical dynamics as domain knowledge that captures fundamental causal relationships across space and time, and can be effectively leveraged by our proposed physics-aware spatiotemporal causal graph network (P-STCGN). We firstly describe a means of deriving causal relationships from spatiotemporal data, serving as physics-aware labels to learn a causal structure via a dedicated neural module. We then formulate a forecasting module that can operate under this causal structure, producing predictions that are guided by physics-aware cause-effect relationships among modeled variables. Extensive experimentation demonstrates that our method is robust to noisy and limited data, outperforming existing models across a variety of challenging synthetic tasks and benchmark datasets. We further evaluate our method on real-world graph signals and observe superior forecasting performance, achieved by effectively utilizing causal signals from prior physics knowledge."}, {"id": "63530", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "CausalGame: Benchmarking Causal Thinking of LLM Agents in Games", "url": "https://icml.cc/virtual/2026/poster/63530", "board": "Hall A #3609", "categories": ["Causal Reasoning in LLMs/Agents", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zhenhao Chen", "Yongqiang Chen", "Chenxi Liu", "Junchi Yu", "Xiangchen Song", "Zijian Li", "Jialin Li", "Phil Torr", "Bo Han", "Kun Zhang"], "famous": ["Kun Zhang"], "key_idea_en": "CausalGame is an interactive-game benchmark that tests whether LLM agents can design experiments and infer the true causal structure in the presence of selection bias, noise, and hidden confounders.", "summary_en": "Building AI Scientist agents requires genuine causal thinking to distinguish causation from correlation and hidden bias, yet existing AI-scientist benchmarks largely ignore the hidden biases and confounders pervasive in real scientific discovery. CausalGame has LLM agents actively design experimental protocols, collect observational data, and produce a final causal solution with an explanation report, across 14 game settings incorporating selection bias, noisy measurements, and hidden confounders. Testing 16 frontier LLM agents shows they consistently fail to reason about and recover the true underlying causal relationships needed to solve the games. The benchmark exposes a fundamental gap in current LLM agents' causal experimental-design and inference abilities, a capability considered essential for autonomous scientific discovery. The evaluation covers 14 synthetic game settings, which may not capture the full complexity of causal confounding encountered in real scientific domains.", "key_idea_ko": "CausalGame은 selection bias, noise, hidden confounder가 존재하는 상황에서 LLM agent가 실험을 설계하고 참된 causal structure를 추론할 수 있는지 평가하는 interactive game benchmark다.", "summary_ko": "AI Scientist agent를 구축하려면 causation과 correlation, hidden bias를 구분하는 진정한 causal thinking이 필요하지만, 기존 AI-scientist benchmark들은 실제 과학적 발견 과정에 만연한 hidden bias와 confounder를 반영하지 못한다. CausalGame에서는 LLM agent가 실험 프로토콜을 능동적으로 설계하고 observational data를 수집한 뒤, selection bias, noisy measurement, hidden confounder를 포함한 14가지 game setting 전반에서 최종 causal solution과 설명 report를 산출하도록 한다. 16개의 frontier LLM agent를 테스트한 결과, 이들은 game을 풀기 위해 필요한 참된 causal relationship을 추론하고 복원하는 데 일관되게 실패한다. 이 benchmark는 autonomous scientific discovery에 필수적이라고 여겨지는 능력인 causal experimental-design 및 inference 능력에서 현재 LLM agent들이 갖는 근본적인 격차를 드러낸다는 의의가 있다. 평가는 14개의 synthetic game setting으로 구성되어 있어, 실제 과학 domain에서 마주치는 causal confounding의 전체 복잡성을 포착하지 못할 수 있다.", "abstract": "Recently, it has received growing attention in building AI Scientist agents with Large Language Models (LLMs). Since scientific discovery fundamentally relies on uncovering causal relationships from observations, the capability of causal thinking that distinguish causation from correlation and hidden biases, is essential to LLM agents. Despite a number of existing benchmarks for AI scientists, none of them are designed with the consideration of hidden biases and confounders, that widely exist in real-world scientific discovery. To this end, we present CausalGame, a benchmark that evaluates the causal thinking capabilities of LLM agents through interactive games. More specifically, we ask LLM agents to actively design experimental protocols, collect observation data and derive a final solution with an explanation report. To emulate realistic scientific discovery challenges, we design 14 game settings with the incorporation of selection bias, noisy measurements, and hidden confounders. The results with 16 frontier LLM agents show that they consistently fail to reason about and recover the underlying causal relationships required to solve the games. CausalGame provides a rigorous measurement of capabilities essential to AI Scientist agents."}, {"id": "60883", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Grounding Multi-Hop Reasoning in Structural Causal Models via Group Relative Policy Optimization", "url": "https://icml.cc/virtual/2026/poster/60883", "board": "Hall A #108", "categories": ["Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yunhan Bu", "Quan Zhang", "Zhang Huaping", "Guotong Geng", "Chunxiao Gao", "Askar Hamdulla", "Juan Wang", "Qiuchi Li", "Baohua Zhang", "Yunbo Cao", "Zhunchen Luo", "Shuai Lei"], "famous": [], "key_idea_en": "SCM-GRPO grounds multi-hop fact verification in a structural causal model and uses GRPO-based reinforcement learning to balance reasoning-chain depth against conciseness, improving both accuracy and interpretability.", "summary_en": "Multi-hop fact verification requires reasoning over disparate evidence, and LLMs relying on chain-of-thought often hallucinate or produce fractured logical chains because CoT does not explicitly model causal dependencies between evidence and claims. The authors ground verification in a structural causal model, treating it as a constructive causal inference process, and empirically observe an inverted-U-shaped relationship between reasoning-chain length and accuracy. They propose a rule-based reinforcement learning strategy using Group Relative Policy Optimization (GRPO) that dynamically trades structural depth off against conciseness, and show the resulting SCM-GRPO framework outperforms state-of-the-art baselines on HoVer and EX-FEVER. This offers a more interpretable and reliable route to multi-hop fact verification by making the causal structure of the reasoning process explicit rather than implicit in free-form CoT. Evaluation is limited to two fact-verification benchmarks, so generalization to other multi-hop reasoning tasks is not shown.", "key_idea_ko": "SCM-GRPO는 multi-hop fact verification을 structural causal model에 근거시키고 GRPO 기반 reinforcement learning을 이용해 reasoning-chain depth와 conciseness 사이의 균형을 맞춤으로써 accuracy와 interpretability를 향상시킨다.", "summary_ko": "multi-hop fact verification은 서로 다른 evidence에 대한 복잡한 reasoning을 요구하는데, chain-of-thought(CoT)로 이를 수행하는 LLM은 evidence와 claim 사이의 causal dependency를 explicit하게 모델링하지 않기 때문에 hallucinate하거나 단절된 logical chain을 만들어내는 경우가 많다. 저자들은 verification을 constructive causal inference process로 취급하여 structural causal model에 근거시키고, reasoning-chain length와 accuracy 사이에 inverted U-shaped 관계가 있음을 empirical하게 관찰한다. 이들은 structural depth와 conciseness를 동적으로 절충하는 Group Relative Policy Optimization(GRPO) 기반 rule-based reinforcement learning 전략을 제안하며, 이렇게 만들어진 SCM-GRPO framework가 HoVer와 EX-FEVER에서 state-of-the-art baseline을 능가함을 보인다. 이는 reasoning process의 causal structure를 free-form CoT에서처럼 암묵적으로 두지 않고 explicit하게 만듦으로써, multi-hop fact verification에 더 interpretable하고 reliable한 경로를 제공한다는 점에서 의의가 있다. 평가는 두 개의 fact-verification benchmark로 한정되어 있어, 다른 multi-hop reasoning task로의 generalization은 보여지지 않는다.", "abstract": "Multi-Hop Fact Verification (MHFV) necessitates complex reasoning across disparate evidence, posing significant challenges for Large Language Models (LLMs) which often suffer from hallucinations and fractured logical chains. Existing methods, while improving transparency via Chain-of-Thought (CoT), lack explicit modeling of the causal dependencies between evidence and claims. In this work, we introduce a novel framework that grounds reasoning in a Structural Causal Model (SCM), treating verification as a constructive causal inference process. We empirically identify an \"inverted U-shaped\" correlation between reasoning chain length and accuracy, revealing that excessive structural complexity degrades performance. To address this, we propose a Rule-based Reinforcement Learning strategy using Group Relative Policy Optimization (GRPO). This approach dynamically optimizes the trade-off between structural depth and conciseness. Extensive experiments on HoVer and EX-FEVER demonstrate that our SCM-GRPO framework significantly outperforms state-of-the-art baselines, offering a reliable and interpretable solution for complex fact verification."}, {"id": "64247", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Causal Dependency-Aware Unsupervised Routing for Large Reasoning Models", "url": "https://icml.cc/virtual/2026/poster/64247", "board": "Hall A #2910", "categories": ["Causal Reasoning in LLMs/Agents", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Jiacheng Liu", "Hao Liu", "Xiaofeng Hou", "Wei Xue", "Yike Guo"], "famous": [], "key_idea_en": "ReasoningRouter is an unsupervised LLM router that models the causal 'thinking to answer' structure of large reasoning models via a length-balanced embedding and a Causal Triangulation Property enabling label-free estimation of component qualities.", "summary_en": "Routing queries to the best LLM in a diverse pool without expensive human-annotated preference data is difficult, and supervised routers tend to be brittle under distribution shift, a problem worsened for large reasoning models whose long 'thinking' text can dominate the final answer signal in label-free methods. ReasoningRouter addresses this with a length-balanced embedding strategy and a probabilistic model that explicitly captures the causal dependency between thinking and answering. Its central theoretical contribution, the Causal Triangulation Property, enables label-free estimation of the quality of the reasoning and answer components and of their causal link. The result is an unsupervised, adaptable router that achieves competitive accuracy while also providing interpretable, separate quality assessments of reasoning versus final answers, at low computational cost. The approach is specific to routing among reasoning-capable LLMs and depends on the validity of the assumed causal thinking-answer structure.", "key_idea_ko": "대규모 reasoning 모델의 'thinking to answer' causal 구조를 length-balanced embedding과 Causal Triangulation Property로 모델링하여, label 없이 unsupervised하게 각 구성 요소의 quality를 추정하는 LLM router인 ReasoningRouter를 제안한다.", "summary_ko": "비용이 큰 human-annotated preference data 없이 다양한 LLM pool 중 최적의 모델로 query를 routing해야 하는데, supervised router는 distribution shift에 취약하고, Large Reasoning Model의 경우 긴 thinking text가 label-free 방법에서 최종 answer 신호를 압도하는 문제가 있다. ReasoningRouter는 length-balanced embedding 전략과 thinking에서 answer로 이어지는 causal dependency를 명시적으로 포착하는 probabilistic model을 사용한다. Causal Triangulation Property라는 이론적 결과를 통해 reasoning과 answer 구성 요소의 quality 및 이들 간 causal link를 label 없이 추정할 수 있음을 보인다. 이를 통해 unsupervised하면서도 adaptable한 router를 얻으며, 경쟁력 있는 정확도와 함께 reasoning과 final answer에 대한 해석 가능하고 분리된 quality 평가를 낮은 계산 비용으로 제공한다. 이 접근은 reasoning 능력을 갖춘 LLM들 간 routing에 특화되어 있으며, 가정된 causal thinking-answer 구조의 타당성에 의존한다.", "abstract": "As Large Language Model (LLM) ecosystems grow, routing queries to the most suitable model in a diverse pool has become a critical strategy for building efficient and high-performing AI systems. A common approach is to train a supervised router; however, this requires vast, expensive human-annotated preference data and creates models that are notoriously brittle, failing to generalize when faced with inevitable distribution shifts in user queries. Consequently, developing robust, unsupervised routing methods that adapt without retraining is a crucial research frontier. This challenge is severely amplified by Large Reasoning Models (LRMs), which introduce a dual problem for any label-free method: their outputs have a causal 'thinking' to 'answer' structure that must be modeled, and a structural imbalance where long reasoning text can dominate the final answer signal. We introduce ReasoningRouter, a novel framework that resolves these issues with a length-balanced embedding strategy and a probabilistic model capturing the thinking-to-answer dependency. Our key theoretical advance, the Causal Triangulation Property, enables the label-free estimation of component qualities and their causal link. Beyond competitive routing accuracy, ReasoningRouter offers unprecedented insights into model behavior, enabling separate quality assessment of reasoning and answer components while maintaining computational efficiency. The code is provided in the supplementary materials."}, {"id": "66456", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "CARE: Confounder-Aware Aggregation for Reliable LLM Evaluation", "url": "https://icml.cc/virtual/2026/poster/66456", "board": "Hall A #4008", "categories": ["Confounding & Deconfounding", "Causal Reasoning in LLMs/Agents", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Jitian Zhao", "Changho Shin", "Tzu-Heng Huang", "Satya Sai Srinath Namburi GNVV", "Frederic Sala"], "famous": [], "key_idea_en": "CARE aggregates LLM-judge ensembles by modeling each judge's score as a mix of a latent true-quality signal and shared confounders, recovering quality with identifiability guarantees and no ground-truth labels.", "summary_en": "LLM-as-a-judge ensembles are now standard for scalable evaluation, but common aggregation rules such as majority vote or averaging assume judges err independently, when in practice judges share correlated biases - verbosity, style, training artifacts - that these rules can amplify rather than cancel out. CARE instead models each judge's score as arising from a latent true-quality signal plus shared confounding factors, and separates the two without any ground-truth labels, rather than heuristically re-weighting judges. The authors prove identifiability and finite-sample recovery guarantees under shared confounding, quantify the bias that confounder-blind aggregation incurs, and show CARE cuts aggregation error by up to 26.8% across 12 public benchmarks spanning scoring, classification, and pairwise-preference settings. By reframing judge aggregation as a principled deconfounding problem, the approach improves evaluation reliability without any added human-labeling cost. Its guarantees hold under the assumption that the latent-factor model adequately captures the confounding at play, and the empirical gains are demonstrated on the 12 tested benchmarks rather than established as universal.", "key_idea_ko": "CARE는 LLM-judge ensemble을 위한 confounder-aware aggregation framework로, judge score를 latent true-quality signal과 shared confounder의 혼합으로 모델링하여 ground-truth label 없이도 identifiability guarantee와 함께 quality를 복원한다.", "summary_ko": "문제는 LLM-as-a-judge ensemble이 scalable evaluation의 표준 방법이지만, majority vote나 averaging 같은 흔한 aggregation rule은 judge들이 독립적으로 오류를 낸다고 가정하는 반면 실제 judge들은 verbosity, style, training artifact 같은 correlated bias를 공유하여 이러한 rule이 오히려 bias를 증폭시킬 수 있다는 점이다. 핵심 아이디어는 judge를 heuristic하게 재가중하는 대신, 각 judge의 score를 latent true-quality signal과 shared confounding factor의 합으로 explicit하게 모델링하고 ground-truth label 없이 이 둘을 분리하는 것이다. 주요 기술적 결과는 shared confounder 하에서의 theoretical identifiability와 finite-sample recovery guarantee를 제시하고 confounder-blind aggregation이 초래하는 bias를 정량화하며, scoring, classification, pairwise-preference 설정을 아우르는 12개 public benchmark에서 CARE가 aggregation error를 최대 26.8%까지 줄임을 보인 것이다. 이는 LLM-judge aggregation을 추가 human labeling 비용 없이 principled한 deconfounding 문제로 전환하여 evaluation reliability를 개선한다는 점에서 중요하다. guarantee는 confounding이 가정된 latent-factor model로 충분히 포착된다는 가정 하에 성립하며, empirical한 개선은 테스트된 12개 benchmark에서 보인 것으로 universal함이 증명된 것은 아니다.", "abstract": "LLM-as-a-judge ensembles are the standard paradigm for scalable evaluation, but their aggregation mechanisms suffer from a fundamental flaw: they implicitly assume that judges provide independent estimates of true quality. However, in practice, LLM judges exhibit correlated errors caused by shared latent confounders, such as verbosity, stylistic preferences, or training artifacts, causing standard aggregation rules like majority vote or averaging to provide little gain or even amplify systematic mistakes. To address this, we introduce CARE, a confounder-aware aggregation framework that explicitly models LLM judge scores as arising from both a latent true-quality signal and shared confounding factors. Rather than heuristically re-weighting judges, CARE separates quality from confounders without access to ground-truth labels. We provide theoretical guarantees for identifiability and finite-sample recovery under shared confounders, and we quantify the systematic bias incurred when aggregation models omit confounding latent factors. Across 12 public benchmarks spanning continuous scoring, binary classification, and pairwise preference settings, CARE improves aggregation accuracy, reducing error by up to 26.8%."}, {"id": "63623", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Causal-JEPA: Learning World Models through Object-Level Latent Interventions", "url": "https://icml.cc/virtual/2026/poster/63623", "board": "Hall A #1008", "categories": ["Causal Representation Learning", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Heejeong Nam", "Quentin Le Lidec", "Lucas Maes", "Yann LeCun", "Randall Balestriero"], "famous": [], "key_idea_en": "Causal-JEPA extends masked joint-embedding predictive world models from patches to object-level representations, so masking one object and inferring its state from others induces latent interventions that act like counterfactuals and force genuine interaction reasoning.", "summary_en": "Object-centric world model representations capture objects individually but not the interaction-dependent dynamics needed for robust relational prediction, reasoning, and control. C-JEPA extends masked joint-embedding prediction from image patches to object-centric representations, masking an object's state so it must be inferred from other objects, which induces latent interventions with counterfactual-like effects and blocks shortcut solutions. This object-level masking yields roughly a 20-point absolute improvement in counterfactual visual-question-answering reasoning and enables planning with only 1% of the latent features that patch-based world models need for comparable performance, backed by a formal analysis of the induced causal inductive bias. The result offers a concrete, scalable way to build causal and interventional inductive bias into object-centric world models, improving reasoning and control efficiency together. It is evaluated on visual question answering and agent control tasks with object-centric representations, and its effectiveness on scenes lacking clean object decompositions is not addressed.", "key_idea_ko": "Causal-JEPA(C-JEPA)는 masked joint-embedding predictive world model을 patch 단위에서 object 단위 표현으로 확장하여, 한 object를 masking하고 다른 object들로부터 그 상태를 추론하게 함으로써 counterfactual처럼 작동하는 latent intervention을 유도하고 진정한 interaction reasoning을 강제한다.", "summary_ko": "object-centric world model 표현은 개별 object는 포착하지만, robust한 relational prediction, reasoning, control에 필요한 interaction 의존적 dynamics는 포착하지 못한다. C-JEPA는 masked joint embedding prediction을 image patch에서 object-centric 표현으로 확장하여, 한 object의 상태를 masking해 다른 object들로부터 추론하도록 강제함으로써 counterfactual-like 효과를 갖는 latent intervention을 유도하고 shortcut solution을 방지한다. 이러한 object-level masking은 counterfactual visual question answering reasoning에서 약 20%의 절대적 성능 향상을 가져오고, 동등한 성능에서 patch 기반 world model 대비 단 1%의 latent feature만으로 planning을 가능하게 하며, 유도된 causal inductive bias에 대한 formal analysis로 뒷받침된다. 이는 object-centric world model에 causal/interventional inductive bias를 구체적이고 확장 가능한 방식으로 내재화하여 reasoning과 control 효율성을 모두 향상시킨다는 점에서 의의가 있다. visual question answering과 agent control task에서 object-centric 표현을 사용해 평가되었으며, 깔끔한 object decomposition이 어려운 장면에 대한 효과는 abstract에서 다루지 않는다.", "abstract": "World models require robust relational understanding to support prediction, reasoning, and control. While object-centric representations provide a useful abstraction, they are not sufficient to capture interaction-dependent dynamics. We therefore propose C-JEPA, a simple and flexible object-centric world model that extends masked joint embedding prediction from image patches to object-centric representations. By applying object-level masking that requires an object's state to be inferred from other objects, C-JEPA induces latent interventions with counterfactual-like effects and prevents shortcut solutions, making interaction reasoning essential. Empirically, C-JEPA leads to consistent gains in visual question answering, with an absolute improvement of about 20% in counterfactual reasoning over the same architecture without object-level masking. On agent control tasks, C-JEPA enables substantially more efficient planning by using only 1% of the total latent input features required by patch-based world models, while achieving comparable performance. Finally, we provide a formal analysis demonstrating that object-level masking induces a causal inductive bias via latent interventions."}, {"id": "63094", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Causal-aware Anomaly Detection for Tabular Data", "url": "https://icml.cc/virtual/2026/poster/63094", "board": "Hall A #4302", "categories": ["Causal Discovery", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Dang Nguyen", "Tu Anh Hoang Nguyen", "Thuc Le", "Svetha Venkatesh", "Trung Le", "Sunil Gupta"], "famous": [], "key_idea_en": "CausalAno trains a causal GAN on normal tabular data and uses its discriminator's mechanism-consistent feature space, via Mahalanobis distance, to flag anomalies arising from mechanism violations rather than mere outlier values.", "summary_en": "Standard anomaly detection treats anomalies as statistical outliers, which is fragile when anomalies actually arise from violations of underlying causal mechanisms rather than extreme feature values. CausalAno addresses this by training a causal GAN on normal data and using its discriminator to learn a mechanism-consistent representation, then fitting a Gaussian model in that feature space and scoring test points by Mahalanobis distance to measure deviation from the normal causal manifold. Extensive experiments on 28 tabular datasets (18 continuous-only, 10 mixed-type) against 16 state-of-the-art baselines show consistent improvements in both mixed-type and numerical-only settings. This matters for tabular domains such as fraud or sensor-fault detection, where dependency-breaking behavior rather than magnitude alone signals anomalies. Ablations confirm the gains come specifically from the causal factorization in the GAN rather than the GAN architecture alone, though the method depends on correctly training the causal GAN on clean normal data.", "key_idea_ko": "정상(normal) tabular data에 causal GAN을 학습시키고, 그 discriminator의 mechanism-consistent feature space(Mahalanobis distance 기반)를 이용해 단순 이상값이 아니라 mechanism violation으로 인한 anomaly를 탐지하는 CausalAno를 제안한다.", "summary_ko": "표준 anomaly detection은 anomaly를 statistical outlier로 취급하는데, 이는 anomaly가 실제로는 extreme feature value가 아니라 기저 causal mechanism의 위반에서 비롯될 때 취약하다. 이 논문은 정상 데이터에 causal GAN을 학습시켜 discriminator가 mechanism-consistent representation을 학습하도록 하고, 그 feature space에서 Gaussian model을 적합한 뒤 Mahalanobis distance로 test point를 채점하여 정상 causal manifold로부터의 이탈을 측정하는 CausalAno를 제안한다. 28개 tabular dataset(연속형만 18개, mixed-type 10개)에서 16개의 state-of-the-art baseline과 비교한 광범위한 실험 결과 mixed-type과 numerical-only 세팅 모두에서 일관된 성능 향상을 보인다. 이는 fraud나 sensor fault처럼 magnitude가 아니라 dependency 붕괴가 anomaly의 신호가 되는 tabular domain의 anomaly detection에서 중요한 의미를 가진다. Ablation은 성능 향상이 GAN 아키텍처 자체가 아니라 GAN 내 causal factorization에서 기인함을 확인하지만, 방법은 causal GAN을 clean한 정상 데이터로 올바르게 학습시키는 데 의존한다.", "abstract": "Anomaly detection (AD) methods often ignore causal dependencies and treat anomalies as outliers, which is brittle when anomalies are primarily mechanism violations rather than extreme values. We propose CausalAno, a causal-aware detector that trains a causal GAN on normal data and leverages its discriminator to learn mechanism-consistent representations. We score test samples by fitting a Gaussian model in this feature space and computing the Mahalanobis distance, measuring deviation from the normal causal manifold. We demonstrate the effectiveness of CausalAno with extensive experiments on 28 tabular datasets (18 continuous-only and 10 mixed-type), comparing against 16 SOTA baselines. Our results show consistent improvements across both mixed-type and numerical-only settings. Our ablation studies further confirm that the gains come from the causal factorization in the causal GAN rather than a generic GAN backbone. Our CausalAno offers a practical and effective solution for real-world applications where anomalies often arise from dependency-breaking behaviors."}, {"id": "61842", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Causal Modeling of Selection in Evolution", "url": "https://icml.cc/virtual/2026/poster/61842", "board": "Hall A #4400", "categories": ["Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Haoyue Dai", "Zeyu Tang", "Peter Spirtes", "Kun Zhang"], "famous": ["Peter Spirtes", "Kun Zhang"], "key_idea_en": "The paper distinguishes 'static' from 'evolutionary' selection bias, shows the standard graphical selection model is invalid for evolutionary settings, and gives a sound and complete procedure for identifying evolutionary-selection models from multi-generation or multi-environment data.", "summary_en": "Causal discovery must account for selection bias, but common treatments conflate two distinct forms: 'static' selection, a one-shot filtering into an observed subset such as survey volunteer bias, and 'evolutionary' selection, repeated rounds of differential fitness shaping the latest generation, as in immune adaptation or antibiotic resistance. The authors show that the standard graphical selection model, though valid for static selection, fails to characterize data generated under evolutionary selection and can produce false discoveries when misapplied, and they introduce a new graphical model tailored to evolutionary selection instead. They further develop a sound and complete procedure for identifying such models from data spanning one or multiple environments or generations. This distinction matters because it prevents spurious causal conclusions in domains genuinely driven by evolutionary dynamics, where the ubiquitous static-selection assumption does not apply. Full identification still requires data across multiple generations or environments, and applying the right model in practice depends on correctly recognizing a process as evolutionary rather than static.", "key_idea_ko": "'static' selection bias와 'evolutionary' selection bias를 구분하고, 표준 graphical selection model이 evolutionary 상황에서는 부적합함을 보인 뒤, 다세대/다환경 데이터로부터 evolutionary-selection model을 식별하는 sound하고 complete한 절차를 제시한다.", "summary_ko": "causal discovery는 selection bias를 고려해야 하지만, 본 논문은 흔히 통용되는 서술이 서로 다른 두 형태, 즉 'static' selection(예: 설문 자원자 편향과 같이 한 번의 filtering으로 관측 subset이 결정되는 경우)과 'evolutionary' selection(예: 면역 적응이나 항생제 내성처럼 반복적인 차등 적합도가 최신 세대를 형성하는 경우)을 혼동한다고 지적하며, 기존 방법들은 이 둘을 동일하게 모델링한다. 저자들은 표준 graphical selection model이 static selection에는 유효하지만 evolutionary selection 하에서 생성된 데이터는 제대로 특징짓지 못하며, 이를 잘못 적용하면 false discovery로 이어질 수 있음을 보인다. 이들은 evolutionary selection에 맞춘 새로운 graphical model을 도입하고, 하나 또는 여러 환경/세대에 걸친 데이터로부터 이러한 model을 식별하는 sound하고 complete한 절차를 개발한다. 이는 evolutionary dynamics에 실제로 좌우되는 domain에서, 어디에나 적용되어온 static-selection 가정이 부적합함에도 불구하고 잘못 적용되어 spurious causal conclusion에 이르는 것을 방지한다는 점에서 중요하다. 완전한 identification을 위해서는 다세대/다환경 데이터가 필요하며, 실제 적용 시에는 어떤 과정을 static이 아닌 evolutionary로 올바르게 인식하는 것이 전제되어야 한다.", "abstract": "Understanding potential selection in data is crucial for causal discovery; we argue that \"selection\" in common narratives takes two forms, which we term static and evolutionary selection, respectively. Static selection refers to a one-shot filtering process where observed data consist of a subset of the population of interest, as in survey volunteer bias. Evolutionary selection, in contrast, operates through repeated rounds of differential fitness in reproduction, where observed data constitute the latest generation shaped by a historical trajectory, as in immune adaptation, antibiotic resistance, and social norm emergence. Existing methods largely conflate these two forms and rely on an identical graphical model of selection. We show that this model is valid for static settings but fails to characterize data under evolution, yielding false discovery results. To address this, we introduce a new model that specifically characterizes evolutionary selection, and develop a sound and complete procedure for identifying such models from data across one or multiple environments or generations. Experimental results validate the method's ability to uncover the relevant mechanisms underlying evolution from data."}, {"id": "64096", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Attention Sinks in Diffusion Transformers: A Causal Analysis", "url": "https://icml.cc/virtual/2026/poster/64096", "board": "Hall A #1212", "categories": ["Causal Reasoning in LLMs/Agents", "Other"], "estimands": [], "treatment_type": "binary", "discovery_types": [], "authors": ["FANGZHENG WU", "Brian Summa"], "famous": [], "key_idea_en": "A causal-intervention analysis of attention sinks in text-to-image diffusion transformers shows they are not functionally necessary for semantic text-image alignment, though they affect output appearance and can degrade preference scores under strong interventions.", "summary_en": "Attention sinks are known to matter functionally in autoregressive language models, but whether they play a similarly necessary role in diffusion transformers for image generation has been unclear. The authors dynamically identify dominant attention-receiving tokens and apply paired, training-free interventions along the score and value paths to causally test sink necessity across layers, denoising phases, and architectures. Across 553 GenEval prompts on Stable Diffusion 3, corroborated by SDXL experiments, removing sinks leaves text-image alignment (CLIP-T) and preference proxies intact under standard interventions (k=1), though a metric-dependent degradation on HPS-v2 emerges under stronger interventions (k >= 10), even as suppressing sinks changes output appearance. The causal framework clarifies that attention sinks are not required for semantic alignment in diffusion transformers, refining assumptions carried over from the autoregressive LLM literature and pointing to metric-specific sensitivities. The results are based on specific models (SD3, SDXL) and specific intervention strengths and metrics, leaving broader diffusion architectures and stronger intervention regimes uncovered.", "key_idea_ko": "text-to-image diffusion transformer에서 attention sink에 대한 causal-intervention 분석을 수행하여, attention sink가 semantic text-image alignment에 기능적으로 필수적이지는 않지만 output appearance에는 영향을 미치고 강한 intervention 하에서는 preference score를 저하시킬 수 있음을 보인다.", "summary_ko": "Attention sink는 autoregressive language model에서 기능적으로 중요하다고 여겨져 왔지만, image generation을 위한 diffusion transformer에서도 필요한지는 불분명했다. 저자들은 dominant attention을 받는 token을 동적으로 식별하고, score path와 value path를 따라 paired training-free intervention을 적용하여 여러 layer, denoising phase, architecture에 걸쳐 sink의 필요성을 causal하게 검증한다. Stable Diffusion 3에 대한 553개 GenEval prompt 실험과 SDXL을 이용한 보충 실험에서, 표준 intervention(k=1) 하에서 sink 제거는 text-image alignment(CLIP-T)나 preference proxy를 저하시키지 않았으나, 더 강한 intervention(k>=10) 하에서는 HPS-v2 지표에서 metric-dependent한 성능 저하가 나타났으며 sink를 억제하면 output appearance는 변화했다. 이 causal framework는 diffusion transformer에서 attention sink가 semantic alignment에 필수적이지 않음을 명확히 하여, autoregressive LLM 문헌에서 이어져 온 가정을 정교화하고 metric별 민감도를 시사한다는 점에서 의의가 있다. 결과는 특정 모델(SD3, SDXL)과 특정 intervention 강도 및 metric에 기반한 것으로, 더 넓은 범위의 diffusion architecture나 더 강한 intervention regime은 충분히 다루지 못한다.", "abstract": "Attention sinks (tokens that receive disproportionate attention mass) are often assumed to be functionally important in autoregressive language models. Whether such sinks are necessary in diffusion transformers remains unclear. We present a causal analysis of attention sinks in text-to-image diffusion models, dynamically identifying dominant attention recipients based on incoming attention mass. Using paired, training-free interventions along the score and value paths, we test sink necessity across layers, denoising phases, and architectures. Across large-scale evaluations on 553 GenEval prompts with Stable Diffusion 3 and corroborating experiments on SDXL, we find that removing these sinks does not degrade text-image alignment or preference proxies under standard settings (k=1), with a metric-dependent boundary on HPS-v2 emerging only under stronger interventions (k >= 10). We additionally quantify perceptual and distributional shifts relative to baseline outputs, showing that suppressing dominant recipients can alter appearance without affecting alignment or preference scores. Together, these results clarify that attention sinks are not functionally necessary for semantic alignment in diffusion transformers, while revealing a metric-dependent boundary: preference proxies show sink-specific degradation under stronger interventions (k >= 10), whereas alignment (CLIP-T) remains robust across all tested conditions."}, {"id": "66593", "session": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "COPF: An Online Framework for Deployment-Stable Counterfactual Fairness in Evolving Graphs", "url": "https://icml.cc/virtual/2026/poster/66593", "board": "Hall A #3412", "categories": ["Causal Fairness & Robustness", "Counterfactual Inference"], "estimands": ["counterfactual query"], "treatment_type": "binary", "discovery_types": [], "authors": ["Sheng'en Li", "Dongmian Zou"], "famous": [], "key_idea_en": "COPF is a decision-layer framework that defines, estimates, and controls exposure-counterfactual fairness gaps in online link recommendation on evolving graphs using propensity logging and doubly robust auditing.", "summary_en": "Online link recommendation is performative because showing certain candidate links changes which links form and what feedback is observed, so fairness estimates from logged outcomes can be misleading and drift after policy updates. COPF addresses this by defining group-level opportunity gaps as exposure counterfactuals, making them estimable via explicit exploration and propensity logging, and auditing and controlling fairness using residual outcome indistinguishability with graph-aware doubly robust estimators, an online multicalibration auditor, and a primal-dual controller. Its main result is a transfer theorem showing that residual outcome indistinguishability on estimated residuals bounds exposure-counterfactual group gaps under temporal mixing and bounded local interference, demonstrated on two TGB streams and a synthetic bipartite stream to reduce worst-case fairness disparity spikes at modest utility cost. This provides a principled, deployment-stable way to monitor and control fairness in dynamic, feedback-driven recommendation systems, rather than relying on static post-hoc audits. The guarantees depend on assumptions of temporal mixing and bounded local interference, and evaluation is limited to the tested streaming benchmarks.", "key_idea_ko": "COPF는 propensity logging과 doubly robust auditing을 이용해 evolving graph 위의 online link recommendation에서 exposure-counterfactual fairness gap을 정의, 추정, 통제하는 decision-layer framework이다.", "summary_ko": "online link recommendation은 특정 candidate link를 노출시키는 것 자체가 어떤 link가 형성되고 어떤 feedback이 관측되는지를 바꾸는 performative한 성격을 가지므로, logged outcome으로부터의 fairness 추정은 오도될 수 있고 policy update 이후 drift될 수 있다. 이 논문은 group-level opportunity gap을 exposure counterfactual로 정의하고, explicit exploration과 propensity logging을 통해 이를 추정 가능하게 하며, residual outcome indistinguishability를 graph-aware doubly robust estimator, online multicalibration auditor, primal-dual controller로 audit하고 통제하는 COPF를 제안한다. 핵심 결과는 temporal mixing과 bounded local interference 하에서 estimated residual에 대한 residual-OI가 exposure-counterfactual group gap을 bound함을 보이는 transfer theorem이며, 두 개의 TGB stream과 하나의 synthetic bipartite stream에서 적은 utility 비용으로 worst-case fairness disparity spike를 줄임을 보인다. static한 post-hoc audit에 의존하는 대신, dynamic하고 feedback-driven한 recommendation system에서 fairness를 원칙적으로 모니터링하고 통제하는 deployment-stable한 방법을 제공한다는 점에서 의의가 있다. 이 guarantee는 temporal mixing과 bounded local interference 가정에 의존하며, 평가는 테스트된 streaming benchmark로 제한된다.", "abstract": "Online link recommendation on evolving graphs is performative: by choosing which candidate links to show users, the system changes which links form and what feedback it later observes. Consequently, fairness estimates from logged outcomes can be misleading and may drift after deployment when the recommendation policy is updated. We introduce COPF, a decision-layer framework for deployment-stable fairness monitoring and control in online link recommendation. COPF (i) defines group-level opportunity gaps on exposure (shown vs. not shown) counterfactuals, (ii) makes them estimable by explicit exploration and by logging the probability (propensity) that each candidate is shown, and (iii) audits and controls fairness using residual outcome indistinguishability (OI) over a configurable auditor family with graph-aware doubly robust (GA-DR) estimators. We provide a noisy transfer theorem showing that Residual-OI on estimated GA-DR residuals implies bounds on exposure-counterfactual group gaps under temporal mixing and bounded local interference, and we instantiate an online multicalibration auditor together with a primal–dual controller. Experiments on two TGB streams and a controlled synthetic bipartite stream show that COPF reduces worst-case spikes in exposure-counterfactual group disparities with modest impact on ranking utility."}, {"id": "61798", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Counterfactual Residual Data Augmentation for Regression", "url": "https://icml.cc/virtual/2026/poster/61798", "board": "Hall A #4402", "categories": ["Counterfactual Inference", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Hossein Mohebbi", "Oliver Schulte", "Ke Li", "Pascal Poupart"], "famous": [], "key_idea_en": "Counterfactual Residual Data Augmentation (CRDA) is a model-agnostic technique for tabular regression that generates new training samples by perturbing selected features while exploiting the residual invariance of the noise component captured by a fitted regressor.", "summary_en": "Data-driven regression on tabular data often suffers from limited training samples, high data-collection costs, and noisy observations, and the augmentation techniques common in vision and language are far less established for tabular regression. CRDA's central insight is that once a regressor has captured the systematic component of the data, the remaining residual noise behaves as an invariant quantity that stays stable under small perturbations of carefully selected features, a property that can be exploited to synthesize new, realistic training samples without collecting additional real data. The method is model-agnostic and applies across regressor types; on benchmark datasets it reduces an MLP regressor's MSE by 22.9% and an XGBoost regressor's MSE by 6.4% on average, consistently outperforming existing state-of-the-art data generators and augmentation techniques. This offers a simple, efficient remedy for noise-prone, small-sample tabular regression settings. The residual-invariance assumption underlying the augmentation is a modeling choice whose validity may vary across datasets with different noise structures.", "key_idea_ko": "tabular regression을 위한 model-agnostic 기법인 Counterfactual Residual Data Augmentation (CRDA)을 제안하며, fitted regressor가 모델링한 noise component의 residual invariance를 활용해 선택된 feature를 perturb함으로써 새로운 training sample을 생성한다.", "summary_ko": "tabular data 기반 data-driven regression은 흔히 제한된 training sample, 높은 data-collection 비용, noisy observation 문제를 겪지만, vision이나 language 분야에서 흔한 data augmentation 기법은 tabular regression에서는 잘 확립되어 있지 않다. CRDA의 핵심 통찰은, regressor가 데이터의 systematic component를 포착하고 나면 남은 residual noise가 신중하게 선택된 feature의 작은 perturbation에도 안정적으로 유지되는 invariant quantity처럼 행동한다는 것이며, 이러한 residual invariance를 이용해 추가적인 real data 수집 없이 realistic한 새로운 training sample을 합성할 수 있다. 이 방법은 model-agnostic하여 다양한 regressor 유형에 적용 가능하며, benchmark dataset 전반에서 MLP Regressor의 MSE를 평균 22.9%, XGBoost Regressor의 MSE를 평균 6.4% 낮추어 기존 state-of-the-art data generator 및 augmentation 기법을 일관되게 능가한다. 이는 noise가 많고 sample 수가 적은 tabular regression 환경에 대한 간단하고 효율적인 해법을 제공한다는 의의가 있다. augmentation의 바탕이 되는 residual-invariance 가정은 모델링 선택이며, 그 타당성은 noise 구조가 다른 데이터셋마다 달라질 수 있다.", "abstract": "Data-driven modeling in real-world regression tasks often suffers from limited training samples, high collection costs, and noisy observations. Inspired by the impact of data augmentation in vision and language, we propose a novel Counterfactual Residual Data Augmentation (CRDA) technique for tabular regression. Our key insight is that once a regressor has modeled the systematic component of the data, the remaining noise can be viewed as an invariant residual that remains stable under small perturbations of carefully selected features. We exploit this residual invariance to generate new, yet realistic, training samples, effectively expanding the dataset without requiring additional real data. Our method is model-agnostic and readily applicable to various types of regressors. In experiments across datasets from a variety of benchmark repositories, on average, CRDA reduces an MLP Regressor's MSE by 22.9% and an XGBoost Regressor's MSE by 6.4%. When compared to existing state-of-the-art data generators and augmentation techniques, CRDA consistently outperforms in MSE reduction. By adding principled counterfactual variations to the training data, our method offers a simple and efficient remedy for noise-prone, small-sample regression settings."}, {"id": "63443", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Beyond Benchmarks: Toward Causally Faithful Evaluation of Large Language Models", "url": "https://icml.cc/virtual/2026/poster/63443", "board": "Hall A #4408", "categories": ["Causal Reasoning in LLMs/Agents", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zhengshuyuan Tian", "Chuanxin Lan", "Chenxi Wang", "Lei Wang", "Guoxin Kang", "Zhengxin Yang", "Yunyou Huang", "Xuehai Hong", "Wanling Gao", "Jianfeng Zhan"], "famous": [], "key_idea_en": "LLM evaluatology is a causally-informed framework that jointly models evaluation-system components, datasets, prompting, decoding, and software/hardware, alongside structured question variation to give reproducible, causally faithful attribution of LLM capability, separate from confounding evaluation artifacts.", "summary_en": "LLM evaluations often conflate benchmark performance with intrinsic model capability, when in fact observed outcomes arise from the whole evaluation system, datasets, prompting methods, decoding parameters, and the software-hardware stack, and when that system is underspecified, evaluation choices alone can swing accuracy by up to 70%. The paper proposes jointly modeling evaluation components together with structured question variation, rather than studying components in isolation or relying on the small, manually curated question variants used in prior work. This yields LLM evaluatology, a framework that grounds evaluation in causal system design to enable interpretable and reproducible attribution of model capability. It targets a systemic validity problem in LLM benchmarking, where apparent gains may reflect artifacts of the evaluation system rather than genuine improvements in capability. The paper is primarily a framework and methodology contribution; the abstract does not report head-to-head quantitative results against specific existing benchmark suites beyond motivating the up-to-70% swing.", "key_idea_ko": "LLM evaluatology는 dataset, prompting, decoding, software/hardware 등 evaluation-system component와 구조화된 question variation을 함께 모델링하여 confounding되는 evaluation artifact와 분리된, reproducible하고 causally faithful한 LLM capability attribution을 제공하는 causally-informed framework이다.", "summary_ko": "LLM evaluation은 benchmark 성능과 intrinsic model capability를 혼동하는 경우가 많은데, 실제 관측 결과는 dataset, prompting method, decoding parameter, software-hardware stack을 포함한 전체 evaluation system으로부터 발생하며, 이 system이 underspecified되면 evaluation 선택만으로도 accuracy가 최대 70%까지 흔들릴 수 있다. 핵심 아이디어는 component를 개별적으로 연구하거나 소규모로 수동 curation된 question variant에 의존하던 선행 연구와 달리, evaluation component와 구조화된 question variation을 함께 모델링하는 것이다. 주요 contribution은 evaluation을 causal system design에 기반시켜 model capability의 interpretable하고 reproducible한 attribution을 가능하게 하는 framework인 LLM evaluatology이다. 이는 LLM benchmarking에서 겉으로 보이는 성능 향상이 실제 capability 개선이 아니라 evaluation system의 artifact를 반영할 수 있다는 systemic validity 문제를 겨냥한다는 점에서 중요하다. 이 논문은 주로 framework/methodology contribution이며, abstract는 최대 70% 흔들림을 뒷받침하는 것 외에 특정 기존 benchmark suite와의 head-to-head quantitative 결과는 보고하지 않는다.", "abstract": "Current LLM evaluations often conflate benchmark performance with intrinsic model capability. This is misleading, as observed outcomes arise from the entire evaluation system, including datasets, prompting methods, decoding parameters, and the software-hardware stack, rather than the model alone. When this system is underspecified, attribution becomes unreliable; in practice, evaluation choices alone can induce accuracy swings of up to 70%. This attribution challenge is compounded by the open-ended nature of LLM evaluation. Questions span languages, domains, and usage styles, forming highly variable and implicitly shifting datasets. Consequently, strong performance on static benchmarks may reflect alignment with surface patterns rather than robust underlying capability. Prior studies either focus on individual components, overlooking their interactions, or investigate manually curated and small-scale question variants, lacking a holistic perspective, precluding precise attribution of intrinsic model capabilities amidst the confounding influences. To address these limitations, we propose LLM evaluatology, a principled framework that grounds LLM evaluation in a causally informed system design. By jointly modeling evaluation components and structured question variations, it enables interpretable, reproducible, and causally faithful assessment of model capability, establishing clear conditions under which evaluation results are meaningful and trustworthy."}, {"id": "60663", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Physics from Video: Identifiability of Time-Invariant Second-Order ODEs under Minimal Trajectory Conditions", "url": "https://icml.cc/virtual/2026/poster/60663", "board": "Hall A #4005", "categories": ["Identification & Partial ID", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yuanyuan Wang", "Wenjie Wang", "Kun Zhang", "Mingming Gong"], "famous": ["Kun Zhang", "Mingming Gong"], "key_idea_en": "Structural identifiability conditions, in the form of a level-set slope-coverage condition, let an encoder-only video model uniquely recover the parameters of second-order linear ODEs governing physical dynamics directly from pixels, with minimal trajectory data.", "summary_en": "A core challenge for video-based world models is recovering true, interpretable physical laws from raw pixels rather than merely achieving visual realism, and this paper asks whether an encoder-only pipeline can uniquely identify the parameters of time-invariant second-order linear ODEs from video. It proves that a level-set slope-coverage condition ensures the learned latent space is locally affine to the true physical state, guaranteeing exact parameter recovery, and it characterizes minimal data requirements across damping regimes, showing that underdamped systems are identifiable from a single video clip while other regimes require three diverse trajectories. A variance-floor regularizer further stabilizes the decoder-free training objective and prevents latent collapse. The result is physically correct and transparent parameter estimation from video without expensive pixel-reconstruction decoders, validated on both synthetic and real data. The identifiability guarantees are specific to time-invariant second-order linear ODE dynamics and depend on the stated slope-coverage and trajectory-diversity conditions being met.", "key_idea_ko": "이 논문은 level-set slope-coverage condition이라는 structural identifiability 조건을 증명하여, encoder-only video model이 최소한의 trajectory data만으로 pixel로부터 직접 second-order linear ODE의 physical dynamics parameter를 uniquely 복원할 수 있음을 보인다.", "summary_ko": "Video 기반 world model의 핵심 과제는 visual realism을 넘어 raw pixel로부터 참된 interpretable physical law를 복원하는 것이며, 이 논문은 encoder-only pipeline이 time-invariant second-order linear ODE의 parameter를 video로부터 uniquely identify할 수 있는지를 연구한다. 저자들은 level-set slope-coverage condition이 학습된 latent space가 참된 physical state에 locally affine함을 보장하여 exact parameter recovery를 가능케 함을 증명하고, damping regime별 minimal data requirement를 characterize하여 underdamped system은 단일 video clip만으로, 그 외 regime은 세 개의 다양한 trajectory가 필요함을 보인다. 이들은 나아가 decoder-free training objective를 안정화하고 latent collapse를 방지하는 variance-floor regularizer를 도입한다. 이는 비용이 큰 pixel-reconstruction decoder 없이도 video로부터 physically correct하고 transparent한 parameter estimation을 가능케 한다는 점에서 중요하며, synthetic 및 real data로 검증되었다. Identifiability guarantee는 time-invariant second-order linear ODE dynamics에 특화되어 있으며, 명시된 slope-coverage 및 trajectory-diversity 조건이 충족된다는 전제에 의존한다.", "abstract": "Bridging the gap between visual realism and physical understanding is a core challenge for video-based world models. We study the structural identifiability of continuous-time physical laws from raw pixels, focusing on whether an encoder-only pipeline can uniquely recover the parameters of second-order linear ODEs. We prove that a level-set slope-coverage condition ensures the learned latent space is locally affine to the true physical state, enabling exact parameter recovery. Our theory provides the first characterization of minimal data requirements across damping regimes, establishing that underdamped systems are identifiable from a single video clip, whereas other regimes require three diverse trajectories. We further introduce a variance-floor regularizer to stabilize the decoder-free objective and prevent latent collapse. Validated on synthetic and real-world data, our approach demonstrates that interpretable physical constants can be reliably estimated from video without the need for compute-intensive pixel reconstruction, ensuring both physical correctness and transparency."}, {"id": "65163", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Unsupervised Disentanglement Without Compromises : How Functional Orthogonality Enforces Identifiability", "url": "https://icml.cc/virtual/2026/poster/65163", "board": "HALL A #4012", "categories": ["Causal Representation Learning", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Mathieu Simon", "Pascal Frossard", "Christophe De Vleeschouwer"], "famous": [], "key_idea_en": "Latent factors that influence observations through locally orthogonal directions, formalized as a Jacobian orthogonality constraint, are identifiable in general nonlinear generative models without requiring statistical independence or causal assumptions.", "summary_en": "Unsupervised disentangled representation learning is widely believed to be impossible without extra assumptions such as statistical independence or causal structure among latent factors. The authors instead define latent concepts as factors that influence observations through locally orthogonal directions, formalized as an orthogonality constraint on the Jacobian of the generative mapping. They prove that this orthogonality condition yields identifiability of general nonlinear generative models without independence or causal assumptions, provided the latent domain admits all combinations of factor values, and orthogonality-regularized normalizing-flow experiments empirically confirm reliable recovery of ground-truth factors. This challenges prevailing impossibility results for unsupervised disentanglement and supplies a principled alternative identifiability foundation, also helping explain why VAEs work well empirically. The identifiability guarantee requires the latent domain to admit all combinations of factor values, a completeness/support assumption that may not hold for every real dataset.", "key_idea_ko": "observation에 locally orthogonal한 방향을 통해 영향을 미치는 latent factor(Jacobian orthogonality constraint)가 statistical independence나 causal assumption 없이도 general nonlinear generative model에서 identifiable함을 증명한다.", "summary_ko": "unsupervised disentangled representation learning은 latent factor 간 statistical independence나 causal structure 같은 추가 가정 없이는 불가능하다고 널리 여겨져 왔다. 핵심 아이디어는 latent concept를 observation에 locally orthogonal한 방향을 통해 영향을 미치는 factor로 정의하는 것이며, 이는 generative mapping의 Jacobian에 대한 orthogonality constraint로 formalize된다. 주요 기술적 결과는 latent domain이 factor value의 모든 조합을 허용한다면 independence나 causal assumption 없이도 이 orthogonality condition이 general nonlinear generative model의 identifiability를 보장한다는 증명이며, orthogonality-regularized normalizing flow 실험은 ground-truth factor의 신뢰할 수 있는 복원을 empirical하게 확인했다. 이는 unsupervised disentanglement에 대한 기존의 impossibility result에 도전하며 원칙에 입각한 대안적 identifiability 토대를 제공하고, VAE가 경험적으로 잘 작동하는 이유를 설명하는 데도 도움이 된다. 다만 이 identifiability guarantee는 latent domain이 factor value의 모든 조합을 허용해야 한다는 completeness/support assumption을 요구하며, 이는 모든 real dataset에서 성립하지 않을 수 있다.", "abstract": "This paper explores unsupervised disentangled representation learning from a functional perspective. We define latent concepts as factors that influence observations through locally orthogonal directions, formalized as an orthogonality constraint on the Jacobian of the generative mapping. We prove that this condition yields identifiability of general nonlinear generative models, without requiring statistical independence or causal assumptions, provided the latent domain admits all combinations of factor values. Experiments with orthogonality-regularized normalizing flows empirically confirm the theory, demonstrate reliable recovery of ground-truth factors, and shed light on the success of VAEs. These findings challenge the prevailing impossibility claims for unsupervised disentanglement and provide a principled alternative foundation."}, {"id": "62057", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Dynamics Within Latent Chain-of-Thought: An Empirical Study of Causal Structure", "url": "https://icml.cc/virtual/2026/poster/62057", "board": "Hall A #3406", "categories": ["Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Zirui Li", "Xuefeng Bai", "Kehai Chen", "Yizhi Li", "Jian Yang", "Chenghua Lin", "Min Zhang"], "famous": [], "key_idea_en": "Using structural causal models to analyze latent chain-of-thought computations empirically, the paper identifies which latent steps are causally necessary for correct answers and how influence propagates between them.", "summary_en": "Latent or continuous chain-of-thought methods replace explicit textual rationales with internal latent computation steps that are hard to evaluate beyond correlation-based probing. Modeling latent reasoning steps with structural causal models, the authors empirically investigate which steps are causally necessary for correctness, how influence propagates across steps, and how the resulting influence patterns should be interpreted. They find that latent-step computational budget should be treated as distinct functional roles rather than simply added depth, and identify a gap between early output bias and later representational commitment that training should address. This offers a causal, rather than purely correlational, lens on latent reasoning in LLMs, suggesting concrete design principles, including mode-conditional and stability-aware analysis, for future training. The available abstract is a paraphrase rather than fully verbatim text, and the causal claims rest on structural-causal-model assumptions applied to a black-box latent reasoning process rather than on ground-truth intervention experiments.", "key_idea_ko": "논문은 structural causal model을 사용하여 latent chain-of-thought 계산을 경험적으로 분석하고, 어떤 latent step이 정답에 causally necessary한지와 영향이 step 간에 어떻게 전파되는지를 규명한다.", "summary_ko": "latent 혹은 continuous chain-of-thought 방법은 명시적인 텍스트 rationale을 내부의 latent computation step으로 대체하는데, 이는 correlation-based probing을 넘어서는 평가가 어렵다. 저자들은 structural causal model을 사용해 latent reasoning step을 모델링하고, 어떤 step이 정답에 causally necessary한지, 영향이 step 간에 어떻게 전파되는지, 그리고 그 결과로 나타나는 influence pattern을 어떻게 해석해야 하는지를 경험적으로 규명한다. latent-step computational budget은 단순히 depth를 더한 것이 아니라 서로 구별되는 functional role로 다루어야 함을 발견했으며, early output bias와 later representational commitment 사이의 gap을 확인하여 training이 이를 다루어야 함을 제시한다. 이는 LLM의 latent reasoning을 이해하고 개선하기 위해 순전히 correlational이 아닌 causal한 관점을 제공하며, 향후 training을 위한 구체적인 설계 원칙(mode-conditional, stability-aware analysis)을 제안한다. 활용 가능한 abstract는 verbatim text가 아니라 paraphrase이며, causal claim은 ground-truth intervention 실험이 아니라 black-box latent reasoning process에 적용된 structural-causal-model 가정에 근거한다.", "abstract": "Latent or continuous chain-of-thought methods replace explicit textual rationales with a number of internal latent steps, but these intermediate computations are difficult to evaluate beyond correlation-based probes. This paper models latent reasoning steps using structural causal models and investigates which steps are causally necessary for correctness, how influence propagates across steps, and how to interpret influence patterns. The key findings indicate that latent-step computational budgets should be viewed as distinct functionalities rather than simply adding more depth, and that training should address the gap between early output bias and later representational commitment. The authors recommend mode-conditional and stability-aware analyses as more dependable approaches for understanding and enhancing latent reasoning systems."}, {"id": "65863", "session": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)", "title": "Data Reconstruction: Identifiability and Optimization with Sample Splitting", "url": "https://icml.cc/virtual/2026/poster/65863", "board": "Hall A #1403", "categories": ["Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yujie Shen", "Zihan Wang", "Jian Qian", "Qi Lei"], "famous": [], "key_idea_en": "The paper characterizes when KKT-based training-data reconstruction has a unique solution for two-layer polynomial networks and introduces sample splitting, a curvature-aware optimization refinement that improves recovery for general reconstruction objectives.", "summary_en": "Reconstructing training data from a trained model's KKT conditions has worked empirically, but it has been unclear when the resulting KKT system admits a unique solution, and even when it does, how to reliably find that solution through optimization. The paper tackles both issues, deriving sufficient conditions on two-layer networks with polynomial activations under which the KKT system uniquely determines the training data, and introducing sample splitting, a curvature-aware refinement step applicable to general reconstruction objectives beyond KKT-based formulations. Sample splitting creates additional descent directions that help optimization escape poor stationary points and refine reconstructed solutions, and adding it to several existing reconstruction methods consistently improves reconstruction performance in experiments. This clarifies theoretically when training-data reconstruction is even well-posed and provides a practical, broadly applicable optimization fix that boosts existing reconstruction pipelines. The identifiability results are specific to two-layer networks with polynomial activations, and the work is a model-inversion/reconstruction study rather than causal inference despite the 'identifiability' terminology.", "key_idea_ko": "이 논문은 two-layer polynomial network에서 KKT 기반 training-data reconstruction이 유일한 해를 갖는 조건을 규명하고, 일반적인 reconstruction objective의 최적화를 개선하는 curvature-aware 기법인 sample splitting을 제안한다.", "summary_ko": "학습된 model의 KKT condition으로부터 training data를 reconstruction하는 방법은 경험적으로는 성과를 냈지만, 그 결과 KKT system이 언제 unique solution을 갖는지, 그리고 그런 경우에도 optimization을 통해 그 해를 어떻게 안정적으로 찾을지는 불분명했다. 이 논문은 identifiability 측면에서 polynomial activation을 갖는 two-layer network에서 KKT system이 training data를 uniquely determine하는 충분조건을 도출하고, optimization 측면에서 KKT 기반 formulation을 넘어 일반적인 reconstruction objective에 적용 가능한 curvature-aware refinement 단계인 sample splitting을 제안한다. Sample splitting은 추가적인 descent direction을 만들어 optimization이 나쁜 stationary point를 벗어나 reconstructed solution을 정교화하도록 돕는데, 이를 기존 여러 reconstruction 방법에 추가하면 실험에서 일관되게 reconstruction 성능이 향상된다. 이는 training-data reconstruction이 언제 well-posed한지를 이론적으로 규명하는 동시에, 기존 reconstruction pipeline의 성능을 높이는 실용적이고 폭넓게 적용 가능한 optimization 개선책을 제공한다는 점에서 의미가 있다. Identifiability 결과는 polynomial activation을 갖는 two-layer network에 특화된 것이며, 이 논문은 identifiability라는 용어에도 불구하고 causal inference가 아니라 model-inversion/reconstruction 연구이다.", "abstract": "Training data reconstruction from KKT conditions has shown striking empirical success, yet it remains unclear when the resulting KKT equations have unique solutions and, even in identifiable regimes, how to reliably recover solutions by optimization. This work hereby focuses on these two complementary questions: identifiability and optimization. On the identifiability side, we discuss the sufficient conditions for KKT system of two-layer networks with polynomial activations to uniquely determine the training data, providing a theoretical explanation of when and why reconstruction is possible. On the optimization side, we introduce sample splitting, a curvature-aware refinement step applicable to general reconstruction objectives (not limited to KKT-based formulations): it creates additional descent directions to escape poor stationary points and refine solutions. Experiments demonstrate that augmenting several existing reconstruction methods with sample splitting consistently improves reconstruction performance."}], "categories": ["Causal Discovery", "Treatment Effects & CATE", "Counterfactual Inference", "Identification & Partial ID", "Causal Representation Learning", "Confounding & Deconfounding", "Time-Series Causality", "Causal Fairness & Robustness", "Causal Reasoning in LLMs/Agents", "Other"], "notable_count": 60, "sessions": [{"n": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)"}, {"n": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)"}, {"n": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)"}, {"n": 4, "time": "14:30-16:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)"}, {"n": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)"}, {"n": 6, "time": "10:30-12:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)"}, {"n": 7, "time": "14:30-16:15", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)"}, {"n": 8, "time": "17:00-18:45", "date_en": "Thu Jul 9", "date_ko": "7/9 (목)"}]};

  const escapeMap = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
  const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => escapeMap[char]);
  const escapeAttr = escapeHtml;
  const escapeRegex = value => String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const normalizeName = value => String(value || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")

    .replace(/[.\-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  const formatTime = value => String(value || "").replace(/\s*-\s*/g, "–");
  const cleanArray = values => Array.isArray(values)
    ? values.map(value => String(value ?? "").trim()).filter(Boolean)
    : [];
  const boardNumber = value => {
    const match = String(value || "").match(/#\s*([A-Za-z0-9-]+)/);
    return match ? `#${match[1]}` : copy[state.lang].boardMissing;
  };
  const boardSort = paper => {
    const match = String(paper.board || "").match(/#\s*(\d+)/);
    return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;

  const unique = values => {

    values.forEach(value => {

      seen.add(value);
      result.push(value);
    });
    return result;

  const styleVars = vars => {

  };
  const categoryColor = category => CATEGORY_COLOR[category] || CATEGORY_COLOR.Other;
  const dayKeyForSession = session => {

  };
  const dayColorForSession = session => DAY_COLOR[dayKeyForSession(session)] || "";

  const PAPERS = rawPapers.map((paper, index) => {

    };
  }).sort((a, b) =>

  PAPERS.forEach(paper => {

  const totalNotablePapers = PAPERS.filter(paper => paper._famous.length > 0).length;
  const themeQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
