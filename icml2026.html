se their prior is never asymptotically overwritten by data, motivating a one-step posterior correction that restores consistency and calibrated uncertainty for average treatment effects.", "summary_en": "Whether PFN-based, in-context-learning causal estimators produce uncertainty quantification consistent with classical frequentist theory has remained an open question for average treatment effect estimation. The authors show that existing PFNs suffer from prior-induced confounding bias, since the prior is never asymptotically overwritten by data, and they introduce a one-step posterior correction (OSPC), implemented in practice via martingale posteriors. A semi-parametric Bernstein-von Mises theorem for the corrected estimator establishes that its posterior uncertainty asymptotically matches frequentist uncertainty. This result closes a foundational gap between fast, amortized in-context causal inference and the rigorous frequentist guarantees needed for scientific and policy applications. The correction is an asymptotic fix targeted specifically at the average treatment effect estimand under standard PFN training assumptions.", "key_idea_ko": "prior-data fitted network(PFN) 기반 causal estimator는 prior가 asymptotically data로 대체되지 않아 frequentist-consistent하지 않음을 보이고, average treatment effect에 대한 consistency와 calibrated uncertainty를 회복하는 one-step posterior correction을 제안한다.", "summary_ko": "PFN 기반 in-context-learning causal estimator가 average treatment effect에 대해 classical frequentist theory와 부합하는 uncertainty quantification을 제공하는지는 불분명했다. 저자들은 기존 PFN이 prior가 asymptotically data로 overwrite되지 않는 prior-induced confounding bias를 겪음을 보이고, martingale posterior를 통해 실제로 구현되는 one-step posterior correction(OSPC)을 도입한다. 이들은 correction된 estimator에 대해 semi-parametric Bernstein-von Mises theorem을 증명하여, posterior uncertainty가 asymptotically frequentist uncertainty와 일치함을 보인다. 이는 빠르고 amortized된 in-context causal inference와 과학적/정책적 활용에 필요한 rigorous frequentist guarantee 사이의 근본적 간극을 메운다는 점에서 중요하다. 이 correction은 표준 PFN training assumption 하에서 average treatment effect estimand에 초점을 맞춘 asymptotic fix이다.", "abstract": "Foundation models based on prior-data fitted networks (PFNs) have shown strong empirical performance in causal inference by framing it as an in-context learning problem. However, it is unclear whether PFN-based causal estimators provide uncertainty quantification that is consistent with classical frequentist estimators. This work shows that existing PFNs can exhibit prior-induced confounding bias, where the prior is not asymptotically overwritten by data, preventing frequentist consistency. A one-step posterior correction (OSPC) restores this property and yields a semi-parametric Bernstein-von Mises theorem. Martingale posteriors implement OSPC practically, producing uncertainty that asymptotically matches frequentist uncertainty for average treatment effect estimation."}, {"id": "66624", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Hierarchical Causal Abduction: A Foundation Framework for Explainable Model Predictive Control", "url": "https://icml.cc/virtual/2026/poster/66624", "board": "Hall A #4408", "categories": ["Time-Series Causality", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Ramesh Arvind Naagarajan", "Zuehal Wagner", "Stefan Streif"], "famous": [], "key_idea_en": "Hierarchical Causal Abduction generates faithful, human-interpretable explanations for nonlinear model-predictive-control actions by combining physics-informed domain knowledge, KKT-multiplier optimization evidence, and PCMCI-based temporal causal discovery.", "summary_en": "Nonlinear model predictive control (MPC) governs safety-critical infrastructure, yet its optimization-based decisions remain opaque to human operators, undermining trust and deployment. The paper proposes Hierarchical Causal Abduction (HCA), which fuses physics-informed domain knowledge graphs, KKT-multiplier optimization evidence, and PCMCI temporal causal discovery to produce human-interpretable explanations of MPC control actions. Across three control domains, greenhouse climate, building HVAC, and chemical process engineering, with expert validation, HCA improves explanation accuracy by 53% over LIME using a single cross-domain parameter set, and domain-specific KKT-threshold calibration raises accuracy further. Trustworthy, interpretable explanations are a prerequisite for deploying learning-based and optimization-based controllers in safety-critical settings, which underscores the practical stakes of this result. Ablations confirm each evidence source is essential, and the method generalizes beyond MPC to other prediction-based decision systems, though it still requires domain knowledge graphs and some domain-specific calibration.", "key_idea_ko": "physics-informed domain knowledge, KKT-multiplier optimization evidence, PCMCI 기반 temporal causal discovery를 결합하여 nonlinear model predictive control의 행동에 대해 faithful하고 human-interpretable한 설명을 생성한다.", "summary_ko": "nonlinear model predictive control(MPC)은 safety-critical infrastructure 운영에 사용되지만 그 optimization 기반 control decision이 human operator에게 불투명하여 신뢰와 배포를 저해한다. 이 논문은 physics-informed domain knowledge graph, KKT-multiplier optimization evidence, PCMCI temporal causal discovery를 결합한 Hierarchical Causal Abduction(HCA)을 제안하여 MPC control action에 대한 human-interpretable explanation을 생성한다. greenhouse climate, building HVAC, chemical process engineering 세 control domain에서 expert validation을 거쳐, 단일 cross-domain parameter set만으로도 HCA가 LIME 대비 explanation accuracy를 53% 향상시켰고, domain-specific KKT-threshold calibration은 accuracy를 추가로 높였다. trustworthy하고 interpretable한 explanation은 learning 기반 및 optimization 기반 controller를 safety-critical setting에 배포하기 위한 전제조건이라는 점에서 이 결과는 중요하다. ablation을 통해 각 evidence source가 모두 필수임을 확인했고 method는 MPC 외 다른 prediction 기반 decision system으로도 일반화되지만, domain knowledge graph와 일부 domain-specific calibration이 여전히 필요하다.", "abstract": "Model Predictive Control (MPC) is widely used to operate safety-critical infrastructure by predicting future trajectories and optimizing control actions. However, nonlinear dynamics, hard safety constraints, and numerical optimization often render individual control moves opaque to human operators, undermining trust and hindering deployment. This paper presents Hierarchical Causal Abduction (HCA), which combines (i) physics-informed reasoning via domain knowledge graphs, (ii) optimization evidence from Karush-Kuhn-Tucker (KKT) multipliers, and (iii) temporal causal discovery via the PCMCI algorithm to generate faithful, human-interpretable explanations for control actions computed by nonlinear MPC. Across three diverse control applications (greenhouse climate, building HVAC, chemical process engineering) with expert validation, HCA improves explanation accuracy by 53% over LIME (0.478 vs. 0.311) using a single set of cross-domain parameters without per-domain tuning; domain-specific KKT-threshold calibration over 2-3 days further increases accuracy to 0.88. Ablation studies confirm that each evidence source is essential, with 32-37% accuracy degradation when any component is removed, and HCA's ranking-and-validation methodology generalizes beyond MPC to other prediction-based decision systems, including learning-based control and trajectory planning."}, {"id": "64751", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Identifying Partially Observed Causal Models from Heterogeneous/Nonstationary Data", "url": "https://icml.cc/virtual/2026/poster/64751", "board": "Hall A #4409", "categories": ["Causal Discovery", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Xinshuai Dong", "Haoyue Dai", "Ignavier Ng", "Peter Spirtes", "Kun Zhang"], "famous": ["Ignavier Ng", "Peter Spirtes", "Kun Zhang"], "key_idea_en": "The paper extends rank-deficiency-based causal discovery with latent variables to heterogeneous and nonstationary data through a new rank-deficiency test carrying identifiability guarantees.", "summary_en": "Recovering causal structure among latent variables is inherently hard, and existing methods that exploit rank-deficiency constraints on covariance matrices typically assume homogeneous, stationary data that real-world settings often violate. The authors formulate a class of heterogeneous and nonstationary partially observed linear causal models, prove that their distributional rank constraints are equivalent to those in the homogeneous case, and build a novel rank-deficiency test that efficiently handles heterogeneous or nonstationary data. This yields identifiability results for recovering latent-variable causal structure under heterogeneity, together with a method for detecting which variables' causal mechanisms actually shift across domains. Extending a powerful family of latent-variable discovery techniques to the common real-world case of nonstationary, multi-domain data matters precisely because applying it under a false homogeneity assumption would otherwise misfire. The approach is restricted to linear causal models, and its guarantees are validated on simulated and real-world data rather than proven optimal in finite samples.", "key_idea_ko": "rank-deficiency 기반의 latent variable causal discovery를 heterogeneous/nonstationary data로 확장하기 위해, identifiability guarantee를 갖춘 새로운 rank-deficiency test를 제안한다.", "summary_ko": "latent variable 간의 causal structure를 복원하는 것은 어려운 문제이며, covariance matrix의 rank-deficiency constraint를 활용하는 기존 방법들은 대체로 homogeneous(stationary) data를 가정하는데, 실제 데이터는 이를 흔히 위반한다. 저자들은 heterogeneous/nonstationary partially observed linear causal model의 한 class를 정식화하고, 이들의 distributional(rank) constraint가 homogeneous 경우의 constraint와 동치임을 증명한 뒤, heterogeneous/nonstationary data를 효율적으로 다룰 수 있는 새로운 rank-deficiency test를 구축한다. 이는 heterogeneity 하에서 latent-variable causal structure를 복원하기 위한 identifiability 결과와, 어떤 변수의 causal mechanism이 domain 간에 실제로 shift하는지를 탐지하는 방법을 제공한다. 강력한 latent-variable discovery 기법군을 homogeneity 가정 하에서 오작동시키는 대신, 흔히 접하는 nonstationary, multi-domain data 상황에 안전하게 적용할 수 있게 한다는 점에서 중요하다. 접근법은 linear causal model로 제한되며, 그 guarantee는 simulated 및 real-world data에서 검증되었을 뿐 finite sample에서 optimal함이 증명된 것은 아니다.", "abstract": "Estimating causal structure in the presence of latent variables is an important yet challenging problem. Recent works have shown that distributional constraints, such as rank deficiency constraints of the covariance matrices, can be exploited to recover the underlying causal structure involving latent variables. However, real-world data often exhibit heterogeneity/nonstationarity, which pose challenges to existing methods. In this work, we develop a principled approach for identifying the structure of partially observed linear causal models from heterogenous/nonstationary data. We first formulate a class of heterogenous/nonstationary, partially observed linear causal models and prove that their distributional constraints are equivalent to those in the homogeneous case. Building on this, we propose a novel rank deficiency test that can efficiently handle heterogenous/nonstationary data, and further establish identifiability results for recovering the causal structure involving latent variables. We also provide a method to identify which variables exhibit distribution shifts, i.e., whose causal mechanisms vary across domains. Experiments on simulated and real-world data validate our theoretical findings and the effectiveness of our method."}, {"id": "64535", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Learning General Causal Structures with Hidden Dynamic Process for Climate Analysis", "url": "https://icml.cc/virtual/2026/poster/64535", "board": "Hall A #4410", "categories": ["Causal Representation Learning", "Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["continuous-optimization"], "authors": ["Minghao Fu", "Biwei Huang", "Zijian Li", "Yujia Zheng", "Ignavier Ng", "Guangyi Chen", "Yingyao Hu", "Kun Zhang"], "famous": ["Biwei Huang", "Ignavier Ng", "Kun Zhang"], "key_idea_en": "CaDRe jointly identifies latent dynamic drivers and observed-variable causal structure from nonparametric time-series data, unifying causal representation learning with causal discovery for climate analysis.", "summary_en": "Standard causal representation learning recovers latent factors but ignores direct causal relations among geographically proximate observed variables, limiting its usefulness for climate analysis. The paper introduces a unified framework, instantiated as CaDRe, that jointly learns latent driving-force dynamics and observed-to-observed causal structure through a structurally constrained time-series generative model integrating causal representation learning with causal discovery. It proves joint identifiability of both the hidden dynamic process and the observed causal graph even in a fully nonparametric setting, leveraging contextual information to disambiguate the latents. On real climate datasets, CaDRe achieves competitive forecasting accuracy while recovering causal graphs that align with domain expertise, offering interpretable insight into climate systems. The theoretical identifiability claims are validated on synthetic data, and the approach depends on contextual or temporal information being informative enough to separate latent from observed causal structure.", "key_idea_ko": "CaDRe는 nonparametric time-series data로부터 latent dynamic driver와 관측 변수 간 causal structure를 동시에 identify하여 causal representation learning과 causal discovery를 통합한다.", "summary_ko": "표준 causal representation learning은 latent factor를 복원하지만 지리적으로 인접한 관측 변수들 간 direct causal relation은 무시하여 기후 분석에는 활용도가 제한된다. 이 논문은 causal representation learning과 causal discovery를 결합한 structurally constrained time-series generative model을 통해 latent driving-force dynamics와 observed-to-observed causal structure를 함께 학습하는 통합 framework, 즉 CaDRe를 제안한다. 완전히 nonparametric한 설정에서도 hidden dynamic process와 observed causal graph 모두의 joint identifiability를 증명하며, contextual information을 활용해 latent를 disambiguate한다. 실제 기후 데이터셋에서 CaDRe는 forecasting 정확도가 경쟁력이 있으면서도 domain expertise와 부합하는 causal graph를 복원하여 기후 시스템에 대한 해석 가능한 insight를 제공한다. Theoretical identifiability는 synthetic data로 검증되었으며, 이 방법은 latent와 observed causal structure를 분리할 만큼 contextual/temporal information이 충분히 informative해야 한다는 가정에 의존한다.", "abstract": "Understanding climate dynamics requires going beyond correlations in observational data to uncover their underlying causal process. Latent drivers, such as atmospheric processes, play a critical role in temporal dynamics, while direct causal influences also exist among geographically proximate observed variables. Traditional Causal Representation Learning (CRL) typically focuses on latent factors but overlooks such observable-to-observable causal relations, limiting its applicability to climate analysis. In this paper, we introduce a unified framework that jointly uncovers (i) causal relations among observed variables and (ii) latent driving forces together with their interactions. We establish conditions under which both the hidden dynamic processes and the causal structure among observed variables are simultaneously identifiable from time-series data. Remarkably, our guarantees hold even in the nonparametric setting, leveraging contextual information to recover latent variables and observable relations. Building on these insights, we propose CaDRe (Causal Discovery and Representation learning), a time-series generative model with structural constraints that integrates CRL and causal discovery. Experiments on synthetic datasets validate our theoretical results. On real-world climate datasets, CaDRe not only delivers competitive forecasting accuracy but also recovers visualized causal graphs aligned with domain expertise, thereby offering interpretable insights into climate systems."}, {"id": "61404", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Local Covariate Selection for Average Causal Effect Estimation without Pretreatment and Causal Sufficiency Assumptions", "url": "https://icml.cc/virtual/2026/poster/61404", "board": "Hall A #4412", "categories": ["Confounding & Deconfounding", "Treatment Effects & CATE"], "estimands": ["ATE"], "treatment_type": "", "discovery_types": [], "authors": ["Zeyu Liu", "Zheng Li", "Feng Xie", "Yan Zeng", "Hao Zhang", "Kun Zhang"], "famous": ["Feng Xie", "Kun Zhang"], "key_idea_en": "A local learning method selects valid covariate adjustment sets for causal effect estimation without requiring full global causal structure learning, the pretreatment assumption, or causal sufficiency.", "summary_en": "Selecting appropriate covariates for adjustment is essential for unbiased causal effect estimation, yet existing approaches typically require learning the full global causal structure, assume no latent variables, or impose the pretreatment assumption restricting covariates to those unaffected by treatment or outcome. This paper instead characterizes the local existence boundary of adjustment sets and develops a local learning method for covariate selection that accommodates latent variables and drops the pretreatment assumption. Its central result is a proof that the method is sound and complete under standard assumptions, supported by validation on synthetic and real-world datasets. This makes nonparametric causal effect estimation more computationally efficient and applicable to realistic settings with latent confounders and treatment-affected covariates. The approach still relies on standard local causal identification assumptions and has been tested primarily on the reported synthetic and real-world benchmarks.", "key_idea_ko": "전체 global causal structure를 학습하지 않고도 causal effect estimation을 위한 valid한 covariate adjustment set을 선택하는 local learning 방법으로, pretreatment 가정이나 causal sufficiency를 요구하지 않는다.", "summary_ko": "unbiased causal effect estimation을 위해서는 적절한 covariate 조정이 필수적이지만, 기존 접근은 대개 전체 global causal structure 학습을 요구하거나 latent variable이 없다고 가정하거나, treatment나 outcome의 영향을 받지 않는 covariate로 제한하는 pretreatment 가정을 부과한다. 논문은 adjustment set의 local existence boundary를 characterize하고, latent variable을 수용하면서 pretreatment 가정을 제거한 local learning 기반 covariate selection 방법을 개발한다. 표준 가정 하에서 이 방법이 sound하고 complete함을 증명하며, synthetic 및 real-world dataset에서 검증한다. latent confounder와 treatment-affected covariate가 존재하는 현실적인 setting에서 nonparametric causal effect estimation을 계산적으로 더 효율적이고 적용 가능하게 만든다. 이 접근 역시 표준 local causal identification 가정에 의존하며, 주로 논문에서 제시한 synthetic 및 real-world benchmark로만 테스트되었다.", "abstract": "Causal effect estimation is a fundamental task in many scientific fields. Selecting appropriate covariates for adjustment is crucial for obtaining unbiased causal effects. However, most existing methods either rely on learning the global causal structure, assume the absence of latent variables, or impose the pretreatment assumption-restricts covariates to those unaffected by the treatment or outcome. These assumptions are often unrealistic in real-world scenarios, and global structure learning can be computationally intensive and inefficient. To address these challenges, we first characterize the local existence boundary of adjustment sets for causal effect estimation. Based on this characterization, we develop a novel local learning method for covariate selection in nonparametric causal effect estimation. This method accommodates the presence of latent variables and eliminates the need for the pretreatment assumption. We prove that the proposed method is both sound and complete under standard assumptions. Its effectiveness is validated through extensive experiments on both synthetic and real-world datasets."}, {"id": "65660", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "PACER: Acyclic Causal Discovery from Large-scale Interventional Data", "url": "https://icml.cc/virtual/2026/poster/65660", "board": "Hall A #4414", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["continuous-optimization", "intervention-based"], "authors": ["Ramon Vinas Torne", "Silvia Fabregas Salazar", "Soyon Park", "Ivo Alexander Ban", "Artyom Gadetsky", "Nikita Doikov", "Maria Brbic"], "famous": [], "key_idea_en": "PACER is a causal discovery framework that guarantees DAG acyclicity by construction, via permutations and edge probabilities, and derives closed-form interventional log-likelihood gradients for linear-Gaussian models to scale to thousands of variables.", "summary_en": "Learning DAG structure from data is central to causal discovery, and the task becomes especially difficult in high-dimensional settings where interventional data are plentiful but existing penalty-based acyclicity constraints do not scale well. PACER parameterizes distributions over DAGs using variable permutations and edge probabilities, which guarantees acyclicity by construction rather than through a soft penalty. For linear-Gaussian mechanisms, the authors derive closed-form expressions for the expected interventional log-likelihood and its gradients, yielding substantial computational savings over prior approaches. The method achieves improved accuracy on protein-signaling and genetic-perturbation benchmarks while scaling to networks with thousands of variables, a regime where earlier penalty-based methods struggle. Because the closed-form gradient derivation is specific to linear-Gaussian mechanisms, extension to nonlinear or non-Gaussian settings falls outside the guarantees stated here.", "key_idea_ko": "PACER는 permutation과 edge probability를 통해 acyclicity를 구조적으로 보장하는 DAG-structured causal discovery framework이며, linear-Gaussian model에 대한 closed-form interventional log-likelihood gradient를 도출하여 수천 개 변수로 scale한다.", "summary_ko": "문제는 데이터로부터 DAG structure를 학습하는 것이 causal discovery의 핵심 문제이며, large-scale interventional data가 있는 high-dimensional setting에서는 기존 penalty-based acyclicity constraint가 잘 scale되지 않아 특히 어려워진다는 점이다. 핵심 아이디어는 PACER가 variable permutation과 edge probability를 이용해 DAG에 대한 distribution을 parameterize하여, soft penalty가 아니라 구조적으로 acyclicity를 보장하는 것이다. 주요 기술적 결과는 linear-Gaussian mechanism에 대해 저자들이 expected interventional log-likelihood와 그 gradient의 closed-form 표현을 도출하여 기존 방법 대비 상당한 계산 절감을 얻으며, 이 방법이 protein-signaling 및 genetic-perturbation benchmark에서 향상된 정확도를 보이면서 수천 개 변수를 가진 network까지 scale된다는 것이다. 이는 기존 penalty-based method가 어려움을 겪던 regime에서도 causal discovery를 가능하게 한다는 점에서 중요하다. closed-form gradient 도출은 linear-Gaussian mechanism에 특화되어 있어, nonlinear 또는 non-Gaussian setting으로의 확장은 제시된 guarantee 범위에 포함되지 않는다.", "abstract": "Inferring the structure of directed acyclic graphs (DAGs) from data is a central challenge in causal discovery, particularly in modern high-dimensional settings where large-scale interventional data are increasingly available. PACER is a framework that guarantees acyclicity by construction through parameterizing distributions over DAGs using variable permutations and edge probabilities. For linear-Gaussian mechanisms, the authors derive closed-form expressions for the expected interventional log-likelihood and its gradients, yielding substantial computational gains. The method demonstrates improved performance on protein signaling and genetic perturbation benchmarks while achieving significant speedups compared to existing penalty-based approaches, successfully scaling to networks containing thousands of variables."}, {"id": "61300", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Partial Identification under High-Dimensional Potential Outcomes and Confounders via Optimal Transport", "url": "https://icml.cc/virtual/2026/poster/61300", "board": "Hall A #4415", "categories": ["Identification & Partial ID", "Confounding & Deconfounding"], "estimands": ["joint of POs"], "treatment_type": "", "discovery_types": [], "authors": ["Yunfeng Wang", "Zhiheng Zhang", "Zijun Gao"], "famous": [], "key_idea_en": "The paper introduces an optimal-transport partial-identification estimator that decomposes the transport problem into a low-dimensional signal subspace plus a high-dimensional residual recovered via Sliced Wasserstein distance, avoiding the curse of dimensionality that afflicts existing OT-based causal bounds.", "summary_en": "Optimal-transport-based partial identification gives informative causal bounds when point identification fails, but becomes computationally and statistically intractable when both potential outcomes and confounders are high-dimensional. The proposed method decomposes the transport problem into a low-dimensional signal subspace and a high-dimensional residual subspace, recovering the residual transport energy via the computationally efficient Sliced Wasserstein distance rather than discarding it, as prior projection-based methods do. This yields interpretable conditions bounding the approximation gap in terms of residual structure and a data-driven rule for choosing the signal dimension. The result is tighter, more informative, non-vacuous causal bounds than projection-only baselines while remaining tractable in high dimensions. The approach still relies on a signal/residual decomposition assumption and is validated empirically against projection-based baselines rather than against a ground-truth high-dimensional benchmark.", "key_idea_ko": "고차원 potential outcome과 confounder 하에서 optimal transport 문제를 저차원 signal subspace와 Sliced Wasserstein distance로 복원되는 고차원 residual로 분해하는 partial-identification estimator를 제안하여, 기존 OT 기반 causal bound가 겪는 curse of dimensionality를 피한다.", "summary_ko": "optimal-transport 기반 partial identification은 point identification이 실패할 때 informative한 causal bound를 제공하지만, potential outcome과 confounder가 모두 고차원일 때는 계산적으로나 통계적으로 다루기 어려워진다. 이 논문의 핵심 아이디어는 transport 문제를 저차원 signal subspace와 고차원 residual subspace로 분해하고, 기존 projection 기반 방법들처럼 residual을 버리는 대신 계산적으로 효율적인 Sliced Wasserstein distance를 통해 residual transport energy를 복원하는 것이다. 주요 기술적 결과는 residual structure 관점에서 approximation gap을 bound하는 해석 가능한 조건과 signal dimension을 선택하는 data-driven rule이다. 이는 고차원에서도 tractability를 유지하면서 projection-only baseline보다 더 tight하고 informative한(non-vacuous) causal bound를 산출한다는 점에서 의의가 있다. 이 접근법은 여전히 signal/residual 분해 가정에 의존하며, ground-truth 고차원 benchmark가 아닌 projection 기반 baseline과의 경험적 비교를 통해 검증되었다.", "abstract": "Partial identification provides informative causal guarantees when point identification is impossible, but existing approaches based on optimal transport (OT) become computationally and statistically intractable in high-dimensional settings. This limitation is particularly severe when both potential outcomes and confounders are high-dimensional, where classical OT-based bounds suffer from the curse of dimensionality and unfavorable convergence rates. To address this challenge, we propose a novel estimator that decomposes the transport problem into a low-dimensional signal subspace and a high-dimensional residual subspace. Unlike existing projection-based methods that discard residual information, we recover the residual transport energy using the Sliced Wasserstein distance, which is computationally efficient and robust to high dimensions. We establish interpretable conditions controlling the approximation gap based on residual structure and provide a data-driven rule for signal dimension selection. Empirical results show that our estimator consistently outperforms projection-only baselines by recovering lost transport energy, yielding more informative causal bounds while remaining computationally tractable in high dimensions."}, {"id": "61833", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Skewness-Robust Causal Discovery in Location-Scale Noise Models", "url": "https://icml.cc/virtual/2026/poster/61833", "board": "Hall A #4416", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["functional causal model"], "authors": ["Daniel Klippert", "Alexander Marx"], "famous": [], "key_idea_en": "SkewD is a likelihood-based bivariate (and extendable multivariate) causal discovery method for location-scale noise models that remains accurate when the noise distribution is skewed rather than symmetric.", "summary_en": "Distinguishing Markov equivalent graphs in causal discovery requires restricting the structural causal model, and location-scale noise models (LSNMs), where Y = f(X) + g(X)N, are a flexible and often identifiable choice, but existing estimation methods commonly assume N is symmetric. The authors show that when the true noise N is skewed, a realistic scenario in real-world data, these symmetric-noise methods lose accuracy. They propose SkewD, which extends the estimation framework from the normal distribution to the skew-normal distribution, using a combination of heuristic search and expectation conditional maximization to fit parameters under both symmetric and skewed noise. This broadens the practical applicability of LSNM-based causal discovery to noisier, less idealized real-world settings. The method's main focus and validation are on the bivariate cause-effect case, with only a further extension sketched for the multivariate setting.", "key_idea_ko": "location-scale noise model에서 noise distribution이 대칭이 아니라 skewed일 때에도 정확도를 유지하는 likelihood 기반 bivariate(및 확장 가능한 multivariate) causal discovery 방법 SkewD를 소개한다.", "summary_ko": "causal discovery에서 Markov equivalent graph를 구별하려면 structural causal model에 제약을 가해야 하며, location-scale noise model(LSNM, Y = f(X) + g(X)N)은 유연하고 흔히 identifiable한 선택이지만 기존 추정 방법은 대체로 N이 symmetric하다고 가정한다. 저자들은 실제 데이터에서 흔히 나타나는 시나리오인 true noise N이 skewed일 때 이러한 symmetric-noise 방법이 정확도를 잃는다는 것을 보인다. 이들은 normal distribution에서 skew-normal distribution으로 추정 framework를 확장한 SkewD를 제안하며, heuristic search와 expectation conditional maximization을 결합해 symmetric noise와 skewed noise 모두에서 parameter를 적합한다. 이는 LSNM 기반 causal discovery의 실용적 적용 범위를 더 noisy하고 덜 idealized한 real-world setting으로 넓힌다는 점에서 의미가 있다. 방법의 주요 초점과 검증은 bivariate cause-effect case에 있으며, multivariate setting으로의 확장은 개략적으로만 제시된다.", "abstract": "To distinguish Markov equivalent graphs in causal discovery, it is necessary to restrict the structural causal model. A flexible class of models that is general and identifiable in most cases are location-scale noise models (LSNMs), in which the effect Y is modeled based on its causes X as Y = f(X) + g(X)N. To facilitate the estimation of these models, a prominent assumption is that the noise variable N follows a symmetric distribution. We show that when N is a skewed random variable, which is likely in real-world domains, such approaches drop in performance. To address this limitation, we propose SkewD, a likelihood-based method for causal discovery under LSNMs with skewed noise, employing a combination of heuristic search and expectation conditional maximization for parameter estimation. SkewD extends the usual normal distribution framework to the skew-normal setting, enabling reliable inference under symmetric and skewed noise. While our main focus is on bivariate cause-effect inference, we further showcase how SkewD can be extended to the multivariate setting."}, {"id": "67168", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Position: VLM Causal Reasoning Benchmarks Should Probe Temporal Understanding, Not Presume It", "url": "https://icml.cc/virtual/2026/poster/67168", "board": "HALL A #2713", "categories": ["Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Chinh Hoang", "Mohammad Hasan"], "famous": [], "key_idea_en": "The position paper argues that VLM causal-reasoning benchmarks wrongly presume temporal understanding and scaffolding-independent competence, and proposes diagnostics that test these foundations directly rather than relying on output accuracy alone.", "summary_en": "Benchmarks for vision-language model (VLM) causal reasoning presuppose, without testing, that models understand time as the medium through which causes produce effects and that causal performance reflects internalized capability rather than reliance on external symbolic scaffolding. The paper proposes diagnostics, drawing on frameworks from art, philosophy, and psychoanalysis, that directly probe temporal constitution and scaffolding-invariance, meaning robustness to changes in scaffolding as a signature of genuine internalization. A preliminary evaluation of three VLMs finds a systematic gap between fluent causal-sounding text and valid causal structure, along with qualitatively different responses to identical scaffolding manipulations, and none of the models shows constitutive internalization. These findings challenge the field to redesign causal-reasoning benchmarks so that surface accuracy is not mistaken for genuine causal competence. As a position paper, its empirical support is preliminary and limited to three models rather than a full benchmark suite.", "key_idea_ko": "VLM causal-reasoning benchmark가 temporal understanding과 scaffolding-independent competence를 부당하게 전제하고 있다고 주장하며, output accuracy만이 아니라 이 두 기반을 직접 검증하는 diagnostic을 제안한다.", "summary_ko": "본 논문이 다루는 문제는 vision-language model(VLM)의 causal reasoning benchmark가 두 가지를 검증 없이 전제한다는 점이다. 하나는 model이 원인이 결과를 만들어내는 매개체로서의 time을 이해한다는 것이고, 다른 하나는 causal performance가 외부 symbolic scaffolding에 대한 의존이 아니라 내재화된 capability를 반영한다는 것이다. 핵심 아이디어는 예술, 철학, 정신분석학의 framework를 끌어와 temporal constitution과 scaffolding-invariance(scaffolding 변화에 대한 강건성을 진정한 internalization의 signature로 보는 것)를 직접 검증하는 diagnostic을 제안하는 것이다. 주요 결과로, 3개 VLM에 대한 예비 평가에서 유창하게 causal처럼 들리는 text와 valid한 causal structure 사이에 체계적인 격차가 있으며, 동일한 scaffolding 조작에 대해 질적으로 다른 반응을 보이고, 어느 model도 constitutive internalization을 보이지 않았음을 발견했다. 이는 표면적인 accuracy를 진정한 causal competence로 오인하지 않도록 causal-reasoning benchmark를 재설계하라는 문제 제기라는 점에서 중요하며, position paper인만큼 경험적 근거는 예비적이고 3개 model에 국한되어 있어 전면적인 benchmark suite는 아니다.", "abstract": "This position paper argues that vision-language model (VLM) benchmarks for causal reasoning rely on two under-examined assumptions. First, benchmarks presuppose temporal constitution, the understanding of time as the medium through which causes produce effects, without testing it as a prerequisite. Second, they insufficiently distinguish external symbolic scaffolding from internalized capability; scaffolding-invariance is the diagnostic signature of genuine internalization. Drawing on frameworks from art, philosophy, and psychoanalysis, we propose diagnostics that probe these foundations. Preliminary evidence from three VLMs shows systematic disparity between fluent causal text and valid causal structure, and qualitatively different responses to identical scaffolding manipulation. None of these patterns indicates constitutive internalization. Progress requires benchmarks that test temporal understanding and scaffolding-invariance, not only output accuracy."}, {"id": "66542", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "The Abstraction Gap in Vision-Language Causal Reasoning", "url": "https://icml.cc/virtual/2026/poster/66542", "board": "Hall A #4306", "categories": ["Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Chinh Hoang", "Mohammad Hasan"], "famous": [], "key_idea_en": "The Abstraction Gap metric and CAGE benchmark show that vision-language models produce fluent causal explanations without genuine structural causal understanding.", "summary_en": "Whether vision-language models' fluent causal explanations of visual scenes reflect real structural causal understanding, or merely plausible-sounding language, has remained unclear. The authors propose a dual-probe methodology - a Text-Only Probe measuring linguistic plausibility and a Chain-Text Probe requiring explicit causal chains before answers - and define the Abstraction Gap (AG) as the normalized performance difference between the two, evaluated via CAGE, a 49,500-question benchmark spanning Pearl's causal hierarchy over 5,500 images. Across eight VLMs, seven show an AG exceeding 0.50, scoring 6-8 on free text but below 2.5 on explicit chains and often producing blank chains, and fine-tuning on 45,000 chain-annotated examples fails to close this gap. The findings indicate that current VLMs optimize for plausible-sounding causal language rather than faithful structural reasoning, and that chain supervision alone cannot instill this capability - a result with implications for how causal reasoning should be evaluated and trained in multimodal models. The study is limited to eight VLMs and a specific probe design; it diagnoses the gap without proposing a training method that successfully closes it.", "key_idea_ko": "Abstraction Gap 지표와 CAGE benchmark를 도입하여, vision-language model이 진정한 structural causal understanding 없이도 유창한 causal explanation을 산출함을 보인다.", "summary_ko": "vision-language model이 산출하는 시각 장면에 대한 유창한 causal explanation이 실제 structural causal understanding을 반영하는지, 아니면 그럴듯하게 들리는 language에 불과한지는 불분명했다. 저자들은 linguistic plausibility를 측정하는 Text-Only Probe와 답변 전에 명시적 causal chain을 요구하는 Chain-Text Probe로 구성된 dual-probe 방법론을 제안하고, 두 probe 간 성능 차이를 정규화한 Abstraction Gap(AG)을 정의하며, 이를 5,500개 이미지에 걸친 Pearl's causal hierarchy를 다루는 49,500개 질문 규모의 CAGE benchmark로 평가한다. 여덟 개 VLM 중 일곱 개가 0.50을 넘는 AG를 보이는데(free text에서는 6-8점을 받으면서도 explicit chain에서는 2.5점 미만을 받고 종종 빈 chain을 출력), 45,000개의 chain-annotated example로 fine-tuning해도 이 gap은 좁혀지지 않는다. 이 결과는 현재의 VLM이 faithful한 structural reasoning이 아니라 그럴듯하게 들리는 causal language를 산출하도록 최적화되어 있으며 chain supervision만으로는 이러한 능력을 심어줄 수 없음을 시사하며, 이는 multimodal model에서 causal reasoning을 어떻게 평가하고 학습시켜야 하는가에 중요한 함의를 갖는다. 이 연구는 여덟 개의 VLM과 특정 probe design으로 범위가 제한되며, gap을 진단할 뿐 이를 성공적으로 해소하는 학습 방법을 제안하지는 않는다.", "abstract": "Vision-language models (VLMs) generate fluent causal explanations for visual scenes, but does this fluency reflect genuine structural understanding? We address this question through a dual-probe methodology that isolates plausibility from faithfulness. The Text-Only Probe measures linguistic quality; the Chain-Text Probe requires models to first generate explicit causal chains before text responses. We define the Abstraction Gap (AG) metric as the normalized performance difference between probes, operationalizing the plausibility-faithfulness distinction from explainable AI research. Applying this methodology to eight VLMs using CAGE (Causal Abstraction Gap Evaluation), a benchmark of 49,500 questions across 5,500 images spanning Pearl's causal hierarchy, we find seven models exhibit AG exceeding 0.50: scoring 6-8 on text but below 2.5 on chains, often producing blank outputs. Fine-tuning on 45,000 chain-annotated examples fails to close the gap, indicating that explicit chain supervision cannot instill structural abstraction capability. Current VLMs optimize for plausible language without faithful structural understanding."}, {"id": "62582", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Should I Have Expressed a Different Intent? Counterfactual Generation for LLM-Based Autonomous Control", "url": "https://icml.cc/virtual/2026/poster/62582", "board": "Hall A #3506", "categories": ["Causal Reasoning in LLMs/Agents", "Counterfactual Inference"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Amirmohammad Farzaneh", "Salvatore D'oro", "Osvaldo Simeone"], "famous": [], "key_idea_en": "Conformal counterfactual generation (CCG) models an LLM-agent-environment loop as a structural causal model and produces calibrated counterfactual-outcome sets answering 'what if I had phrased my intent differently' with coverage guarantees.", "summary_en": "After an LLM-based agent acts on a user's stated intent and an outcome is observed, users may want to know what would have happened had they phrased their intent differently, yet agentic LLM pipelines offer no principled way to answer such counterfactual queries. The authors model the closed-loop interaction between user, LLM agent, and environment as a structural causal model, and use test-time scaling with probabilistic abduction to generate multiple candidate counterfactual outcomes. An offline conformal calibration phase then yields CCG, producing sets of counterfactual outcomes guaranteed to contain the true counterfactual outcome with high probability. This gives formal reliability guarantees for what-if-I-said-it-differently reasoning in real agentic control systems, rather than relying on ad hoc re-execution. The method is demonstrated only on a wireless network control use case against naive re-execution baselines, so its generality to other control domains remains untested.", "key_idea_ko": "conformal counterfactual generation(CCG)은 LLM-agent-환경 loop을 structural causal model로 modeling하여 의도를 다르게 표현했다면 어떻게 되었을지에 답하는, coverage guarantee를 가진 calibrated counterfactual-outcome set을 생성한다.", "summary_ko": "LLM 기반 agent가 사용자의 명시된 intent에 따라 행동하고 outcome이 관측된 이후, 사용자는 intent를 다르게 표현했다면 어떤 일이 일어났을지 알고 싶어할 수 있지만, agentic LLM pipeline은 이러한 counterfactual query에 답할 원칙적인 방법을 제공하지 않는다. 저자들은 user, LLM agent, 환경 간의 closed-loop interaction을 structural causal model로 modeling하고, probabilistic abduction을 활용한 test-time scaling으로 여러 candidate counterfactual outcome을 생성한다. 이어지는 offline conformal calibration 단계는 conformal counterfactual generation(CCG)을 산출하는데, 이는 true counterfactual outcome을 높은 확률로 포함한다고 보장되는 counterfactual outcome의 집합을 생성한다. ad hoc한 재실행에 의존하는 대신, 실제 agentic control system에서 다르게 말했다면 어땠을까라는 reasoning에 formal reliability guarantee를 부여한다는 점에서 의의가 있다. 이 방법은 wireless network control이라는 하나의 use case에서 naive re-execution baseline과의 비교로만 시연되었으므로, 다른 control domain으로의 generality는 아직 검증되지 않았다.", "abstract": "Large language model (LLM)-powered agents can translate high-level user intents into plans and actions in an environment. Yet after observing an outcome, users may wonder: What if I had phrased my intent differently? We introduce a framework that enables such counterfactual reasoning in agentic LLM-driven control scenarios, while providing formal reliability guarantees. Our approach models the closed-loop interaction between a user, an LLM-based agent, and an environment as a structural causal model (SCM), and leverages test-time scaling to generate multiple candidate counterfactual outcomes via probabilistic abduction. Through an offline calibration phase, the proposed conformal counterfactual generation (CCG) yields sets of counterfactual outcomes that are guaranteed to contain the true counterfactual outcome with high probability. We showcase the performance of CCG on a wireless network control use case, demonstrating significant advantages compared to naive re-execution baselines."}, {"id": "65217", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Outcome-Aware Spectral Feature Learning for Instrumental Variable Regression", "url": "https://icml.cc/virtual/2026/poster/65217", "board": "Hall A #4413", "categories": ["Confounding & Deconfounding", "Treatment Effects & CATE"], "estimands": ["dose-response"], "treatment_type": "continuous", "discovery_types": [], "authors": ["Dimitri Meunier", "Jakub Wornbard", "Vladimir Kostic", "Antoine Moulin", "Alek Frohlich", "Karim Lounici", "Massimiliano Pontil", "Arthur Gretton"], "famous": ["Arthur Gretton"], "key_idea_en": "Augmented Spectral Feature Learning makes instrumental-variable regression outcome-aware through a contrastive objective, correcting the failures that outcome-agnostic spectral methods suffer under spectral misalignment.", "summary_en": "Nonparametric instrumental variable regression must recover causal effects under hidden confounding, yet existing spectral-feature estimators learn features from the top singular subspaces of the treatment-instrument operator without ever consulting the outcome. Augmented Spectral Feature Learning instead makes feature learning outcome-aware by minimizing a novel contrastive loss derived from an augmented operator that incorporates outcome information. A theoretical analysis shows the resulting method stays effective even when the true causal function aligns poorly with the dominant singular functions, a spectral-misalignment regime that defeats prior outcome-agnostic approaches. By removing this dependence on favorable spectral alignment, the approach makes spectral IV methods considerably more robust in realistic settings where the causal function need not concentrate on the instrument-treatment relationship's leading directions. The method is validated on challenging benchmarks but remains confined to the nonparametric IV setting under standard IV validity assumptions.", "key_idea_ko": "outcome-agnostic spectral feature 방법이 spectral misalignment 하에서 실패하는 문제를 해결하기 위해, instrumental variable regression을 위한 outcome-aware contrastive objective인 Augmented Spectral Feature Learning을 제안한다.", "summary_ko": "hidden confounding 하에서 nonparametric instrumental variable (IV) regression을 통한 causal effect 추정이 문제이며, 기존 spectral-feature estimator들은 outcome 정보를 고려하지 않은 채 treatment-instrument operator의 top singular subspace만을 span하는 feature를 학습한다. 핵심 아이디어는 outcome 정보를 포함한 augmented operator로부터 유도된 새로운 contrastive loss를 최소화하여 feature learning을 outcome-aware하게 만드는 것이다. 주요 기술적 결과는 true causal function이 dominant singular function들과 잘 정렬되지 않는 spectral misalignment 상황에서도 이 방법이 효과적임을 이론적으로 보인다는 점이며, 이는 기존 outcome-agnostic 접근법의 실패 모드였다. instrument-treatment 관계의 top singular direction에 causal function이 집중되지 않는 현실적인 설정에서도 spectral IV 방법의 robustness를 높인다는 점에서 의미가 있다. 어려운 벤치마크에서 검증되었으나, standard IV validity assumption을 따르는 nonparametric IV setting으로 범위가 한정된다.", "abstract": "We address the problem of causal effect estimation in the presence of hidden confounders using nonparametric instrumental variable (IV) regression. An established approach is to use estimators based on learned spectral features, that is, features spanning the top singular subspaces of the operator linking treatments to instruments. While powerful, such features are agnostic to the outcome variable. Consequently, the method can fail when the true causal function is poorly represented by these dominant singular functions. To mitigate, we introduce Augmented Spectral Feature Learning, a framework that makes the feature learning process outcome-aware. Our method learns features by minimizing a novel contrastive loss derived from an augmented operator that incorporates information from the outcome. By learning these task-specific features, our approach remains effective even under spectral misalignment. We provide a theoretical analysis of this framework and validate our approach on challenging benchmarks."}, {"id": "66223", "session": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "GUDA: Counterfactual Group-wise Training Data Attribution for Diffusion Models via Unlearning", "url": "https://icml.cc/virtual/2026/poster/66223", "board": "Hall A #2701", "categories": ["Counterfactual Inference", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Naoki Murata", "Yuhta Takida", "Chieh-Hsin Lai", "Toshimitsu Uesaka", "Bac Nguyen", "Stefano Ermon", "Yuki Mitsufuji"], "famous": [], "key_idea_en": "GUDA estimates group-level training-data attribution for diffusion models by approximating leave-one-group-out retraining through machine unlearning on a single shared base model.", "summary_en": "Training-data attribution for generative vision models typically scores individual examples, yet practitioners often need group-level attribution (e.g., a style or class), which is naturally posed as a counterfactual question about how the model would behave had a group been excluded from training. Since the gold-standard counterfactual, leave-one-group-out (LOGO) retraining, becomes computationally prohibitive as the number of groups grows, GUDA instead applies machine unlearning to a single shared full-data model to approximate each group-removal counterfactual, scoring group influence via the ELBO difference between the full model and its unlearned counterpart. On CIFAR-10 and Stable Diffusion style attribution, GUDA identifies contributing groups more reliably than similarity- or gradient-based attribution and instance-level unlearning, while running roughly 100x faster than LOGO retraining on CIFAR-10. This brings group-wise counterfactual attribution within practical reach at scale, supporting audits of style and data provenance in diffusion models. Its fidelity nonetheless hinges on how closely unlearning approximates true retraining, and the evaluation so far covers only CIFAR-10 and a single Stable Diffusion style-attribution setting.", "key_idea_ko": "GUDA는 diffusion model에서 leave-one-group-out retraining을 machine unlearning으로 근사하여 group 단위 training-data attribution을 추정한다.", "summary_ko": "Generative vision model의 training-data attribution은 보통 개별 example 단위로 계산되지만, 실무에서는 스타일이나 클래스 같은 group 단위 attribution이 필요하며 이는 자연스럽게 counterfactual 질문(해당 group을 training에서 제외하면 모델이 어떻게 달라지는가)으로 정식화된다. Gold-standard인 Leave-One-Group-Out(LOGO) retraining은 group 수가 늘어나면 계산 비용이 지나치게 커지므로, GUDA는 하나의 공유된 full-data model에 machine unlearning을 적용해 각 group 제거 counterfactual을 근사한다. GUDA는 full model과 unlearned counterfactual 간 ELBO 차이로 group influence를 점수화하며, CIFAR-10과 Stable Diffusion style attribution 실험에서 similarity 기반, gradient 기반 attribution 및 instance-level unlearning보다 기여 group을 더 안정적으로 식별하고 CIFAR-10에서 LOGO retraining 대비 약 100배 빠르다. 이는 group-wise counterfactual attribution을 대규모로 실용화하여 diffusion model의 style 및 data provenance 감사(auditing)에 유용하다. 이 방법의 정확도는 unlearning이 실제 retraining을 얼마나 잘 근사하는지에 좌우되며, 평가는 CIFAR-10과 Stable Diffusion을 사용한 하나의 style-attribution 세팅에 국한된다.", "abstract": "Training-data attribution for vision generative models aims to identify which training data influenced a given output. While most methods score individual examples, practitioners often need group-level answers (e.g., artistic styles or object classes). Group-wise attribution is counterfactual: how would a model's behavior on a generated sample change if a group were absent from training? A natural realization of this counterfactual is Leave-One-Group-Out (LOGO) retraining, which retrains the model with each group removed; however, it becomes computationally prohibitive as the number of groups grows. We propose GUDA (Group Unlearning-based Data Attribution) for diffusion models, which approximates each counterfactual model by applying machine unlearning to a shared full-data model instead of training from scratch. GUDA quantifies group influence using differences in a likelihood-based scoring rule (ELBO) between the full model and each unlearned counterfactual. Experiments on CIFAR-10 and artistic style attribution with Stable Diffusion show that GUDA identifies primary contributing groups more reliably than semantic similarity, gradient-based attribution, and instance-level unlearning approaches, while achieving ~100x speedup on CIFAR-10 over LOGO retraining."}, {"id": "61202", "session": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal-Adapter: Taming Text-to-Image Diffusion for Faithful Counterfactual Generation", "url": "https://icml.cc/virtual/2026/poster/61202", "board": "Hall A #2714", "categories": ["Counterfactual Inference", "Causal Representation Learning"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Lei Tong", "Zhihua Liu", "Chaochao Lu", "Dino Oglic", "Tom Diethe", "Philip Teare", "Sotirios Tsaftaris", "Chen Jin"], "famous": ["Chaochao Lu"], "key_idea_en": "Causal-Adapter is a modular adapter for frozen text-to-image diffusion backbones that uses structural causal modeling plus two regularizers to generate faithful counterfactual images by editing one attribute while preserving identity and other attributes.", "summary_en": "Editing text-to-image diffusion outputs through prompts alone struggles to change a single causal attribute without triggering unintended changes to identity or other attributes. Causal-Adapter attaches a structural-causal-model-guided adapter to a frozen diffusion backbone, combining prompt-aligned injection for precise semantic control with a conditioned token contrastive loss that suppresses spurious correlations. Across synthetic and real benchmarks, it achieves superior effectiveness, compositionality, realism, and minimality scores compared with prior counterfactual image editing methods. This provides an efficient, generalizable route to faithful counterfactual image generation, useful for causal representation learning and dataset augmentation, without retraining the backbone. The method builds on frozen pretrained diffusion backbones, and its causal structure is specified or assumed rather than discovered from data.", "key_idea_ko": "frozen text-to-image diffusion backbone에 structural causal model 기반 adapter와 두 가지 regularizer를 부착하여, identity와 다른 attribute를 보존하면서 하나의 attribute만 편집해 faithful한 counterfactual image를 생성한다.", "summary_ko": "prompt만으로 text-to-image diffusion 모델을 counterfactual하게 편집하면 하나의 causal attribute만 바꾸면서 identity나 다른 attribute의 의도치 않은 변화를 막기 어렵다. Causal-Adapter는 structural causal model에 기반한 adapter를 frozen diffusion backbone에 부착하고, prompt-aligned injection으로 정밀한 semantic control을 수행하며 conditioned token contrastive loss로 spurious correlation을 억제한다. synthetic과 real benchmark 전반에서 기존 counterfactual image editing 방법 대비 effectiveness, compositionality, realism, minimality 지표에서 우수한 성능을 보인다. backbone을 재학습하지 않고도 faithful한 counterfactual image generation을 위한 효율적이고 generalizable한 방법을 제공하여, causal representation learning과 dataset augmentation에 유용하다. frozen pretrained diffusion backbone에 의존하며, causal structure는 데이터로부터 discovery되는 것이 아니라 사전에 specify/가정된다.", "abstract": "We present Causal-Adapter, a modular framework that adapts frozen text-to-image diffusion backbones for counterfactual image generation. The method enables causal modifications to specific image attributes while maintaining other visual elements and core identity. Rather than depending solely on text prompts, it employs structural causal modeling combined with two regularization techniques: prompt-aligned injection for precise semantic control and a conditioned token contrastive loss to reduce spurious correlations. The approach achieves superior performance across synthetic and real-world benchmarks in metrics including effectiveness, composition, realism, and minimality, enabling efficient, robust, and generalizable counterfactual image editing."}, {"id": "64495", "session": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Mind Dreamer: Untethering Imagination via Active Counterfactual Reasoning on Latent Manifolds", "url": "https://icml.cc/virtual/2026/poster/64495", "board": "Hall A #303", "categories": ["Counterfactual Inference", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Shaojun Xu", "Xiaoling Zhou", "Fangzhou Guo", "Yapeng Meng", "Xinglong Ji", "Luping Shi", "Rong Zhao"], "famous": [], "key_idea_en": "Mind Dreamer is a model-based RL framework that uses a latent-space do-operator to generate counterfactual 'latent jumps' beyond observed states, paired with new Bellman-style value and uncertainty functions to accelerate exploration.", "summary_en": "Model-based reinforcement learning typically initializes imagination from observed states, which creates a mismatch under sparse rewards: the world model discovers the environment's manifold faster than the policy can exploit it. Mind Dreamer (MD) addresses this through Active Counterfactual Reasoning, applying a latent-space do-operator with an adversarial generator to synthesize physically plausible but non-continuous jumps into unexplored regions of latent space, and introduces Relay Value and Relay Uncertainty Functions to propagate value and uncertainty across these discontinuities. A key theoretical result shows that propagating uncertainty across such jumps requires a quadratic discount factor, which formalizes an epistemic horizon and lets the method act as an optimal importance sampler that shrinks hitting times to bottleneck states. Empirically, MD delivers a 1.67x average speedup over DreamerV3 on the DeepMind Control Suite, rising to 8.8x in sparse-reward tasks. This tackles a fundamental exploration bottleneck in imagination-based RL rather than simply tuning existing dreaming methods, though its benefits depend on the counterfactual generator producing plausible latent states and have so far been evaluated mainly on standard continuous-control benchmarks.", "key_idea_ko": "Mind Dreamer는 latent-space do-operator를 사용해 관측된 state를 벗어나는 counterfactual latent jump를 생성하고, 새로운 Bellman-style value/uncertainty function으로 exploration을 가속하는 model-based RL framework를 제안한다.", "summary_ko": "문제는 model-based reinforcement learning이 일반적으로 관측된 state에서 imagination을 시작하여, world model이 policy가 활용할 수 있는 속도보다 빠르게 environment manifold를 발견하는 mismatch를 초래하며 이는 sparse reward 하에서 특히 문제가 된다는 점이다. 핵심 아이디어는 Mind Dreamer(MD)를 제안하는 것으로, latent-space do-operator와 adversarial generator를 적용해 물리적으로 그럴듯하지만 non-continuous한 latent jump를 미탐색 영역으로 합성하는 Active Counterfactual Reasoning을 수행하고, 이러한 discontinuity에 걸쳐 value와 uncertainty를 전파하는 Relay Value and Relay Uncertainty Function을 도출한다. 주요 기술적 결과는 이러한 jump에 걸친 uncertainty propagation이 quadratic discount factor를 요구한다는 것으로 이는 epistemic horizon을 formalize하며, 이 방법이 bottleneck state까지의 hitting time을 줄이는 optimal importance sampler로 작동함을 보이고, 실험적으로 MD는 DeepMind Control Suite에서 DreamerV3 대비 평균 1.67배의 speedup을 달성하며 sparse-reward task에서는 8.8배까지 상승한다는 것이다. 이는 기존 dreaming method를 단순히 tuning하는 것이 아니라 imagination 기반 RL의 근본적인 exploration bottleneck을 다룬다는 점에서 중요하다. 이 접근은 counterfactual generator가 plausible한 latent state를 생성한다는 데 의존하며, 주로 표준 continuous-control benchmark에서 평가되었다.", "abstract": "Model-Based Reinforcement Learning (MBRL) leverages latent imagination for sample efficiency, yet remains constrained by Historical Tethering: imagination is typically initialized from observed states. This creates a learning asymmetry, where the world model's manifold discovery outpaces the policy's sparse-reward optimization. We propose Mind Dreamer (MD), a framework that operationalizes Active Counterfactual Reasoning (ACR) to transcend Markovian continuity. MD reformulates discovery as the minimization of a global Relay Manifold Expected Free Energy (R-EFE); by invoking a latent-space do-operator, MD utilizes an adversarial generator to synthesize non-continuous latent jumps to epistemic blind spots that are physically plausible yet cognitively challenging. To resolve the credit assignment paradox across these spatial ruptures, we derive the Relay Value Function (RVF) and Relay Uncertainty Function (RUF). These potentials treat synthesized anchors as latent bridges, propagating pragmatic and epistemic value through a principled Bellman-style formulation. Notably, we prove that the Uncertainty propagation across discontinuities necessitates a quadratic discount gamma^2, establishing a formal epistemic horizon. Theoretically, MD acts as an optimal importance sampler that expands the manifold's spectral gap, reducing the hitting time to critical bottleneck states. Empirically, MD achieves a 1.67x average speedup over DreamerV3 on DeepMind Control Suite, reaching 8.8x in sparse-reward tasks."}, {"id": "66113", "session": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Identifiable Token Correspondence for World Models", "url": "https://icml.cc/virtual/2026/poster/66113", "board": "Hall A #309", "categories": ["Causal Representation Learning", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Youngin Kim", "Ray Sun", "Inho Kim", "Bumsoo Park", "Hyun Oh Song"], "famous": [], "key_idea_en": "The method models next-frame token prediction in transformer world models as structured probabilistic inference over latent token-correspondence variables (copy-vs-generate), reducing temporal inconsistency in long rollouts.", "summary_en": "Transformer-based world models used in visual RL suffer temporal inconsistency over long rollouts, with objects duplicating, vanishing, or morphing, largely because next-frame prediction is treated as unconstrained token generation with no explicit account of which tokens correspond across time. The authors reformulate next-frame prediction as structured probabilistic inference over latent token-correspondence variables, so each next-frame token is explained either by copying a token from the previous frame or by generating a new one. This explicit correspondence model achieves state-of-the-art results on four challenging benchmarks, including a 72.5% return and 35.6% score on Craftax-classic versus a prior best of 67.4%/27.9%. More consistent object persistence in world models directly improves downstream RL performance and the reliability of long-horizon planning. The evaluation is limited to specific benchmarks such as Craftax-classic, 'identifiable' here refers to token correspondence rather than classical statistical causal identification, and code release is planned only upon acceptance.", "key_idea_ko": "transformer world model의 next-frame token prediction을 latent token-correspondence 변수(copy-vs-generate)에 대한 구조화된 확률적 추론으로 모델링하여 긴 rollout에서의 temporal inconsistency를 줄인다.", "summary_ko": "visual RL에 사용되는 transformer 기반 world model은 next-frame prediction이 시간에 걸친 token 대응 관계를 명시적으로 모델링하지 않는 제약 없는 token generation으로 취급되기 때문에, 긴 rollout에서 object가 중복되거나 사라지거나 변형되는 temporal inconsistency를 겪는다. 저자들은 next-frame prediction을 latent token-correspondence 변수를 갖는 구조화된 확률적 추론으로 재정식화하여, 각 next-frame token이 이전 frame의 token을 복사하거나 새로 생성되는 것으로 설명되도록 한다. 이 명시적 correspondence model은 네 가지 도전적인 benchmark에서 state-of-the-art 결과를 내는데, 예를 들어 Craftax-classic에서 기존 최고치 67.4%/27.9% 대비 72.5% return과 35.6% score를 달성한다. world model에서 더 일관된 object 지속성은 downstream RL 성능과 long-horizon planning의 신뢰성을 직접적으로 향상시킨다는 점에서 의의가 있다. 평가는 특정 benchmark(Craftax-classic 등)로 제한되며, 여기서 identifiable은 classical한 statistical causal identification이 아니라 token correspondence를 의미하고, code 공개는 승인 시에만 예정되어 있다.", "abstract": "Transformer-based world models have shown strong performance in visual reinforcement learning, but often suffer from temporal inconsistency in long-horizon rollouts, including object duplication, disappearance, and transmutation. A key reason is that most existing approaches treat next-frame prediction purely as a token generation problem, without explicitly modeling correspondence between tokens across time. We formulate next-frame prediction as a structured probabilistic inference problem with latent token correspondence variables, deriving a model in which each next-frame token is explained either by copying a token from the previous frame or by generating a new token. Our experiments show state-of-the-art performance on 4 challenging benchmarks. The proposed method achieves a return of 72.5% and a score of 35.6% on the Craftax-classic benchmark, significantly surpassing the previous best of 67.4% and 27.9%. We plan to release our source code on GitHub upon acceptance."}, {"id": "64184", "session": 2, "time": "14:00-15:45", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "RECAST: Model Reconstruction via Counterfactual-Aware Wasserstein Geometry under Limited Data", "url": "https://icml.cc/virtual/2026/poster/64184", "board": "Hall A #3207", "categories": ["Counterfactual Inference", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Xuan Zhao", "Lena Krieger", "Zhuo Cao", "Arya Bangun", "Hanno Scharr", "Ira Assent"], "famous": [], "key_idea_en": "RECAST reconstructs a black-box model's decision surface from limited data by treating counterfactual explanations as informative training examples aligned via Wasserstein barycentric prototypes, without needing ongoing query access.", "summary_en": "Reconstructing a surrogate of a target ML model from counterfactual explanations suffers from decision-boundary shift and overfitting, and prior approaches often require continued online query access to the target system. RECAST instead treats counterfactual examples as informative samples for both the original and counterfactual classes, aligning them via Wasserstein barycentric prototypes to build a faithful surrogate model without further querying. The method attains high fidelity and query efficiency and remains stable even when access to counterfactuals is limited or noisy, as shown on real-world datasets and group-fairness diagnostics. This enables model auditing and reconstruction, for example for fairness testing, in settings where only a handful of counterfactual explanations are available rather than continuous query access. Robustness is demonstrated empirically under limited or noisy-access conditions, but generality beyond the tested data regimes and explanation qualities is not fully characterized.", "key_idea_ko": "RECAST는 counterfactual explanation을 정보성 있는 학습 예시로 취급하고 이를 Wasserstein barycentric prototype으로 정렬하여, 지속적인 query access 없이도 제한된 데이터에서 black-box model의 decision surface를 재구성한다.", "summary_ko": "counterfactual explanation(CF)으로부터 target ML model의 surrogate를 재구성하는 것은 decision-boundary shift와 overfitting 문제를 겪으며, 기존 접근법은 흔히 target system에 대한 지속적인 online query access를 필요로 한다. RECAST는 counterfactual example을 원본 class와 counterfactual class 모두에 대한 정보성 있는 sample로 활용하고, 이를 Wasserstein barycentric prototype을 통해 정렬하여 추가 query 없이 faithful한 surrogate model을 구축한다. 이 방법은 real-world dataset과 group-fairness 진단을 통해 평가되었을 때 높은 fidelity와 query efficiency를 달성하며, counterfactual에 대한 access가 제한적이거나 noisy한 경우에도 안정성을 유지한다. 이는 지속적인 query access가 아니라 소수의 counterfactual explanation만 이용 가능한 상황에서 model auditing과 재구성, 예컨대 fairness testing을 가능하게 한다는 의의가 있다. Robustness는 abstract 기준 제한적/noisy access 조건에서 경험적으로 입증되었으며, 검증된 data regime과 explanation quality를 넘어서는 일반성은 title/abstract만으로는 충분히 규명되지 않는다.", "abstract": "Counterfactual explanations (CFs) help understand machine learning models by identifying minimal input changes that would lead to alternative model outcomes. The research addresses limitations in CF-based model reconstruction, including decision boundary shifts and overfitting issues that typically require online access to target systems. The proposed RECAST method uses Wasserstein barycenteric prototypes to create surrogate models that maintain fidelity even with limited data. By treating counterfactual examples as informative samples for both classes, the approach operates effectively without requiring ongoing query access during the reconstruction phase. The researchers demonstrate their technique's effectiveness through group fairness diagnostics and testing across real-world datasets, showing high fidelity and query efficiency, as well as stable results even when the access is limited and noisy."}, {"id": "62322", "session": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Identifiable Smooth Conjugacy Learning via Adversarial Orthogonality", "url": "https://icml.cc/virtual/2026/poster/62322", "board": "Hall A #1310", "categories": ["Causal Representation Learning", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["In Huh", "Changwook Jeong", "Muhammad Alam"], "famous": [], "key_idea_en": "The framework jointly learns a diffeomorphic conjugacy and low-dimensional adjustments to a source dynamical system, enabling identifiable recovery of canonical dynamical structure even when the source system is topologically incompatible with the data.", "summary_en": "Data-driven dynamical system models often fail to capture long-term structure because behavior is weakly constrained away from the observed data manifold, and existing conjugacy-based fixes assume the chosen source system is topologically compatible with the target, an assumption whose violation renders the conjugacy problem ill-posed and non-identifiable. The paper instead jointly learns a diffeomorphism together with controlled low-dimensional context modulation of the source dynamics, using versal unfolding theory to enforce orthogonality of the modulation space to worst-case orbit-tangent directions found via adversarial search. This yields an identifiable decomposition of dynamical variation into diffeomorphic and intrinsic topology-changing components. The approach enables interpretable recovery of canonical structures, such as normal forms and symmetries, even when prior topological assumptions fail. The method is developed for dynamical systems modeling rather than standard structural causal model identification, though it draws on causal-adjacent identifiability tools.", "key_idea_ko": "source dynamical system에 대한 diffeomorphic conjugacy와 저차원 adjustment를 함께 학습하는 framework로, source system이 데이터와 topologically 호환되지 않는 경우에도 canonical dynamical structure를 identifiable하게 복원할 수 있다.", "summary_ko": "data-driven dynamical system model은 관측된 data manifold를 벗어난 영역에서 behavior가 약하게만 제약되기 때문에 long-term structure를 포착하는 데 흔히 실패하며, 기존 conjugacy 기반 해결책은 선택한 source system이 target과 topologically 호환된다고 가정하는데, 이 가정이 위배되면 conjugacy 문제가 ill-posed하고 non-identifiable해질 수 있다. 본 논문은 diffeomorphism을 source dynamics에 대한 통제된 저차원 context modulation과 함께 학습하는 방법을 제안하며, versal unfolding theory를 이용해 adversarial search로 찾은 worst-case orbit-tangent 방향에 대해 modulation space의 orthogonality를 강제한다. 주요 결과는 dynamical variation을 diffeomorphic component와 intrinsic topology-changing component로 identifiable하게 분해하는 것이다. 이는 사전 topological 가정이 성립하지 않는 경우에도 normal form이나 symmetry 같은 canonical structure를 해석 가능하게 복원할 수 있게 한다는 점에서 중요하다. 이 방법은 dynamical systems modeling을 위해 개발된 것으로 standard structural causal model identification을 직접 다루지는 않지만, causal-adjacent identifiability 도구를 활용한다.", "abstract": "Data-driven dynamical system models often fail to recover the long-term structure of the underlying system, as their behavior is weakly constrained off the data manifold. Conjugacy-based approaches address this limitation by learning a diffeomorphism that pushes forward a source vector field to match observed dynamics, inheriting qualitative topology from the source. However, such methods typically presuppose that the chosen source system is topologically compatible with the target data. When this assumption is violated, the conjugacy problem becomes ill-posed, and arbitrary corrections can be traded off against diffeomorphic variation, leading to non-identifiability. We propose a framework that relaxes this assumed prior by jointly learning the diffeomorphic conjugacy together with controlled adjustments to the source dynamics via low-dimensional context modulation. Inspired by versal unfolding theory, we enforce the modulation space to be orthogonal to the worst-case orbit-tangent directions, obtained by adversarially searching over a class of parameterized diffeomorphisms. This promotes an identifiable decomposition of dynamical variation into diffeomorphic and intrinsic, topology-changing components, enabling interpretable corrections that recover the canonical structure such as normal forms and symmetries."}, {"id": "63997", "session": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Embodied Interpretability: Linking Causal Understanding to Generalization in Vision-Language-Action Models", "url": "https://icml.cc/virtual/2026/poster/63997", "board": "Hall A #705", "categories": ["Causal Reasoning in LLMs/Agents", "Other"], "estimands": [], "treatment_type": "binary", "discovery_types": [], "authors": ["Hanxin Zhang", "Mingshuo Xu", "Abdulqader Dhafer", "Shigang Yue", "Hongbiao Dong", "Zhou Daniel Hao"], "famous": [], "key_idea_en": "Formulating visual-to-action attribution in Vision-Language-Action policies as an interventional estimation problem, this work introduces an Interventional Significance Score (ISS) and Nuisance Mass Ratio (NMR) to diagnose spurious visual correlations and predict generalization failure.", "summary_en": "Vision-Language-Action (VLA) policies frequently fail under distribution shift, suggesting their action decisions may rely on spurious visual correlations rather than task-relevant causes. The authors frame visual-action attribution as an interventional estimation problem, introducing the Interventional Significance Score (ISS) - an interventional-masking procedure estimating the causal influence of visual regions on action predictions - together with the Nuisance Mass Ratio (NMR), a scalar measuring attribution to task-irrelevant features. They show ISS admits unbiased estimation, characterize conditions under which action-prediction error serves as a valid proxy for causal influence, and find that across diverse manipulation tasks NMR predicts generalization behavior while ISS yields more faithful explanations than existing interpretability methods. This positions interventional attribution as a diagnostic tool for causal misalignment in embodied policies. The unbiasedness and proxy-validity results hold only under conditions the authors characterize, limiting applicability outside those conditions.", "key_idea_ko": "Vision-Language-Action(VLA) policy에서 visual-to-action attribution을 interventional estimation 문제로 정식화하고, spurious visual correlation을 진단하고 generalization failure를 예측하기 위한 Interventional Significance Score(ISS)와 Nuisance Mass Ratio(NMR)를 도입한다.", "summary_ko": "Vision-Language-Action(VLA) policy는 distribution shift 하에서 자주 실패하는데, 이는 action decision이 task-relevant한 cause가 아니라 spurious visual correlation에 의존할 수 있음을 시사한다. 저자들은 visual-action attribution을 interventional estimation 문제로 다루어, visual region이 action prediction에 미치는 causal influence를 추정하는 interventional-masking 절차인 Interventional Significance Score(ISS)와, task-irrelevant feature에 대한 attribution을 측정하는 scalar인 Nuisance Mass Ratio(NMR)를 제안한다. 이들은 ISS가 unbiased estimation을 허용함을 보이고, action-prediction error가 causal influence에 대한 valid한 proxy가 되는 조건을 특성화한다. 다양한 manipulation task에 걸쳐 NMR은 generalization 양상을 예측하고 ISS는 기존 interpretability 방법보다 더 faithful한 설명을 제공하여, interventional attribution을 embodied policy의 causal misalignment 진단 도구로 자리매김한다는 점에서 의의가 있다. action-error-as-proxy와 unbiasedness 결과는 저자들이 특성화한 특정 조건에 의존하므로, 그 조건을 벗어난 범위에서의 적용 가능성은 제한적이다.", "abstract": "Vision-Language-Action (VLA) policies often fail under distribution shift, suggesting that decisions may depend on spurious visual correlations rather than task-relevant causes. We formulate visual-action attribution as an interventional estimation problem. Accordingly, we introduce the Interventional Significance Score (ISS), an interventional masking procedure for estimating the causal influence of visual regions on action predictions, and the Nuisance Mass Ratio (NMR), a scalar measure of attribution to task-irrelevant features. We analyze the statistical properties of ISS and show that it admits unbiased estimation, and we characterize conditions under which action prediction error provides a valid proxy for causal influence. Experiments across diverse manipulation tasks indicate that NMR predicts generalization behavior and that ISS yields more faithful explanations than existing interpretability methods. These results suggest that interventional attribution provides a simple diagnostic approach for identifying causal misalignment in embodied policies."}, {"id": "65256", "session": 3, "time": "10:30-12:15", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Beyond Structural Symmetries: Linear Mode Connectivity via Neuron Identifiability", "url": "https://icml.cc/virtual/2026/poster/65256", "board": "Hall A #2713", "categories": ["Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Vincent Burgin", "Daniel Herbst", "Ya-Wei Eileen Lin", "Stefanie Jegelka"], "famous": [], "key_idea_en": "A theory of effective function classes and neuron identifiability across independent training runs explains linear mode connectivity and enables alignment-free model merging (a deep-learning-theory paper, not a causal-inference paper, likely swept in by the term 'identifiability').", "summary_en": "Deep learning phenomena such as linear mode connectivity are usually attributed to parameter symmetries, yet the exact interplay between parameters, data, and representations behind these symmetries remains underexplored. This paper develops a theoretical framework of effective function classes, defined by neurons' induced functions restricted to the representation subspace, together with a formalization of effective symmetry breaking via neuron identifiability across independently trained models. The main results show that networks can admit large families of approximately equivalent solutions even in structurally asymmetric architectures, that neuron identifiability enables representation merging without prior alignment, and that the theory characterizes when such merges admit a linear low-loss connecting path. These findings advance understanding of loss-landscape geometry and point toward alignment-free model merging in practice. This is a neural-network-theory and mode-connectivity paper rather than a causal-inference paper, included here only because the term 'identifiability' likely caused it to be swept into a causal-paper corpus search.", "key_idea_ko": "이 논문은 독립적으로 학습된 model들 간의 effective function class와 neuron identifiability 이론을 개발하여 linear mode connectivity를 설명하고 alignment-free model merging을 가능하게 하는 논문으로, causal inference 논문이 아니라 deep-learning-theory 논문이며 identifiability라는 용어 때문에 causal 논문 corpus에 포함된 것으로 보인다.", "summary_ko": "이 논문은 linear mode connectivity와 같은 deep learning 현상이 parameter symmetry로부터 발생한다는 점에 주목하면서, parameter, data, representation이 이러한 symmetry를 만들어내는 정확한 상호작용은 아직 충분히 규명되지 않았다는 점을 다룬다. 핵심 아이디어는 representation subspace로 제한된 neuron이 유도하는 함수로 정의되는 effective function class 이론과, 독립적으로 학습된 model들 간의 neuron identifiability를 통해 formalize한 effective symmetry breaking 개념이다. structurally asymmetric한 architecture에서도 network가 approximately equivalent한 solution의 큰 family를 가질 수 있음을 보이고, neuron identifiability가 사전 alignment 없이 representation merging을 가능하게 함을 보이며, 그러한 merge가 linear low-loss connecting path를 허용하는 조건을 규명한다. loss landscape geometry를 이해하고 실제로 alignment-free model merging을 가능하게 하는 데 의의가 있다. 다만 이 논문은 causal inference 논문이 아니라 neural-network-theory/mode-connectivity 논문이며, identifiability라는 용어로 인해 causal 논문 corpus 검색에 우연히 포함된 것으로 보인다는 점을 유의해야 한다.", "abstract": "Many striking phenomena in deep learning, such as linear mode connectivity and the structured behavior of training dynamics, are closely tied to parameter symmetries: transformations that leave the realized function unchanged. Despite growing attention to structural parameter symmetries, the exact interplay between parameters, data, and representations remains underexplored. To investigate this, we develop a theoretical framework of effective function classes defined by the neurons' induced functions restricted to the representation subspace. We then formalize effective symmetry breaking via neuron identifiability across independent training runs. Our analysis shows that neural networks can admit large families of approximately equivalent solutions even in structurally asymmetric models. This allows us to disentangle the effects of data-specific
