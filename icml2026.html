<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICML 2026 Causal Papers Companion</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f7f8;
  --panel:#ffffff;
  --panel-2:#f8fafb;
  --ink:#142022;
  --muted:#66737d;
  --soft:#8a98a3;
  --line:#dbe4e8;
  --accent:#246b72;
  --accent-strong:#164f55;
  --accent-soft:#e4f2f3;
  --gold:#9c6b16;
  --gold-soft:#fff2cc;
  --mark:#ffe48a;
  --header:rgba(244,247,248,.95);
  --shadow:0 10px 30px rgba(27,45,53,.08),0 1px 2px rgba(27,45,53,.08);
  --sticky-offset:220px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101415;
    --panel:#171c1e;
    --panel-2:#1d2427;
    --ink:#e9eeef;
    --muted:#aab5b9;
    --soft:#7f8b90;
    --line:#2a3437;
    --accent:#7cc8c8;
    --accent-strong:#a1dddd;
    --accent-soft:#173439;
    --gold:#f2c96b;
    --gold-soft:#3c3020;
    --mark:#5f4d12;
    --header:rgba(16,20,21,.94);
    --shadow:0 12px 32px rgba(0,0,0,.26),0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101415;
  --panel:#171c1e;
  --panel-2:#1d2427;
  --ink:#e9eeef;
  --muted:#aab5b9;
  --soft:#7f8b90;
  --line:#2a3437;
  --accent:#7cc8c8;
  --accent-strong:#a1dddd;
  --accent-soft:#173439;
  --gold:#f2c96b;
  --gold-soft:#3c3020;
  --mark:#5f4d12;
  --header:rgba(16,20,21,.94);
  --shadow:0 12px 32px rgba(0,0,0,.26),0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit;letter-spacing:0}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 .1em}
.shell{width:min(1180px,calc(100% - 32px));margin:0 auto}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--header);
  border-bottom:1px solid var(--line);
  backdrop-filter:saturate(160%) blur(14px);
}
.masthead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:18px 0 12px;
}
.eyebrow{
  margin:0 0 2px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}
h1{
  margin:0;
  color:var(--ink);
  font-size:22px;
  line-height:1.25;
  font-weight:780;
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.theme-toggle,
.clear-button,
.notable-toggle,
.segmented button,
.chip{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
}
.theme-toggle{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:8px;
  padding:6px 10px;
  font-size:13px;
  font-weight:700;
}
.theme-toggle:hover,
.clear-button:hover,
.notable-toggle:hover,
.chip:hover{border-color:var(--accent);color:var(--accent-strong)}
.segmented{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel-2);
}
.segmented button{
  min-height:28px;
  border:0;
  border-radius:6px;
  background:transparent;
  padding:5px 11px;
  font-size:13px;
  font-weight:700;
}
.segmented button.is-active{
  background:var(--panel);
  color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.toolbar{
  display:grid;
  grid-template-columns:minmax(260px,1fr) auto auto;
  gap:10px;
  align-items:center;
  padding:0 0 12px;
}
.search-box{position:relative;min-width:0}
.search-symbol{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--soft);
  pointer-events:none;
  font-size:17px;
}
.search-box input{
  width:100%;
  min-height:42px;
  padding:9px 12px 9px 38px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel);
  color:var(--ink);
  outline:none;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.notable-toggle{
  min-height:42px;
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}
.notable-toggle.is-active{
  background:var(--gold-soft);
  border-color:var(--gold);
  color:var(--gold);
}
.filter-panel{
  display:grid;
  gap:8px;
  padding:0 0 14px;
}
.filter-row{
  display:grid;
  grid-template-columns:86px minmax(0,1fr);
  gap:10px;
  align-items:start;
}
.filter-label{
  padding-top:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{
  min-height:30px;
  max-width:100%;
  align-items:center;
  display:inline-flex;
  gap:6px;
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:750;
  text-align:left;
}
.chip-label{min-width:0;overflow-wrap:anywhere}
.chip-count{color:var(--soft);font-variant-numeric:tabular-nums}
.chip.is-active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.chip.is-active .chip-count{color:rgba(255,255,255,.78)}
.chip-category{
  --category-color:var(--accent-strong);
  border-color:var(--category-color);
  color:var(--category-color);
}
.chip-category::before{
  content:"";
  flex:0 0 7px;
  width:7px;
  height:7px;
  border-radius:999px;
  background:var(--category-color);
}
.chip-category:hover{
  border-color:var(--category-color);
  color:var(--category-color);
}
.chip-category .chip-count{color:var(--category-color)}
.chip-category.is-active{
  background:var(--category-color);
  border-color:var(--category-color);
  color:#fff;
}
.chip-category.is-active .chip-count{color:rgba(255,255,255,.78)}
.chip-category.is-active::before{background:#fff}
main.shell{padding:18px 0 64px}
.overview-strip{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:8px;
  margin:0 0 14px;
}
.overview-tile{
  min-width:0;
  display:grid;
  gap:4px;
  padding:10px;
  border:1px solid var(--line);
  border-left-width:3px;
  border-left-color:var(--day-color,var(--line));
  border-radius:8px;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.overview-tile:hover{
  border-color:var(--accent);
  border-left-color:var(--day-color,var(--accent));
  color:var(--accent-strong);
  text-decoration:none;
  transform:translateY(-1px);
}
.overview-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:6px;
}
.overview-ps{font-size:13px;font-weight:850}
.overview-count{font-size:20px;line-height:1;font-weight:850;font-variant-numeric:tabular-nums}
.overview-date{color:var(--ink);font-size:12px;font-weight:800;overflow-wrap:anywhere}
.overview-time{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.results-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:4px 0 14px;
}
.result-copy{display:grid;gap:2px}
.result-count{margin:0;color:var(--ink);font-size:15px;font-weight:800}
.notable-stat{margin:0;color:var(--muted);font-size:13px}
.clear-button{
  min-height:32px;
  border-radius:8px;
  padding:6px 10px;
  font-size:12px;
  font-weight:800;
}
.clear-button[hidden]{display:none}
.group{
  margin:0 0 28px;
  scroll-margin-top:var(--sticky-offset);
}
.group-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:16px 0 9px;
  border-top:1px solid var(--line);
}
.group:first-child .group-head{border-top:0}
.group-head.day-accent{
  padding-left:10px;
  border-left:3px solid var(--day-color);
}
.group-title{
  margin:0;
  font-size:17px;
  line-height:1.3;
  font-weight:820;
}
.group-meta{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.paper-card{
  overflow:hidden;
  margin:0 0 10px;
  border:1px solid var(--line);
  border-left-width:3px;
  border-left-color:var(--day-color,var(--line));
  border-radius:8px;
  background:var(--panel);
  box-shadow:var(--shadow);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.paper-card:hover{
  border-color:var(--accent);
  border-left-color:var(--day-color,var(--accent));
}
.paper-card.is-open{
  border-color:var(--accent);
  border-left-color:var(--day-color,var(--accent));
  box-shadow:0 14px 34px rgba(27,45,53,.12);
}
.card-hitbox{
  width:100%;
  display:grid;
  grid-template-columns:74px minmax(0,1fr) 24px;
  gap:12px;
  align-items:start;
  padding:14px;
  color:inherit;
  outline:none;
  cursor:pointer;
}
.card-hitbox:focus-visible{box-shadow:inset 0 0 0 3px var(--accent-soft)}
.board-badge{
  min-width:68px;
  border:1px solid var(--accent);
  border-radius:8px;
  background:var(--accent-soft);
  color:var(--accent-strong);
  padding:7px 6px;
  text-align:center;
  line-height:1.15;
}
.board-number{display:block;font-size:13px;font-weight:850;font-variant-numeric:tabular-nums}
.board-hall{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:750}
.card-main{min-width:0}
.card-title{
  margin:0 0 8px;
  color:var(--ink);
  font-size:16px;
  line-height:1.35;
  font-weight:790;
  overflow-wrap:anywhere;
}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.tag{
  max-width:100%;
  display:inline-flex;
  align-items:center;
  min-height:24px;
  border-radius:6px;
  padding:3px 7px;
  background:var(--panel-2);
  color:var(--muted);
  border:1px solid var(--line);
  font-size:11px;
  font-weight:760;
  overflow-wrap:anywhere;
}
.tag-category{
  --category-color:var(--accent-strong);
  background:var(--accent-soft);
  border-color:var(--category-color);
  color:var(--category-color);
  font-size:12px;
  font-weight:800;
}
@supports (color:color-mix(in srgb,#000 10%,#fff)){
  .tag-category{
    background:color-mix(in srgb,var(--category-color) 6%,transparent);
  }
  .chip-category{
    background:color-mix(in srgb,var(--category-color) 5%,var(--panel));
    border-color:color-mix(in srgb,var(--category-color) 45%,var(--line));
    color:color-mix(in srgb,var(--category-color) 64%,var(--ink));
  }
  .chip-category::before{
    background:var(--category-color);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 10%,var(--panel));
  }
  .chip-category .chip-count{
    color:color-mix(in srgb,var(--category-color) 58%,var(--muted));
  }
  .chip-category:hover{
    background:color-mix(in srgb,var(--category-color) 9%,var(--panel));
    border-color:color-mix(in srgb,var(--category-color) 72%,var(--line));
    color:color-mix(in srgb,var(--category-color) 70%,var(--ink));
  }
  .chip-category.is-active{
    background:color-mix(in srgb,var(--category-color) 20%,var(--panel));
    border-color:color-mix(in srgb,var(--category-color) 86%,var(--line));
    color:color-mix(in srgb,var(--category-color) 68%,var(--ink));
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--category-color) 26%,transparent);
  }
  .chip-category.is-active::before{
    background:color-mix(in srgb,var(--category-color) 78%,var(--ink));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 20%,var(--panel));
  }
  .chip-category.is-active .chip-count{
    color:color-mix(in srgb,var(--category-color) 62%,var(--muted));
  }
  .overview-tile.day-accent{
    background:
      linear-gradient(90deg,color-mix(in srgb,var(--day-color) 7%,transparent),transparent 58%),
      linear-gradient(180deg,var(--panel),var(--panel-2));
  }
  .group-head.day-accent{
    background:linear-gradient(90deg,color-mix(in srgb,var(--day-color) 7%,transparent),transparent 62%);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .tag-category{
      background:color-mix(in srgb,var(--category-color) 22%,transparent);
      border-color:color-mix(in srgb,var(--category-color) 46%,white);
      color:color-mix(in srgb,var(--category-color) 46%,white);
    }
    :root:not([data-theme="light"]) .chip-category{
      background:color-mix(in srgb,var(--category-color) 12%,transparent);
      border-color:color-mix(in srgb,var(--category-color) 36%,white);
      color:color-mix(in srgb,var(--category-color) 48%,white);
    }
    :root:not([data-theme="light"]) .chip-category::before{
      background:color-mix(in srgb,var(--category-color) 70%,white);
      box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 14%,var(--panel));
    }
    :root:not([data-theme="light"]) .chip-category .chip-count{
      color:color-mix(in srgb,var(--category-color) 38%,white);
    }
    :root:not([data-theme="light"]) .chip-category:hover{
      background:color-mix(in srgb,var(--category-color) 18%,transparent);
      border-color:color-mix(in srgb,var(--category-color) 52%,white);
      color:color-mix(in srgb,var(--category-color) 56%,white);
    }
    :root:not([data-theme="light"]) .chip-category.is-active{
      background:color-mix(in srgb,var(--category-color) 28%,transparent);
      border-color:color-mix(in srgb,var(--category-color) 64%,white);
      color:color-mix(in srgb,var(--category-color) 62%,white);
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--category-color) 36%,transparent);
    }
    :root:not([data-theme="light"]) .chip-category.is-active::before{
      background:color-mix(in srgb,var(--category-color) 30%,white);
      box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 28%,var(--panel));
    }
    :root:not([data-theme="light"]) .chip-category.is-active .chip-count{
      color:color-mix(in srgb,var(--category-color) 48%,white);
    }
  }
  :root[data-theme="dark"] .tag-category{
    background:color-mix(in srgb,var(--category-color) 22%,transparent);
    border-color:color-mix(in srgb,var(--category-color) 46%,white);
    color:color-mix(in srgb,var(--category-color) 46%,white);
  }
  :root[data-theme="dark"] .chip-category{
    background:color-mix(in srgb,var(--category-color) 12%,transparent);
    border-color:color-mix(in srgb,var(--category-color) 36%,white);
    color:color-mix(in srgb,var(--category-color) 48%,white);
  }
  :root[data-theme="dark"] .chip-category::before{
    background:color-mix(in srgb,var(--category-color) 70%,white);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 14%,var(--panel));
  }
  :root[data-theme="dark"] .chip-category .chip-count{
    color:color-mix(in srgb,var(--category-color) 38%,white);
  }
  :root[data-theme="dark"] .chip-category:hover{
    background:color-mix(in srgb,var(--category-color) 18%,transparent);
    border-color:color-mix(in srgb,var(--category-color) 52%,white);
    color:color-mix(in srgb,var(--category-color) 56%,white);
  }
  :root[data-theme="dark"] .chip-category.is-active{
    background:color-mix(in srgb,var(--category-color) 28%,transparent);
    border-color:color-mix(in srgb,var(--category-color) 64%,white);
    color:color-mix(in srgb,var(--category-color) 62%,white);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--category-color) 36%,transparent);
  }
  :root[data-theme="dark"] .chip-category.is-active::before{
    background:color-mix(in srgb,var(--category-color) 30%,white);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--category-color) 28%,var(--panel));
  }
  :root[data-theme="dark"] .chip-category.is-active .chip-count{
    color:color-mix(in srgb,var(--category-color) 48%,white);
  }
}
.tag-row-facets{
  gap:4px;
  margin:-3px 0 8px;
  align-items:center;
}
.tag-facet{
  min-height:20px;
  padding:2px 6px;
  background:transparent;
  color:var(--soft);
  border-color:var(--line);
  font-size:10px;
  font-weight:720;
}
.facet-label{
  display:inline-flex;
  align-items:center;
  min-height:20px;
  color:var(--soft);
  font-size:10px;
  font-weight:850;
}
.authors{
  margin:0 0 7px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  overflow-wrap:anywhere;
}
.author{display:inline}
.famous-author{color:var(--ink);font-weight:850}
.star{color:var(--gold);font-weight:900}
.author-more{
  border:0;
  background:transparent;
  color:var(--accent);
  padding:0 2px;
  font-size:13px;
  font-weight:850;
}
.author-more:hover{text-decoration:underline}
.idea{
  margin:0;
  color:var(--muted);
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.expand-indicator{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  color:var(--soft);
  border-radius:50%;
  transition:transform .22s ease,background .18s ease,color .18s ease;
}
.paper-card.is-open .expand-indicator{
  transform:rotate(180deg);
  background:var(--accent-soft);
  color:var(--accent-strong);
}
.details-panel{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  pointer-events:none;
  border-top:1px solid transparent;
  transition:grid-template-rows .26s ease,opacity .18s ease,border-color .18s ease;
}
.paper-card.is-open .details-panel{
  grid-template-rows:1fr;
  opacity:1;
  pointer-events:auto;
  border-top-color:var(--line);
}
.details-inner{overflow:hidden}
.details-content{padding:0 16px 16px 100px}
.details-content h3{
  margin:15px 0 6px;
  color:var(--ink);
  font-size:13px;
  line-height:1.35;
  font-weight:850;
}
.details-content p{margin:0;color:var(--ink);overflow-wrap:anywhere}
.details-content .abstract{color:var(--muted)}
.open-link{
  display:inline-flex;
  align-items:center;
  margin-top:13px;
  font-size:13px;
  font-weight:850;
}
.section-empty{
  margin:0;
  padding:14px 0 4px;
  color:var(--muted);
  font-size:13px;
}
.empty{
  border:1px dashed var(--line);
  border-radius:8px;
  padding:28px 16px;
  text-align:center;
  color:var(--muted);
  background:var(--panel-2);
}
.empty[hidden]{display:none}
footer{
  margin-top:34px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  overflow-wrap:anywhere;
}
@media (max-width:960px){
  .toolbar{grid-template-columns:1fr}
  .toolbar .segmented{justify-self:start}
  .notable-toggle{justify-self:start}
  .overview-strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filter-row{grid-template-columns:1fr;gap:6px}
  .filter-label{padding-top:0}
}
@media (max-width:560px){
  .shell{width:min(100% - 24px,1180px)}
  .masthead{display:grid;gap:10px}
  .header-actions{justify-content:space-between}

<script>
window.__DATA__ = {"papers": [{"id": "65829", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Learning Treatment Allocations with Risk Control Under Partial Identifiability", "url": "https://icml.cc/virtual/2026/poster/65829", "board": "Hall A #4411", "categories": ["Treatment Effects & CATE", "Identification & Partial ID"], "estimands": ["joint of POs"], "treatment_type": "binary", "discovery_types": [], "authors": ["Sofia Ek", "Dave Zachariah"], "famous": [], "key_idea_en": "A certifiable, finite-sample method learns treatment allocation policies while explicitly controlling the partially identified risk of treating patients who receive no benefit.", "summary_en": "Learning a beneficial treatment allocation policy is central to precision medicine, but some treated patients may receive no benefit, creating a wasteful and potentially harmful 'treatment risk.' Rather than only maximizing expected benefit, the authors propose learning allocation policies that explicitly control this treatment risk. They give a certifiable learning method with finite-sample guarantees on treatment risk, even though the risk quantity is not point-identifiable from randomized trial or observational data alone. This lets practitioners bound the harm from unnecessary treatment even when the underlying causal quantity is only partially identified. The approach is demonstrated on simulated and real data, but it relies on the partial-identification setting and finite-sample bounds rather than exact risk identification.", "key_idea_ko": "부분식별(partial identifiability) 상황에서도 이득 없이 treatment를 받는 환자 비율에 대한 (partially identified) risk를 finite-sample 수준에서 통제하며 treatment allocation policy를 학습하는 인증 가능한 방법을 제안한다.", "summary_ko": "정밀의료에서 환자 집단에 대한 유익한 treatment allocation policy를 학습하는 것이 중요하지만, treatment를 받고도 아무런 이득을 얻지 못하는 환자가 존재할 수 있어 낭비적이고 잠재적으로 해로운 '치료 위험'인 treatment risk가 발생한다. 기대 이득을 극대화하는 데 그치지 않고 policy 학습 과정에서 이 treatment risk를 명시적으로 통제하는 것이 핵심 아이디어이다. randomized trial이나 observational data만으로는 해당 risk 값이 point-identifiable하지 않음에도 불구하고, finite-sample 수준에서 treatment risk에 대한 보장을 제공하는 certifiable learning method가 주요 기술적 결과이다. 이는 기저 causal quantity가 partial identification 상태에 있더라도 실무자가 불필요한 treatment로 인한 harm을 bound할 수 있게 해준다는 점에서 의미가 있다. 방법은 simulated 및 real data에서 시연되었으나, 정확한 risk identification이 아니라 partial-identification 설정과 finite-sample bound에 의존한다.", "abstract": "Learning beneficial treatment allocations for a patient population is an important problem in precision medicine. For such allocations, a certain proportion of treated patients may not receive any benefit. This proportion of unnecessary treated represents a 'treatment risk' which is a waste of resources and may, in addition, expose patients to unnecessary adverse effects. Therefore, we aim to control the treatment risk when learning beneficial allocations. This learning problem is complicated by the fact that the treatment risk is generally not identifiable from either randomized trial or observational data. We propose a certifiable learning method that controls treatment risk, using finite samples in the partially identified setting. The method is illustrated using both simulated and real data."}, {"id": "65733", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "CELL: A Causal Perspective for Fairness-aware Graph Adaptation", "url": "https://icml.cc/virtual/2026/poster/65733", "board": "Hall A #2404", "categories": ["Causal Fairness & Robustness", "Causal Representation Learning"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Hourun Li", "Yifan Wang", "Qinghua Ran", "Junyu Luo", "Jia Yang", "Changling Zhou", "Zhiping Xiao", "Wei Ju", "Xiao Luo", "Ming Zhang"], "famous": [], "key_idea_en": "CELL improves fairness in cross-domain graph learning by using a causal graph to disentangle causal from sensitive-attribute factors, without requiring sensitive-attribute labels on the target domain.", "summary_en": "Fairness-aware domain adaptation on graphs typically assumes access to sensitive-attribute labels on the unlabeled target graph, an assumption that rarely holds in real deployments. CELL (Causality-attended Representation Disentanglement with Structural Alignment) instead builds a causal graph of the graph-generation process and trains separate sensitive and causal encoders, disentangling the two representations by minimizing their conditional mutual information. It further leverages pseudo-labels for the target task and sensitive attributes, combined with a fairness-aware bipartite graph for structural cross-domain alignment, yielding consistent gains in both accuracy and fairness over strong baselines on benchmark datasets. By dispensing with target-domain sensitive labels, the method removes a strong and often unrealistic assumption that has limited the real-world applicability of fair graph transfer learning. Its guarantees remain empirical rather than proven under general model misspecification, since the approach depends on the causal graph correctly capturing the true generation mechanism.", "key_idea_ko": "CELL은 causal graph를 이용해 causal factor와 sensitive-attribute factor를 분리함으로써, target domain에 sensitive label이 없어도 cross-domain graph learning에서 fairness를 개선한다.", "summary_ko": "Graph 상의 fairness-aware domain adaptation은 보통 label이 없는 target graph에도 sensitive-attribute label 접근이 가능하다고 가정하는데, 이는 실제 배포 환경에서는 비현실적이다. CELL(Causality-attended Representation Disentanglement with Structural Alignment)은 graph 생성 과정에 대한 causal graph를 구성하고, sensitive encoder와 causal encoder를 분리하여 두 representation 간 conditional mutual information을 최소화함으로써 disentanglement를 수행한다. 또한 target task에 대한 pseudo-label과 sensitive attribute, 그리고 fairness-aware bipartite graph를 활용한 structural cross-domain alignment를 적용하여, 여러 benchmark dataset에서 강력한 baseline 대비 accuracy와 fairness 모두에서 일관된 개선을 보인다. 이는 fair graph transfer learning의 실용성을 제약해온 강한 가정, 즉 target sensitive-attribute의 가용성 가정을 제거한다는 점에서 의의가 있다. 다만 이 접근법은 causal graph가 생성 메커니즘을 올바르게 포착한다는 전제에 의존하므로, 그 보장은 일반적인 model misspecification 하에서 증명된 것이 아니라 경험적 수준에 머문다.", "abstract": "This paper investigates fairness-aware graph adaptation, aiming to transfer knowledge from a labeled source graph to an unlabeled target graph while explicitly accounting for fairness. Most prior methods rely on adversarial learning to learn invariant graph representations of sensitive attributes. However, these approaches assume that sensitive attributes of the target domain are available, which often fails in real-world deployments. To address this limitation, we propose Causality-attended Representation Disentanglement with Structural Alignment (CELL) for fairness-aware graph adaptation without requiring target sensitive labels. The key idea of CELL is to build a causal graph that captures the underlying graph-generation mechanism and guides representation disentanglement toward improved fairness. In particular, CELL employs a sensitive encoder and a causal encoder to extract sensitive and causal factors respectively. We encourage disentanglement by minimizing the mutual information between causal and sensitive representations, considering the conditional distribution. To leverage unlabeled target data, we further generate pseudo-labels for both target task labels and sensitive attributes, and use similarity relations to derive unbiased node representations. Finally, to further mitigate domain shift, we build a fairness-aware bipartite graph that provides additional structural supervision for cross-domain alignment. Extensive experiments on benchmark datasets demonstrate that CELL consistently outperforms strong baselines in both predictive performance and fairness."}, {"id": "63635", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal Direct Preference Optimization for Distributionally Robust Generative Recommendation", "url": "https://icml.cc/virtual/2026/poster/63635", "board": "Hall A #3911", "categories": ["Confounding & Deconfounding", "Causal Fairness & Robustness", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Chu Zhao", "Enneng Yang", "Jianzhe Zhao", "Guibing Guo"], "famous": [], "key_idea_en": "Augmenting Direct Preference Optimization for LLM-based recommenders with a backdoor-adjustment mechanism removes environmental confounding and improves the out-of-distribution generalization of learned user preferences.", "summary_en": "DPO-aligned LLM recommenders tend to latch onto spurious correlations induced by environmental confounders, which undermines their out-of-distribution generalization. CausalDPO extends DPO with a backdoor-adjustment strategy applied during preference alignment, modeling the latent environment through soft clustering and adding invariance constraints across environments. Theoretical analysis shows that CausalDPO recovers users' stable preference structure across environments, and experiments across four distribution-shift settings yield a 24.10% average improvement across four metrics. The approach offers a principled causal remedy for a common failure mode of preference-alignment methods in recommender systems facing shifting user populations. It relies on a soft-clustering approximation of the latent environment variable and is evaluated on recommendation benchmarks rather than general LLM alignment tasks.", "key_idea_ko": "LLM 기반 recommender를 위한 Direct Preference Optimization(DPO)에 backdoor-adjustment mechanism을 추가하여 environmental confounding을 제거함으로써 학습된 user preference의 out-of-distribution generalization을 개선한다.", "summary_ko": "DPO로 정렬된 LLM recommender는 environmental confounder에 의해 유발된 spurious correlation에 의존하게 되어 out-of-distribution(OOD) generalization을 저해한다는 문제가 있다. CausalDPO는 preference alignment 과정에 backdoor-adjustment 전략을 도입하여, latent environment를 soft clustering으로 모델링하고 environment 간 invariance constraint를 추가함으로써 DPO를 확장한다. 이론적 분석은 CausalDPO가 environment 전반에 걸쳐 안정적인 user preference structure를 복원함을 보이며, 네 가지 distribution-shift 세팅에서의 실험은 네 개 지표에서 평균 24.10%의 성능 향상을 보여준다. 이는 shifting user population에 직면한 recommender system에서 흔히 나타나는 preference-alignment 방법의 실패 모드에 대한 원칙적인 causal 해법을 제공한다는 점에서 의의가 있다. 다만 이 방법은 latent environment variable에 대한 soft-clustering approximation에 의존하며, 일반적인 LLM alignment task가 아닌 recommendation benchmark에서 평가되었다.", "abstract": "Direct Preference Optimization (DPO) guides large language models (LLMs) to generate recommendations aligned with user historical behavior distributions by minimizing preference alignment loss. However, our systematic empirical research and theoretical analysis reveal that DPO tends to amplify spurious correlations caused by environmental confounders during the alignment process, significantly undermining the generalization capability of LLM-based generative recommendation methods in out-of-distribution (OOD) scenarios. To mitigate this issue, we propose CausalDPO, an extension of DPO that incorporates a causal invariance learning mechanism. This method introduces a backdoor adjustment strategy during the preference alignment phase to eliminate interference from environmental confounders, explicitly models the latent environmental distribution using a soft clustering approach, and enhances robust consistency across diverse environments through invariance constraints. Theoretical analysis demonstrates that CausalDPO can effectively capture users' stable preference structures across multiple environments, thereby improving the OOD generalization performance of LLM-based recommendation models. We conduct extensive experiments under four representative distribution shift settings to validate the effectiveness of CausalDPO, achieving an average performance improvement of 24.10% across four evaluation metrics."}, {"id": "61462", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal Representation Learning with Optimal Compression and Complex Treatments", "url": "https://icml.cc/virtual/2026/poster/61462", "board": "Hall A #206", "categories": ["Treatment Effects & CATE", "Causal Representation Learning"], "estimands": ["ITE"], "treatment_type": "multi-valued", "discovery_types": [], "authors": ["Wanting Liang", "Haoang Chi", "Zhiheng Zhang"], "famous": [], "key_idea_en": "The paper derives a theoretically optimal balancing-weight estimator and a scalable Treatment Aggregation strategy for estimating individual treatment effects under many multi-valued treatments, extended to a generative Wasserstein-geometry model.", "summary_en": "Estimating individual treatment effects with many possible treatments is difficult because tuning the balancing weight is a fragile heuristic and pairwise or one-vs-all comparisons scale poorly with the number of treatments. This paper derives a novel multi-treatment generalization bound and a theoretical estimator for the optimal balancing weight, removing the need for expensive hyperparameter search, and compares Pairwise, One-vs-All, and a new Treatment Aggregation strategy, finding that One-vs-All is more accurate in low dimensions while Treatment Aggregation attains O(1) scalability as the treatment space grows; it further extends the approach to a generative architecture, Multi-Treatment CausalEGM, that preserves the Wasserstein geodesic structure of the treatment manifold. Experiments on semi-synthetic and image datasets show the proposed approach outperforms prior models in accuracy and efficiency, especially at large intervention scale. This is valuable for settings such as dosage or multi-arm interventions, where the treatment space is large and per-treatment tuning is infeasible. The gains, though, rely on the theoretical balancing-weight derivation and generative manifold assumptions holding in practice.", "key_idea_ko": "이 논문은 여러 개(multi-valued)의 treatment 하에서 individual treatment effect를 추정하기 위한 이론적으로 최적인 balancing-weight estimator와 확장 가능한 Treatment Aggregation 전략을 도출하고, 이를 generative Wasserstein-geometry model로 확장한다.", "summary_ko": "가능한 treatment가 많은 상황에서 individual treatment effect(ITE)를 추정하는 것은 balancing weight의 tuning이 취약한 heuristic이고 pairwise/one-vs-all 비교가 treatment 수 증가에 따라 잘 scale되지 않기 때문에 어렵다. 이 논문은 새로운 multi-treatment generalization bound와 optimal balancing weight에 대한 이론적 estimator를 도출하여 비용이 큰 hyperparameter search의 필요성을 제거하고, Pairwise, One-vs-All, 그리고 새로운 Treatment Aggregation 전략을 비교한다. OVA는 저차원에서 더 정확한 반면 Treatment Aggregation은 treatment space가 커질수록 O(1) scalability를 달성하며, treatment manifold의 Wasserstein geodesic 구조를 보존하는 generative architecture(Multi-Treatment CausalEGM)로 확장했을 때 semi-synthetic 및 image dataset 실험에서 기존 model보다 accuracy와 efficiency 면에서 우수함을, 특히 large intervention scale에서 보인다. dosage나 multi-arm intervention처럼 treatment space가 크고 treatment별 tuning이 불가능한 setting에 유용하다. 성능 향상은 이론적 balancing-weight 도출과 generative manifold 가정이 실제로 성립하는 것에 의존한다.", "abstract": "Estimating Individual Treatment Effects (ITE) in multi-treatment scenarios faces two critical challenges: the Hyperparameter Selection Dilemma for balancing weights and the Curse of Dimensionality in computational scalability. This paper derives a novel multi-treatment generalization bound and proposes a theoretical estimator for the optimal balancing weight alpha, eliminating expensive heuristic tuning. We investigate three balancing strategies: Pairwise, One-vs-All (OVA), and Treatment Aggregation. While OVA achieves superior precision in low-dimensional settings, our proposed Treatment Aggregation ensures both accuracy and O(1) scalability as the treatment space expands. Furthermore, we extend our framework to a generative architecture, Multi-Treatment CausalEGM, which preserves the Wasserstein geodesic structure of the treatment manifold. Experiments on semi-synthetic and image datasets demonstrate that our approach significantly outperforms traditional models in estimation accuracy and efficiency, particularly in large-scale intervention scenarios."}, {"id": "62125", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal Identification from Counterfactual Data: Completeness and Bounding Results", "url": "https://icml.cc/virtual/2026/poster/62125", "board": "Hall A #3403", "categories": ["Identification & Partial ID", "Counterfactual Inference"], "estimands": ["counterfactual query"], "treatment_type": "", "discovery_types": [], "authors": ["Arvind Raghavan"], "famous": [], "key_idea_en": "ctfIDu+ is a complete algorithm for identifying counterfactual queries from realizable Layer-3 (counterfactual) data, with provably tighter bounds when exact identification is not possible.", "summary_en": "Prior completeness results for counterfactual identification covered only input data from observational and interventional distributions, Pearl's Layers 1 and 2, since counterfactual, Layer-3, data was assumed unobtainable. Building on the recent notion of counterfactual realizability, that is, counterfactual distributions that can actually be estimated experimentally, the authors develop the ctfIDu+ algorithm to identify a target counterfactual query from an arbitrary set of such realizable Layer-3 data. They prove ctfIDu+ is complete for this task, pinning down the exact limit of what counterfactuals can be identified from physically realizable data and establishing a fundamental bound on non-parametric causal inference. This resolves how much additional identifying power realizable counterfactual data contributes beyond Layers 1 and 2, and yields concrete, tighter bounds for quantities that remain non-identifiable. The results are non-parametric and graphical, grounded in SCMs, and depend on which counterfactual distributions are realizable per Raghavan and Bareinboim (2025); simulations corroborate the bound-tightening, but the core contribution is the completeness proof itself.", "key_idea_ko": "realizable Layer-3 (counterfactual) data로부터 counterfactual query를 식별하는 완전한 알고리즘 ctfIDu+를 제시하고, 정확한 identification이 실패할 때 증명 가능하게 더 tight한 bound를 도출한다.", "summary_ko": "기존의 counterfactual identification에 대한 completeness 결과는 counterfactual(Layer-3) data는 얻을 수 없다고 가정하여 observational과 interventional distribution(Pearl의 Layer 1-2)만을 입력으로 다루었다. 저자들은 실제로 실험적으로 추정 가능한 counterfactual distribution을 뜻하는 'counterfactual realizability' 개념을 바탕으로, 임의의 realizable Layer-3 data 집합으로부터 target counterfactual query를 identify하는 ctfIDu+ 알고리즘을 개발한다. ctfIDu+가 이 task에 대해 complete함을 증명함으로써, 물리적으로 realizable한 데이터로부터 identify 가능한 counterfactual의 정확한 한계를 규명하고 non-parametric causal inference의 근본적 한계를 확립한다. 이는 realizable counterfactual data가 Layer 1-2를 넘어 얼마나 추가적인 identifying power를 제공하는지를 규명하고, non-identifiable한 quantity에 대해 구체적으로 더 tight한 bound를 제시한다는 점에서 중요하다. 결과는 non-parametric/graphical(SCM 기반)이며 Raghavan and Bareinboim (2025)의 기준에 따라 어떤 counterfactual distribution이 realizable한지에 의존하는데, 시뮬레이션은 bound가 tight해짐을 뒷받침하지만 핵심 기여는 completeness 증명 자체다.", "abstract": "Previous work establishing completeness results for counterfactual identification has been limited to the setting where the input data belongs to observational and interventional distributions (Layers 1 and 2 of Pearl's Causal Hierarchy), since it was generally presumed impossible to obtain data from counterfactual distributions, belonging to Layer 3. However, recent work (Raghavan & Bareinboim, 2025) has formally characterized a family of counterfactual distributions which can be directly estimated via experimental methods - a notion they call counterfactual realizabilty. This leaves open the question of what additional Layer 3 quantities now become identifiable, given this new access to (some) Layer 3 data. We develop the ctfIDu+ algorithm for identifying a counterfactual query from an arbitrary set of Layer 3 data, and prove that it is complete for this task. Using this, we establish the theoretical limit of which counterfactuals can be identified from physically realizable data, thus implying the fundamental limit to exact causal inference in the non-parametric setting. Finally, we derive novel analytic bounds for important non-identifiable quantities given realizable counterfactual data, that are provably tighter than the previously established benchmark. We corroborate using simulations that even if a quantity is non-identifiable, counterfactual data can be used to further tighten bounds for its range."}, {"id": "65568", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Global Directional Priors with Local Statistical Validation for Scalable Causal Discovery", "url": "https://icml.cc/virtual/2026/poster/65568", "board": "Hall A #4006", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["hybrid", "constraint-based"], "authors": ["Wei Yuan", "Zixuan Shao", "Shuhui Wang"], "famous": [], "key_idea_en": "OCMB decouples causal discovery into a lightweight global ordering step followed by local Markov-blanket validation within small, ordering-constrained candidate sets, keeping conditional-independence conditioning-set sizes bounded even in hub-dominated graphs.", "summary_en": "Constraint-based causal discovery depends on conditional independence tests that grow unreliable as conditioning sets expand, a problem that is especially acute around hub nodes. OCMB (Ordering-Constrained Markov Blanket discovery) first estimates a lightweight global variable ordering to obtain directional priors, then validates local Markov blankets only within small candidate sets constrained by that ordering. The method provably recovers correct parent sets whenever the ordering has high recall, without requiring the ordering to be globally correct, and it bounds conditioning-set size even at hub nodes. This decoupling lets constraint-based discovery scale to high-dimensional, hub-heavy graphs where standard CI-test-based methods degrade sharply. Correctness depends on the high-recall ordering assumption, and the reported gains over constraint-based and hybrid baselines are demonstrated empirically in high-dimensional regimes.", "key_idea_ko": "OCMB는 causal discovery를 가벼운 global ordering 단계와 그 ordering으로 제약된 작은 candidate set 내에서의 local Markov-blanket validation으로 분리하여, hub-dominated graph에서도 conditional-independence conditioning-set 크기를 bounded하게 유지한다.", "summary_ko": "constraint-based causal discovery는 conditional independence test에 의존하는데, 특히 hub node 주변에서 conditioning set이 커질수록 이 test는 신뢰도가 떨어진다. OCMB(Ordering-Constrained Markov Blanket discovery)는 먼저 가벼운 global variable ordering을 추정해 directional prior를 얻은 뒤, 그 ordering으로 제약된 작은 candidate set 내에서만 local Markov blanket을 검증한다. 이 방법은 ordering이 globally correct할 필요 없이 high recall만 가지면 parent set을 provably 복원하며, hub node에서도 conditioning-set 크기를 bounded하게 유지한다. 이러한 decoupling은 constraint-based discovery를 standard CI-test 기반 방법이 급격히 성능 저하되는 high-dimensional, hub-heavy graph로 확장 가능하게 한다는 점에서 의의가 있다. correctness는 high-recall ordering assumption에 의존하며, high-dimensional regime에서 constraint-based 및 hybrid baseline 대비 성능 향상이 empirical하게 입증되었다.", "abstract": "Constraint-based causal discovery relies on conditional independence (CI) tests whose reliability degrades as conditioning sets grow, particularly in hub-dominated graphs. Existing methods constrain adjacency or global structure, but leave conditioning-set dimensionality uncontrolled. In this paper, we propose Ordering-Constrained Markov Blanket discovery (OCMB), a paradigm that treats conditioning-set dimensionality as a first-class constraint. OCMB decouples discovery into two stages: lightweight global ordering estimation providing directional priors, followed by local Markov blanket validation within small, ordering-constrained candidate sets. By enforcing directional constraints before any CI test, OCMB ensures bounded conditioning sets even with hub nodes. We show that OCMB recovers correct parent sets provided a high-recall ordering assumption holds, without requiring the ordering to be globally correct. Experiments demonstrate that OCMB significantly improves precision and robustness over constraint-based and hybrid methods in high-dimensional regimes where conventional CI-based approaches fail."}, {"id": "66381", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Linear Causal Representation Learning by Topological Ordering, Pruning, and Disentanglement", "url": "https://icml.cc/virtual/2026/poster/66381", "board": "Hall A #4202", "categories": ["Causal Representation Learning", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Hao Chen", "Lin Liu", "Yu Guang Wang"], "famous": [], "key_idea_en": "A new linear causal representation learning algorithm recovers latent causal features up to an equivalence class under weaker heterogeneity and distributional assumptions than prior methods.", "summary_en": "Linear causal representation learning aims to disentangle a linear structural causal model over latent features from observed data via a linear mixing function, but existing methods require restrictive assumptions such as single-node interventional data or specific distributional constraints. The paper proposes an algorithm combining topological ordering, pruning, and disentanglement that operates under weaker assumptions about environment heterogeneity and data-generating distributions. It proves provable recovery of latent causal features up to an equivalence class, a result validated on synthetic experiments and an interpretability analysis of large language models. This broadens the practical applicability of causal representation learning to settings where strong interventional or distributional assumptions cannot be guaranteed. The scope remains limited to linear structural causal models with linear mixing functions between latent and observed variables.", "key_idea_ko": "새로운 linear causal representation learning 알고리즘이 기존 방법보다 약한 heterogeneity 및 distributional assumption 하에서 latent causal feature를 equivalence class까지 복원한다.", "summary_ko": "Linear causal representation learning(CRL)은 linear mixing function을 통해 관측 data로부터 latent feature에 대한 linear structural causal model을 disentangle하는 것을 목표로 하지만, 기존 방법들은 single-node interventional data나 특정 distributional constraint 같은 restrictive assumption을 요구한다. 이 논문은 topological ordering, pruning, disentanglement를 결합한 새로운 알고리즘을 제안하며, environment heterogeneity와 data-generating distribution에 대해 더 약한 assumption 하에서 동작한다. 주요 결과는 latent causal feature를 equivalence class까지 provable하게 복원한다는 것이며, synthetic experiment와 large language model에 대한 interpretability 분석으로 검증되었다. 이는 strong interventional 혹은 distributional assumption을 보장할 수 없는 상황으로 CRL의 실질적 적용범위를 넓힌다는 점에서 중요하다. 범위는 linear structural causal model과 latent-observed 변수 간 linear mixing function으로 제한된다.", "abstract": "Causal representation learning (CRL) has garnered increasing interests from the causal inference and artificial intelligence community, due to its capability of disentangling potentially complex data-generating mechanism into causally interpretable latent features, by leveraging the heterogeneity of modern datasets. In this paper, we further contribute to the CRL literature, by focusing on the stylized linear structural causal model over the latent features and assuming a linear mixing function that maps latent features to the observed data or measurements. Existing linear CRL methods often rely on stringent assumptions, such as accessibility to single-node interventional data or restrictive distributional constraints on latent features and exogenous measurement noise. However, these prerequisites can be challenging to satisfy in certain scenarios. In this work, we propose a novel linear CRL algorithm that, unlike most existing linear CRL methods, operates under weaker assumptions about environment heterogeneity and data-generating distributions while still recovering latent causal features up to an equivalence class. We further validate our new algorithm via synthetic experiments and an interpretability analysis of large language models (LLMs), demonstrating both its superiority over competing methods in finite samples and its potential in integrating causality into AI."}, {"id": "64689", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Test-Time Learning of Causal Structure from Interventional Data", "url": "https://icml.cc/virtual/2026/poster/64689", "board": "Hall A #4213", "categories": ["Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based", "intervention-based"], "authors": ["Wei Chen", "Rui Ding", "Huang Bojun", "Yuxuan Liang", "Yang Zhang", "Qiang Fu", "Shi Han", "Dongmei Zhang"], "famous": [], "key_idea_en": "TICL is a test-time training method that synthesizes instance-specific self-augmented data and combines it with joint causal inference to discover causal structure and unknown intervention targets at test time.", "summary_en": "Supervised causal discovery methods often generalize poorly across different interventional settings, particularly when intervention targets are unknown. TICL (Test-time Interventional Causal Learning) tackles this by synthesizing instance-specific training data at test time through a self-augmentation strategy that avoids distribution shift, integrating Joint Causal Inference (JCI) into a PC-inspired two-phase supervised learning scheme. This design lets the model exploit self-augmented data while retaining theoretical identifiability guarantees. Experiments on bnlearn benchmarks show TICL outperforming existing approaches on both causal discovery and intervention target detection. Validation is confined primarily to standard bnlearn benchmark networks, so behavior on larger or non-benchmark real-world systems is not directly established.", "key_idea_ko": "TICL은 test-time에 instance-specific self-augmented data를 생성하고 이를 joint causal inference와 결합하여 test 시점에 causal structure와 unknown intervention target을 discover하는 test-time training 방법을 제안한다.", "summary_ko": "supervised causal discovery 방법은 서로 다른 interventional setting, 특히 intervention target이 unknown인 경우에 대한 generalization이 잘 되지 않는 경우가 많다. TICL(Test-time Interventional Causal Learning)은 test time에 self-augmentation strategy를 통해 instance-specific training data를 합성하여 distribution shift를 회피하고, Joint Causal Inference(JCI)를 PC 기반 two-phase supervised learning scheme에 통합한다. 이 설계는 model이 self-augmented data를 활용하면서도 theoretical identifiability guarantee를 유지하게 하며, bnlearn benchmark 실험에서 TICL은 causal discovery와 intervention target detection 모두에서 기존 접근법을 능가했다. 이는 intervention target이 알려지지 않은 상황에서도 test time에 causal structure를 안정적으로 학습할 수 있는 방법을 제시한다는 점에서 의의가 있다. 다만 이 접근은 주로 standard bnlearn benchmark network에서 검증되었으므로, 더 크거나 non-benchmark인 real-world system에서의 동작은 직접적으로 확립되지 않았다.", "abstract": "Supervised Causal Learning has shown promise in causal discovery, yet it often struggles with generalization across diverse interventional settings, particularly when intervention targets are unknown. To address this, we propose TICL (Test-time Interventional Causal Learning), a novel method that synergizes Test-Time Training with Joint Causal Inference (JCI). Specifically, we design a self-augmentation strategy to generate instance-specific training data at test time, effectively avoiding distribution shifts. Furthermore, by integrating JCI, we developed a PC-inspired two-phase supervised learning scheme, which effectively leverages self-augmented data while ensuring theoretical identifiability. Extensive experiments on bnlearn benchmarks demonstrate TICL's superiority in multiple aspects of causal discovery and intervention target detection."}, {"id": "66497", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Towards a Holistic Understanding of Selection Bias for Causal Effect Identification", "url": "https://icml.cc/virtual/2026/poster/66497", "board": "Hall A #4314", "categories": ["Identification & Partial ID", "Treatment Effects & CATE"], "estimands": ["ATE"], "treatment_type": "", "discovery_types": [], "authors": ["Yiwen Qiu", "Filip Kovacevic", "Shimeng Huang", "Peter Spirtes", "Francesco Locatello"], "famous": ["Peter Spirtes", "Francesco Locatello"], "key_idea_en": "The paper derives necessary and sufficient conditions for ATE identifiability under selection bias, extending existing graphical identifiability criteria under strictly weaker assumptions on the propensity score and selection probability.", "summary_en": "Selection bias pervades observational studies, as when biobank respondents are healthier than the general population, and estimating average treatment effects from such selectively sampled data can badly bias whole-population estimates. This paper studies ATE identifiability under selection bias by characterizing the propensity score and selection probability through weak assumptions on their probability classes. Its main result is a set of necessary and sufficient conditions for ATE identifiability that extend prior graphical identifiability criteria to a strictly weaker, more general setting. Doing so broadens the range of selection-biased observational studies for which valid causal effect recovery is provably possible. The contribution is purely identification-theoretic, characterizing when identification is possible rather than proposing new estimators.", "key_idea_ko": "propensity score와 selection probability에 대해 기존보다 엄격히 약한 가정 하에서 기존 graphical identifiability criterion을 확장하여, selection bias 하에서의 ATE identifiability에 대한 필요충분조건을 도출한다.", "summary_ko": "selection bias는 observational study에서 흔히 발생하며(예: biobank 응답자가 일반 인구보다 건강한 경우), 이렇게 selectively sampling된 데이터로부터 average treatment effect(ATE)를 추정하면 전체 population에 대한 추정치가 심각하게 편향될 수 있다. 논문은 propensity score와 selection probability의 확률 class에 대한 약한 가정을 통해 특성화함으로써 selection bias 하에서의 ATE identifiability를 연구한다. 기존의 graphical identifiability criterion을 엄격히 더 약하고 일반적인 설정으로 확장하는 ATE identifiability의 필요충분조건이 주된 결과이다. valid한 causal effect 복원이 provably 가능한 selection-biased observational study의 범위를 넓힌다는 점에서 중요하다. 기여는 순수하게 identification-theoretic이며, identification이 언제 가능한지를 특성화할 뿐 새로운 estimator를 제안하지는 않는다.", "abstract": "Selection bias is pervasive in observational studies. For example, large scale biobanks data can exhibit \"healthy volunteer bias\" when respondents are healthier and of higher socio-economic status than the population they are meant to represent. Recovering causal effects from such sub-population is an important problem in causal inference, as estimating average treatment effects (ATE) from selected populations can result in a severely biased estimate of the ATE from the whole population. In this paper, we investigate the identifiability of the ATE under selection bias. We provide necessary and sufficient conditions for ATE identifiability, leveraging weak assumptions on probability classes to characterize propensity score and selection probability. Compared to previous works, our results extend existing graphical identifiability criteria and offer a more comprehensive understanding of causal effect identification with strictly weaker conditions in the presence of selection bias."}, {"id": "62772", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Towards Completeness in Causal Discovery from Soft Interventions with Known Targets", "url": "https://icml.cc/virtual/2026/poster/62772", "board": "Hall A #4315", "categories": ["Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based", "intervention-based"], "authors": ["Zihan Zhou", "Murat Kocaoglu"], "famous": [], "key_idea_en": "The paper shows that the I-FCI algorithm for causal discovery from soft interventions with latent confounding is sound but incomplete, and provides two remedies, an enumeration-based completion procedure and additional orientation rules, to close the gap.", "summary_en": "Causal discovery from soft interventions with latent confounders can be represented via an augmented graph with intervention-indicator nodes, whose MAG (the I-MAG) characterizes the interventional Markov equivalence class, and the existing FCI-inspired learner for this setting, I-FCI (Kocaoglu et al., 2019), turns out to be sound but not complete, leaving some circle endpoints unoriented even when they are compelled by the equivalence class. To close this gap, the authors propose an enumeration-based completion procedure that is sound and complete, along with a complementary set of local orientation rules that tighten I-FCI's output without increasing its asymptotic complexity. Both approaches recover strictly more orientations than I-FCI alone, with the enumeration method achieving full completeness and the local rules offering a lighter-weight partial improvement. Together they make causal discovery under soft interventions with latent variables more informative without sacrificing correctness. The enumeration method's worst-case cost is combinatorial in the number of compatible MAGs, making the local-rule method the more practical improvement for larger problems.", "key_idea_ko": "이 논문은 known target을 갖는 soft intervention에서의 causal discovery 알고리즘인 I-FCI가 sound하지만 incomplete함을 보이고, 이를 보완하는 두 가지 방법(enumeration 기반 completion 절차와 추가 orientation rule)을 제시한다.", "summary_ko": "Latent confounding이 있는 soft intervention으로부터의 causal discovery는 intervention-indicator node를 추가한 augmented graph로 표현할 수 있으며, 그 MAG(I-MAG)가 interventional Markov equivalence class를 특징짓는다. 저자들은 기존 FCI 계열 learner인 I-FCI(Kocaoglu et al. 2019)가 sound하지만 complete하지는 않음을 보이는데, equivalence class에 의해 실제로는 compel되는 circle endpoint를 unoriented 상태로 남길 수 있기 때문이다. 이를 해결하기 위해 sound하고 complete하지만 비용이 compatible MAG의 수에 의존하는 enumeration 기반 completion 절차와, 추가적인 asymptotic complexity 없이 I-FCI의 출력을 정교화하는 local orientation rule 집합을 제안한다. 두 기여 모두 정확성을 희생하지 않으면서 latent variable이 있는 soft intervention 하의 causal discovery를 더 informative하게 만든다는 점에서 의미가 있다. Enumeration 방법의 worst-case 비용은 compatible MAG 수에 대해 combinatorial하므로, 더 큰 문제에서는 local-rule 방법이 더 실용적인 개선책이다.", "abstract": "We study causal discovery from soft interventions in the presence of latent confounding. Beyond within-environment conditional independences, soft interventions induce cross-environment invariances that can be encoded using an augmented graph with intervention indicator nodes (I-AUG). Taking its maximal ancestral graph (MAG) yields the I-MAG, which characterizes the interventional Markov equivalence class. Building on this framework, we show that the FCI-inspired learner (I-FCI) by Kocaoglu et al. (2019) is sound but not complete: it may output circle endpoints that are nevertheless compelled by the interventional equivalence class. To exploit intervention-node semantics, we propose two complementary methods. First, we introduce an enumeration-based completion procedure that is sound and theoretically complete, but whose worst-case cost depends on the number of MAGs compatible with the partial graph learned by I-FCI. Second, we derive a set of additional local orientation rules that provably tighten I-FCI without increasing asymptotic complexity. Both methods refine prior outputs in the controlled soft-intervention setting with latent variables."}, {"id": "60698", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "TRACE: Trajectory Recovery for Continuous Mechanism Evolution in Causal Representation Learning", "url": "https://icml.cc/virtual/2026/poster/60698", "board": "Hall A #4316", "categories": ["Causal Representation Learning", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Shicheng Fan", "Kun Zhang", "Lu Cheng"], "famous": ["Kun Zhang"], "key_idea_en": "TRACE jointly identifies latent causal variables and a continuous mechanism-mixing trajectory using a Mixture-of-Experts model, instead of assuming instantaneous discrete regime switches.", "summary_en": "Existing temporal causal representation learning methods assume causal mechanisms switch instantaneously between discrete domains, yet real systems, such as a vehicle turning or a gait shifting from walk to run, often transition continuously. This paper models transitional mechanisms as convex combinations of finitely many atomic mechanisms with time-varying mixing coefficients, and proposes TRACE, a Mixture-of-Experts framework where each expert learns one atomic mechanism so mechanism trajectories can be recovered at test time. The authors prove that the latent causal variables and the continuous mixing trajectory are jointly identifiable, and TRACE recovers mixing trajectories with up to 0.99 correlation on synthetic and real data, outperforming discrete-switching baselines. This extends causal representation learning beyond the common discrete-switching assumption and generalizes to intermediate mechanism states never seen in training. The identifiability guarantee is tied to the assumed convex-combination-of-atomic-mechanisms structure, which may not capture arbitrarily complex mechanism dynamics.", "key_idea_ko": "TRACE는 discrete한 순간적 regime switch를 가정하는 대신, Mixture-of-Experts model을 이용해 latent causal variable과 연속적인 mechanism-mixing trajectory를 함께 identify한다.", "summary_ko": "기존 temporal causal representation learning 방법들은 causal mechanism이 discrete한 domain 사이에서 순간적으로 전환된다고 가정하지만, 실제 시스템(예: 차량의 회전, 걷기에서 달리기로의 gait 전환)은 흔히 연속적으로 전환된다. 논문은 transitional mechanism을 유한 개의 atomic mechanism의 time-varying mixing coefficient를 갖는 convex combination으로 모델링하고, 각 expert가 하나의 atomic mechanism을 학습하는 Mixture-of-Experts framework인 TRACE를 제안하여 test 시점에 mechanism trajectory를 복원할 수 있게 한다. latent causal variable과 연속적인 mixing trajectory가 함께 identifiable함을 증명하며, TRACE는 synthetic과 real data에서 최대 0.99의 상관관계로 mixing trajectory를 복원해 discrete-switching baseline을 능가한다. 흔히 쓰이는 discrete-switching 가정을 넘어 causal representation learning을 확장하며, training에서 관측되지 않은 intermediate mechanism state로도 generalize한다. identifiability guarantee는 가정된 convex-combination-of-atomic-mechanisms 구조에 묶여 있어, 임의로 복잡한 mechanism dynamics는 포착하지 못할 수 있다.", "abstract": "Temporal causal representation learning methods assume that causal mechanisms switch instantaneously between discrete domains, yet real-world systems often exhibit continuous mechanism transitions. For example, a vehicle's dynamics evolve gradually through a turning maneuver, and human gait shifts smoothly from walking to running. We formalize this setting by modeling transitional mechanisms as convex combinations of finitely many atomic mechanisms, governed by time-varying mixing coefficients. Our theoretical contributions establish that both the latent causal variables and the continuous mixing trajectory are jointly identifiable. We further propose TRACE, a Mixture-of-Experts framework where each expert learns one atomic mechanism during training, enabling recovery of mechanism trajectories at test time. This formulation generalizes to intermediate mechanism states never observed during training. Experiments on synthetic and real-world data demonstrate that TRACE recovers mixing trajectories with up to 0.99 correlation, substantially outperforming discrete-switching baselines."}, {"id": "63729", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "CauScale: Neural Causal Discovery at Scale", "url": "https://icml.cc/virtual/2026/poster/63729", "board": "Hall A #4403", "categories": ["Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": ["continuous-optimization"], "authors": ["Bo Peng", "Sirui Chen", "Jiaguo Tian", "Yu Qiao", "Chaochao Lu"], "famous": ["Chaochao Lu"], "key_idea_en": "CauScale is a two-stream neural architecture that scales causal discovery to graphs of up to 1000 nodes while cutting inference time and memory cost.", "summary_en": "Existing causal discovery methods suffer severe time and space inefficiency when scaling to large graphs, which limits their applicability in data-driven scientific domains. CauScale introduces a reduction unit that compresses data embeddings, along with tied attention weights that avoid maintaining axis-specific attention maps, within a two-stream design where a data stream extracts relational evidence and a graph stream integrates statistical graph priors. It trains on graphs of up to 500 nodes - a size at which prior methods fail due to memory limits - and infers on graphs of up to 1000 nodes, achieving 99.6% mAP in-distribution, 84.4% out-of-distribution, and inference speedups of 4x to 13,000x over prior methods. This resolves a major scalability bottleneck that has confined neural causal discovery to small graphs, opening the door to large-scale scientific and data-analysis applications. Performance still degrades notably under distribution shift, and the approach relies on learned graph priors that may not generalize to unseen causal mechanisms.", "key_idea_ko": "CauScale은 최대 1000개 node의 graph까지 causal discovery를 scale하면서 inference 시간과 memory 비용을 크게 줄이는 two-stream neural architecture이다.", "summary_ko": "문제는 기존 causal discovery method들이 large graph로 scale할 때 심각한 시간 및 공간 비효율을 겪으며, 이는 data-driven scientific domain에서의 적용 가능성을 제한한다는 점이다. 핵심 아이디어는 CauScale이 data embedding을 압축하는 reduction unit과 axis-specific attention map을 유지할 필요를 없애는 tied attention weight를 도입하고, data stream이 relational evidence를 추출하고 graph stream이 statistical graph prior를 통합하는 two-stream design과 결합하는 것이다. 주요 기술적 결과는 이 방법이 기존 method들이 memory 한계로 실패하는 최대 500개 node의 graph에서 training되고 최대 1000개 node의 graph에서 inference하며, in-distribution에서 99.6% mAP, out-of-distribution에서 84.4%를 달성하고, 기존 방법 대비 4배에서 13,000배의 inference speedup을 보인다는 것이다. 이는 neural causal discovery를 small graph로 제한해온 주요 scalability bottleneck을 해결하여 large-scale scientific 및 data-analysis setting에서의 적용을 가능하게 한다는 점에서 중요하다. distribution shift 하에서는 성능이 여전히 눈에 띄게 저하되며, 이 접근은 unseen causal mechanism에 일반화되지 않을 수 있는 learned graph prior에 의존한다.", "abstract": "Causal discovery is essential for advancing data-driven fields such as scientific AI and data analysis, yet existing approaches face significant time- and space-efficiency bottlenecks when scaling to large graphs. To address this challenge, we present CauScale, a neural architecture designed for efficient causal discovery that scales inference to graphs with up to 1000 nodes. CauScale improves time efficiency via a reduction unit that compresses data embeddings and improves space efficiency by adopting tied attention weights to avoid maintaining axis-specific attention maps. To keep high causal discovery accuracy, CauScale adopts a two-stream design: a data stream extracts relational evidence from high-dimensional observations, while a graph stream integrates statistical graph priors and preserves key structural signals. CauScale successfully scales to 500-node graphs during training, where prior work fails due to space limitations. Across testing data with varying graph scales and causal mechanisms, CauScale achieves 99.6% mAP on in-distribution data and 84.4% on out-of-distribution data, while delivering 4x-13,000x inference speedups over prior methods."}, {"id": "60649", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal Discovery for Irregularly Time Series with Consistency Guarantees", "url": "https://icml.cc/virtual/2026/poster/60649", "board": "Hall A #4404", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["score-based"], "authors": ["Weihong Li", "Baohong Li", "Anpeng Wu", "Zhihan Li", "Ming Ma", "Kun Kuang", "Keting Yin"], "famous": ["Kun Kuang"], "key_idea_en": "ReTimeCausal is an EM-based framework that alternates between missing-data imputation and causal structure learning for irregularly sampled time series, with provable consistency guarantees.", "summary_en": "Causal discovery in irregularly sampled time series is difficult because missing data and inconsistent sampling frequencies distort inferred causal mechanisms, and errors in imputation and structure learning can reinforce each other. ReTimeCausal addresses this with an EM-based framework that alternates between imputing missing values and learning the causal graph, combining kernel-based sparse regression with structural constraints to keep the two steps mutually consistent. The authors prove theoretical consistency guarantees for structure recovery, extending classical causal discovery consistency results to settings with irregular sampling and high missingness. This targets a common failure mode in risk-sensitive domains such as finance, healthcare, and climate science, where naive impute-then-discover or joint neural approaches lack such guarantees. Evaluation on synthetic and real-world datasets shows improvement over existing methods, though the guarantees are tied to the specific kernel-based sparse regression setup used.", "key_idea_ko": "ReTimeCausal은 irregularly sampled time series에 대해 missing-data imputation과 causal structure learning을 번갈아 수행하는 EM 기반 framework으로, 증명 가능한 consistency guarantee를 갖는다.", "summary_ko": "irregularly sampled time series에서의 causal discovery는 missing data와 일관되지 않은 sampling frequency가 추론된 causal mechanism을 왜곡시키고, imputation과 structure learning의 오류가 서로를 강화할 수 있어 어렵다. 이 논문은 missing value를 imputation하는 단계와 causal graph를 학습하는 단계를 번갈아 수행하는 EM 기반 framework인 ReTimeCausal을 제안하며, kernel 기반 sparse regression과 structural constraint를 결합해 두 단계가 상호 일관성을 유지하도록 한다. 저자들은 structure recovery에 대한 이론적 consistency guarantee를 증명하여, classical causal discovery의 consistency 결과를 irregular sampling과 high missingness 상황으로 확장한다. 이는 naive한 impute-then-discover 방식이나 joint neural network 접근법이 이러한 guarantee를 갖추지 못한 finance, healthcare, climate science 등 risk-sensitive 도메인에서 흔한 실패 양상을 해결한다는 점에서 의의가 있다. 평가는 synthetic 및 real-world dataset에서 기존 방법 대비 향상을 보이는 것으로 제한되며, 그 guarantee는 사용된 특정 kernel 기반 sparse regression 설정에 결부되어 있다.", "abstract": "This paper studies causal discovery in irregularly sampled time series—a key challenge in risk-sensitive domains like finance, healthcare, and climate science, where missing data and inconsistent sampling frequencies distort causal mechanisms. The main challenge comes from the interdependence between missing data imputation and causal structure recovery: errors in imputation and structure learning can reinforce each other, leading to an inaccurate causal graph. Existing methods either impute first and then discover, or jointly optimize both via neural representation learning, but lack explicit mechanisms to ensure mutual consistency of imputation and structure learning. We address this challenge with ReTimeCausal, an EM-based framework that alternates between imputation and structure learning, which encourages structural consistency throughout the optimization process. Our framework provides theoretical consistency guarantees for structure recovery and extends classical results to settings with irregular sampling and high missingness. ReTimeCausal combines kernel-based sparse regression and structural constraints in an alternating process that updates the completed data and the causal graph in turn. Experiments on synthetic and real-world datasets show that ReTimeCausal is more effective than existing methods under challenging irregular sampling and missing time series data."}, {"id": "65942", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Causal Effect Identifiability in the Presence of Latent Confounders Without Auxiliary Variables", "url": "https://icml.cc/virtual/2026/poster/65942", "board": "Hall A #4405", "categories": ["Identification & Partial ID", "Confounding & Deconfounding"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Xiu-Chuan Li", "James Kwok", "Jiaxian Guo", "Tongliang Liu"], "famous": [], "key_idea_en": "A complete characterization of when a treatment effect is identifiable in linear SCMs with latent confounders, using only the treatment-outcome joint distribution and exploiting non-Gaussianity of the exogenous noise, without any auxiliary variables.", "summary_en": "Identifying a causal effect in the presence of latent confounders typically requires auxiliary variables such as instruments, but these are often unavailable, leaving only the treatment-outcome joint distribution to work with. The authors address this within linear structural causal models, characterizing identifiability entirely through the Gaussianity properties of the exogenous noise terms. They derive a set of mutually exclusive, collectively exhaustive conditions on noise Gaussianity that fully determine whether the effect is identifiable, along with a characterization of the size of the feasible solution set when it is not. By dispensing with the usual requirement for instruments or other auxiliary variables, the result broadens the range of settings in which causal effects can be provably recovered. The guarantees are specific to linear SCMs and hinge on non-Gaussian noise, a restriction the authors support with empirical validation.", "key_idea_ko": "보조 변수(auxiliary variable) 없이 treatment-outcome joint distribution만으로, 외생 noise의 non-Gaussianity 조건을 이용해 linear SCM에서 latent confounder 하의 treatment effect identifiability를 완전히 특징짓는다.", "summary_ko": "instrument와 같은 보조 변수가 없을 때, treatment-outcome joint distribution만으로 latent confounder가 존재하는 상황에서 causal effect가 identifiable한지 판단하는 문제를 다룬다. 핵심 아이디어는 linear structural causal model에 국한하여, 외생 noise 항들의 Gaussianity 특성만으로 identifiability를 규정하는 것이다. 주요 기술적 결과로 identifiability 여부를 완전히 결정하는, 상호배타적이며 완전한 noise Gaussianity 조건 집합을 제시하고, unidentifiable한 경우에는 feasible solution set의 크기까지 특징짓는다. 이는 auxiliary/instrumental variable을 요구하는 기존 관행을 제거하여 causal effect를 증명 가능하게 복원할 수 있는 설정의 범위를 넓힌다는 점에서 의의가 있다. 다만 접근법은 linear SCM에 한정되며 identifiability 보장은 non-Gaussian noise 분포 가정에 의존하는데, 실험적 검증이 이 이론을 뒷받침한다.", "abstract": "It is a fundamental challenge to ascertain whether the causal effect of a treatment on an outcome is identifiable in the presence of latent confounders, which serves as the logical prerequisite for recovering the causal effect in a partially observed system. While prior literature demonstrates that the causal effect is identifiable when there exist auxiliary variables subject to stringent structural constraints, this paper investigates identifiability of the causal effect without such variables. This means that we ground identifiability solely in the joint distribution of the treatment-outcome pair, which constitutes the irreducible statistical basis for causal effect identification. Focusing on linear structural causal models (SCMs), we provide a nuanced and complete characterization of identifiability of the causal effect contingent on the distributional properties of exogenous noises. Specifically, we formulate a set of mutually exclusive and collectively exhaustive conditions regarding the Gaussianity of exogenous noises, ascertain under which conditions the causal effect is identifiable and under which it is not, while also quantifying the cardinality of the feasible solution set for the unidentifiable cases. Finally, we empirically validate our theoretical findings."}, {"id": "62929", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Dissecting Causal Mechanism Shifts via FANS: Function And Noise Separation", "url": "https://icml.cc/virtual/2026/poster/62929", "board": "Hall A #4406", "categories": ["Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Gyeongdeok Seo", "Jaeyoon Shim", "Mingyu Kim", "Hoyoon Byun", "Yonghan Jung", "Kyungwoo Song"], "famous": ["Yonghan Jung"], "key_idea_en": "FANS is a retraining-free, two-stage algorithm that detects causal mechanism shifts in nonlinear, non-additive structural causal models and attributes them separately to function changes versus noise changes.", "summary_en": "Detecting and separating causal mechanism shifts into functional versus noise changes is important in domains like biomedicine and manufacturing, but remains largely unexplored beyond additive noise models. FANS (Function And Noise Separation) builds on a theoretical independence criterion, that a functional shift induces statistical dependence between a node's parents and its residual noise, to detect and dissect mechanism shifts across general nonlinear, non-additive structural causal models, implemented as a practical two-stage algorithm requiring no retraining. The authors further introduce a formal assumption that resolves the non-identifiability arising when function and noise shift simultaneously, and validate the approach in simulation. This extends mechanism-shift detection well beyond the additive-noise-model setting to a much broader class of structural causal models relevant to real shifted systems. Validation is confined to simulated data, and the simultaneous-shift case is identifiable only under the added assumption rather than in full generality.", "key_idea_ko": "FANS는 retraining 없이 nonlinear, non-additive SCM에서 causal mechanism shift를 function change와 noise change로 구분해 감지하고 귀속시키는 two-stage 알고리즘이다.", "summary_ko": "causal mechanism shift를 감지하고 이를 functional change와 noise change로 분리하는 것은 biomedicine이나 manufacturing 같은 domain에서 중요하지만, additive noise model을 넘어선 설정에서는 충분히 연구되지 않았다. FANS(Function And Noise Separation)는 function shift가 발생하면 노드의 parents와 residual noise 사이에 statistical dependence가 유도된다는 theoretical independence criterion을 활용해, general한 non-additive, nonlinear structural causal model에서 mechanism shift를 감지하고 분리하는 retraining-free two-stage 알고리즘이다. 저자들은 이 알고리즘을 실질적으로 구현하는 동시에, function과 noise가 동시에 shift할 때 발생하는 non-identifiability를 해결하는 formal assumption을 추가로 제시한다. 이는 mechanism-shift detection을 additive-noise-model 설정을 넘어 실제 shifted system과 관련된 훨씬 넓은 class의 SCM으로 일반화한다는 점에서 의의가 있다. 결과는 simulation을 통해 검증되었으며, simultaneous-shift case는 완전히 general한 identifiability가 아니라 추가된 identifying assumption에 의존한다.", "abstract": "Identifying the drivers of causal mechanism shifts, distinguishing functional changes from noise alterations, known as dissection, is a critical yet under-explored problem in data science (e.g., biomedical science and manufacturing). This paper introduces a more general and unified framework, the function and noise separation framework (FANS), that detects and dissects shifts in non-additive, non-linear Structural Causal Models (SCMs) beyond existing additive noise models. Our approach is grounded in a theoretical independence criterion, where function shifts induce a statistical dependence between a node's parents and residual noise. Building on this foundation, we develop a practical two-stage algorithm to efficiently detect and dissect these shifts without retraining. Furthermore, we address the complex challenge of simultaneous function and noise shifts, introducing a formal assumption to resolve their inherent non-identifiability. Our results are corroborated by simulations."}, {"id": "61548", "session": 1, "time": "10:30-12:15", "date_en": "Tue Jul 7", "date_ko": "7/7 (화)", "title": "Frequentist Consistency of Prior-Data Fitted Networks for Causal Estimation", "url": "https://icml.cc/virtual/2026/poster/61548", "board": "Hall A #4407", "categories": ["Treatment Effects & CATE", "Causal Reasoning in LLMs/Agents"], "estimands": ["ATE"], "treatment_type": "", "discovery_types": [], "authors": ["Valentyn Melnychuk", "Vahid Balazadeh", "Stefan Feuerriegel", "Rahul G. Krishnan"], "famous": ["Stefan Feuerriegel"], "key_idea_en": "Prior-data fitted network (PFN) causal estimators turn out not to be frequentist-consistent becau
