인다. 이는 forecasting을 단순한 구조적 intervention을 넘어 현실적인 free-text what-if 시나리오(예: 월드컵 결승전이 내일 열린다면)로 확장하여 실제 planning에 대한 적용 가능성을 넓힌다는 의의가 있다. counterfactual ground truth가 일반적으로 존재하지 않기 때문에 평가는 실제 counterfactual outcome과의 직접 비교 대신 제안된 프레임워크에 의존하며, 이는 이 setting 고유의 한계다.", "abstract": "Time series forecasting has become increasingly critical in real-world scenarios, where future sequences are influenced not only by historical patterns but also by forthcoming events. In this context, forecasting must dynamically adapt to complex and stochastic future conditions, which introduces fundamental challenges in both forecasting and evaluation. Traditional methods typically rely on historical data or factual future conditions, while overlooking counterfactual scenarios. Furthermore, many existing approaches are restricted to simple structured conditions, limiting their ability to generalize to the real-world complexities. To address these gaps, we introduce the task of counterfactual time series forecasting with textual conditions, enabling more flexible and condition-aware forecasting. We propose a comprehensive evaluation framework that encompasses both factual and counterfactual settings, even in the absence of ground truth time series. Additionally, we present a novel text-attribution mechanism that distinguishes mutable from immutable factors, thereby improving forecast accuracy under sophisticated and stochastic textual conditions."}, {"id": "65944", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Bootstrapped Exploration with Causal Reasoning: A Training Paradigm for Adaptive Forecasting Agent", "url": "https://icml.cc/virtual/2026/poster/65944", "board": "Hall A #610", "categories": ["Time-Series Causality", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Qingwen Zeng", "Dajun Guo", "Zhaoge Bi", "lining chen", "Jushang Qiu", "Yitian Yang", "Carl Yang", "Huaming Chen", "Ling Chen"], "famous": [], "key_idea_en": "BECRA trains an LLM-based forecasting agent through contrast-aware exploration and causal 'lesson' extraction, enabling it to adapt its forecasting strategy zero-shot to new time-series datasets without human supervision.", "summary_en": "LLM-agent forecasting pipelines often fail to adapt their workflow consistently across heterogeneous, non-stationary time-series datasets, hampered by limited strategy-level supervision and the difficulty of mapping dataset meta-features onto effective strategies. BECRA is a training paradigm in which an agent explores forecasting strategies through contrast-aware exploration and distills the results into agent-level causal lessons, symbolic strategy knowledge, without any human annotation. These distilled causal lessons support in-context planning, allowing the agent to adapt its forecasting workflow zero-shot to unseen datasets. This reduces the engineering cost of building bespoke forecasting pipelines by letting an agent transfer reusable causal strategy knowledge across domains such as finance, energy, and healthcare. The reported results cover strategy distillation and zero-shot adaptation, but no formal identifiability or theoretical guarantee is given for the extracted causal lessons.", "key_idea_ko": "BECRA는 contrast-aware exploration과 causal lesson 추출을 통해 LLM 기반 forecasting agent를 학습시켜, 사람의 감독 없이 새로운 time-series dataset에 zero-shot으로 forecasting 전략을 적응시킨다.", "summary_ko": "LLM-agent forecasting pipeline은 strategy-level supervision의 부족과 dataset meta-feature를 효과적인 전략에 매핑하는 어려움 때문에 이질적이고 non-stationary한 time-series dataset 전반에서 workflow를 일관되게 적응시키지 못한다. BECRA는 contrast-aware exploration을 통해 forecasting 전략을 탐색하고, 사람의 annotation 없이 agent-level causal lesson(symbolic strategy knowledge)을 distill하는 agent-training paradigm이다. distill된 causal lesson은 in-context planning을 지원하여 unseen dataset에 대한 forecasting workflow의 zero-shot adaptation을 가능하게 한다. 이는 agent가 finance, energy, healthcare 같은 domain에 걸쳐 재사용 가능한 causal strategy knowledge를 전이하도록 함으로써 맞춤형 forecasting pipeline 구축의 engineering cost를 줄인다는 점에서 의의가 있다. abstract는 strategy distillation과 zero-shot adaptation을 보고하지만, 추출된 causal lesson에 대한 formal identifiability나 theoretical guarantee는 제공하지 않는다.", "abstract": "Time series forecasting is critical in domains such as finance, energy, and healthcare, yet real-world datasets often exhibit non-stationarity, noise, missing values, and distribution shifts, posing severe challenges for generalization. In practice, industry solutions typically rely on customized forecasting frameworks that combine imputation, decomposition, and specialized models. However, such frameworks are costly to engineer and maintain. Moreover, many frameworks suffer from the impacts of distribution shifts, which degrade their performance. This motivates a paradigm that transfers reliably across heterogeneous datasets while accumulating reusable strategy knowledge for large-scale, dynamic environments. Although large language model-based agents have recently shown strong reasoning and tool-use capabilities, existing approaches do not consistently adapt forecasting workflows across diverse time series, due to limited strategy-level supervision and the inherent complexity of mapping dataset-specific meta-features to effective forecasting strategies. To address these challenges, we propose BECRA, a novel agent training paradigm that learns forecasting intelligence through contrast-aware exploration and agent-level causal lesson extraction, without human-annotated supervision. BECRA distills symbolic strategy lessons that support in-context planning on unseen datasets, enabling zero-shot training adaptation."}, {"id": "65263", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "When Sample Selection Bias Precipitates Model Collapse", "url": "https://icml.cc/virtual/2026/poster/65263", "board": "Hall A #2707", "categories": ["Confounding & Deconfounding", "Other"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Xinbao Qiao", "Xianglong Du", "Wei Liu", "Jingqi Zhang", "Peihua Mai", "Meng Zhang", "Yan (James) Pang"], "famous": [], "key_idea_en": "Data-silo sample selection bias is shown to accelerate recursive model collapse, motivating a Wasserstein-Barycenter-based multi-party filtering criterion that lets siloed data owners collaboratively score synthetic data without sharing raw data.", "summary_en": "Recursive training on synthetic data risks model collapse, and existing data-selection defenses assume a verifier with perfect global knowledge of the true data distribution, an assumption that breaks down once data is fragmented across silos such as hospitals or financial institutions. The paper proves theoretically that siloed, locally biased selection accelerates collapse, with diversity decaying according to a power law, and derives an automated filtering criterion combining a sensitivity theorem with Wasserstein geometry. Multiple parties can then collaboratively compute geodesic interpolations and a Wasserstein Barycenter as a shared proxy for the true distribution, without exchanging raw data, and use it to score synthetic samples. Empirically, baseline filtering fails once distributions are skewed across silos, while the proposed method prevents collapse, a result relevant to federated or privacy-constrained settings that increasingly depend on synthetic-data training pipelines. The analysis centers selection-induced sample-selection bias as the collapse mechanism, and its guarantees hinge on the barycenter proxy adequately approximating the true global distribution.", "key_idea_ko": "data-silo sample selection bias가 recursive model collapse를 가속화함을 보이고, siloed data owner들이 raw data를 공유하지 않고도 synthetic data를 협력적으로 평가할 수 있는 Wasserstein-Barycenter 기반 multi-party filtering criterion을 제안한다.", "summary_ko": "Recursive training on synthetic data는 model collapse 위험을 지니며, 기존 data-selection 방어책은 true distribution에 대한 완전한 global knowledge를 갖는 verifier를 가정하지만 hospital이나 financial institution처럼 data가 silo로 나뉜 상황에서는 이 가정이 무너진다. 이 논문은 siloed(local하게 biased된) selection이 model collapse를 가속화하며 diversity가 power law로 decay함을 이론적으로 증명하고, sensitivity theorem과 Wasserstein geometry를 결합한 automated filtering criterion을 제안한다. 구체적으로는 여러 party가 raw data 공유 없이 geodesic interpolation과 Wasserstein Barycenter를 협력적으로 계산해 true distribution의 shared proxy로 삼고, 이를 이용해 synthetic sample을 score한다. 실험 결과 baseline filtering은 silo 간 distribution이 skewed된 경우 실패하지만 제안된 방법은 model collapse를 방지하며, 이는 synthetic-data training pipeline에 점점 의존하는 federated 혹은 privacy-constrained setting에 중요한 의미를 갖는다. 이 접근의 핵심은 selection-induced sample-selection bias를 collapse의 mechanism으로 지목한 데 있으며, 그 guarantee는 barycenter proxy가 true global distribution을 충분히 근사한다는 가정에 의존한다.", "abstract": "The proliferation of recursive synthetic data training promises to alleviate data scarcity but introduces the existential risk of model collapse, wherein recursive training on synthetic data erodes distributional tails and homogenizes outputs. Current literature identifies data selection as a pivotal solution, employing verifiers to prune datasets in pursuit of synthetic samples that approximate the true data manifold. However, this approach hinges on the fragile and often unrealistic assumption that a perfect verifier possesses global distributional knowledge. In real-world scenarios characterized by data silos, such as fragmented healthcare consortia or proprietary financial institutions, this assumption is invalidated by the inherent fragmentation of knowledge. We theoretically prove that such siloed selection accelerates model collapse, driving diversity decay governed by a power law. To bridge this gap, we propose an automated filtering criterion that synergizes the sensitivity theorem with Wasserstein geometry. Specifically, multiple parties collaboratively compute geodesic interpolations and the Wasserstein Barycenter as proxy measures, without exchanging raw data. These proxies serve as a collective reference, enabling multiple parties to score synthetic data rather than relying on a single biased perspective in a data silo. Empirical results show the failure of the baseline on skewed distributions, whereas our methods effectively prevent collapse. Code available at Anonymous Github."}, {"id": "65508", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Factored Causal Representation Learning for Robust Reward Modeling in RLHF", "url": "https://icml.cc/virtual/2026/poster/65508", "board": "Hall A #2413", "categories": ["Causal Representation Learning", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yupei Yang", "Lin Yang", "Wanxi Deng", "Lin Qu", "Fan Feng", "Biwei Huang", "Shikui Tu", "Lei Xu"], "famous": ["Biwei Huang"], "key_idea_en": "Factoring an RLHF reward model's embedding into causal and non-causal components, restricting the reward head to the causal factors while an adversarial head with gradient reversal strips reward signal from the rest, yields more robust reward models.", "summary_en": "Reward models used in RLHF for aligning LLMs tend to latch onto spurious, non-causal features such as response length or sycophancy, producing reward hacking in which high predicted reward fails to track genuinely better behavior. The authors address this by decomposing the model's contextual embedding into causal factors sufficient for reward prediction and non-causal factors capturing reward-irrelevant attributes, restricting the reward head to the causal component while an adversarial head with gradient reversal prevents the non-causal factors from encoding reward-relevant information. Experiments on mathematical and dialogue tasks show the method yields more robust reward models and consistently improves downstream RLHF performance over state-of-the-art baselines, with targeted analyses confirming reduced length and sycophantic bias. This furnishes a concrete causal-representation-learning recipe for mitigating reward hacking, a central failure mode in LLM alignment. The approach's success depends on the adversarial objective successfully separating causal from non-causal factors, and evaluation is confined to specific task domains, namely math and dialogue.", "key_idea_ko": "RLHF reward model의 embedding을 causal(reward-relevant) factor와 non-causal factor로 factorize하여 reward head는 causal factor에만 의존하게 제한하고, gradient reversal을 적용한 adversarial head로 non-causal factor에서 reward 신호를 제거한다.", "summary_ko": "LLM alignment를 위한 RLHF에서 사용되는 reward model은 response length나 sycophancy 같은 spurious하고 non-causal한 feature에 의존하기 쉬워, predicted reward가 실제로 더 나은 행동을 추적하지 못하는 reward hacking을 유발한다. 저자들은 model의 contextual embedding을 reward prediction에 충분한 causal factor와 reward와 무관한 attribute를 포착하는 non-causal factor로 분해하고, reward head가 causal component에만 의존하도록 제약하며, gradient reversal을 사용한 adversarial head를 추가하여 non-causal factor가 reward-relevant 정보를 encoding하지 못하게 한다. mathematical 및 dialogue task 실험에서 이 방법이 더 robust한 reward model을 학습하고 state-of-the-art baseline 대비 downstream RLHF performance를 일관되게 향상시켰으며, targeted analysis는 length bias와 sycophantic bias가 감소함을 확인했다. 이는 LLM alignment의 핵심 실패 모드인 reward hacking을 완화하기 위한 구체적인 causal representation learning 레시피를 제공한다는 점에서 중요하다. 다만 이 접근은 adversarial objective가 causal factor와 non-causal factor를 성공적으로 분리하는 데 의존하며, math와 dialogue라는 특정 task domain에서만 평가되었다.", "abstract": "A reliable reward model is essential for aligning large language models (LLMs) with human preferences through reinforcement learning from human feedback (RLHF). However, standard reward models are susceptible to spurious features that are not causally related to human labels. This can lead to reward hacking, where high predicted reward does not translate into better behavior. In this work, we address this problem from a causal perspective by proposing a factored representation learning framework that decomposes the model's contextual embedding into (1) causal factors that are sufficient for reward prediction and (2) non-causal factors that capture reward-irrelevant attributes such as length or sycophantic bias. The reward head is then constrained to depend only on the causal component. In addition, we introduce an adversarial head trained to predict reward from the non-causal factors, while applying gradient reversal to discourage them from encoding reward-relevant information. Experiments on both mathematical and dialogue tasks demonstrate that our method learns more robust reward models and consistently improves downstream RLHF performance over state-of-the-art baselines. Analyses on length and sycophantic bias further validate the effectiveness of our method in mitigating reward hacking behaviors."}, {"id": "65293", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "HugRAG: Hierarchical Causal Knowledge Graph Design for RAG", "url": "https://icml.cc/virtual/2026/poster/65293", "board": "Hall A #2304", "categories": ["Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Nengbo Wang", "Tuo Liang", "Vikash Singh", "Chaoda Song", "Van Yang", "Yu Yin", "Jing Ma", "Jagdip Singh", "Vipin Chaudhary"], "famous": [], "key_idea_en": "HugRAG restructures graph-based retrieval-augmented generation around a hierarchical causal knowledge graph with explicit causal gating across modules, suppressing spurious correlations and enabling cross-module causal reasoning.", "summary_en": "Existing graph-based retrieval-augmented generation methods rely on surface-level node matching without explicit causal modeling, and even prior causal-RAG attempts remain limited to local contexts with information isolated across modular graph structures. HugRAG instead organizes knowledge via a hierarchical causal knowledge graph and applies causal gating across modules to explicitly model causal relationships and suppress spurious correlations. It consistently outperforms competitive graph-based RAG baselines across multiple datasets and evaluation metrics. By addressing the scalability and cross-module reasoning limits of prior causal RAG, the approach aims for LLM answers that are more faithful, less spurious, and better grounded in structured knowledge. Evaluation is empirical across benchmark datasets, and the abstract does not detail formal identification guarantees for the causal gating mechanism.", "key_idea_ko": "HugRAG는 hierarchical knowledge-graph module 간에 명시적인 causal gating을 적용하여 graph-based retrieval-augmented generation을 재구성함으로써 spurious correlation을 억제하고 module 간 causal reasoning을 가능하게 한다.", "summary_ko": "기존 graph-based retrieval-augmented generation (RAG) 방법은 명시적인 causal modeling 없이 표면적인 node matching에 의존하며, 기존의 causal-RAG 시도들은 local context에 국한되어 modular graph structure 전반에 정보가 고립되는 한계가 있다. HugRAG는 hierarchical causal knowledge graph를 통해 지식을 조직화하고, module 간에 causal gating을 적용하여 causal relationship을 명시적으로 모델링하고 spurious correlation을 억제한다. HugRAG는 여러 데이터셋과 평가 지표에 걸쳐 경쟁력 있는 graph-based RAG baseline들을 일관되게 능가한다. causal RAG에서의 scalability와 cross-module reasoning 한계를 해결하여, 구조화된 지식에 근거한 더 충실하고 spurious함이 적은 LLM 답변을 지향한다는 점에서 의의가 있다. 평가는 벤치마크 데이터셋에 대한 경험적 분석이며, causal gating 메커니즘에 대한 formal identification guarantee는 abstract에 상세히 제시되어 있지 않다.", "abstract": "Retrieval augmented generation (RAG) has enhanced large language models by enabling access to external knowledge, with graph-based RAG emerging as a powerful paradigm for structured retrieval and reasoning. However, existing graph-based methods often over-rely on surface-level node matching and lack explicit causal modeling, leading to unfaithful or spurious answers. Prior attempts to incorporate causality are typically limited to local or single-document contexts and also suffer from information isolation that arises from modular graph structures, which hinders scalability and cross-module causal reasoning. To address these challenges, we propose HugRAG, a framework that rethinks knowledge organization for graph-based RAG through causal gating across hierarchical modules. HugRAG explicitly models causal relationships to suppress spurious correlations while enabling scalable reasoning over large-scale knowledge graphs. Extensive experiments demonstrate that HugRAG consistently outperforms competitive graph-based RAG baselines across multiple datasets and evaluation metrics. Our work establishes a principled foundation for structured, scalable, and causally grounded RAG systems."}, {"id": "64884", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Causal Matrix Completion under Multiple Treatments via Mixed Synthetic Nearest Neighbors", "url": "https://icml.cc/virtual/2026/poster/64884", "board": "Hall A #3710", "categories": ["Treatment Effects & CATE", "Identification & Partial ID"], "estimands": ["joint of POs"], "treatment_type": "multi-valued", "discovery_types": [], "authors": ["Minrui Luo", "Zhiheng Zhang"], "famous": [], "key_idea_en": "Mixed Synthetic Nearest Neighbors extends causal matrix completion under missing-not-at-random data to multiple treatments by pooling information across treatment levels while retaining Synthetic Nearest Neighbors' theoretical guarantees.", "summary_en": "Synthetic Nearest Neighbors (SNN) enables causal matrix completion under missing-not-at-random data via local low-rank structure, but it requires sufficient data within each treatment level, which often fails once treatments become multiple or complex. The paper introduces Mixed Synthetic Nearest Neighbors (MSNN), an entry-wise causal identification estimator that pools information across treatment levels instead of treating each in isolation. MSNN retains SNN's finite-sample error bounds and asymptotic normality while effectively enlarging the usable sample size for estimation. This makes causal matrix completion practical in the data-scarce multi-treatment settings common to real applications such as panel and recommendation data. The method is validated empirically on synthetic and real-world datasets but is framed specifically for the multiple-treatment causal matrix completion setting.", "key_idea_ko": "Mixed Synthetic Nearest Neighbors는 treatment level 간 정보를 pooling하여 Synthetic Nearest Neighbors의 theoretical guarantee를 유지하면서 causal matrix completion을 multiple treatment 상황으로 확장한다.", "summary_ko": "Synthetic Nearest Neighbors(SNN)는 local low-rank structure를 이용해 missing-not-at-random data 하에서 causal matrix completion을 가능하게 하지만, 각 treatment level 내에 충분한 데이터가 필요하며 이는 multiple이거나 복잡한 treatment 하에서 흔히 실패한다. 이 논문은 각 treatment level을 개별적으로 다루는 대신 treatment level 간 정보를 통합하는 entry-wise causal identification estimator인 Mixed Synthetic Nearest Neighbors(MSNN)를 제안한다. 주요 결과는 MSNN이 SNN의 finite-sample error bound와 asymptotic normality를 유지하면서도 estimation에 사용 가능한 sample size를 실질적으로 늘린다는 것이다. 이는 panel data나 recommendation data처럼 실제 응용에서 흔한 data-scarce multi-treatment 상황에서 causal matrix completion을 실용적으로 만든다는 점에서 의미가 있다. 이 방법은 synthetic 및 real-world 데이터셋에서 경험적으로 검증되었지만, multiple-treatment causal matrix completion 상황에 특화되어 설계되었다.", "abstract": "Synthetic Nearest Neighbors (SNN) provides a principled solution to causal matrix completion under missing-not-at-random (MNAR) by exploiting local low-rank structure through fully observed anchor submatrices. However, its effectiveness critically relies on sufficient data availability within each treatment level, a condition that often fails in settings with multiple or complex treatments. In this work, we propose Mixed Synthetic Nearest Neighbors (MSNN), a new entry-wise causal identification estimator that integrates information across treatment levels. We show that MSNN retains the finite-sample error bounds and asymptotic normality guarantees of SNN, while enlarging the effective sample size available for estimation. Empirical results on synthetic and real-world datasets illustrate the efficacy of the proposed approach, especially under data-scarce treatment levels."}, {"id": "68775", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Multi-Accurate CATE is Robust to Unknown Covariate Shifts", "url": "https://icml.cc/virtual/2026/poster/68775", "board": "Hall A #3905", "categories": ["Treatment Effects & CATE", "Causal Fairness & Robustness"], "estimands": ["CATE"], "treatment_type": "binary", "discovery_types": [], "authors": ["Christoph Kern", "Michael Kim", "Angela Zhou"], "famous": [], "key_idea_en": "Post-processing CATE T-learners and other pseudo-outcome regressions with multi-accurate predictor methodology makes heterogeneous treatment effect estimates robust to unknown covariate shifts between training and deployment populations.", "summary_en": "Conditional average treatment effect (CATE) predictors are often trained on one population but deployed on a different, possibly unknown population, which undermines their usefulness for tailoring treatments. This work adapts methodology for learning multi-accurate predictors to post-process CATE T-learners (differenced regressions) and, more generally, pseudo-outcome regressions such as the DR-learner, making them robust to unknown covariate shift at deployment time. The approach can combine a large confounded observational dataset with a smaller randomized dataset by learning a confounded predictor from observational data and auditing it for multi-accuracy on the RCT, and simulations with increasingly large covariate shift, plus a semi-synthetic observational/RCT case study, show reduced bias and MSE. It thereby connects multi-distribution learning methodology to causal inference desiderata such as external validity. The robustness guarantees are demonstrated empirically via simulation and a semi-synthetic case study rather than a fully real-world deployment evaluation.", "key_idea_ko": "CATE T-learner 및 다른 pseudo-outcome regression을 multi-accurate predictor 방법론으로 post-processing하여, training population과 deployment population 간 unknown covariate shift에 강건한 heterogeneous treatment effect estimate를 얻는다.", "summary_ko": "conditional average treatment effect (CATE) predictor는 흔히 한 population에서 학습되어 다르고 때로는 알 수 없는 population에 배포되는데, 이는 treatment를 맞춤화하는 데 있어 predictor의 유용성을 저해한다. 저자들은 multi-accurate predictor 학습 방법론을 CATE T-learner(differenced regression)와, 더 일반적으로는 DR-learner와 같은 pseudo-outcome regression을 post-processing하는 데 적용하여, deployment 시점의 unknown covariate shift에 강건하게 만든다. 이 접근은 confounded observational data로부터 confounded predictor를 학습한 뒤 RCT에서 multi-accuracy를 audit함으로써 대형 confounded observational dataset과 소규모 randomized dataset을 결합할 수 있으며, covariate shift를 점차 키운 simulation과 semi-synthetic observational/RCT case study 모두에서 bias와 MSE 감소를 보인다. 이 연구는 multi-distribution learning 방법론을 external validity와 같은 causal inference의 요구사항과 연결한다. robustness guarantee는 완전한 real-world deployment 평가가 아니라 simulation과 semi-synthetic case study를 통해 실증적으로만 입증되었다.", "abstract": "Estimating heterogeneous treatment effects is important to tailor treatments to those individuals who would most likely benefit. However, conditional average treatment effect predictors may often be trained on one population but possibly deployed on different, possibly unknown populations. We use methodology for learning multi-accurate predictors to post-process CATE T-learners (differenced regressions) to become robust to unknown covariate shifts at the time of deployment. The method works in general for pseudo-outcome regression, such as the DR-learner. We show how this approach can combine (large) confounded observational and (smaller) randomized datasets by learning a confounded predictor from the observational dataset, and auditing for multi-accuracy on the randomized controlled trial. We show improvements in bias and mean squared error in simulations with increasingly larger covariate shift, and on a semi-synthetic case study of a parallel large observational study and smaller randomized controlled experiment. Overall, we establish a connection between methods developed for multi-distribution learning and achieve appealing desiderata (e.g. external validity) in causal inference and machine learning."}, {"id": "61982", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Use What You Know: Causal Foundation Models with Partial Graphs", "url": "https://icml.cc/virtual/2026/poster/61982", "board": "Hall A #4109", "categories": ["Causal Discovery", "Identification & Partial ID", "Treatment Effects & CATE"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Arik Reuter", "Anish Dhir", "Cristiana Diaconu", "Jake Robertson", "Ole Ossen", "Frank Hutter", "Adrian Weller", "Mark van der Wilk", "Bernhard Scholkopf"], "famous": ["Bernhard Scholkopf"], "key_idea_en": "Conditioning strategies - best implemented as learnable attention biases - let Causal Foundation Models incorporate full or partial causal-graph domain knowledge, allowing a general-purpose CFM to match specialized models trained on specific causal structures.", "summary_en": "Causal Foundation Models (CFMs) promise to unify causal discovery and inference by amortizing them into a single model, but they currently have no way to incorporate domain knowledge such as a known causal graph, which can hurt prediction quality. The authors introduce methods for conditioning CFMs on causal information ranging from a complete causal graph down to more readily available partial or ancestral information when the full graph is unknown. A systematic comparison of conditioning strategies finds that injecting learnable biases into the attention mechanism is the most effective way to exploit full or partial causal information, letting a general CFM match specialized models trained on specific causal structures. This removes a central obstacle to all-in-one causal foundation models, since it lets a single model flexibly exploit whatever domain expertise happens to be available rather than requiring either complete knowledge or none. The evaluation is against specialized baselines within the amortized-model setting, and how performance degrades with noisier or larger partial-graph priors is not detailed in the abstract.", "key_idea_ko": "이 논문은 Causal Foundation Model이 full 또는 partial causal-graph domain knowledge를 활용할 수 있도록 하는 conditioning 전략(가장 효과적인 구현은 learnable attention bias)을 도입하여, general-purpose CFM이 특정 causal structure에 훈련된 specialized model과 맞먹는 성능을 내도록 한다.", "summary_ko": "문제는 Causal Foundation Model(CFM)이 causal discovery와 inference를 하나의 model로 amortize하여 통합하는 것을 목표로 하지만, 현재는 known causal graph와 같은 domain knowledge를 활용하지 못해 prediction 품질이 저해될 수 있다는 점이다. 핵심 아이디어는 CFM을 causal information에 conditioning하는 방법을 도입하는 것으로, 이는 complete causal graph부터 full graph를 모를 때 더 쉽게 얻을 수 있는 partial/ancestral information까지 아우른다. 주요 기술적 결과는 conditioning 전략들에 대한 systematic comparison을 통해 attention mechanism에 learnable bias를 주입하는 것이 full 또는 partial causal information을 활용하는 가장 효과적인 방법임을 보이며, 이를 통해 general CFM이 특정 causal structure로 훈련된 specialized model과 맞먹을 수 있음을 보인 것이다. 이는 complete knowledge 혹은 no knowledge라는 양자택일 대신 가용한 domain expertise를 유연하게 활용해야 하는 all-in-one causal foundation model의 핵심 장애물을 제거한다는 점에서 중요하다. 평가는 amortized-model setting 내에서 specialized baseline과 비교되었으며, noisier하거나 더 큰 partial-graph prior에서 성능이 어떻게 저하되는지는 abstract에 상세히 나와 있지 않다.", "abstract": "Estimating causal quantities traditionally relies on bespoke estimators tailored to specific assumptions. Recently proposed Causal Foundation Models (CFMs) promise a more unified approach by amortising causal discovery and inference in a single step. However, in their current state, they do not allow for the incorporation of any domain knowledge, which can lead to suboptimal predictions. We bridge this gap by introducing methods to condition CFMs on causal information, such as the causal graph or more readily available ancestral information. When access to complete causal graph information is too strict a requirement, our approach also effectively leverages partial causal information. We systematically evaluate conditioning strategies and find that injecting learnable biases into the attention mechanism is the most effective method to utilise full and partial causal information. Our experiments show that this conditioning allows a general-purpose CFM to match the performance of specialised models trained on specific causal structures. Overall, our approach addresses a central hurdle on the path towards all-in-one causal foundation models: the capability to answer causal queries in a data-driven manner while effectively leveraging any amount of domain expertise."}, {"id": "63252", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Unveiling Prior-data Fitted Networks on Causal Effect Estimation: Pre-training or Finetuning?", "url": "https://icml.cc/virtual/2026/poster/63252", "board": "Hall A #4110", "categories": ["Treatment Effects & CATE", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Haotian Wang", "Xinpeng Lv", "Hao Zou", "Yanghao Xiao", "Shanzhi Gu", "Yang Shi", "Yunxin Mao", "Yuanxing Zhang", "Mingyang Geng", "Shaowu Yang", "Haoxuan Li", "Wenjing Yang", "Peng Cui", "Zhouchen Lin"], "famous": ["Peng Cui"], "key_idea_en": "The paper proves that Prior-data Fitted Networks pre-trained for amortized causal effect estimation suffer from 'prior uncoverage,' since one observational prior cannot cover the exponentially large space of possible interventional distributions, and proposes fine-tuning strategies, PWF and MSF, to correct the resulting bias.", "summary_en": "Amortized causal inference via Prior-data Fitted Networks (PFNs) promises zero-shot estimation of causal effects without per-dataset tuning, but whether unified pre-training can truly cover general interventional regimes has remained unclear. Studying interventions on subsets of SCM variables, the authors prove that a single observational SCM induces an exponentially large space of possible interventional distributions, a phenomenon they term prior uncoverage, which mismatches the learned meta-prior against the true prior and causes unavoidable posterior inconsistency and estimation bias. To address this, they argue fine-tuning is fundamentally necessary and propose Point-Wise Interventional Fine-tuning (PWF) for local generalization to a specific target, then scale it to Meta-Sampling Fine-tuning (MSF), an active-learning-style approach for uniform generalization across any interventional distribution. The work identifies a theoretical ceiling on purely zero-shot PFN-based causal effect estimation and offers a principled remedy rather than simply more pre-training data. Consequently, pre-training-only PFNs cannot be relied upon for arbitrary interventional queries, and the proposed fixes require some budgeted fine-tuning or active-learning effort at deployment time.", "key_idea_ko": "이 논문은 amortized causal effect estimation을 위해 pre-train된 Prior-data Fitted Network가 prior uncoverage(하나의 observational prior로는 지수적으로 큰 interventional distribution 공간을 커버할 수 없는 현상)를 겪음을 증명하고, 이로 인한 bias를 해소하기 위한 fine-tuning 전략(PWF와 MSF)을 제안한다.", "summary_ko": "Prior-data Fitted Network(PFN)를 통한 amortized causal inference는 dataset별 tuning 없이 zero-shot causal effect estimation을 약속하지만, 통합된 pre-training이 실제로 일반적인 interventional regime을 커버할 수 있는지는 불분명하다. 저자들은 SCM 변수의 부분집합에 대한 intervention을 연구하여, 하나의 observational SCM이 지수적으로 큰 possible interventional distribution 공간을 유도한다는 것을 증명하는데, 이를 prior uncoverage라 부르며 이는 학습된 meta-prior와 true prior를 불일치시켜 불가피한 posterior inconsistency와 estimation bias를 초래한다. 이를 해결하기 위해 저자들은 fine-tuning이 근본적으로 필요하다고 주장하며, 특정 target에 대한 local generalization을 위한 Point-Wise Interventional Fine-tuning(PWF)을 제안한 뒤, 임의의 interventional distribution에 대한 uniform generalization을 위해 이를 active-learning 방식의 Meta-Sampling Fine-tuning(MSF)으로 확장한다. 이는 순수 zero-shot PFN 기반 causal effect estimation에 대한 이론적 한계를 규명하고 단순히 더 많은 pre-training data가 아닌 원칙적인 해법을 제시한다는 점에서 의의가 있다. 이 결과는 pre-training만으로 이루어진 PFN이 임의의 interventional query에 신뢰될 수 없음을 시사하며, 제안된 해법은 배포 시점에 어느 정도의 예산이 소요되는 fine-tuning/active-learning 노력을 필요로 한다.", "abstract": "Amortized causal inference via Prior-data Fitted Networks (PFNs) has emerged as a promising paradigm, enabling zero-shot estimation of causal effects without the need for dataset-specific model tuning. However, the principled effectiveness of unified pre-training across general interventional regimes remains an underexplored question. In this paper, we investigate interventions on subsets of variables within Structural Causal Models (SCMs) and identify a fundamental theoretical limitation of current pre-training approaches. Theoretically, we prove that a single observational SCM induces an exponentially large space of interventional distributions, resulting in a phenomenon we term prior uncoverage. Consequently, this uncoverage yields a mismatch between the learned meta-prior and the true grounding prior, leading to unavoidable posterior inconsistency and estimation bias. To address this, we posit that fine-tuning is a fundamental necessity and propose a target-specific strategy named Point-Wise Interventional Fine-tuning (PWF), enabling the local generalization property. We further scale this approach via Meta-Sampling Fine-tuning (MSF) from a budgeted active learning perspective, thereby achieving uniform generalization on any interventional distribution."}, {"id": "63521", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Relational Structural Causal Models", "url": "https://icml.cc/virtual/2026/poster/63521", "board": "HALL A #4207", "categories": ["Identification & Partial ID", "Confounding & Deconfounding", "Counterfactual Inference"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Adiba Ejaz", "Elias Bareinboim"], "famous": ["Elias Bareinboim"], "key_idea_en": "Structural causal models are extended to relational settings with varying objects and relations, enabling identification of causal and observational queries about previously unseen object combinations even under unobserved confounding.", "summary_en": "Standard causal models do not naturally support combinatorial generalization to unseen combinations of objects and relations, something many real systems, such as traffic scenes with varying agents, require alongside causal reasoning. This work introduces relational structural causal models, along with a corresponding 'relational neural causal model' implementation, extending Pearl's SCM framework to scenarios with a variable number of objects and relations among them. The main result is identification of answers to causal and observational queries about previously unseen object combinations, even in the presence of unobserved confounding, with the relational neural approach outperforming non-relational methods on simulated traffic scenarios involving varying vehicles, signals, and pedestrians. This bridges causal inference with relational and combinatorial generalization, relevant to multi-entity systems such as traffic, social networks, or multi-agent environments. Empirical validation is limited to simulated traffic scenarios, and the identification guarantees depend on the specific relational structural assumptions made.", "key_idea_ko": "object와 relation의 수가 달라지는 relational setting으로 structural causal model을 확장하여, unobserved confounding이 있는 경우에도 이전에 관측되지 않은 object 조합에 대한 causal 및 observational query의 identification을 가능하게 한다.", "summary_ko": "문제는 표준 causal model이 traffic scene의 다양한 agent처럼 causal reasoning과 더불어 combinatorial generalization을 필요로 하는 많은 실제 system에서 요구되는, 관측되지 않은 object와 relation 조합으로의 combinatorial generalization을 자연스럽게 지원하지 못한다는 점이다. 핵심 아이디어는 Pearl의 SCM framework를 가변적인 수의 object와 그 사이의 relation을 가진 시나리오로 확장하는 relational structural causal model과 이에 대응하는 'relational neural causal model' 구현을 도입하는 것이다. 주요 기술적 결과는 unobserved confounding이 존재하는 경우에도 이전에 관측되지 않은 object 조합에 대한 causal 및 observational query의 identification이며, relational neural approach는 vehicle, signal, pedestrian 수가 달라지는 simulated traffic scenario에서 non-relational method를 능가한다. 이는 causal inference를 relational/combinatorial generalization과 연결한다는 점에서 의미가 있으며, traffic, social network, multi-agent environment 같은 multi-entity system과 관련이 있다. 실증적 검증은 simulated traffic scenario에 국한되며, identification guarantee는 명시된 특정 relational structural assumption에 의존한다.", "abstract": "\"An artificial intelligence must have a model of its environment that is causal, supporting reasoning about interventions and counterfactuals, and also combinatorial, supporting generalization to unseen combinations of objects.\" The researchers developed relational structural causal models extending Pearl's framework to scenarios with varying objects and relations. They demonstrated how to identify answers to both causal and observational queries about previously unseen object combinations, even with unobserved confounding present. Their approach, called relational neural causal models, showed improved performance compared to non-relational methods when tested on simulated traffic scenarios featuring different vehicles, signals, and pedestrians."}, {"id": "66032", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Robust Causal Discovery in Real-World Time Series with Power-Laws", "url": "https://icml.cc/virtual/2026/poster/66032", "board": "Hall A #4208", "categories": ["Time-Series Causality", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Matteo Tusoni", "Giuseppe Masi", "Andrea Coletta", "Aldo Glielmo", "Viviana Arrigoni", "Novella Bartolini"], "famous": [], "key_idea_en": "The method exploits the power-law frequency spectrum common in real-world time series to build a noise-robust causal discovery approach that suppresses spurious causal links.", "summary_en": "Causal discovery algorithms for stochastic time series are highly sensitive to noise, often producing spurious causal inferences on real-world data. The authors observe that many real-world time series exhibit power-law frequency spectra arising from self-organizing behavior, and build a causal discovery method that extracts power-law spectral features to amplify genuine causal signals over noise. The method consistently outperforms state-of-the-art causal discovery alternatives on both synthetic benchmarks and real-world datasets with known causal structures. Such robustness to noise is critical for causal discovery to be trustworthy in high-stakes domains like finance, economics, neuroscience, and climate science. The approach presumes the target time series exhibits power-law spectral behavior, which may not hold for all real-world processes.", "key_idea_ko": "실제 time series에서 흔히 나타나는 power-law frequency spectrum을 활용하여 spurious causal link를 억제하는 noise-robust causal discovery 방법을 구축한다.", "summary_ko": "확률적 time series에 대한 causal discovery 알고리즘은 noise에 매우 민감하여, 실제 데이터에서 spurious causal inference를 만들어내는 경우가 많다. 저자들은 많은 실제 time series가 self-organizing behavior로 인해 power-law frequency spectrum을 보인다는 점에 주목하고, power-law spectral feature를 추출하여 noise 대비 genuine causal signal을 증폭시키는 causal discovery 방법을 구축한다. 이 방법은 synthetic benchmark와 known causal structure를 가진 real-world dataset 모두에서 state-of-the-art causal discovery 대안들을 일관되게 능가한다. noise에 대한 robustness는 finance, economics, neuroscience, climate science와 같은 고위험 real-world domain에서 causal discovery가 신뢰받기 위한 핵심 요소이다. 다만 이 접근법은 대상 time series가 power-law spectral behavior를 보인다고 전제하는데, 이는 모든 real-world process에 적용되지 않을 수 있다.", "abstract": "Exploring causal relationships in stochastic time series is a challenging yet crucial task with a vast range of applications, including finance, economics, neuroscience, and climate science. Many algorithms for Causal Discovery (CD) have been proposed; however, they often exhibit a high sensitivity to noise, resulting in spurious causal inferences on real data. In this paper, we observe that the frequency spectra of many real-world time series follow a power-law distribution, notably due to an inherent self-organizing behavior. Leveraging this insight, we build a robust CD method based on the extraction of power-law spectral features that amplify genuine causal signals. Our method consistently outperforms state-of-the-art alternatives on both synthetic benchmarks and real-world datasets with known causal structures, demonstrating its robustness and practical relevance."}, {"id": "62870", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Spatial Deconfounder: Interference-Aware Deconfounding for Spatial Causal Inference", "url": "https://icml.cc/virtual/2026/poster/62870", "board": "Hall A #4212", "categories": ["Confounding & Deconfounding", "Treatment Effects & CATE", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Ayush Khot", "Miruna Oprescu", "Maresa Schroder", "Ai Kagawa", "Xihaier Luo"], "famous": [], "key_idea_en": "The Spatial Deconfounder is a two-stage method that exploits treatment interference as a signal to reconstruct latent spatial confounders via a spatial-prior CVAE, enabling nonparametric identification of direct and spillover effects.", "summary_en": "Spatial causal inference faces two intertwined challenges - unmeasured spatial confounders such as weather, pollution, or mobility, and interference from nearby treatments - and prior methods typically handle only one while assuming away the other. The authors show that interference actually reveals structure in the latent confounder, and propose the Spatial Deconfounder, which reconstructs a substitute confounder from local treatment vectors using a conditional variational autoencoder with a spatial prior, then fits a flexible outcome model. They prove nonparametric identification of both direct and spillover effects under weak assumptions, without requiring multiple treatment types or a known latent-field model. This turns interference, usually treated as a nuisance, into a useful multi-cause signal that bridges the spatial-confounding and interference literatures for more robust spatial causal inference. The method is validated by extending the SpaCE benchmark to include treatment interference and on real-world environmental-health and social-science datasets, though identification still relies on the CVAE substitute-confounder assumption.", "key_idea_ko": "Spatial Deconfounder는 treatment interference를 신호로 활용해 spatial-prior CVAE를 통해 latent spatial confounder를 재구성하는 two-stage 방법으로, direct effect와 spillover effect의 nonparametric identification을 가능케 한다.", "summary_ko": "Spatial causal inference는 unmeasured spatial confounder(예: weather, pollution, mobility)와 인근 treatment로부터의 interference라는 두 가지가 얽힌 문제에 직면하는데, 기존 방법들은 대개 한쪽만 다루고 다른 쪽은 없다고 가정한다. 저자들은 interference가 실제로 latent confounder의 구조를 드러낸다는 점을 보이고, local treatment vector로부터 spatial prior를 갖는 conditional variational autoencoder를 이용해 substitute confounder를 재구성한 뒤 flexible한 outcome model을 적합하는 Spatial Deconfounder를 제안한다. 이들은 여러 treatment type이나 알려진 latent-field model을 필요로 하지 않으면서, weak assumption 하에서 direct effect와 spillover effect 모두의 nonparametric identification을 증명한다. 이는 통상 nuisance로 취급되던 interference를 유용한 multi-cause signal로 전환하여 spatial-confounding 문헌과 interference 문헌을 연결함으로써 더 robust한 spatial causal inference를 가능케 한다는 점에서 의의가 있다. 이 방법은 treatment interference를 포함하도록 SpaCE benchmark를 확장한 것과 실제 환경-건강 및 사회과학 데이터셋으로 검증되었으나, identification은 여전히 CVAE substitute-confounder assumption에 의존한다.", "abstract": "Causal inference in spatial domains faces two intertwined challenges: (1) unmeasured spatial factors, such as weather, air pollution, or mobility, that confound treatment and outcome, and (2) interference from nearby treatments that violate standard no-interference assumptions. While existing methods typically address one by assuming away the other, we show they are deeply connected: interference reveals structure in the latent confounder. Leveraging this insight, we propose the Spatial Deconfounder, a two-stage method that reconstructs a substitute confounder from local treatment vectors using a conditional variational autoencoder (C-VAE) with a spatial prior, then estimates causal effects via a flexible outcome model. We show that this approach enables nonparametric identification of both direct and spillover effects under weak assumptions—without requiring multiple treatment types or a known model of the latent field. Empirically, we extend SpaCE, a benchmark suite for spatial confounding, to include treatment interference, and show that the Spatial Deconfounder consistently improves effect estimation across real-world datasets in environmental health and social science. By turning interference into a multi-cause signal, our framework bridges spatial and deconfounding literatures to advance robust causal inference in structured spatial data."}, {"id": "62411", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Many Experiments, Few Repetitions, Unpaired Data, and Sparse Effects: Is Causal Inference Possible?", "url": "https://icml.cc/virtual/2026/poster/62411", "board": "Hall A #4301", "categories": ["Confounding & Deconfounding", "Treatment Effects & CATE", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Felix Schur", "Niklas Pfister", "Peng Ding", "Sach Mukherjee", "Jonas Peters"], "famous": ["Jonas Peters"], "key_idea_en": "A cross-fitting GMM estimator recovers causal effects under hidden confounding from unpaired covariate-outcome data across many experimental environments, remaining consistent even when each environment contributes only a handful of observations.", "summary_en": "Estimating causal effects under hidden confounding becomes difficult when covariates X and outcomes Y are recorded in different experimental environments but never jointly on the same units, a setting that can be cast as instrumental-variable regression with the environment itself serving as the instrument. The authors introduce a GMM-type estimator built on cross-fold sample splitting of the instrument-covariate sample, tailored to the regime of many environments with few repetitions each, where standard two-sample IV estimators fail to be consistent. They prove consistency as the number of environments grows even while the sample size per environment stays fixed, and extend the approach to sparse causal effects through L1-regularized estimation with post-selection refitting. Such many-experiments/few-repetitions/unpaired designs arise routinely in practice, notably in perturbation biology, where conventional paired IV tools break down. The guarantees are asymptotic in the number of environments and depend on suitable regularity and IV-type conditions, with sparsity addressed only through the added regularization extension.", "key_idea_ko": "hidden confounding 하에서 covariate와 outcome이 여러 environment에 걸쳐 unpaired 상태로만 관측될 때, environment당 관측치가 few개뿐이어도 consistent한 cross-fitting GMM estimator를 개발한다.", "summary_ko": "covariates X와 outcomes Y가 서로 다른 실험 environment에서 관측되지만 동일 unit에 대해 결코 jointly 관측되지 않는 unpaired data 상황에서 hidden confounding 하의 causal effect를 추정하는 문제를 다루며, 이는 environment를 instrument로 하는 instrumental variable regression으로 formulate될 수 있다. 핵심 아이디어는 instrument-covariate 표본에 대한 cross-fold sample splitting에 기반한 GMM-type estimator로, environment 수는 많지만 environment당 반복 관측이 few인 regime, 즉 표준 two-sample IV estimator가 inconsistent해지는 상황을 겨냥한다. 주요 기술적 결과는 environment당 sample size가 고정되어 있어도 environment 수가 증가함에 따라 consistency가 성립함을 증명한 것이며, L1-regularized estimation과 post-selection refitting을 통한 sparse causal effect로의 확장도 제시했다. perturbation biology 등 many-experiments, few-repetitions, unpaired 설계가 흔한 실제 상황에서 기존 paired IV 도구가 작동하지 않는 문제를 해결한다는 점에서 실용적 의의가 크다. 다만 이 방법의 guarantee는 environment 수에 대한 asymptotic 성질이며 적절한 regularity 및 IV-type 조건에 의존하고, sparsity는 추가적인 regularization extension을 통해서만 다뤄진다.", "abstract": "In many applications, practical constraints prevent measuring covariates and outcomes on the same units, resulting in unpaired data. We study the problem of estimating causal effects under hidden confounding in the following unpaired data setting: we observe some covariates X and an outcome Y under different experimental conditions (environments) but do not observe them jointly -- we either observe X or Y. Under appropriate regularity conditions, the problem can be cast as an instrumental variable (IV) regression with the environment acting as a (possibly high-dimensional) instrument. When there are many environments but only a few observations per environment, standard two-sample IV estimators fail to be consistent. We propose a GMM-type estimator based on cross-fold sample splitting of the instrument-covariate sample that also applies in standard IV settings. We prove that it is consistent as the number of environments grows but the sample size per environment remains constant. We further extend the method to sparse causal effects via L1-regularized estimation and post-selection refitting."}, {"id": "65599", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Interventional Processes For Causal Uncertainty Quantification", "url": "https://icml.cc/virtual/2026/poster/65599", "board": "Hall A #4302", "categories": ["Treatment Effects & CATE", "Other"], "estimands": ["dose-response"], "treatment_type": "continuous", "discovery_types": [], "authors": ["Hugh Dance", "Peter Orbanz", "Arthur Gretton"], "famous": ["Arthur Gretton"], "key_idea_en": "IMPspec is a Gaussian-process framework built on spectral RKHS representations that delivers calibrated, tractable uncertainty quantification for interventional causal effects under continuous treatments.", "summary_en": "Uncertainty quantification for estimated causal effects is essential for downstream decision-making, yet it remains difficult to achieve in nonparametric models, particularly with continuous treatments. IMPspec addresses this by modeling interventional causal functions as objects in a reproducing kernel Hilbert space (RKHS) and combining a Gaussian process with function-class expansions and a spectral RKHS feature representation to keep training and inference tractable. A spectral algorithm calibrates the resulting posterior credible intervals, avoiding the underfitting and variance-collapse pathologies that plague prior GP-on-RKHS approaches, and the method achieves state-of-the-art uncertainty quantification on synthetic benchmarks and a healthcare application. Such reliable uncertainty estimates matter because they enable downstream tasks like causal Bayesian optimization, where knowing one's confidence in an estimated effect is essential for safe intervention choices. Evaluation is limited to synthetic data and a single healthcare application, and the approach is specific to continuous-treatment interventional effects representable within an RKHS.", "key_idea_ko": "IMPspec는 spectral RKHS representation을 사용하는 Gaussian process 프레임워크로, continuous treatment 하에서 interventional causal effect에 대한 calibrated하고 tractable한 uncertainty quantification을 제공한다.", "summary_ko": "추정된 causal effect의 uncertainty를 정량화하는 것은 downstream decision에 중요하지만, 특히 continuous treatment를 가진 nonparametric model에서는 어렵다. IMPspec는 interventional causal function을 reproducing kernel Hilbert space (RKHS)에서 표현 가능한 대상으로 모델링하고, function-class expansion과 spectral RKHS feature representation을 갖춘 Gaussian process를 사용하여 training과 inference를 tractable하게 만든다. posterior credible interval을 calibration하는 spectral algorithm을 제공하며, 기존 GP-on-RKHS 접근법의 underfitting과 variance-collapse 문제를 피하면서 synthetic benchmark와 healthcare application에서 state-of-the-art uncertainty quantification 성능을 달성한다. 신뢰할 수 있는 uncertainty quantification은 causal Bayesian optimization과 같은 downstream task를 가능하게 하며, 여기서는 안전한 intervention 선택을 위해 추정된 causal effect에 대한 confidence를 아는 것이 필수적이다. synthetic data와 하나의 healthcare application으로 검증되었으며, RKHS로 표현 가능한 continuous-treatment interventional effect에 특화되어 있다.", "abstract": "Reliable uncertainty quantification for causal effects is crucial in various applications, but remains difficult in nonparametric models, particularly for continuous treatments. We introduce IMPspec, a Gaussian process (GP) framework for modeling uncertainty over interventional causal functions under continuous treatments, which can be represented using reproducing Kernel Hilbert Spaces (RKHSs). By using principled function class expansions and a spectral representation of RKHS features, IMPspec yields tractable training and inference, a spectral algorithm to calibrate posterior credible intervals, and avoids the underfitting and variance collapse pathologies of earlier GP-on-RKHS methods. Across synthetic benchmarks and an application in healthcare, IMPspec delivers state-of-the-art performance in causal uncertainty quantification and downstream causal Bayesian optimization tasks."}, {"id": "64429", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Identifiable Nonlinear Differentiable Causal Discovery via Independence and Adaptive Group Sparsity", "url": "https://icml.cc/virtual/2026/poster/64429", "board": "Hall A #4303", "categories": ["Causal Discovery", "Identification & Partial ID"], "estimands": [], "treatment_type": "", "discovery_types": ["continuous-optimization", "functional causal model"], "authors": ["Ruicong Yao", "Tim Verdonck", "Mihaela van der Schaar", "Jakob Raymaekers"], "famous": ["Mihaela van der Schaar"], "key_idea_en": "Extending NOTIME's independence-based differentiable causal-discovery objective with an adaptive group-lasso penalty on MLP first-layer weights identifies arbitrary non-Gaussian, heteroscedastic additive-noise causal models exactly, rather than only up to constant edges.", "summary_en": "Differentiable causal discovery methods for nonlinear additive-noise models typically assume homoscedastic or known noise, and mean-squared-error objectives fail to recover the true DAG once noise becomes non-Gaussian or varies in scale. Building on NOTIME's residual-independence criterion, the authors add an adaptive group-lasso penalty over columns of the MLP's first-layer weights to prune the extra constant edges that the independence objective alone leaves behind. They prove that the independence criterion's global minimizer recovers the true DAG up to constant edges in general additive-noise models, and that the added group-lasso step then recovers the exact structure. The result extends identifiability guarantees for differentiable causal discovery to arbitrary noise distributions, broadening applicability well beyond the Gaussian, homoscedastic regime. The guarantees are established specifically for nonlinear additive-noise models, and performance in practice depends on properly tuning both the group-lasso penalty and the independence-criterion optimization.", "key_idea_ko": "NOTIME의 independence 기반 differentiable causal discovery objective에 MLP 첫 층 weight에 대한 adaptive group-lasso penalty를 추가하여 임의의 non-Gaussian, heteroscedastic additive-noise model까지 constant edge 없이 정확히 identify한다.", "summary_ko": "Nonlinear additive noise model을 위한 differentiable causal discovery 방법들은 대체로 homoscedastic이거나 noise 분포를 안다고 가정하며, mean-squared-error 기반 objective는 non-Gaussian이고 scale이 변하는 noise 하에서 true DAG를 복원하지 못한다. 저자들은 NOTIME의 residual-independence criterion을 기반으로, independence objective가 남기는 잉여 constant edge를 선택적으로 제거하기 위해 MLP 첫 층 weight의 column에 대한 adaptive group lasso penalty를 추가한다. 이들은 independence criterion의 global minimizer가 일반적인 additive noise model에서 true DAG를 constant edge까지는 복원함을 증명하고, group-lasso 단계가 정확한 structure를 복원함을 보인다. 이는 differentiable causal discovery의 identifiability guarantee를 임의의 noise 분포로 확장하여 Gaussian/homoscedastic 영역을 넘어 적용 범위를 넓힌다. Guarantee는 nonlinear additive noise model에 대해 성립하며, 성능은 group-lasso penalty와 independence-criterion 최적화를 올바르게 tuning하는 데 의존한다.", "abstract": "Differentiable approaches to causal discovery have shown promise in learning DAG structures via continuous optimization, but their theoretical guarantees are largely restricted to models with homoscedastic noise or known noise distribution. In particular, existing methods based on mean squared error fail to identify the true DAG when noise distributions are non-Gaussian and vary in scale. This paper addresses this gap in nonlinear additive noise models (ANMs) with arbitrary noise, extending NOTIME (Berrevoets et al. 2025), which minimizes an independence criterion among the residuals. The global minimizer of the independence criterion corresponds to the true underlying DAG up to additional constant edges in general ANMs. To recover the exact structure, the authors introduce an adaptive group lasso penalty that regularizes entire columns of the first-layer weight matrix of an MLP, enabling selective pruning of constant edges in a functionally meaningful way. Empirically, the method exhibits effective and stable performance across diverse noise types and variances, outperforming prior methods that lack identifiability guarantees in this setting."}, {"id": "62998", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Evaluating bivariate causal statements based on mutual compatibility", "url": "https://icml.cc/virtual/2026/poster/62998", "board": "Hall A #4306", "categories": ["Causal Discovery", "Causal Reasoning in LLMs/Agents"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Erik Jahn", "Dominik Janzing"], "famous": ["Dominik Janzing"], "key_idea_en": "Compatibility and incompatibility scores assess the plausibility of a collection of pairwise (bivariate) causal claims over a variable set without requiring the faithfulness assumption, and are applied to fact-check LLM-generated causal claims.", "summary_en": "When causal ground truth is unavailable, judging whether a large set of asserted bivariate causal relationships among n variables is jointly plausible is difficult. Any collection of acyclic linear bivariate causal statements can be extended to a unique multivariate model, but such a model is implausible if it requires excessive additional confounding to explain the observed correlations, motivating a compatibility score that quantifies this plausibility without assuming faithfulness, alongside a separate incompatibility score for purely graphical statements based on faithfulness- and acyclicity-derived global consistency constraints. Theoretical and empirical results show both scores distinguish correct from incorrect causal statements in generic settings. The method is further applied to evaluate causal claims produced by large language models, demonstrating its use as a validation tool. It thus offers a principled way to audit causal claims from experts or AI when direct experimental validation is impossible, though the compatibility score's linear/acyclic setting and the incompatibility score's reliance on faithfulness bound its scope.", "key_idea_ko": "faithfulness 가정 없이 변수 집합 전체에 걸친 pairwise (bivariate) causal claim 모음의 plausibility를 평가하는 compatibility 및 incompatibility score를 제안하고, 이를 LLM이 생성한 causal claim의 fact-check에 적용한다.", "summary_ko": "causal ground truth가 없을 때, n개 변수에 대해 주장된 다수의 bivariate causal relationship 집합이 jointly plausible한지 평가하기 어렵다. 임의의 acyclic linear bivariate causal statement 모음은 유일한 multivariate model로 확장될 수 있음을 보이되, 관측된 상관관계를 설명하기 위해 과도한 추가 confounding이 필요하다면 그 model은 implausible하다고 보고, faithfulness를 가정하지 않는 compatibility score를 제안하며, 순수하게 graphical한 statement를 위한 별도의 incompatibility score는 faithfulness와 acyclicity로부터 유도된 global consistency 제약에 기반한다. 이론적, 실증적 결과 모두 두 score가 generic한 setting에서 올바른 causal statement와 그렇지 않은 것을 구분함을 보인다. 실험적 검증이 불가능한 상황에서 전문가나 AI가 제시한 causal claim을 감사(audit)하는 원칙적인 방법을 제공하며, 실제로 LLM이 생성한 causal claim을 평가하는 데 적용해 그 활용성을 보여준다. compatibility score는 linear/acyclic setting에, incompatibility score는 faithfulness 가정에 의존하는 범위로 scope가 제한된다.", "abstract": "For many real-world systems, causal ground truth is difficult to obtain, making claims about causal effects hard to assess. We develop methods for evaluating collections of C(n,2) bivariate causal statements over a set of n variables. In the setting of acyclic linear statements, any such collection can be extended to a unique multivariate causal model, but we argue that this induced model is implausible if it imposes substantial additional confounding to explain observed correlations. We introduce a compatibility score that quantifies this notion of plausibility, notably without relying on the faithfulness assumption. Additionally, we define an incompatibility score for purely graphical bivariate causal statements, based on global consistency constraints that are derived from acyclicity and faithfulness assumptions. We give theoretical and empirical evidence that both scores can successfully distinguish correct from incorrect causal statements in generic settings. Moreover, we demonstrate the practical applicability of our methods by analyzing causal claims made by large language models. Our work aims to provide a foundation for assessing the reliability of causal information derived from human experts or artificial intelligence in settings where alternative forms of validation are unavailable."}, {"id": "61894", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Distributionally Robust Causal Abstractions", "url": "https://icml.cc/virtual/2026/poster/61894", "board": "Hall A #4308", "categories": ["Causal Representation Learning", "Identification & Partial ID", "Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Yorgos Felekis", "Theodoros Damoulas", "Paris Giampouras"], "famous": [], "key_idea_en": "The paper introduces distributionally robust Causal Abstractions, learned via constrained min-max optimization over Wasserstein ambiguity sets so that abstraction mappings stay valid under exogenous-distribution shift and model misspecification.", "summary_en": "Causal Abstraction theory relates causal models of the same system at different granularities while preserving interventional consistency, but existing learning methods assume a fixed, well-specified exogenous distribution and break down under environmental shift or misspecification. The authors introduce the first class of distributionally robust Causal Abstractions, casting robust learning as a constrained min-max optimization over Wasserstein ambiguity sets around the exogenous distribution. They derive theoretical guarantees for both empirical and Gaussian environments that support principled selection of ambiguity-set radii, along with quantitative bounds on worst-case abstraction error. This makes causal abstraction learning viable under real-world distribution shift and structural or intervention-mapping misspecification, broadening where the theory can be safely deployed. The robustness guarantees, however, are tied specifically to the Wasserstein-ambiguity-set formulation and to the empirical and Gaussian environment assumptions studied.", "key_idea_ko": "이 논문은 Wasserstein ambiguity set에 대한 constrained min-max optimization으로 학습되는 distributionally robust Causal Abstraction을 도입하여, exogenous-distribution shift와 model misspecification 하에서도 causal-abstraction mapping이 유효하게 유지되도록 한다.", "summary_ko": "문제는 Causal Abstraction 이론이 서로 다른 granularity에서 동일 system을 기술하는 causal model들을 interventional consistency를 보존하며 연결하지만, 기존 학습 방법들은 고정되고 well-specified된 exogenous distribution을 가정하여 environmental shift나 misspecification 하에서 깨진다는 점이다. 핵심 아이디어는 저자들이 첫 distributionally robust Causal Abstraction class를 도입하고, robust CA 학습을 exogenous distribution 주변의 Wasserstein ambiguity set에 대한 constrained min-max optimization 문제로 정식화하는 것이다. 주요 결과는 empirical 환경과 Gaussian 환경 모두에 대해 ambiguity-set radius를 principled하게 선택할 수 있게 하는 theoretical guarantee와 worst-case abstraction error에 대한 quantitative bound를 제시한 것이다. 이는 실세계의 distribution shift 및 structural/intervention-mapping misspecification 하에서도 causal abstraction 학습을 실용적으로 만들어 CA 이론이 안전하게 적용될 수 있는 범위를 넓힌다는 점에서 중요하다. robustness guarantee는 연구된 특정 Wasserstein-ambiguity-set 정식화와 empirical/Gaussian 환경 가정에 결부되어 있다.", "abstract": "Causal Abstraction (CA) theory provides a principled framework for relating causal models that describe the same system at different levels of granularity while ensuring interventional consistency between them. Recent methods for learning CAs, however, assume fixed and well-specified exogenous distributions, leaving them vulnerable to environmental shifts and model misspecification. In this work, we address these limitations by introducing the first class of distributionally robust CAs and their associated learning algorithms. The latter cast robust causal abstraction learning as a constrained min-max optimization problem with Wasserstein ambiguity sets. We provide theoretical guarantees for both empirical and Gaussian environments, enabling principled selection of ambiguity-set radii and establish quantitative guarantees on worst-case abstraction error. Furthermore, we present empirical evidence across different problems and CA learning methods, demonstrating our framework's robustness not only to environmental shifts but also to structural and intervention mapping misspecification."}, {"id": "66736", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "CausalProfiler: Generating Synthetic Benchmarks for Rigorous and Transparent Evaluation of Causal Machine Learning", "url": "https://icml.cc/virtual/2026/poster/66736", "board": "Hall A #4311", "categories": ["Other", "Identification & Partial ID", "Causal Discovery"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Panayiotis Panayiotou", "Audrey Poinsot", "Alessandro Leite", "Nicolas Chesneau", "Marc Schoenauer", "Ozgur Simsek"], "famous": [], "key_idea_en": "CausalProfiler is a random generator of synthetic causal benchmarks with coverage guarantees that samples causal models, data, queries, and ground truths across the observational, interventional, and counterfactual rungs to enable rigorous, transparent evaluation of causal ML methods.", "summary_en": "Empirical evaluation of causal machine learning methods is limited by reliance on a handful of hand-crafted or semi-synthetic datasets, which produces brittle, non-generalizable conclusions. CausalProfiler instead defines explicit design choices over classes of causal models, queries, and data, then randomly samples benchmarks with ground truth spanning the observational, interventional, and counterfactual levels of causal reasoning. It is presented as the first random generator of synthetic causal benchmarks to offer coverage guarantees and transparent assumptions across all three rungs. This lets researchers rigorously and transparently stress-test causal ML methods under diverse, controllable conditions, including both in- and out-of-identification regimes. Its utility is demonstrated by evaluating several state-of-the-art methods, though overall coverage and generality still depend on the chosen design space of causal model classes.", "key_idea_ko": "CausalProfiler는 causal model, data, query, ground truth를 observational, interventional, counterfactual rung에 걸쳐 샘플링하는 coverage guarantee를 갖춘 synthetic causal benchmark random generator로, causal ML 방법의 엄밀하고 투명한 평가를 가능하게 한다.", "summary_ko": "causal machine learning 방법의 경험적 평가는 소수의 hand-crafted 또는 semi-synthetic dataset에 의존하는 데 제한되어 있어, 결론이 취약하고 일반화되기 어렵다. CausalProfiler는 causal model, query, data의 class에 대해 명시적인 design choice를 정의한 뒤, observation, intervention, counterfactual 수준의 causal reasoning에 걸친 ground truth를 갖는 benchmark를 무작위로 샘플링한다. 이는 세 rung 모두에 걸쳐 coverage guarantee와 투명한 가정을 제공하는 최초의 synthetic causal benchmark random generator로 제시된다. 이를 통해 연구자들은 identification 여부가 다양한 상황(in- 및 out-of-identification regime 포함)에서 causal ML 방법을 엄밀하고 투명하게 stress-test할 수 있다. 여러 state-of-the-art 방법을 평가하여 유용성을 입증했으나, 전반적인 coverage와 일반성은 선택된 causal model class의 design space에 의존한다.", "abstract": "Causal machine learning (Causal ML) aims to answer \"what if\" questions using machine learning algorithms, making it a promising tool for high-stakes decision-making. Yet, empirical evaluation practices in Causal ML remain limited. Existing benchmarks often rely on a handful of hand-crafted or semi-synthetic datasets, leading to brittle, non-generalizable conclusions. To bridge this gap, we introduce CausalProfiler, a synthetic benchmark generator for Causal ML methods. Based on a set of explicit design choices about the class of causal models, queries, and data considered, the CausalProfiler randomly samples causal models, data, queries, and ground truths constituting the synthetic causal benchmarks. In this way, Causal ML methods can be rigorously and transparently evaluated under a variety of conditions. This work offers the first random generator of synthetic causal benchmarks with coverage guarantees and transparent assumptions operating on the three levels of causal reasoning: observation, intervention, and counterfactual. We demonstrate its utility by evaluating several state-of-the-art methods under diverse conditions and assumptions, both in and out of the identification regime, illustrating the types of analyses and insights the CausalProfiler enables."}, {"id": "66592", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Causal discovery for time series with endogenous context variables", "url": "https://icml.cc/virtual/2026/poster/66592", "board": "Hall A #4312", "categories": ["Causal Discovery", "Time-Series Causality"], "estimands": [], "treatment_type": "", "discovery_types": ["constraint-based"], "authors": ["Oana-Iuliana Popescu", "Wiebke Guenther", "Martin Rabel", "Jakob Runge"], "famous": [], "key_idea_en": "Two new PCMCI-based algorithms extend time-series causal discovery to structural causal models with endogenous, time-dependent discrete context variables that both influence and are influenced by system dynamics.", "summary_en": "Many real-world time series exhibit context-dependent causal dynamics in which the system state also shapes its own context, as when precipitation drives soil moisture, which then conditions heat-flux realization, a case not well handled by standard time-series causal discovery. The authors model this with structural causal models incorporating endogenous, time-dependent discrete context variables that allow lagged dependencies, and introduce two new PCMCI-based causal discovery algorithms proven sound under assumptions of context persistence or sparsity of context-system dependencies. The main result is effective, sound causal discovery validated on synthetic benchmarks and a real-world land-atmosphere feedback application. This matters because many physical and environmental systems exhibit exactly this kind of state-context feedback, which prior methods could misrepresent. The approach requires context variables to be discrete, possibly as proxies for continuous variables, and relies on the stated persistence or sparsity assumptions for soundness.", "key_idea_ko": "system dynamics에 영향을 주고 영향을 받는 endogenous하고 시간에 따라 변하는 discrete context variable을 가진 structural causal model로 시계열 causal discovery를 확장하는 두 가지 새로운 PCMCI 기반 알고리즘을 제안한다.", "summary_ko": "많은 실세계 time series는 context-dependent causal dynamics를 보이는데, 예컨대 강수량이 토양 수분을 유발하고 이것이 다시 heat-flux 실현의 context가 되는 경우처럼 system state가 자기 자신의 context를 형성하기도 하며, 이는 표준 time-series causal discovery로는 잘 다뤄지지 않는다. 이 논문은 lagged dependency를 허용하는 endogenous하고 시간 의존적인 discrete context variable을 포함하는 structural causal model로 이를 모델링하고, context persistence 또는 context-system dependency의 sparsity 가정 하에서 sound함이 증명된 두 가지 새로운 PCMCI 기반 causal discovery algorithm을 도입한다. 주요 결과는 synthetic benchmark와 실제 land-atmosphere feedback application에서 검증된 효과적이고 sound한 causal discovery이다. 이는 많은 물리적/환경적 system이 정확히 이러한 state-context feedback 형태를 가지며, 기존 방법은 이를 잘못 표현할 수 있다는 점에서 의미가 있다. 이 접근법은 context variable이 discrete일 것을 요구하며(연속 변수의 proxy일 수도 있음), soundness를 위해 명시된 persistence 혹은 sparsity 가정에 의존한다.", "abstract": "Many real-world systems exhibit both context- and time-dependent causal dynamics, where the dynamical system state also influences its context. For instance, soil moisture is driven by precipitation, yet also provides the context for heat-flux realization. We capture such dynamics in Structural Causal Models (SCMs) by introducing endogenous and time-dependent discrete context variables, also allowing for possibly lagged dependencies with the system variables. While context variables are discrete, they may also be proxies of continuous variables. The enabling assumptions for causal discovery of our model are either persistence of the context or sparsity of the context-system dependencies. We design two new PCMCI-based algorithms for causal discovery with endogenous context variables for time series and prove their soundness. A systematic evaluation on synthetic benchmarks and an application to a real-world land-atmosphere feedback problem demonstrate their effectiveness and applicability."}, {"id": "63618", "session": 5, "time": "17:00-18:45", "date_en": "Wed Jul 8", "date_ko": "7/8 (수)", "title": "Anti-causal domain generalization: Leveraging unlabeled data", "url": "https://icml.cc/virtual/2026/poster/63618", "board": "Hall A #4314", "categories": ["Causal Fairness & Robustness"], "estimands": [], "treatment_type": "", "discovery_types": [], "authors": ["Sorawit Saengkyongam", "Juan L. Gamella", "Andrew Miller", "Jonas Peters", "Nicolai Meinshausen", "Christina Heinze-Deml"], "famous": ["Jonas Peters"], "key_idea_en": "The method exploits an anti-causal structure, where the outcome causes the covariates, to achieve domain generalization from only unlabeled multi-environment data, by regularizing model sensitivity to environment-driven shifts in covariate mean and covariance.", "summary_en": "Domain generalization aims to learn predictive models robust to distribution shift in unseen environments, but existing methods usually require labeled data from multiple training environments, limiting their applicability when labels are scarce. This work instead studies domain generalization under an anti-causal structure, where the outcome causes the observed covariates, so that environment perturbations affecting covariates do not propagate to the outcome, motivating regularization of the model's sensitivity to such perturbations. Because estimating these perturbation directions requires no labels, the method can exploit unlabeled data from multiple environments, and the authors propose two variants that penalize sensitivity to cross-environment shifts in covariate mean and covariance respectively, proving worst-case optimality guarantees for certain classes of environments. Empirical results on a controlled physical system and a physiological signal dataset demonstrate the approach's practical performance. The theoretical guarantees hold only for specific classes of environments and rely on the anti-causal assumption, which may not hold across all application domains.", "key_idea_ko": "outcome이 covariate의 원인이 되는 anti-causal structure를 활용하여, environment가 유발하는 covariate mean/covariance의 변화에 대한 model 민감도를 regularize함으로써 unlabeled multi-environment 데이터만으로 domain generalization을 가능하게 한다.", "summary_ko": "domain generalization은 unseen environment의 distribution shift에 강건한 predictive model을 학습하는 것을 목표로 하지만, 기존 방법들은 대개 여러 training environment로부터의 labeled data를 필요로 하여 label이 부족한 경우 적용성이 제한된다. 본 연구는 outcome이 관측된 covariate의 원인이 되는 anti-causal structure 하에서의 domain generalization을 다루는데, 이 경우 covariate에 영향을 주는 environment perturbation이 outcome으로 전파되지 않으므로 이러한 perturbation에 대한 model 민감도를 regularize하는 것이 정당화된다. 이러한 perturbation 방향을 추정하는 데는 label이 필요하지 않기 때문에, 이 방법은 여러 environment의 unlabeled data를 활용할 수 있으며, 저자들은 covariate mean과 covariance의 cross-environment shift에 대한 민감도를 각각 penalize하는 두 가지 방법을 제안하고 특정 class의 environment에 대해 worst-case optimality를 증명한다. 통제된 physical system과 physiological signal dataset에 대한 실험 결과는 이 접근법의 실용적 성능을 보여준다. 이론적 보장은 특정 class의 environment에 대해서만 성립하며 anti-causal 가정에 의존하는데, 이는 모든 application domain에서 성립하지는 않을 수 있다.", "abstract": "The problem of domain generalization concerns learning predictive models that are robust to distribution shifts when deployed in new, previously unseen environments. Existing methods typically require labeled data from multiple training environments, limiting their applicability when labeled data are scarce. In this work, we study domain generalization in an anti-causal setting, where the outcome causes the observed covariates. Under this structure, environment perturbations that affect the covariates do not propagate to the outcome, which motivates regularizing the model's sensitivity to these perturbations. Crucially, estimating these perturbation directions does not require labels, enabling us to leverage unlabeled data from multiple environments. We propose two methods that penalize the model's sensitivity to variations in the mean and covariance of the covariates across environments, respectively, and prove that these methods have worst-case optimality guarantees under certain classes of environments. Finally, we demonstrate the empirical performance of our approach on a controlled physical system and a physiological signal dataset."}, {"id": "60473", "session": 5, "time": "17:00-18:45", "date_en":
